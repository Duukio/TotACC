RULE_OPTION_BIA_STATUSQUO_DESC: "Biafra will remain in its left-wing democratic socialist direction, based on the Ahiara Declaration."
RULE_OPTION_BIA_CONS: "Conservatives"
RULE_OPTION_BIA_CONS_DESC: "Biafra will elect conservatives in a stunning upset to the nation's longstanding left-wing government."
SEY_AI_PATH: "@SEY Republic of Seychelles"
RULE_OPTION_SEY_BOUT: "Viktor Bout's Sejŝeloj"
RULE_OPTION_SEY_BOUT_DESC: "The Seychelles will take a radical left turn towards internationalist humanitarianism and the promotion of Esperanto."
RULE_OPTION_SEY_SPICER: "Tim Spicer's Seychelles"
RULE_OPTION_SEY_SPICER_DESC: "The Seychelles will turn towards the shining beams of the future through technology and scientific investment to create the finest equipment the world has ever seen."
RULE_OPTION_SEY_BARLOW: "Eeben Barlow's Seychelles"
RULE_OPTION_SEY_BARLOW_DESC: "The Seychelles will maintain course."
RULE_OPTION_SEY_PRINCE: "Erik Prince's Seychelles"
RULE_OPTION_SEY_PRINCE_DESC: "The Seychelles will take a rightward turn towards focus on American affairs, a cut-throat economy and merciless combat."
ISP_AI_PATH: "@ISP Hebrew Republic of Labour"
RULE_OPTION_ISP_ASHKENAZI: "Gabi Ashkenazi's Eber"
RULE_OPTION_ISP_ASHKENAZI_DESC: "Gabi Ashkenazi will keep Eber in its regular, mainline course."
RULE_OPTION_ISP_SIMHON: "Shalom Simhon's Eber"
RULE_OPTION_ISP_SIMHON_DESC: "Shalom Simhon, as part of the reformist coalition, will bring Eber's economy, culture and army to the future through cybernetics and technology."
RULE_OPTION_ISP_RAMON: "Haim Ramon's Eber"
RULE_OPTION_ISP_RAMON_DESC: "Haim Ramon, as part of the reformist coalition, will bring Eber towards a free, truly democratic and liberal direction."
RULE_OPTION_ISP_SNEH: "Efraim Sneh's Eber"
RULE_OPTION_ISP_SNEH_DESC: "Efraim Sneh will coup the reformists under Ramon and bring the country back to its glory days with militarism and authoritarian socialism."
RULE_OPTION_ISP_CANAAN: "Canaanites"
RULE_OPTION_ISP_CANAAN_DESC: "The Canaanites will coup the reformists under Ramon and create a palingenetic revival of an ancient, pre-Hebrew identity."
NGA_AI_PATH: "@NGA Federal Republic of Nigeria"
RULE_OPTION_NGA_MILDICT: "Maintain Course"
RULE_OPTION_NGA_MILDICT_DESC: "Nigeria, if victorious in the war, will remain a military dictatorship."
RULE_OPTION_NGA_NATCOM: "A New Red Rising Sun"
RULE_OPTION_NGA_NATCOM_DESC: "Nigeria, if victorious in the war, will eventually coup the military junta and instate a National-Communist, Romanian-inspired regime."
RULE_OPTION_NGA_IZLAM: "Radical Izlam!"
RULE_OPTION_NGA_IZLAM_DESC: "Nigeria, if defeated in the war, will turn towards its Fula-Hausa roots and create a nomadic confederation of gangs and tribes."
RULE_OPTION_NGA_REDDIT: "Jade Revolution: Technocracy, As It Was"
RULE_OPTION_NGA_REDDIT_DESC: "Nigeria, through the Jade Revolution, will elect \"big-T Technocrats\" who advocate for the creation of an African Technate, digitizing Nigeria's economy and effective scientific government."
RULE_OPTION_NGA_JADEREV: "Jade Revolution: Democracy"
RULE_OPTION_NGA_JADEREV_DESC: "Nigeria, through the Jade Revolution, becomes a strong democracy and a peaceful nation."
MSK_AI_PATH: "@MSK Commonwealth of Miskito"
RULE_OPTION_MSK_HENDY: "Steady She Goes"
RULE_OPTION_MSK_HENDY_DESC: "Miskito will remain an Anglo-Saxon inspired, common-law republic-monarchy mix and attempt to unify the region."
RULE_OPTION_MSK_MCAFEE: "McAfee's Takeover"
RULE_OPTION_MSK_MCAFEE_DESC: "McAfee, his druglord associates and disaffected White men will bring Miskito towards the future through mass raiding and black market commerce."

