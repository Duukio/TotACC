intro1: "Welcome to Twilight of the Anthropocene!"
intro2: "1935, Germany: Konrad Zuse, in a stroke of luck, accidentally invents the MOSFET transistor, creating a world-changing catalyst - One, however, which did not save the Axis. As Adolf Hitler is shot at by an assailant in 1943 during a flight to Smolensk, the Nazi state collapsed - and the ensuing anarchy resulted in a comfortable peace deal for the Japanese Empire, which survives to this day. As anarchy engulfed Europe into flames, the Western Allies used a significant number of collaborationist and prewar authorities to assist in ending the chaos, eventually resulting in the creation of three German states: Westphalia, Austro-Bavaria and Prussia. The Japanese scraped by the skin of their teeth on not getting a nuclear bomb thrown on their cities, but the impact of the nuclear bomb's invention would come later in November 1967, when North Vietnam received two nuclear bombs; one in Mu Gia Pass and another in the outskirts of western Hanoi, having been intercepted just prior. This extreme escalation in proportional fighting causes international outrage and the USSR is able to show its evidence that this was an authorised attack from the Oval Office. President Goldwater and LeMay would later both be killed in a bombing attack by an American assassin in April 1968. Due to the different end of WWII, as well as no Korean War, Britain ends up with a stronger economy and pursues more of a nation-building approach to decolonisation. The French take inspiration from this, but instead of establishing a loose international group like the Commonwealth, France pursues the French Union system which sought to incorporate many of France's colonies and overseas territories into metropolitan France. While this approach ultimately failed in places such as Indochina and Algeria, it remained successful in a lot of West Africa. In 1969, the assassination attempt against Brezhnev that happened IRL happens to succeed, and because of the assassin's admiration for Suslov, the reformers that helped Brezhnev get into power use this to their advantage to sideline the hardliner factions within the party and manage to take power themselves, with Alexei Kosygin becoming leader of the USSR. He uses this position to pass the 1965 Liberman reforms that he drew up years prior and this starts a trend of economic reforms over his premiership that transition the USSR into a quasi-market system. As the Soviets reformed, collaboration began to spring up between the US and the USSR. This collaboration saw the building of the International Space Station. By the start of 2021, the first truly international expedition to establish a Martian colony is on its way, with a manned crew of astronauts and cosmonauts from NASA, ESA, and Interkosmos."
 
