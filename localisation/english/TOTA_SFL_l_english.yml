l_english:

SFL_united_against_obamunism: "United Against Obamunism"
SFL_united_against_obamunism_desc: "While the Sunshine State may be crawling to the brim with folk eager to kill and maim each other to be crowned Warboss o’the Peninsula, it is an undeniable fact that President-Derelict Barack \"Hussein\" Obama poses more of a threat to our way of life than any of us could on our owns. Everyone from them hippie-dippie wannabe-Borg and synthcoke con-artists in the south to those fratboy-fascists and hillbilly-heretics of the north’ll fight tooth ‘n’ nail to not be under the jackboots of Hope ‘n’ Change."
SFL_salt_life_scavengers: "Salt Life Scavengers"
SFL_salt_life_scavengers_desc: "Florida's economy consists of several thousand tourists traps lined up together and a spaceport that's certainly seen better years. Despite all this, we've got by with or without Washington’s help, and we certainly won’t lay over without a fight as those Obama-nable commies march through our home. We've survived hurricanes with less - Hussein’s in for a world of hurt."
SFL_veterans_of_unpopular_wars: "Veterans of Unpopular Wars"
SFL_veterans_of_unpopular_wars_desc: "Despite what people think, our retirees aren’t all Soviet Snowbirds or Margaritaville good-f’nothin’s. A good chunk of ’em contributed to guerilla and counter-insurgency warfare efforts over the past century. As a result, even if some of them ain’t used to commanding half-human hicks and boxers, they still have a tactical insight the Obama turncoats lack. Granted, not all of these fought for or with the winning side, but a fighter’s a fighter - they’re better than nothing."
SFL_spring_offensive: "Spring-Breakthrough"
SFL_spring_offensive_desc: "PLACEHOLDER"

SFL_adds_1_gdp: "Adds §Y1%§! to §7Real Growth§!"
 
SFL_peace_in_the_panhandle: "Peace in the Panhandle"
SFL_peace_in_the_panhandle_desc: "All around us, America is burning. Our status of dubious loyalty to Pence, combined with the threat from the Georgian holdouts gives us relative autonomy to do what we will. But it isn't a peace that can last. One day, the North will look down on us with greedy eyes, and only with a stable, successful governance can we hope to beat them back."
SFL_the_freer_the_market: "The Freer the Market..."
SFL_the_freer_the_market_desc: "Centers of capital across America are in complete meltdown. Communists threaten to seize New York and much of the nation has been gripped by commands to mobilise the economy for the warpath. As all these investors look for a place to roost, perhaps the Sunshine state can accommodate them? A few deregulations here and tax breaks there and we'll be swimming in investments."
SFL_the_freer_the_people: "...The Freer the People"
SFL_the_freer_the_people_desc: "The millenia old lie of taxation will finally be abolished once and for all. 230 years ago, the first American insurrection against unjust taxation in the Whiskey Rebellion began, when the federal government betrayed its convictions of oppressive taxation. This century old mistake will be rectified as Florida becomes a beacon of liberty where the thieving drag of taxation will be no more!"
SFL_stand_your_ground: "Stand Your Ground"
SFL_stand_your_ground_desc: "At any moment, Pence could turn against our autonomous and free endeavour in Florida and smite us. And god forbid it, should any of the Commies or Pelosi find their way down here, they'll kill us all! To prepare for this eventuality, we'll need to reinforce the Northern border."
SFL_suns_out_guns_out: "Sun's Out, Guns Out"
SFL_suns_out_guns_out_desc: "Ever since the start of the slow collapse of America, tens of thousands of men rallied to their local militias as their only hope in the face of anarchy. But many of these militias, though sympathetic to us, run around like headless chickens and are liable to start a war in Florida itself, the last thing we need in these trying times. By rallying the militias under a united libertarian leadership, we can bring the disparate forces of Florida together."
SFL_an_end_to_the_war_on_drugs: "An End to the War on Drugs"
SFL_an_end_to_the_war_on_drugs_desc: "Many thousands across the country have been unjustly punished under the draconian laws of the state's war on drugs. Horror! What people put in their bodies is their business, first and foremost! This decades old backwards policy of the war on drugs is an abomination to everything we stand for. By abolishing it and freeing the prisoners guilty of nothing, we can also expect a healthy dose of grateful volunteers."
SFL_develop_the_everglades: "Develop the Everglades"
SFL_develop_the_everglades_desc: "Cracked down on through oppressive environmental regulations, the everglades have stood as a beacon of potential. With the end of the need for these horrid laws, we can finally make the most of our own land."
SFL_hurricane_hussein: "Hurricane Hussein"
SFL_hurricane_hussein_desc: "They came in the night. Countless militia commands were overwhelmed, routed, captured or annihilated and left to rot on the beaches. Barack \"Hussein\" Obama and his Cuban masters have landed in the south of Florida! Locals sympathetic to Obama poured out as he announced his intent to seize the mainland and liberate it from total anarchy and complete the revolution he couldn't finish.\n\nNow is the time for all hands on deck. Hussein's hordes are set to pillage Florida and rape America in the name of Communism. We are America's first line of defence against this terrorist! Rallying around the flag of our new Florida, we will march together for freedom and liberty against all foreign invaders!"
SFL_with_friends_like_these: "With Friends Like These..."
SFL_with_friends_like_these_desc: "The pressure we have come under with Obama's arrival has given the previously fringe factions of the Libertarian party the power to assert themselves as key leading figures in the war. If we are to win, we will need their support. From the imperial-nationalists of Augustus Sol Invictus, to the national-anarchists united under Preston, and the crazed youth gangs of Sharkey disaffected by the civil war and their inability to find a voice in legislature. Gee we really know how to pick 'em"
SFL_freedom_flotillas: "Freedom Flotillas"
SFL_freedom_flotillas_desc: "A key source of Obama's strength comes from his patrons in Havana. They see in him an opportunity to export the Cuban regime's reign of terror to America. While an invasion of Cuba is off the cards, we can hurt them in other ways. Countless freedom loving Americans have volunteered for running private boat fleets into the supply lines of the Cubans. With guns and rockets they'll send those Commie bastards running back to Havana!"
SFL_favors_from_phoenix: "Favors from Phoenix"
SFL_favors_from_phoenix_desc: "Though we have many differences with them, some slightly like minded folks have taken up the fight far in the West under the name of the Free States of America. They are just as horrified as us at the arrival of Obama the tyrant. Perhaps we can solicit some much needed aid from Phoenix?"
SFL_more_than_just_cigars: "More Than Just Cigars"
SFL_more_than_just_cigars_desc: "Obama's hold over the South is far from absolute. Streams of gun-runners and smugglers fester in the South. For the right price, many would be willing to run the risk of seizing Cuban equipment or diverting them to the \"wrong\" places to end up in our hands."
SFL_diy_workshops: "DIY Workshops"
SFL_diy_workshops_desc: "Putting our destiny in our own hands is what we are all about. And how can we do that if everyone's lives are kept up in factories and shop floors? What we need is an association of producers. Producers capable of doing it themselves.\n\nWhat we also need is guns. The few we get from Cuban raids doesn't cut it. So perhaps the key is somewhere in both? By incentivising small-scale private gun-production we will hopefully rapidly arm ourselves and push Obama back into the sea!"
SFL_one_last_job: "One Last Job"
SFL_one_last_job_desc: "Throughout Florida, brave veterans sit in their homes collecting their pensions. Until the state collapsed that is. Many among their number however, are gripped with sorrow at the sight of their dear country tearing itself apart. We are the only ones who can give them what they want and what they need. A bright future, and the ability to fight one last time, one last job, to save America itself!"
SFL_militias_in_the_magic_kingdom: "Militias in the Magic Kingdom"
SFL_militias_in_the_magic_kingdom_desc: "The battle for the happiest place on Earth is coming. Where once was a land filled with nothing but the laughs of children and the smell of cotton candy has become empty and hollow. Dozens of soldiers mount mortars and guns among the attractions ready to fight Obama before he can make it to Orlando."
SFL_savage_garden: "Savage Garden"
SFL_savage_garden_desc: "The savage gardens in the Everglades are hell to fight in. Swamps often result in guns and vehicles being swallowed up, or alligators chomping down on hapless soldiers. The next step forward to beat Obama is to figure out a strategy of how best to deal with this geographic hurdle."
SFL_spring_breakthrough: "Spring Breakthrough"
SFL_spring_breakthrough_desc: "Spring will come soon and the consensus in Florida is that it is high time for an offensive to finally beat back Obama! The generals argue that the end of winter gives us the best chance we'll get to overcome attrition, while militias led by Augustus Sol Invictus under the sway of a mad religious fervour worship the spring and cut the throat of goats in the name of America, they declare now is the time to kill Obama and the Cuban Communist bastards!"
SFL_the_eye_of_the_storm: "The Eye of the Storm"
SFL_the_eye_of_the_storm_desc: "At last, Florida is free and Obama is vanquished. All of Florida breathes a sigh of relief as we can finally turn our eyes to the rest of America, and start the long march toward liberating our nation.\n\nBut all is still not well in Florida. Stanton eyes with growing concern the rising influence of white nationalist factions and militias within the Libertarian party, or the roaming youth gangs of Sharkey the Impaler, and how much territory has become autonomous under Preston's anarchist cells. Yes, in the skeleton of a dead America, the Libertarian party is changing under Stanton's feet, and there's not much he can do about it. The old guard he represents is caught in the eye of a storm, a storm flying toward a place where he is not needed."

SFL.44.t: "Landfall"
SFL.44.desc: "As the sun slipped toward the horizon, staining the sky in streaks of red, blue, purple, and yellow, the towel fluttered in the coastward wind. It drifted gently to the sand — unlike its companion, the basket, which landed with a thud.\n“Mariana,” Henry said softly, “you’re as beautiful as the sunset.”\nShe giggled as his fingers found hers. “Oh, quit acting like we’re twenty!”\nHe grinned and pulled out a bottle of wine. “If we were twenty, would we have this?”\n“Oh, you know we would, Henry.” They kissed, and he filled her glass.\nMariana was leaning in for another when he paused, eyes narrowing toward the sea.\n“Do you hear that?”\nShe blinked. “What are you talking about, dear?”\n“The water... it sounds choppier than it looks.”\nShe turned to look. Her glass tipped slightly, dark wine staining the sand. In the distance, boats — several of them — crept toward shore, flags snapping in the wind. The sun's glare masked their insignias. Her eyes widened.\n“Honey... what are those boats in the distance?”\nHer voice trembled the way it did when she found a lizard in the kitchen.\n“Oh, probably just rafters,” Henry muttered. “Probably.”\nHe pretended not to see the men peering over the gunwales, rifles in hand.\nThe landing craft surged forward, grinding into the Florida sand. Soldiers poured out in practiced formation. At their head was a man with a faded Obama sticker on his helmet.\nHe scanned the resort — and spotted the couple scrambling to pack their bags.\n“Two possible hostiles at 2 o’clock!” he barked.\nGuns raised. Boots pounded. The soldiers charged, yelling:\n“Back in ’08! Who did you fucks vote for?!”"
SFL.44.a: "Rumsfeld."

SFL.99.t: "A Bill to Slay The Beast"
SFL.99.desc: "Governor Paul Stanton has introduced what his office calls “the most liberating piece of legislation in the history of the post-republican world.” The bill — formally titled the Florida Freedom from Coercion Act — proposes the total abolition of taxation in the State of Florida.\nNo more property taxes. No sales taxes. No war tariffs. No levies, tolls, or involuntary fees of any kind. Under Stanton’s vision, the Floridian state will be funded solely by voluntary donations, decentralized crowd-funding initiatives, and “agorist contributions from participating syndicates.” It is, in the governor’s words, “a system built on honor and reciprocity, and not force.”\nUnsurprisingly, the Florida Senate and House lit up like a fireworks stand.\nWhile support for the bill is enthusiastic across all factions, the devil (as always) is in the details. Some members — especially those aligned with the Property Rights Front and Freeholder Militia Caucus — argue that some form of taxation must survive to protect land claims and border defenses. A few hardliner Georgists want to keep a land value tax. Others argue for tariffs on goods imported through surviving ports. But a growing number of Stantonists are demanding a “clean kill”: total abolition, effective immediately, even mid-war.\nThe chamber now teeters between three courses: modify the bill to preserve selective revenue streams; pass the full abolition package and embrace the chaos; or delay the vote entirely, risking backlash from both Stanton loyalists and angry libertarian militias watching from outside Tallahassee.\nIn short: paradise is here. No one can agree on what it looks like."
SFL.99.a: "All taxation is theft. Let's act like it."
SFL.99.b: "No taxes? Fine, but let’s keep the ports and the land registry running."
SFL.99.c: "Can we table this, please? Put it off? Recess?"

SFL.100.t: "Sun's Out, Guns Out"
SFL.100.desc: "They came in from the swamps and the suburbs, from the shell-scarred trailer parks and the gated communities turned redoubts. Some wore hand-me-down camouflage; others wore flip-flops and Punisher tank tops. All of them were armed.\nFlorida’s militias — long fragmented, paranoid, and fiercely territorial — have finally answered the call. Libertarians, property defenders, ex-Marines, Oathkeeper splinter groups, and freelance doomsday prophets now march under a single, uneasy banner. For the first time since the collapse, they are not fighting each other.\nIt didn’t come easy. Leadership had to be decentralized just enough to keep their egos intact, but centralized enough to avoid accidental skirmishes over barbecue sauce or ammo caches. A loose command structure was agreed upon, built less like a military hierarchy and more like a regional forum of warlords and logistics nerds. They meet via shortwave. They vote on who gets to requisition what. Sometimes they duel.\nThe results speak for themselves. Fresh battalions have begun to coalesce — some with uniforms, others without — and morale among the outer counties is soaring. Guns are plentiful. Discipline is... relative.\nStill, some in Tallahassee whisper nervously. You can hand a man a rifle — but how long before he starts thinking it gives him a say in how Florida’s run?"
SFL.100.a: "The good news is we’ve got guns. The bad news is they all have their own opinions!"

SFL.102.t: "Florida wants guns!"

SFL.103.t: "The Free States Answer the Call"
SFL.103.desc: "From the mesas of Arizona to the mountains of Colorado, the Free States have answered. A full division has arrived via planes, armed and ready to defend liberty in the swamps and cities of Florida."
SFL.103.a: "Hooray for liberty!"

SFL.104.t: "A Token of Solidarity"
SFL.104.desc: "The Free States have pledged support—but limited. A single regiment of seasoned volunteers has been dispatched, carrying with them the hope of future cooperation."
SFL.104.a: "Could be worse!"

SFL.111.t: "Rising of the Sun"
SFL.111.desc: "Ray flew down the interstate, the red needle of his ‘87 Starion trembling with every pothole. He weaved between the skeletons of burnt-out sedans and semi-trucks like he was still late for work.\n\n“Oh I’m sowwy Ray, I can’t accept your PTO,” he mocked aloud, lip curled. “These are touuugh times.” He let the steering wheel drift as his voice rose into a snarl. “I’ll show you tough times. Feronia, make him impotent, ruin his shit, kill him!”\nCaught in his own storm of curses and imagined vengeance, he nearly missed the turnoff. Tires screamed as he swerved hard onto a winding gravel road, headlights cutting through humid blackness. The further he got from the highway, the less the world felt real. Civilization fell away, replaced by pine scrub, swamp, and darkness. Mud clung to the sides of the car like blood on a butcher’s apron.\nThen, a sign: AEDES MARTIS in smeared red paint. Ray exhaled in relief. He parked crookedly in the grass, tossed his bag over his shoulder, and jogged toward a shadow waiting under a half-lit archway.\n\n“Salve, Kevin!” he called out.\n“Dude. It’s Quintus now,” his friend replied dryly, adjusting a worn Beretta on his belt.\nThey joined the crowd forming around a stone ring lit by torches and car headlights. Smoke from citronella coils mingled with incense. Tattered Roman flags hung limp on PVC poles.\nFrom the shadows came two figures: one hooded, dragging a bleating goat; the other cloaked in white, face serene. The crowd erupted: “Io Caesar! Sol Eterna!”\nThe robed man raised a hand, and silence fell like a dropped curtain.\n“Brothers. Patricians. We are the vanguard of rebirth,” he said. “From these swamps we forge the spear of the next world.”\nRay stood frozen, transfixed. For the first time in weeks, the noise in his head had stopped.\nThe goat screamed. Sol’s dagger flashed. Blood painted the stones.\n“Augur!” he bellowed. The hooded priest plunged his hands into the corpse and held the organs to the firelight. His eyes widened.\n“The gods will it…” he whispered. Then louder: “The gods will it!”\nA roar shook the woods. The sacrifices had only just begun."
SFL.111.a: "It would be a loooong night."

SFL.112.t: "Moving Day"
SFL.112.desc: "Nel sat by the side of a lonely dirt service road off I-4. The kind of road where the nearest trace of civilization was a flickering Love’s sign in the distance, half-swallowed by swamp. One arm was extended, thumb pointing lazily at the sun. The other clutched the tattered remains of his backpack — a frayed canvas husk that had, somehow, survived the entire march from Savannah.\nHis face was blank. That wide, glassy stare you only saw in junkies right after they dropped their last hit. Except Nel wasn’t high. His stomach made that much clear. He wasn’t lost, either — not exactly. But there was something crumbling inside him. He wasn’t sure if it was hunger, exhaustion, or madness.\nJust as his vision tunneled into black, he saw a shape cresting the hill.\n...\n\n“He’s waking up,” said a woman’s voice — sharp, slightly nasal.\nHis eyes opened to a pale tent ceiling and a blinding shaft of sunlight. A woman sat beside him. Jet black hair, sun-beaten skin, eyes like cold coffee. She handed him a chipped cup of water.\n“You collapsed by the road,” she said. “We saw you and brought you in.”\nNel tried to sit up, winced, and looked out the tent flap.\nOutside was a patchwork sea of dwellings: hand-painted shanties, salvaged FEMA tents, yurts made of stolen campaign banners. Windchimes clinked in the breeze. Children played with sticks next to a pile of books left out to mold in the sun. A hand-carved sign dangled on twine: WELCOME TO THE ARCADIA COASTAL COMMUNE – RESPECT YOUR TRIBE.\nThen came the rustling of grass and plastic as a large figure approached the tent.\nThe man who entered had the gait of someone who thought deeply before speaking but enjoyed being listened to when he did. His gut pressed tight against a threadbare polo shirt, and his long graying hair trailed down his back like wind-blown wiregrass. In one hand he held a weathered notebook. In the other, a single American Spirit cigarette.\nThe woman smiled. “Keith! Glad you’re here — this is Nelson.”\nThe man’s face lit up like a preacher meeting a convert. “Nice to meet you, Nelson...”\nHe reached forward and grasped Nel’s hand.\n“..."
SFL.112.a: "And welcome to the tribe."

SFL.113.t: "The Tampa Caper"
SFL.113.desc: "Harry the Bug was slinking through the bars of downtown Tampa. Cigarette smoke curled over his hat like an angel when Stevie the Cut wandered in from the rain. He shot the bartender, then slung an arm around Harry with a bottle of Tennessee whiskey jammed down his rotting toad throat.\nThe Sicilians had sent them both, but it was Harry who made the deal with the Vampire. Stevie had just come back from the sideways puking and burning plantations of the cotton states.\n“Yo, baby! How’s the Gargoyle melting?”\nHarry rubbed his temples. Sicilian speak — he’d picked it up back in the day. Stevie was asking how the Vampire talks had gone.\nHarry motioned for him to sit, wiping the bartender’s blood off his leather coat.\n“When midnight hit, I got down with the Brown Gang. We tangoed with raccoons. I gave them junk. They shot it straight into their balls right in front of me. One carved a pentagram into his forehead, then rubbed a blood-soaked rag over his jaundiced eyes. Said they’d take me to Sharkey. They called him Father. Tepes. The Red Artist. All kinds of names. He’s their daddy now, see.”\nHarry paused, sweat falling onto the bleeding table. He lit a cigar.\n“So we rode past the bayou, all the way to the ex-plantation. Devil’s moonlight made the hanging ropes on the trees shimmer. You don’t need me to tell you what they used those for. The mansion was called the Black House. Painted jet black. Spanish moss. Gargoyles. Effigies of Medusa, mid-masturbation. We knocked. An hour later, the Vampire answered.”\nHe exhaled.\n“Through vomit-stained curtains and glass halls we walked. Sharkey led us. He had Fiji mermaids in jars, statues of Ba’al, vials of cow and baby blood. Red curtains everywhere. Junkie shadows writhed in some rooms, whispering prayers. He sat us down. Brushed his hair back. His ghost concubines kissed his cheeks and poured us ‘wine.’ We didn’t drink.”\nStevie tapped his gun on the table.\n“Cool it with the jive. What’d the fucker say?”\nHarry took another drag.\n“He said sure-o. We give him guns. We kill a few dealers he doesn’t like. Clean up the place. Give it some class. Then he’ll ‘fix his boys’ — get them off junk. Start building his palaces to Nova Satan.”\nStevie leaned in.\n“And then what?”"
SFL.113.a: "And we ran out of there like bats out of Hell."

SFL.105.t: "Down Fall"
SFL.105.desc: "Tallahassee was in chaos. The state assembly in a state of near anarchy. “Fuck, Fuck…” Stanton muttered to himself. Obama’s hordes may have been defeated, but that had given him no reprieve. Pretty much everyone who had screws to tighten was doing just that. Preston’s gangs of Anarcho-punks and Ex-Obama clerks and sympathisers were flocking over to him and putting up their communes calling for Stanton to be kicked right into the Gulf of Mexico.\nOn the other end of the deal was Sharkey and his gangs. The mad vampire of Tampa was a bane on the Libertarians, with his mafia dealings and his youth gangs assaulting and accosting anyone they saw fit.\nBut most of all, what made Stanton realise there was no room for his memory of the Libertarians in this Florida, was Augustus and his Roman cultists. Everyday decorum in the party could not be reached as the White nationalists under Augustus would attack the once sensible wings of the party.\nThe world was changing, and he was being left behind. Representatives in the assembly still loyal to Stanton were dwindling. Many grew worried over the ruckus of the dissident libertarians, a tense coalition of those three maniacs. They were all together demanding that Stanton resign. He had lost the mandate of Florida, and no one had any desire for his milquetoast rule. The age of pussyfooting fake-tarians was over, and true radicals were to take the helm. It had not escaped Stanton’s notice that many had guns with them. If he wanted to leave here with his life, Stanton would resign, he didn’t doubt that for a second.\n\nBut he still had an ace in the hole, one last trick he could pull. Those representatives still loyal to him, Stanton thought, could perhaps be directed to support whoever he chose to resign in favour of. A subtle trick, but an effective one. Only now, he had to choose. Who is the lesser evil?"
SFL.105.a: "Before Stanton speaks, Invictus’ smoking gun takes the floor!"
SFL.105.b: "Mr Sharkey carries the spirit of our Age. I will resign for him."
SFL.105.c: "To reconcile Left and Right, I bring Preston to the table."

