#prestonwar
SFL_refresh_the_tree_of_liberty: "Refresh The Tree Of Liberty"
SFL_refresh_the_tree_of_liberty_desc: "We might have beat the Obamaists back to the sea. But this is merely the first fight, Jefferson said that the tree of Liberty must be refreshed from time to time. It seems that nowadays our tree has begun to wilt under tyranny. He also says that it must be refreshed with the blood of patriots and tyrants, so let us spill that blood!"
SFL_trash_the_clyburniate: "Trash The Clyburniate"
SFL_trash_the_clyburniate_desc: "To our north lies an aberration; Clyburn’s Africanist tinpot statelet is everything the Founding Fathers warned against, a pure manifestation of U.S. multicultural imperialism imposed upon the people! Its dismantlement will herald the beginning of the end for the central government and a rallying cry for all the pan-sessionist forces. Once Georgia is freed, our Anarchist confederation will be strengthened by the likes of Black Panthers and Neo Confederates all united in the struggle against the State!"
SFL_war_plan_shilling: "War Plan Shilling"
SFL_war_plan_shilling_desc: "Now that Clyburn’s tyranny has been put down like the rabid dog it is, we must face and strike Dixie. Since Bacon’s rebellion, the oligarchs have lulled the Southron into being their chattel by convincing them that there was an advantage to being white chattel rather than black chattel. Freedom is truly gone as their ‘Duke’ is part of a secret society that started out as a terroristic gentleman’s club. We must conquer the Klan state to free the clans that lie within."
SFL_war_plan_peso: "War Plan Peso"
SFL_war_plan_peso_desc: "Pelosi is the second devil, next to Pence and his conservatives. Pelosi’s liberalism is abhorrent to America, letting in however many hordes of immigrants, and doing nothing to stem the decline and stagnation we have been dealing with ever since Goldwater! Just as heavily as we will fight against Pence, we will also fight against Pelosi, to at last depose the last remnants of this outdated liberal order."
SFL_war_plan_dollar: "War Plan Dollar"
SFL_war_plan_dollar_desc: "It is not only the government but also the financial sector that wants the average joe to be stuck in his dead-end job paying tribute to the both of them. So why was anyone surprised when the Soviets bought the New York Stock Exchange in ‘08. Might as well kill two birds with one stone, hitting Bloomberg and Fetterman."
SFL_the_red_psychopaths: "The Red Psychopaths"
SFL_the_red_psychopaths_desc: "A rat’s nest lies in the New York Suburb of New Jersey, where men have been lulled into ‘Class Conflict’ and executing ‘praxis’ instead realizing that their problems are just due to living in a society. They are being ruled by psychotic leeches, who despite supposing that every man entitled to the worth in labor, just want to siphon from working hands and shoot those who ask too much. The quicker it takes us to smoke out the rats and clean the cities, the quicker it’ll take to free these fellows from the obligations of Lenin and Marx."
SFL_the_liberal_rotters: "The Liberal Rotters"
SFL_the_liberal_rotters_desc: "Through their policies of free trade and deregulation, the Forwardists and Pelosi’s acolytes have ruined America. They drove deindustrialisation and economically ruined much of the business sectors of America who could not compete with Soviet, Japanese, or Indian manufacturing. Not to mention their attempts at reconciling with the totalitarian Soviet state has only ruined our standing in the world."
SFL_the_conservative_squares: "The Conservative Squares"
SFL_the_conservative_squares_desc: "Status Quo, Status Quo; these are what the conservative protects. The Conservative never asks whether this Status Quo is unjust or violates liberty; all he does is bitch and moan when they pick the post, but when it is firmly planted into the ground he calms down. Pence is only mad because Pelosi failed to stake the post, let this be done away. Strike whilst the Behemoth is busy with the Leviathan!"
SFL_embolden_the_willing: "Embolden The Willing"
SFL_embolden_the_willing_desc: "What we champion is not rule of Anarchists but rather Anarchs; superior individuals that rose above the herds in defiance, in contempt of both the sheep and their masters. So then, why should we impose upon these Nietzschean Supermen a strict military hierarchy and the officer’s decree? No, let us encourage and foster these egoist wolves that rose over the fog of war, for in the end they will always triumph over the sheep."
SFL_contract_outsiders: "Contract Outsiders"
SFL_contract_outsiders_desc: "Unfortunately the death throws of the U.S. empire have bled our tribes dry. So be it, the world has plenty of Ubermensch willing to fight. Seychelles mercenaries, driven by greed and ego, Danubian ethno-pluralists following the steps of Ernst Junger, Libyan national bolsheviks wishing to kill imperialism in its crib. Anarchy’s call transcends political and geographical boundaries and they all shall answer!"
SFL_war_plan_yen: "War Plan Yen"
SFL_war_plan_yen_desc: "Just as dangerous as Pelosi’s treachery is the empire of California. Under the leadership of the Forwardists, they have substituted subservience to the USSR for subservience to Japan. Pilfering the country and spitting on the very idea of an American nation in favor of corporate domination, what greater evil can there be?"
SFL_the_tahoe_whores: "The Tahoe Whores"
SFL_the_tahoe_whores_desc: "With Tahoe, the CEOs and their mistresses, in our sights we just have to make bigger steps and strike slightly harder. Give it your all boys! I will grant you all a little lot on Lake Tahoe. Fight for Liberty and your Tribe!"
SFL_amnesty_for_our_enemies: "Amnesty For Our Enemies"
SFL_amnesty_for_our_enemies_desc: "While it may be tempting to get rid of our erstwhile comrades turned traitors, it would go against the principles of Anarcho-pluralism to divide the tribes and enforce a single, despotic vision. We are no statists and any disagreements between us, the Death Dealers and Roman libertarians can be forgotten so long as we all focus our superior will against the oppression of the State."
SFL_raid_the_factories: "Raid The Factories"
SFL_raid_the_factories_desc: "Florida never was an industrial titan, so we are at a disadvantage to other combatants. Georgia, though not that big of an industrial centre, still offers opportunities for us. By contacting sympathetic gun-runners and anti-Clyburn insurgents we could perhaps get our hands on more guns for the war effort."
SFL_mobilize_the_workshops: "Mobilize the Workshops"
SFL_mobilize_the_workshops_desc: "During the short war we’ve had with the J-6-M insurrection from Obama, we mobilized local workshops throughout Florida to create improvised weaponry. Though, with Obama’s fall, many fell into disuse. By rebuilding and restructuring these factories we can build a strong industrial base with which to fight this war."
SFL_plunge_fearlessly_into_war: "Plunge Fearlessly Into War"
SFL_plunge_fearlessly_into_war_desc: "People of America, are you ready for freedom? Our call rings out from Florida, and will not rest until every tribe yearning for freedom in America shatters its cages and is reborn. Hordes of millions and millions stand in our way, with their own agendas of destroying America and her freedom, but no matter how long and troubled the road may be, we will walk it and fight all who stand in our way."

SFL_bonus_against_CAL: "Bonus against [CAL.GetFlag] California"
SFL_pence_attack_bonus: "Bonus against [USP.GetFlag] Pence"
SFL_pelosi_attack_bonus_preston: "Bonus against [USA.GetFlag] Pelosi"

SFL_the_sun_rising: "The Sun Rising"
SFL_the_sun_rising_desc: "After uncountable trials and millions bleeding on the grounds of this great country, we have at last risen to supremacy. We, the vanguard of this White America against the longhoused globalists who sought to pillage us. But within us, many questions have yet to be answered. The Imperium of America is here, but where must it now go?"
SFL_brothers_of_blood_and_soul: "Brothers of Blood and Soul"
SFL_brothers_of_blood_and_soul_desc: "Our brethren in Europe lay in disarray. Next to them is an ever rising threat of Soviet expansion, seeking to subsume them into a Communist reign of terror, or the great trouble brought by Chinese expansion and Japanese economic power. What we need in these trying times is brotherhood between these fellow nations of the white race."
SFL_britannia: "Britannia"
SFL_britannia_desc: "The government of Britannia, we may have our disagreements with. But they are a gateway into Europe. Perhaps some accord can be found with them, to rebuild the alliance we had before we collapsed into civil war."
SFL_gallia: "Gallia"
SFL_gallia_desc: "The French, in our absence, rose to the occasion of being Europa’s defender. A great and might force capable of beating back the Soviets and the African threat. Though they have squabbled with the Italians, now is not the time for bearing a grudge. Instead we must strike an accord with the French on pragmatic grounds to reconnect with Europe."
SFL_those_reduced_to_noricum: "Those Reduced to Noricum"
SFL_those_reduced_to_noricum_desc: "The new province of Noricum, Austo-Bavaria, is one of the few bastions of liberty left in Europa. Led by brave men who recognise the valiant struggle of Hitler against the savagery of the Soviets and Marxists, they are our go to ally to get our foot in the door in Europe."
SFL_italia: "Italia"
SFL_italia_desc: "In Italy, Fascism was reborn. She lives now much as she did in the past under the valiant government of Mussolini. With that in mind, having established ties with the Noricum province, Italia is the next step, fighting hard against the globalist treachery of the French and the Soviets alike."
SFL_some_of_our_best_friends_live_in_south_africa: "Some of Our Best Friends Live in South Africa"
SFL_some_of_our_best_friends_live_in_south_africa_desc: "South Africa is one of the few bastions of civilisation left in Africa, ruled by brave white men whose struggle is not unlike ours against the unwashed savage masses. Strengthening ties into a good strong alliance with the Cape government is just what we need to get our foot in the door of African diplomacy and to contain any potential threat that may arise."
SFL_sunshine_on_the_outback: "Sunshine on the Outback"
SFL_sunshine_on_the_outback_desc: "Australia, much like America, is also an Anglo-Saxon bastion of civilisation against the frontier of mudhuts and deserts. They also form a strategic partner against Japan and China. Currying favour with the Aussies may be in our best interest too."
SFL_our_place_at_the_table: "Our Place at the Table"
SFL_our_place_at_the_table_desc: "NATO was one of America’s great accomplishments. It forged a united (mostly) European front against the horror of Marxist terror. Our collapse made us technically no longer a part of NATO, though the recognised government of Pelosi was theoretically a member, she no longer is in the picture. Though we may have had our differences with NATO, now is the time for reconciliation."
SFL_fighting_the_grey_world_abroad: "Fighting the Grey World Abroad"
SFL_fighting_the_grey_world_abroad_desc: "Against the forces of globalism, we must stand united. Italy, Austro-Bavaria, America. A new axis for the ages that stands readily opposed to the danger of treachery and marxism from both the West and the East! Now, with the great might of America standing tall with them against the grey and dry bureaucrats and revolutionary menaces, who can stand against us?"
SFL_the_invictan_agenda: "The Invictan Agenda"
SFL_the_invictan_agenda_desc: "The American Imperium will not be built in a day. The first foundation stones have been placed, but that is all. The face has changed, but the body has not followed suit. Yes, much of America is still plagued by the rot that festered within it for so long, only now can we begin to cure her."
SFL_the_last_bureaucrat: "The Last Bureaucrat"
SFL_the_last_bureaucrat_desc: "Tyrannical institutions such as the IRS, who constantly steal from the population, or the FBI who monitor us and control us, or the DEA who dictate what we can and cannot do with our own bodies, must go at once. How can we be free if the remnants of these globalised freakish institutions remain? No, we must do away with them, and drain the American swamp of these petty bureaucrats and small-tyrants."
SFL_a_life_with_nature: "A Life With Nature"
SFL_a_life_with_nature_desc: "The regime of past American dictators resulted in the pillaging of American land and soil through the construction of suburban hellscapes. These developmentalist satanists have destroyed the land and corrupted the soul of the American white man. By thieving him of nature and forcing him into small plots of land owned by corporate gigalords, they made him docile and weak. But no more! The era of suburban life has now come to an end, and with it a rebirth of nature. Yes, now is the day of the return of the smallholders and frontiersman. What the white race was meant to do among the beauty of nature, to nourish her country with strong capable men and strengthen their spirit with hardwork and grit."
SFL_slam_the_door_open_a_window: "Slam the Door, Open a Window"
SFL_slam_the_door_open_a_window_desc: "With the start of the civil war came a blessing in disguise. People stopped coming here illegally, and muddying the waters of American demography. But now that we have won, we may as well formalise this by closing the borders and stopping any fools who try to enter America illegally to take advantage of this great country.\n\nAt the same time, legal avenues for immigration can be allowed, providing that those who try to come in are of the right ethnic stock and possess the qualities of elite human capital."
SFL_the_insurgent_generation: "The Insurgent Generation"
SFL_the_insurgent_generation_desc: "Any self-respecting empire needs a vast and terrible army to fight for her. The remnants of our forces from the civil war are mighty indeed, but they cannot stay and fight forever. The next generation’s transformation into a caste of warriors ready to rage against our enemies, wherever they may or may not be, is the obvious first step to securing this empire from straggler insurgents and future threats."
SFL_fight_for_your_country: "Fight For Your Country..."
SFL_fight_for_your_country_desc: "What is this Insurgent Generation to fight for? Their people, their brothers and sisters, children and parents. The body of this country, the white nation of America. That is what we struggle for. Who we fight for. No matter what, our cause is to hold up our nation over all. Millions and millions of Aryan stock must line up to revolt against the modern terror-dictatorship that has trapped the world in its great and horrible jaws."
SFL_not_for_your_government: "...Not For Your Government"
SFL_not_for_your_government_desc: "Even still, their loyalty must be to their race. To their nation. But not to the government. Sure, we are a legitimate leadership for America, but the institutions of American government, of the bureaucracy, of taxmen and all those who stand in the way of liberty for white men are not our allies. They are not who we will fight for. Our loyalty is to our race. Not our government. Should this government degenerate into a race-mixing, longhoused dictatorship then a generation of enlightened Libertarians will be ready to wipe it off the face of the world."
SFL_the_necessary_evil: "The Necessary Evil"
SFL_the_necessary_evil_desc: "Government as it has existed for so long is an evil, but a necessary one. Yes, it limits the people’s liberty, but stable governance is a must for what we seek to achieve. A delicate balance is needed between the extremes of total liberty and total dictatorship to guarantee our people’s rights yet not collapse for the 2nd time this decade."
SFL_not_if_you_were_the_last_tyrant_on_earth: "Not If You Were The Last Tyrant on Earth"
SFL_not_if_you_were_the_last_tyrant_on_earth_desc: "Eugenics is tempting to use, but it carries certain risks with it. Certain specimens of the political sphere may get their grubby hands on it and use it for a cause that is ignoble. Perhaps to attack those who are “not white enough” for their tastes, or perhaps to unwittingly create abominations and neo-bugmen beyond our comprehension. Perhaps in the future when the culture of America has been shaped in a way fit for its use, eugenics will have its day in the sun. Until then, we will keep it under lock and key."
SFL_love_of_excellence: "Love of Excellence"
SFL_love_of_excellence_desc: "Technology has come very far indeed, and though it carries the risk of making a generation of bugmen reliant on Communist dictators, it also has the chance of creating a new stock of ubermensch. Though eugenic technology has been strictly seen as taboo, we are at last in a position to use it for our own ends. No longer will disabled freaks blight our race, and no longer will mongrels walk among us. With a new eugenics program, a race fit to lead America will at last emerge."
SFL_against_mass_democracy: "Against Mass Democracy"
SFL_against_mass_democracy_desc: "In the days of elite democracy, we did not need to worry about squalid masses squandering the potential of the nation, being driven into communist fantasies of race-mixing and socialism. The greatest sin of our ancestors was relinquishing power from the worthy to the masses. Democracy is a virtue, but only in the hands of the capable. Those who have a stake in this country! Franchise must be restricted to those with property, to the levelheaded and intelligent men who lead their families and not their wives who must be subservient to them, to the White men who built this country from the ground up!"
SFL_imperium_et_libertas: "Imperium et Libertas"
SFL_imperium_et_libertas_desc: "Across the fields of America, and down from its mountains a new cry rings out. A cry of the brave white men who fought and bled for America to be free at last from a cabal of Marxist, tyrannical, degenerate globalists. In its wake lies an empire among the biggest the world will ever see! And it cries Empire and Liberty! An empire of the White American man, who so bravely struggled against the savage and the tyrant. An empire yet also of Liberty! Which gives her children freedom and prosperity. That is what we have reclaimed today.\n\nMore will come of this great revolution of course, as we return to a pagan state of mind, free of the corrupting influences of Abrahamic demagogues. And more as we return to the legacy of Rome, as our borders will consume those who oppose us. And when that day comes, from sea to shining sea, an empire of ubermensch will reign over the old and the new world!"

