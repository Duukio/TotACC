#preston events
SFL.820.t: "Currency Chaos"
SFL.820.desc: "Johann was sitting in the lobby of the Hilton Hotel, over Johann sat a pinup of a black flag with symbols he did not recognise. In his hand was his phone waiting for that all important call from Toby, his boss who worked for some new up and coming  Japanese firm. They had directed the two of them to negotiate business arrangements in Florida with local communes. The measure of sovereignty had, in the eyes of the business world, opened a near endless stream of opportunities for trade and commerce, at least in theory.\n\nAt last, the phone rang.\n\n\"Hey, hey Johann. How’s Florida?\"\n\n\"Not too bad, all things considered. You still find some… leftovers… from the civil war, but things are going back to normal, I guess.\"\n\n\"Normal?\"\n\n\"Well, as normal as you’d expect.\"\n\n\"Yeah don’t worry bud, I get what you’re putting down.” The two paused for a moment before Toby continued. “But, uh, listen buddy, Kyoto’s been busting my ass about how this deal is gonna go down, any updates about that?\"\n\n\"You want the good news first or the bad news?\"\n\n\"Hit me with the Good news first champ.\"\n\n\"The good news is everyone here loves it. They’re practically drooling over our robots. The bad news is payment.\"\n\n\"Do they not like the asking price?\"\n\n\"No. They don’t care about that. The prices are all fine, the problem is… Well it’s how they want to pay. All these communes have got different systems of accounts and payments and it’s a fucking nightmare to deal with. Some use dollars or bitcoin, and that’s fine obviously. But some want to barter for other goods, others have their own funny money. Some Satanists calling themselves the Death Dealers or some bullshit want to pay us in cow blood. Hell some freaks pay their militias in coconuts! Fucking coconuts man! They want robots for coconuts!\" Another pause grew on the line. Toby groaned and sighed. \"Well, I can’t tell Kyoto the deals have fallen through, or that we can only deal with one or two of the guys. I won’t worry about the money…\"
SFL.820.a: "Let the head hurt in Tokyo, not with us."

SFL.821.t: "Art Of The Deal"
SFL.821.desc: "A series of disputes have risen across the country. Truckers and other workers involved in transportation and their associated unions have been raising a ruckus against us for the past few weeks, citing difficulties concerning their ability to cross state borders. Three different communes have been established among a stretch of land in the North-West, but the way in which their borders intersect mean six different permits are required for them to pass. Despite our promise to provide liberty from red tape and bureaucracy, this seems to be the exact same type of thing that was happening before our revolution.\n\nSome in our ranks have thus called for regulating the borders between communes, to allow for groups such as these to travel across commune lines unburdened. However, representatives from the communes have argued that doing so would be a step towards re-instituting federalism and runs contrary to their sovereignty and thus against the goals of our revolution. Whose side should we take?"
SFL.821.a: "Streamline the borders"
SFL.821.b: "Let them haggle"

SFL.822.t: "Burning Man Forever"
SFL.822.desc: "The black van came to a stop. The tires screeched as dust engulfed the vehicle that created it.\nPreston peered out of the window, he practically stared at the large wooden statue in the center of the arch that formed from the tents.\nAs he exited the van, he noticed a shaggy haired man with shabby clothes running over to him. \"P!\" the man shouted\n\nAs the man, seeming to be in his early 60s, arrived, Preston asked  \"Pee?\"\n\n \"Dude, I can’t call you ‘mister’ we’re free from all that square stuff, so instead I call you just ‘P’.\" responded the guy\n\n\"Ah, uh just call me PUR\" replied Preston\n\n\"Cool Ma-PUR, Welcome to Black Rock City!\" declared the man, \"My name’s Fire Quimby, just call me Fi.\"\n\n\"Nice, so what’s with the big wooden statue?\" Preston humbly asked.\n\nFi looked ecstatic, then he announced as he pointed to it, \"That is The Man, an Effigy build and then we burn him\""
SFL.822.a: "Ah, I see…"

SFL.823.t: "No Rootin’, No Tootin’, No Shootin"
SFL.823.desc: "\"Simply put, it's rude and disrespectful!\" Flower shouted.\n\n\"It’s our land, we’re allowed to do what we want!\" Chet retorted. \n\nPreston was zoning out, and then he snapped back to reality. \"I’m so sorry, what is the dispute again?\" he asked.\n\nBoth seemed pissed, but Flower started again in a much calmer tone. \"On the Yellow River Commune, we don’t allow guns, nor the firing of guns. That’s how we wish to live, in Peace. But, the Middle River Militia finds it funny to take pot shots at us during the day and shoot their guns at night.\"\n\nChet interjected \"It is our right to shoot our guns, it’s not our fault that there’s a red outhouse on the other side of the river\"\n\nFlower shouted \"You shot old man Goa in the ass!\" Chet chuckled loudly, but he cut himself off when she glared him down.\n\n\"Sorry, but for the shots at night; We have to eat. At night is when the Hogs are most numerous. Not only that, but we’re a Militia. I don't really get why you’re surprised that we use guns.\"\n\nPreston looked down at his watch. It showed 5 til noon. He sighed and said,"
SFL.823.a: "Shoot your guns somewhere else"
SFL.823.b: "Just learn to deal with it, it's their right"

#ASI events
SFL.704.t: "The Gherkin"
SFL.704.desc: "\"I was expecting Holyrood.\" Augustus muttered through gritted teeth.\n\nThe British foreign secretary, annoyingly a woman, blinked at him: \"I beg your pardon?\" \n\n\"Holyrood castle!\" Augustus exploded, \"Windsor, Hillsborough, even Buckingham! And instead-\" He realised the delegation was staring at him and tried to reign in his righteous fury: \"I’m sorry, I was just… expecting the reception to take place in an edifice representative of Great Britain and its grand heritage.\" And not in a fucking eggplant made out of glass.\n\nThe woman coughed politely: \"I can assure you that the Gherkin is quite representative of modern UK, mister Invictus.\"\n\nWell she wasn’t wrong: a plain corporate office with no soul, all glass and steel and post-modern bullshit. Is this what Britain had devolved into? His ancestral homeland, plagued by technocrats and liberals.\n\nAs the woman and Gonzalo continued talking about the potential trade agreement and NATO membership, Augustus stood up and started pacing near the window, looking at the city below. A great sprawl that made his skin crawl was beneath him. One of the capitals of international zionist finance and multicultural rot. He was not here to clean it or declare a crusade, but did he have to see it? Secretly he hoped to use the trip as an excuse to visit Scotland and its great and mighty highlands but the sight of London made him want to retch.\n\n\"-there is a roman tomb here, however.\"\n\nAugustus snapped to attention: \"What?\"\n\n\"You mentioned heritage,\" the woman repeated, \"during the tower construction, a Roman tomb was uncovered, 1600 years old. It’s stored at the British Museum, I thought you might be interested.\"\n\nAugustus straightened up and forced down the bile back into his stomach."
SFL.704.a: "Yes, let us pay our respects to Britannia"

SFL.705.t: "Senatus Populusque Leopardus"
SFL.705.desc: "Buck liked to think of himself as a smart fellow. Sure he never had a fancy degree or nothing like that but everyone knew that those things were for pussy ass liberals. He learned the ropes, saved enough cash and got his hands dirty enough times to actually become good at something. Even managed to open a repair shop in Tallahassee. Also managed to read and learn in the meantime. He was no Einstein, but no fool either to trust the government. So when shit kicked the fan he started helping the local Legionnaires that took up arms. Repaired their Toyotas and drove around giving out ammo and gas when the Obamaist hordes were close to taking Tampa. Cried tears of pure joy when Mister Invictus took the White House. Point was, he was a real patriot and was about to do his patriotic duty once more.\n\n\nIf he wasn’t so darn confused.\n\nValoresne nationis albae sustinesne? the text read. Buck scratched his head and looked around. Most of his fellow compatriots looked similarly puzzled, they were here to vote not to answer a quiz. And in some foreign languages as well.\n\nBuck waved at the Legionnaire standing next to his polling booth: \"Excuse me sir, what are we supposed to say here?\"\n\n\"It’s a simple yes or no question sir, just cross the answer you believe is correct.\"\n\n\"But I don’t understand what’s on here!\" \n\nThe Legionnaire, a twenty year old boy, just shrugged: \"Guess you can’t vote then.\"\n\nBuck’s jaw dropped to the ground: \"What do you mean?\"\n\n\"Suffragium ferre non potes.\" The guard said, looking bored.\n\n\"Don’t you speak in Spanish to me son, we’re in America! Now what do you mean that I can’t-\" Buck felt a hand on his shoulder. Two more guards appeared behind him, armed and masked.\n\n\"Don’t you touch me!\" Buck roared as he was dragged out of the polling station. \"You’re denying me my rights!\""
SFL.705.a: "The others only watched as he was pulled away."

SFL.706.t: "Hole in the Wall"
SFL.706.desc: "Jorge had been a farmer, with a hobby of reading books in latin, until the Hondurans burned his farm. He hated the Socialists in San Salvador, so he left. He arrived in Matamoros, and whilst getting a drink in a cantina, he kept hearing about \"Los Romanos\"\n\nHe was at the border when he saw it for himself. The Roman-style flag and the border guards wore roman style helmets. He took a breath and approached them.\n\n\"Salve, Miles. Ad America venio, et scio linguae Latinae\" he announced in a spanish accent.\n\nThe first guard’s eyes went wide. The second guard sputtered \"Salve, venio; es pleasur noster\", and they let him in.\n\nHe continued into Brownsville and said to himself"
SFL.706.a: "Gracias, Seneca"

SFL.707.t: "America Invicta!"
SFL.707.desc: "The winds flew down the streets of Washington, whistling and whaling. The stadium was filled to the brim in complete and utter silence. Legions of people standing, staring at the podium. 200 yard Crimson flags with yellow eagles standing strong on top of them fluttered in the wind. A fire was lit in the centre and a hundred brass trumpets sounded out.\n\nFrom a hidden door, the new emperor emerged. Augustus walked out amidst the roar of a crowd hailing his name. Behind him, came a goat and two dozen naked men, wearing only flat masks. Augustus stood still and watched the crowd as they chanted his name and hailed him. This was the first of many temples to come, dedicated to the old Gods for a new America. Europa’s dagger lay plunged in the heart of the degenerate kingdoms of old, and Augustus stood with her. Washington was only a snapshot, a small microcosm of an earth-shattering revolution. A tear almost fell from his face at the thought of just how far he had come from the backwaters and swamps of Florida, to the head of an empire. Almost. The new Romulus was here, standing over Etrusca.\n\nBut for now, he did not talk. The crowd roared and roared, beating themselves into a frenzy. The masked men behind Augustus grabbed the goat onto an altar. He started to bleat in fear and pain as they slit its throat and belly. It bled out, and its blood pooled around Augustus. The smoke reached him, and the roaring subsided. It was only then…"
SFL.707.a: "That the emperor spoke."


SFL.708.t: "This Oranian Heat"
SFL.708.desc: "Augustus was among friends. On the journey from America to Cape Town, he rode on the plane with a smile, headed to one of the few remaining outposts of European supremacy in this degenerate mongrel world. Officially he was there to establish ties with the Apartheid government of South Africa, but what he was really looking forward to was to meet the white separatists in Orania.\n\nAt least that was the original plan. What Augustus had not planned for was the oppressive heat that beat down on him. He was surrounded by smiling Boers who greeted him and shook his hand. He faked a smile, but gritted his teeth at the sweltering sun. And what was up with how these people talked? He knew Boers weren’t Englishmen, but this accent was impenetrable! A young lady walked up to him and pulled a book out of a bag. What was she saying? Augustus couldn’t concentrate. Not with this sun, and not with his heat, and certainly not with her heavy accent. He tried to stop a sneer at the sight of her ditzy smile. He saw a pen in her hand and figured she wanted him to sign something. He stifled a guffaw and signed it before rushing away with his security surrounding him.\n\nAugustus wished they wouldn’t crowd him. No one in Orania wanted him dead after all. But now he was wishing he was out of Orania too. He came this close to snapping at that idiot earlier, but he knew he couldn’t make a scene here of all places."
SFL.708.a: "He was just going to have to put up with it."

SFL.709.t: "The Romans in their Decadence"
SFL.709.desc: "\"What the fuck is this!\" Invictus shouted as he pointed at a penis painted in white spray-paint.\n\n\"Euh, Mr Invictus please keep your voice down, it's only a bit of graffiti.\" the tour guide said as she tried to calm him down.\n\n\"No, it's shameful, I’ve been in Rome for 2 days. In that time I’ve had my wallet stolen, probably by some dirty arab. You have illegal migrants sitting on monuments that your ancestors made almost 2 thousand years ago.\" Augustus shouted.\n\nThe whole square was watching him, he might have been safe with his guards, but they could not protect his reputation. \"Sir, please stop shouting!\" the guide pleaded. He took a deep breath, she seemed relieved now\n\nHe then opened his mouth and said,"
SFL.709.a: "We’ll make sure our Rome never falls this hard"
