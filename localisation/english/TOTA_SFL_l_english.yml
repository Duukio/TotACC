SFL_on_the_new_moon_of_may: "On the New Moon of May"
SFL_on_the_new_moon_of_may_desc: "With the charades of “libertarianism” and “democracy” vanquished alongside the ranks of our foes, we are ready to cross not just the Rubicon, but the St. John’s and the Savannah too. To our north lie the agents and pawns of freemasonry, not to mention the masses of African biomass that hold the brave and powerful state of Georgia in a bind. The frontier province of swampy Florida, our Julian March, whose youthful men hold great machines of destruction lie eager at the altar of European civilization to exterminate like bugs all these existential enemies of the very fabric of European culture. They will hold position no longer as we bring Revolution to the land!"
SFL_first_torches_upon_the_world: "First Torches Upon the World"
SFL_first_torches_upon_the_world_desc: "With Obama gone, our newest enemy and biggest threat is the Black dictatorship in Georgia. Threatening to completely subvert the white basis of America, our first act must be to march Northward and liberate Atlanta from this rebellious race."
SFL_future_or_ruin: "Future or Ruin"
SFL_future_or_ruin_desc: "Though we have secured control over Florida, the existence of dissident Libertarians forms an everpresent knife behind our backs. Needless to say Preston’s Jewish-Anarcho degenerates are not pleased with the start of this new American Revolution, but alongside them the personalist tendencies of Sharkey and his gangs and mafia connections form a prescient threat. Shoring up and consolidating our support against these anti-European and anti-White villains is thus our first step in domestic politics."
SFL_bearers_of_cultural_disease: "Bearers of Cultural Disease"
SFL_bearers_of_cultural_disease_desc: "The formation of a new Impervium requires the culling of the weak bodied who are not capable of supporting such a great civilization. We will not be so cruel as to kill them in the streets, let them live out the rest of their lives in misery. But their kin, their children and degenerate offspring must not be allowed to ever exist. Through a program of eugenics, a pure strong race will conquer America."
SFL_beauty_of_strength: "Beauty of Strength"
SFL_beauty_of_strength_desc: "The base of this new White Revolution is the strength of the elite. The rule of the overmen. Not the layman. The select few of America who are capable of filling the destiny of the White and the European will be the heads of this new state. Their strength, of body and mind and spirit, their culture of the elite will save us from the muddy rut of mass rule."
SFL_build_the_most_glorious_castles: "Build the Most Glorious Castles"
SFL_build_the_most_glorious_castles_desc: "The castles of the past were instruments of control. Warrior outposts which produced weaponry and armour for soldiers and garrisons. The castles, the most glorious of castles, of this new world is the factory. They are not very defensive, sure. But that is besides the point. A flood of bullets and guns from the production line will serve as the base of our future conquests."
SFL_against_the_artificial_world: "Against the Artificial World"
SFL_against_the_artificial_world_desc: "Longhoused by the trinkets of the international market and rampant, mindless consumerism, the World has lost its way with the very ground they step on. The temples of the Old Gods, once mighty pedestals of praise towards the natural world, are now giving way to the secular and Semitic-occupied brains of technocrats and degenerate weaklings. If we are to wage a grand European revolution for the salvation of this God-forsaken distant province of the Western World, then we must push back against the tyranny of feminized plastics. The great wilderness of Earth must heal and through force we will destroy the incoherence of the postmodern technological schizophrenic system."
SFL_the_root_of_all_evil: "The Root of all Evil"
SFL_the_root_of_all_evil_desc: "The root of the corruption of the White race and the American nation comes in no small part from the clique of Jewish bankers and their dictatorship of interest. These thieves flood us with their banks and their credits and rot our very souls. This new America must seize their degenerate property so we can at last be free."
SFL_the_media_leviathon: "The Media Leviathan"
SFL_the_media_leviathon_desc: "This Leviathan, this Jormungandr, which wraps around us and acts as the instrument of control, is the media. The rule of mass media holds so much opinion power in this new world, that we have to seize all the assets and means of media within our control and turn this Leviathan into a beast of burden for our Revolution. "
SFL_those_bearing_revolution: "Those Bearing Revolution"
SFL_those_bearing_revolution_desc: "The poor White masses of Florida wander in the streets in a daze. The world burns around them but they do not know what to do. But we can lend them a helping hand. For we are those bearing revolution, led by our great and brave Caesar, Augustus Sol Invictus. These lost souls will once more have direction in this great crusade for the very soul of White America!"
SFL_to_make_heroes_and_martyrs: "To Make Heroes and Martyrs"
SFL_to_make_heroes_and_martyrs_desc: "Many thousands have rallied to the cause, but a war of this scale cannot be won with handguns and pistols. These young boys need training and weapons ready for war so a new race of heroes will descend on America once more."
SFL_war_be_unto_the_ends_of_earth: "War Be Unto the Ends of Earth"
SFL_war_be_unto_the_ends_of_earth_desc: "Florida is secure and we have begun the great march to free America, the great son of Europe. The White race which bleeds for a new world will at last have their revolution, and know a supremacy not seen since the years of Rome! Then the whole world drenched in the degenerate yoke of Jewish-Globalist empire will tremble as a war, a great revolution will finally obliterate their hold over the children of Europe! This is our destiny! Our future! All know in their bones and souls that this is what we fight for. A revolution for a new America! A new Rome! A new Europe!"
SFL_the_grey_world_of_man: "The Grey World of Man"
SFL_the_grey_world_of_man_desc: "For so abominably long, the politics of America has been drowning in grey nothingness. Boring, geriatric servants of the Communists pretend they are the only boundary of acceptable politics. But the liberals are race-mixing traitors, and the so-called Conservatives are barely different, bringing a dictatorship of the police and the state in the name of a mongrel world. This grey world of politics is no more. A dictatorship of the brave youth descends on them now, ready to burn them away for good!"
SFL_the_commie_slayer: "The Commie Slayer"
SFL_the_commie_slayer_desc: "Our Great Leader, our Caesar Augustus Sol Invictus, the Commie Slayer. Having sacrificed so much, repudiating all his connections to the old world of degenerate Communists, has dedicated this crusade to slaying the Communist menace. The rats nest of New York and their Soviet masters must be cleaned out at once so America can breathe freely!"
SFL_all_pigs_must_die: "All Pigs Must Die"
SFL_all_pigs_must_die_desc: "New York's Police Department is the largest in the country and one of our foremost enemies. The militarisation of the police has been used to carry out the whims of an anti-White Zionist Occupied Government. By storming the citadel of this degenerate dictatorship, the police will at last no longer be a force for being lords over us, but true servants of the community."
SFL_another_shade_of_tyranny: "Another Shade of Tyranny"
SFL_another_shade_of_tyranny_desc: "The false dictator Pence, and the acolytes of Pelosi frame themselves as the only governments capable of bestowing freedom to America, but they are but another shade of tyranny. The Communists bestow tyranny in its naked form, but the old governments give a tyranny of the soul. A discrete one where people think they are free. It is only us that can give the White volk of America freedom."
SFL_saviors_of_the_west: "Saviors of the West"
SFL_saviors_of_the_west_desc: "With the East coast secure at last under our control, we can now turn our attention to the bleeding West. From the degenerate Anarchist rats of Portland, to the globalist tyrants of Tahoe and the blood-crazed savages of the Indians, and the misguided fanatics in Idaho. We will march to deliver the West from this interregnum."
SFL_no_more_wars_amongst_brothers: "No More Wars Amongst Brothers?"
SFL_no_more_wars_amongst_brothers_desc: "Here in the West, not everyone is our enemy. Some have a cause similar to ours. Perhaps we can make some deals with them, to end these brother wars so that no White man will kill his brother needlessly."
SFL_not_stolen_conquered: "Not Stolen, Conquered"
SFL_not_stolen_conquered_desc: "Ever since the 70s, the Indians have been getting uppity and thinking they could ever stand on the same footing as us. Among their number are savages which openly call of working with the Jews to murder every single White person in this country! Much like Rome put down the savages that resisted its civilizing mission, we will do the same to these upstarts."
SFL_worshippers_of_money: "Worshippers of Money"
SFL_worshippers_of_money_desc: "The Free States of America are a remnant of the beast we vanquished in Washington DC. Poisoned by the vicious ideology of liberalism, the FSA acts as the final vanguard of this Jewish race-mixing degeneracy that stands in the way of a free Evropa."
SFL_corporate_slaves: "Corporate Slaves"
SFL_corporate_slaves_desc: "California is a monument to everything wrong with America. Though led by those who claim to want what’s best for America, what is it that they offer? Persian maniacs, Japanese puppets, and other false prophets. Richard Spencer' s clique is one we are somewhat sympathetic to, but this Californian Reich only desires the subjugation of America to international capital. These slaves to money must burn."
SFL_the_lowest_of_the_masses: "The Lowest of the Masses"
SFL_the_lowest_of_the_masses_desc: "The lowest of the low, Portland stands before us. This new Sodom is perhaps our greatest enemy, fuelled by Whites so smothered in Jewish propaganda their whole ideology is one of self-hatred and sexual degeneracy. When Portland burns, that will mark the true liberation of America."
SFL_the_unconquered_sun: "The Unconquered Sun"
SFL_the_unconquered_sun_desc: "From the bay of Los Angeles to Plymouth Rock, a new order stands over the disheveled corpse of fungal rot and degeneracy! We! The new harbingers of a Free White Order at last rule! The heirs of Rome, we have freed Europa’s greatest son! Listen Discupuli! For America is free at last, and tomorrow it will be Europe from Lisbon to Vladivostok!\n\nA blazing crimson sun shines over this land. Burning away the degenerate dictators of yesteryear, enshrining the liberated joy of a race reborn over the empty humanists. I, Augustus Sol Invictus, am your Lord now. Your liberator. Your Caesar. WITNESS YE! THE DAWNING OF A NEW AGE FOR THE WHITE MAN!"


impaler: "The Impaler"

#sharkey war tree loc
SFL_my_birth: "My Birth"
SFL_my_birth_desc: "You know me, the Sanguinary Satanic Vampyre and Hecate Witch, Vampyric Lord-King of Florida and soon to be president of America, as but a symbol. Why do you see me as a symbol? Because an evil, an evil far greater than me, has controlled the minds of well-meaning Americans. Led by Christian Right-Wing clowns and KGB-affiliated maniacs this great country has been turned into a JOKE. But now, through my Vampyric fire and willpower I will set about bringing peace to this troubled land, just as Vlad the Impaler once brought peace and prosperity to his Wallachia. Even if a few thousand people have to be impaled along the way to get it done."
SFL_my_boys_my_blood: "My Boys... My Blood..."
SFL_my_boys_my_blood_desc: "When I came to Florida, I brought my brave Death Dealers with me to protect America from criminals and other terrorists. Initially, these were strong vampiric brothers and sisters dedicated to protecting me and the love of my life by IMPALING my enemies! But as they grew, many people joined them. People looking for an angry fix. Disaffected, undisciplined youths and junkies not yet following the path of the Vampyre.\n\nThis is not what the Death Dealers need to be. If I am to make a new America, my boys need to get in good shape to fight terrorists and criminals to transform America to a nation ready to fight for evil and the power of the VAMPYRE."
SFL_a_coven_most_high: "A Coven Most High"
SFL_a_coven_most_high_desc: "My Death Dealers are officially the elite squad of the 1st Vampyres, Witches, and Pagans Militia Regiment. It stands to reason they would be loyal to the Vampyres, Witches, and Pagans Party. But many who have joined are SADLY rebels without a cause who don’t even know that this Party exists. I’d say it’s time we bring it into the limelight, my coven of fellows Vampyres, Witches and Pagans who will rule America in the name of Lucifer and SATAN HIMSELF!"
SFL_the_crown_of_sicily: "The Crown of Sicily"
SFL_the_crown_of_sicily_desc: "The epidemics of drug abuse have stained America for far too long! Drug gangs from around the world run to America to torture our population. Well I for one would like to see these drug peddlers tortured! Many have tried, but many have failed. How can I see to it that these people poisoning my Death Dealers and America can face swift justice without a blind terror that could kill innocent law-abiding Americans? The obvious answer is a little compromise. The Mafia gangs like the ones that operate from New York are groups we can form stronger ties with, forming alliances. We’ll protect them, give them monopolies on selling good, clean drugs, like weed. And in exchange they will be able to have free reign and weaponry to kill drug gangs and cartels. Needless to say, any gang members they bring to me alive or dead, will be brutally IMPALED!"
SFL_instruments_of_control: "Instruments of CONTROL"
SFL_instruments_of_control_desc: "The Death Dealers can’t free America from all these corrupt cronies on their own! No, the VWPP needs more and more people to fight our enemies. While I cast curses on our enemies in the North, I will personally see to it that we expand the militias in the VWPP to fight our enemies be it day or especially night!"
SFL_the_manufacture_of_satan: "The Manufacture of Satan"
SFL_the_manufacture_of_satan_desc: "Centuries of rule by foolish Christians who think Jesus is their only God (in fact, he is just a God, but not the God). They have been fooled into attacking all worshippers and followers of DARKNESS and evil. But latent in the very soul of America is a nation ready to accept the ideals of Satanism. The job of me and my Death Dealers is to unleash this potential and open the hellish vats brewing in America’s mind."
SFL_the_golden_cup: "The Golden Cup"
SFL_the_golden_cup_desc: "There’s an old story from Wallachia told about the great Vlad Tepes, ‘The Impaler’. He would place a Golden Cup in the centre of the city. So great and terrible was he, that no one would dare steal the cup because if they did they would be tortured and impaled! Yes he was brutal, and he was also respected! There was no crime in Wallachia because of him. We can learn a lot from Vlad. I will personally place a solid gold cup outside my manor at all times. Anyone who wants to disrespect me and all vampyre-kind and subsequently America as a whole can feel free to steal it, but they should know they will be IMPALED! In fact, this Cup will be a testament to a new regime in America. One not afraid to impale those who wish harm on law-abiding American citizens."
SFL_the_crown_of_the_vampire: "The Crown of the Vampyre"
SFL_the_crown_of_the_vampire_desc: "The Death Dealers are the epitome of evil itself! The forces of my evil magik will, made manifest. They are the crown I wear as I rule over you, and secure for us the birthright of the Vampyre, VICTORY. Every inch of liberated territory will welcome these evil masters of America, as they begin America’s transformation into something new."
SFL_the_battle_of_stpetersburg: "The Battle of St.Petersburg"
SFL_the_battle_of_stpetersburg_desc: "Sadly, Florida is still teeming with people not ready to accept their new Vampyre King. Those figures like Mr. Augustus Sol Invictus, who might I add is just like that terrorist KKK, are attacking those who sympathise with the Satanic path! This will not do. I will personally see to it that Augustus Sol Invicitus and all his cronies who challenge my mandate are cursed and will end up in my torture chambers for being terrorists, menacing the innocent people of America!"
SFL_hades_my_personal_bitch: "Hades, My Personal Bitch"
SFL_hades_my_personal_bitch_desc: "My rule over Florida is just beginning, and with it my dominion over America. As the Vampyre King and representative of Satan and the forces of evil and darkness in this world, my reign will be everlasting. It will never, ever end. As the people of America walk down the blood-soaked streets, they’ll tip toe around the bloodied corpses of cops and terrorists alike. Through my magic, I will emblazen a pentagram on the very sky to mark my immortal reign. A new age is coming to America, whether she likes it or not!"
SFL_i_ares: "I, Ares"
SFL_i_ares_desc: "My Magikal Path Name is Ares, the God of War. As a Satanic Dark Priest, would anything else be more appropriate? Indeed, I do not wish to be a mere fief ruling over Florida. A mere vassal of some greater power is no state for a Vampyric king like me to live in. No, me and my Death Dealers will wage war against all the enemies of America, terrorists and criminals who lord over the nation."
SFL_this_turbulent_hatred: "This Turbulent Hatred"
SFL_this_turbulent_hatred_desc: "For many decades, America has been plagued by hatred. Hatred of race, hatred of color, hatred of rich and poor alike. Now though I am evil, I do not wish to allow this hatred to continue. So in the newly liberated areas, I have instructed my Death Dealers to exact vengeance on these terrorists who have tortured America for so long. The KKK and the Neo-Nazis will be the first to go for their crimes, but make no mistake the Black population is not wholly safe either. Among their number are groups like the Nation of Islam who hate White people and therefore are just as BAD as the KKK."
SFL_my_throne_my_love: "My Throne, My Love"
SFL_my_throne_my_love_desc: "The age-old capital of America, Washington DC. Now that will be my throne. When I am done with it, it will no longer be called the White House. No, it will be called the Black House, for it will be used as a citadel for magick practitioners and followers of Satan! There is no other place fit for a man like me to rule America from. But right now it is under the criminal regimes in the North. I cannot tolerate this! Now that our base has been secured, we will have to march Northward and liberate the capital, so a new Union of Americans will be born, united under me, the great Impaler of America."
SFL_i_laughed_at_the_sun: "I Laughed at the Sun"
SFL_i_laughed_at_the_sun_desc: "Though I have at last secured the East Coast, my ambition remains unfulfilled. This is not a fief fit for a Dark Vampyre Lord such as I! Indeed, the West remains unconquered, and it remains up to me and me alone to bring it to heel."
SFL_my_mistaken_girls: "My Mistaken Girls"
SFL_my_mistaken_girls_desc: "In the North-West lies a troupe of Anarchists of varying stripes and shades. Many among their number are LGBT peoples. Many choose to fight for them because they are afraid of what would come of the triumph of the Nazis or the Californians. Let it be known that I, Jonathan Sharkey, do not oppose the rights of these people. Many of my servants and followers are of their rank, and the forces of darkness do not discriminate except against terrorists and those who menace American society! Perhaps when the people of the Pacific Northwest are made to understand that I do not mean them any harm, they will defect to me and my Death Dealers."
SFL_an_unamerican_terror: "An Un-American Terror"
SFL_an_unamerican_terror_desc: "One of the greatest enemies of peace in America lies in the West under the forces of the Neo-Nazis. These people desire to kill all those who differ from them, and are some of the most bloodthirsty enemies I face. I will have to make it clear to them that there will be no room in my America for such vile hoodlums and terrorists. I will impale their legions across Cascadia and let the trees drink their blood."
SFL_sore_losers_in_my_goblet: "Sore Losers in my Goblet"
SFL_sore_losers_in_my_goblet_desc: "Ever since these first terrorists were defeated by brave American settlers, they have been stealing our resources, stealing our money, and complaining all the while. Now they have turned to violence as well, attacking innocent Americans and some among their number even wish to murder all White people! If I am to secure my fiefdom, a kingdom fit for a Vampyre Lord such as I, these upstarts will have to learn their place!"
SFL_lucifers_sword_on_the_desert: "Lucifer’s Sword on the Desert"
SFL_lucifers_sword_on_the_desert_desc: "Deep within the desert sands lie hordes of liberals ready to subjugate America to their inane whims. With a cheery face, they will force upon our workers and farmers horrific conditions and flood our markets with foreign goods. My America will have no place for such traitors."
SFL_worship_leviathan_my_serpent: "Worship Leviathan, my Serpent"
SFL_worship_leviathan_my_serpent_desc: "The final stretch is upon me at last. My conquest will at last be complete as I step foot on the shores of San Francisco. From sea to bloody sea, my Death Dealers and all those ready for a new America under my auspice will rule at last. All that remains is this puppet of the Japanese that rule from Tahoe. Soon enough, they will fall. The titans of California will be swept away under my spells and under the oceans of blood I will unleash against their followers."

SFL_the_fields_of_camelot: "The Fields of Camelot"
SFL_the_fields_of_camelot_desc: "At long last, I have secured my throne. Though I have had to step over a million corpses to secure it, a new and wise America is finally dawning. Under the guise of her new Vampyre Lord, an unspeakable evil will string America on the pyre. The walls of the cities, shall crumble away. The Demons below them will come out and dance. My enemies will see the Demons come and dance, as they are impaled on my throne."
SFL_my_coronation: "My Coronation"
SFL_my_coronation_desc: "My greatest foes are mostly vanquished, though some have fled the country. No matter. The hardest days are behind us. Now must be a time of celebration for America’s new King. What better way to announce it, than with a coronation?"
SFL_a_vampiric_new_deal: "A Vampyric New Deal"
SFL_a_vampiric_new_deal_desc: "New flags fly over America, but her soul and spirit are more or less the same. Well, I cannot settle for superficial change. The mores that cursed America must be cured, and a New Deal is the only thing that can do it. Ever since the rise of Obama, I have long known what it will take to fix America once and for all. Not all of these policies will be very popular, and very many will have to die along the way in my name. But when all is said and done, when America at last dances with the zombies and the freaks under the bloodied moon, we will be free and my vision will be complete."
SFL_will_of_the_source: "Will of the Source"
SFL_will_of_the_source_desc: "One of my many magikal names is The Source, that is, The Source of All Evil. How could it be that someone such as I, could rule without absolute authority? Indeed within my government and my administration and the dark halls of Satan lurk traitors. Now is the time I root them out, and send them right to the fields where they will all be impaled."
SFL_the_face_of_satan: "The Face of Satan"
SFL_the_face_of_satan_desc: "LaVey and his followers present themselves as the true representative of Satan on Earth.But indeed they are false prophets. They are but tricksters who wish to rob me of my power. They even go so far as to reject Satan and the Supernatural. With these wicked fools leading my America astray, how can America continue onwards? No. Their vicious path must be crushed and impaled."
SFL_in_utero: "In Utero"
SFL_in_utero_desc: "What is the basis of society? It is the family. If I, the Vampyre Lord and impaler of America, Ares, the Hecate-Witch, the Source, am to secure my rule over America then my representatives and I will be the only ones who may officiate marriages. Indeed, people will come from around the country to my Black House and beneath the bodies of the impaled, I will ordain their marriages.\nOf course, I alone cannot marry 300,000,000 people together! With time, I will ordain other followers of my path and of evil to sanctify marriages throughout the country. But all will remember when they do so, that it is under my watch and with my permission that they are united."
SFL_my_blindness_my_mouth: "My Blindness, My Mouth"
SFL_my_blindness_my_mouth_desc: "Justice is blind. My newly formed President’s Council for American Justice will see to it! Once the parasitic power-tripping judges are purged from America, a new council of accountable judges will take hold. I will personally see to it that they are all ready to administer justice in a fair manner, such that no American, rich or poor is left behind. They will be my brain, my hands, my gavel, cleaning America of all stains of injustice."
SFL_vlad_your_lord: "Vlad, Your Lord"
SFL_vlad_your_lord_desc: "Remember, my children. Who is America’s saviour? Who bravely battled the Nazis and KGB-aligned dictators and brought a harsh, but fair, satanic rule to America? It was I, Lord Sharkey. All across the nation, people must know, people must remember who their wicked lord is. Who will save America from itself. It can only be Sharkey. When they pray at night, I will watch over them in spirit and guide their will, guide their actions, to uphold a future fit for all Americans, so long as they recognise me as their lord."
SFL_my_bloody_mess: "My Bloody Mess!"
SFL_my_bloody_mess_desc: "Shows of force are of course necessary for any self-respecting regime of darkness. Across the country, many who oppose the rule of Satan are making their moves. My Death Dealers and all followers of the VWP will have to rise up and show these terrorists who’s boss."
SFL_the_day_of_hades: "The Day of Hades"
SFL_the_day_of_hades_desc: "America needs a revolution. Sure, I have seized control, but that is only half the story. The soul of America is festering with fleas and rot. Baptists and Evangelicals call for my execution and launch insurgency in the South. Within the halls of power, the police departments, the government buildings, the clerks, all of them are plotting against me. But the root cause, America cannot yet stomach a powerful warlock such as I as their lord and saviour.\n\nThere is only one solution, one panacea to this horrid farce. My Death Dealers. My lovely children. They will enter into the streets, rally around the towns and farmsteads and drag America kicking and screaming into a new utopia!"
SFL_the_rape_of_los_angeles: "The Rape of Los Angeles"
SFL_the_rape_of_los_angeles_desc: "I will have my Death Dealers take every member of the LAPD, and right in front of their police stations they will be lined up and shot. These corrupt crooks have drowned America in their filth. I will hang their bodies from street lights and watch as Los Angeles’ streets are drenched in red."
SFL_luciferian_industry: "Luciferian Industry"
SFL_luciferian_industry_desc: "The Unions are the heart of America. Betrayed by establishment politicians, they have been left behind and whipped up by the chains of corporate America. Now many are skeptical of my Lordship over them, but if I throw them a bone or two, giving these unions greater autonomy and power, they will no doubt come about to join my revolution"
SFL_my_horrors_shining: "My Horrors, Shining"
SFL_my_horrors_shining_desc: "Having armed the Death Dealers, now is the time for them to spill out into America! To dash out her brains and consume her guts. These elite soldiers of the VWP will make America shine a thousand times over in the blood of her cancers and tumors."
SFL_a_world_of_teeth: "A World of Teeth"
SFL_a_world_of_teeth_desc: "The birth of a Satanic empire in America can only be the herald of a greater period of change for the world as a whole. Millions will turn to look at America as a fountain from which erupts hordes of Vampires, Witches, and Pagans. A fountain which will create a new world.\nThis new world will have to be under our leash no matter what. By forming the United Vampyre World Organization, the VWP will have a political vehicle by which to control our influence abroad."
SFL_the_consumer: "The Consumer"
SFL_the_consumer_desc: "It is an open secret. Some find it horrid. I find it a necessary act. In the most decrepit and forgotten towns, the Death Dealers take their time to relax. An America of Meat is festering there. Those they found to be fighting against the course of my Vampyric rule are not always beaten and arrested. Sometimes they disappear and enter somewhere else. Cut up and served, we, Vampyres, drink them and eat. We are the Consumers, whose souls glisten with fire when we melt our teeth down into blades."
SFL_i_shit_on_altars: "I Shit on Altars"
SFL_i_shit_on_altars_desc: "The Queer community are my children. And in fact, many among my number, servants of the dark and evil and satanic path, are also Queer too. Their greatest enemy are evil figures like Churches which cast them as evildoers and enemies of Christ. Well, maybe they are evildoers in fact. A Vampyre lord needs wicked beasts to carry out his will as he flies over the Churches who terrorise their neighbours.\nLet my Death Dealers enter the countryside and burn down the Churches, demolish their idols, and impale their terrorist figureheads!"
SFL_a_knock_on_my_door: "A Knock on My Door?"
SFL_a_knock_on_my_door_desc: "When I was but a small warlord in Florida, my Death Dealers were an unruly bunch, addicted to drugs and attracted to my aesthetics alone. But through training, and yes, some deals with the Mafia helping to slaughter and impale rival drug dealers in return for protection, they are no longer what they were once were and have matured."
SFL_satan_satan_satan: "Satan! Satan! Satan!"
SFL_satan_satan_satan_desc: "What is it America must be? It must be a state that lives in service of the pagan. For Satan, for Hecate, for me. Gone are the days of the (false) prophet of bitches and bastards. Gone are the days of Islam or Christianity. Now is the reckoning of the forces of evil. We will wash away the Christian sheen of America, and soak it in tar and oil. From this, it will rise. Battered and angry. A Luciferian America. A Satanic America. My America."
SFL_i_am_the_sun: "I am the Sun"
SFL_i_am_the_sun_desc: "What I am doing is nothing less than the total reinvention of America. I am a peacemaker. A bringer of justice. He who ends crime and terrorism. Like Vlad the Impaler, I torture those who deserve it and my people live in peace and quiet. I am their lord, a Vampyre through which the channels of the Supernatural flow. Shouldn’t my Death Dealers know this? Many among their rank do already, but my Death Dealers must know I am an object or worship, just as much as Satan and Hecate. I am the Sun that shines over America. I am the moon that sinks over America. I.. I am. I. am."
SFL_the_black_goat_on_the_prarie: "The Black Goat on the Prairie"
SFL_the_black_goat_on_the_prarie_desc: "An insurgency continues to burn on the Prairie. Ever since 1971, the region has been embroiled in a guerrilla war which blew up with the Civil War. But these upstart savages stil have not learnt their place. These sore losers who want to steal all our hard earned money will be taught exactly where their place in my America will be."
SFL_theres_nothing_solid_down_here: "There’s Nothing Solid Down Here"
SFL_theres_nothing_solid_down_here_desc: "Across these burning streets, my gaze falls. The fires are rising and rising and the metal is twisting into crooked, cracked statues that bow down at my feet. A pentagram is engraved upon the sky. My face is baked into the sun and into Hell itself. The America that was here just a few years ago is already gone. A fading memory. Soon all will have forgotten it, as they run to the next building, guns and cudgels in hand. There is no time for the past now. Only tomorrow. Forever and forever. A tomorrow that is always here. Burning. Blazing. Eating. Breathing. A tomorrow that is me and will always be me. Here, in my America. The cities are burning into smiles. The people are walking into the flames and dancing. They dance and burn for me. Breathe and breathe. In Luciferian dreams, I pray for them. I pray that I will drink their blood. That my Golden Cups will be moved only by the wind and the storms. Impaled if they must be, again and again, until everyone in America is impaled and happy, Amen."
SFL_decrees_of_hecate: "Decrees of Hecate"
SFL_decrees_of_hecate_desc: "A new America needs new laws, laws which address the failings of the past. It cannot all be the charge of my Death Dealers and the power of me. So I will formulate a new corpus of policy, one which will sweep away the terrors of old corporate America and replace it with a new, fair deal."
SFL_the_robin_hood_act: "The Robin Hood Act"
SFL_the_robin_hood_act_desc: "It is time to end poverty in our great country. Through taxing the wealthy which previous administrations have enabled to get stinking rich at the expense of everyone else, I will fund a rise in the minimum wage. Soon we will no longer hunger for welfare. My people will be able to go to the schools, and learn and one day make their dreams come true through a more equitable deal for America."
SFL_the_black_list_act: "The Black List Act"
SFL_the_black_list_act_desc: "Globalisation has wreaked havoc on America. So many companies hungry for tax breaks flee the Americas and set up shop elsewhere. Well I say that’s enough of that! From here on out, any company which leaves America will have their products BANNED!"
SFL_russian_fats: "Russian Fats"
SFL_russian_fats_desc: "A great amount of heartache in America came from the Left. Maoists, Kosygnites, and other such idiots, all under the KGB playbook. These socialists and Marxists have no place in America for their attempts to try and repress our freedom. All such parties will now be BANNED!"
SFL_feed_me_drink_for_me: "Feed Me, Drink for Me"
SFL_feed_me_drink_for_me_desc: "Our farmers are facing a deep crisis. Much of our food since the civil war is imported, driving our brothers into bankruptcy. Now is not the time to let them die. We must subsidise their work to ensure they can remain competitive and continue to thrive as the backbone of our society!"
SFL_i_love_my_children: "I Love My Children"
SFL_i_love_my_children_desc: "How many foreign wars have we died in? Corrupt politicians have sent us to die in foreign lands for their wars. Well no longer! America’s job as the world police is done and dusted. We will never send our men to foreign lands ever again to fight for wars that do not concern us. "

SFL_the_tribes_set_free: "The Tribes Set Free"
SFL_the_tribes_set_free_desc: "With one foot in the Atlantic and another in the Pacific, America can be set free under our vision for a new world. Gone now are the days of race mixing and statist control. Instead, all races in America will be free to follow the liberation of their own tribes on their own terms. The White, the red, the black, the brown. All shall be separate, but pure and free."
SFL_returning_to_the_primordials: "Returning to the Primordials"
SFL_returning_to_the_primordials_desc: "The fault of modern society and modern governance is that it is inherently tyrannical. Even in supposedly free democracies, miles of red tape suffocate its citizens. But past forms of organisation and antiquated forms of society did not suffer from such problems. When men were wild and free, when the only law was the law of the frontier, that is when we were truly free. This primordial form of organisation is what we will aim to bring back. Not to resurrect an old America that cannot give her many nations freedom."
SFL_building_the_archaic_future: "Building The Archaic Future"
SFL_building_the_archaic_future_desc: "We reject the tyranny of modernity, yet some ask how we can return to tradition without abandoning the technology that has allowed us to live so well. We can do both. It just takes a bit of trial and error to see how technology can be used to keep the Liberty and Tradition of our ancestors."
SFL_landauerian_societies: "Landauerian Societies"
SFL_landauerian_societies_desc: "West Coast anarchists might accuse Keith Preston of being crypto-fascist but that couldn’t be further from the truth. Proudhonian-Bakuninist anarchism is the foundation of Anarcho-pluralism, followed by classical liberalism, American populism, third positionism and even Maoism.\n\nBut above all our National Anarchism is a direct continuation of Gustav Landauer’s völkisch-anarcho-socialism, a romantic reaction against industrial modernity and the true spiritual expression of Gemeinschaft. We are far more socialists than the scientific Marxists or Libertarian hippies, for true socialism requires a withdrawal from the capitalist system into decentralized, rural, mutual-aid settlements, drawing on Proudhonian mutualism and Kropotkin's ideas on integrated labor. This utopia cannot be reached with brutish Soviet methods, only Anarchist Statelessness will do."
SFL_renewed_articles_of_confederation: "Renewed Articles of Confederation"
SFL_renewed_articles_of_confederation_desc: "The tyranny of America was once not much of an issue at all. Under the first days of American independence, the articles of Confederacy provided much freedom without the federal government to impose its will. What we must aim to do is to return to the first structure of the United States as a vision for freedom. Not the dissolution of America itself into primordial ethno-states."
SFL_revise_what_went_wrong: "Revise What Went Wrong"
SFL_revise_what_went_wrong_desc: "Let’s be frank, there were a few problems with the Articles. Like the lack of control over borders or being unable to prevent tyranny from the states; this time we’ll add a few tweaks so that we avoid the mistakes that led to the imposition of federal totalitarianism."
SFL_to_do_away_with_america: "To do Away With America"
SFL_to_do_away_with_america_desc: "America has been raped by the devils of globalism and racemixing. It is not a nation of racially pure stock, but of mutts and mongrels. If we are to move forward, the very concept of this “melting pot” empire must be abandoned."
SFL_and_to_bring_forth_arcadia: "And To Bring Forth Arcadia"
SFL_and_to_bring_forth_arcadia_desc: "Our job now, is not exterminating any one group, but giving each nation within America the right to realise their own racial destiny. Arcadia will rise on this continent, as the ethnic nations of America realise their own destinies, in harmony with themselves and each other."
SFL_reject_the_sub_and_the_urb: "Reject The Sub and the Urb"
SFL_reject_the_sub_and_the_urb_desc: "The greatest obstacle in our way toward a collection of pure states in a commonwealth now that we have seized power is the ideology of urbanisation. Cities box souls in, create hard borders compared with the fluid and free nature of the rural freemen. We cannot destroy these cities, but we can certainly end the movement of urbanisation in favour of the rule of the rural people's community."
SFL_may_a_thousand_splinters_bloom: "May A Thousand Splinters Bloom"
SFL_may_a_thousand_splinters_bloom_desc: "The revolutions of 1848 are sometimes called the Springtime of Nation, but these nations were not true nations. A true nation is a tribe, and no tribe can be a million strong. We want to chop these behemoth “nations” into a thousand splinters, so that they may bloom during a true Springtime of Nations!"
SFL_intentional_communitarianism: "Intentional Communitarianism"
SFL_intentional_communitarianism_desc: "In our push for decentralisation, and the creation of a communitarian system, proposals for countless random communitarian states have been made. But few of these can be taken seriously. What we need are states built on nation and culture. A community for the black, or the white, or the Queer can be admitted. But those who call for a state or a community based on no distinct identity other than geographic identity are not tolerable."
SFL_decentralized_borders: "Decentralized Borders"
SFL_decentralized_borders_desc: "It is clear that the state is not competent nor willing enough to control borders. Not only this, but it is wrong for a man who lives thousands of miles from the border to regulate who comes into America. We should delegate the job of border patrolling to the tribes who live in these regions, it is the right thing to do."
SFL_semitributary_systems: "Semi-Tributary Systems"
SFL_semitributary_systems_desc: "Since 1869, Washington has declared that no-state can secede, this clearly violates every man’s freedom of association. If these communities wish to be free, permitted they at least meet the bare minimum of what a community is, they can do so. Yet we cannot let them be free without some conditions. By bringing back the ancient systems of dues and tribute, this loss of land will be compensated for."
SFL_competition_of_power: "Competition of Power"
SFL_competition_of_power_desc: "Throughout America’s remnants, an Arcadia blooms at last. Nothing is true, everything is permitted. In one town, the Indians dance, and in another they may very well be killed. We are no longer a nation of horrified clerks and penpushers whose minds are boxed into one unitary, totalitarian system. We are a nation of motion. Our cities are in motion. Our spirit is in motion. We are a nation in flux, always in change. That is our supreme power, what cements us as a utopia over the rest of the rotting world. A freedom that cannot be found anywhere else. A freedom for chaos and superstructures no matter what rules they break and consume."
SFL_and_embrace_what_brought_liberty: "And Embrace What Brought Liberty"
SFL_and_embrace_what_brought_liberty_desc: "Despite all her flaws, we must remember that the Article’s main purpose was to keep the liberty that the Americans died and fought for during the revolution. It would be evil to just remake the constitution that allowed for tyranny to fester and then rot America!"
SFL_from_vermont_to_harlan_county: "From Vermont to Harlan County"
SFL_from_vermont_to_harlan_county_desc: "History Teachers often describe the phenomena of “Rugged Individualism”. Essentially the spirit amongst all Americans that doesn’t just blindly listen to those who lord over them, from Vermont being suspicious of newly born union to the miners who fought against their bosses and the corrupt sheriffs. We will let this American tradition flourish, not try to stifle it."
SFL_invioable_liberty: "Inviolable Liberty"
SFL_invioable_liberty_desc: "The order of this renewed America, at last unchained from centuries of federal rule, must be liberty. Today and forever. No more will we have to trouble ourselves with regulations, with oppressive taxation, and all the terrors of federal rule. The first, most essential rule is liberty, today and forever."
SFL_militias_against_tyranny: "Militias Against Tyranny"
SFL_militias_against_tyranny_desc: "Perhaps the greatest notion that was absent in the Articles of Confederation and codified by the Founding Fathers in the Bill of Rights, is the right to bear and keep arms and organise militias. A vital component of American individualism and what allowed us to resist and triumph over the tyrannical central government. This age-old tradition must be nurtured and emphasized. Let each community wield their own militias, independent of our central government. This is the best way to prevent any future despot from taking away our hard earned liberty."
SFL_our_heritage_preserved: "Our Heritage Preserved"
SFL_our_heritage_preserved_desc: "What we must preserve in America is the basis of our nation, the white race. It was white men who built this country from the ground up. Under the Indians, it was but woods. But it was we who turned it into a pure, industrial titan of a state. This legacy will not be forgotten as we return to the origins of American nationhood."
SFL_liberation_but_not_destruction: "Liberation, But Not Destruction"
SFL_liberation_but_not_destruction_desc: "When we enshrine liberty into the spirit of this new America, it is not a liberty to destruction.Those who act against the heritage of America, her culture, and her nationhood have no place in this reborn empire of liberty."
SFL_lest_we_abandon_jefferson: "Lest We Abandon Jefferson"
SFL_lest_we_abandon_jefferson_desc: "Jeffersonianism, a commitment to republicanism and liberty against corruption and autocracy, for virtue and freedom, is the path for our new articles of confederation. The principles of Jeffersonianism which recognises the yeomenry and the farmers as the backbone of the nation, as opposed to the urban merchants and workers, is the only path that can affirm a freedom loving, decentralised state."
SFL_internet_as_unification: "Internet As Unification"
SFL_internet_as_unification_desc: "The internet is one of the greatest and one of the few positive innovations of modernity. Through partnering up with the Dutch based Starlink we’ll bring the internet to all corners of America to unify distant communities. With instant messaging and instant communication, rural communities will no longer need cities for goods and services. Distribution will no longer rely on old paths and roads, instead through the internet orders for goods and services across the world and the country can be made in an instant."
SFL_countryside_as_purification: "Countryside as Purification"
SFL_countryside_as_purification_desc: "Back in the day, when someone caught tuberculosis the doctor would prescribe that they move out west to breathe in dry and hot air. Now, we prescribe that the people move out into the country to cure their mental ailments. Distance themselves from the synthetic drugs, dysgenics, and cramped apartments, and enjoy the wellness that comes with living free and in a tribe in the woods."
SFL_choice_as_liberation: "Choice as Liberation"
SFL_choice_as_liberation_desc: "Giving our people the right to make their own decisions is the most important part of a state of liberty. No more of these regulations that say what people can and cannot do their own bodies. Rules over drugs, rules over life and body. No more of this. We want freedom for all. And that includes even the bloodiest and maddest personal choices around."
SFL_intention_as_consolidation: "Intention As Consolidation"
SFL_intention_as_consolidation_desc: "Within the framework of this new confederation, we cannot just resurrect the old borders of the states. Instead, a collection of many hundreds of new communities will need to rise in its stead. We are not just after a renewal of the old empire that ruined itself. Communities that identify an intent, a purpose for themselves ought to be recognised. Those that overlap, can associate with each other into a neatly-organised decentralised system of hundreds of different non-continous polities."
SFL_do_away_with_pollution: "Do Away With Pollution"
SFL_do_away_with_pollution_desc: "Civilization’s fruits can be seen on our shores, rivers and woods: Litter. Scientists say that there is a mass made up of plastic that is the size of Angola floating in the middle of the Pacific, and even despite the powers of modern day Dialysis, it is said that 95% of persons have an non-zero number of microplastics in vital organs. This is unacceptable, and we must crack down on pollution of all types, so that our children may breathe free without inhaling carcinogens nor microplastics"
SFL_do_away_with_market_fundamentalism: "Do Away With Market Fundamentalism"
SFL_do_away_with_market_fundamentalism_desc: "The biggest crutch to civilization for 300 years have been the markets, after they usurped the church. Just like any religion, in recent times there have been reformers who sought to return to the principles of their institution. We agree that people should be allowed to exchange goods and services for the resources they need to survive, but as the magnitude increases it gets messier. So that men are not fleeced for their labor, a few regulations need to be crafted so that no tribe nor man is exploited."
SFL_bring_forth_innovation: "Bring Forth Innovation"
SFL_bring_forth_innovation_desc: "Technology and Traditions are not enemies, they in fact can help each other. There are a few tribes who seek to contribute to America through research and experimentation. We must incentivize the other tribes to supply these “Tinker” tribes with the materials they need to do their vital work."
SFL_bring_forth_happiness: "Bring Forth Happiness"
SFL_bring_forth_happiness_desc: "Since the end of WW2, all the Government has ever been able to harp on is “the GDP.” All it has done is make the rich richer, at the cost of the working men and our freedoms. Not only that but it is also based on the evil principle of ‘advancing’ the toxic institution of Civilization. In our post-Civilization America, we seek instead to increase happiness among people rather than the GDerP."
SFL_for_our_tribes_dignity: "For Our Tribes' Dignity"
SFL_for_our_tribes_dignity_desc: "We have done it, we have returned to the fullest natural unit of human living. America is vibrant with life and diversity, whilst being a bastion of Liberty. We may have succeeded here, but we hope to one day spread it to our neighbors in the North and the South. Let the Tribes Celebrate!"



