SFL.920.t: "A Vampyric Welcome"
SFL.920.desc: "Down in Tallahassee, a black house rose. Where once sat the state capitol was a gibbering mass of brick and mortar whose shadow hung over the dying city. Painted with tar and oil, christened with statues to strange Gods, the new men of Florida awoke. The image of the new Hecate was seared onto it, its eyes piercing the Florida sky.\nIt was as if a switch had turned on in Florida, almost overnight the mood had changed. In some faraway regions, some tried to fight back. But angry youths looking for a fix took themselves up with the Death Dealers, some police officers squabbled about but they were not long for this new America.  The streets were empty, save for a few black clad gangs who carved strange symbols onto their heads and walked around with guns and machetes. And it was Sharkey who watched over them.\nStatues of gargoyles, impaled dissenters, blood soaked carpets surrounded Sharkey as he stared out of the window, gazing upon the night. The time for speeches and grand declarations had passed. Florida heard what he had to say. Now the mist was settling over the state as he and his warriors, his Death Dealers, rallied for war. Sharkey stepped over a broken cross and kissed the flags of Lucifer. In his very skin, phantoms and daemons rose to kneel at his presence. “The Dark Lord was here. Born into an American mask.” They would whisper among themselves and speak in the netherworld as the Source of all Evil kneeled before a portrait of Vlad Tepes. The wind whistled through the room, and a scream in the distance could be heard, softly echoing. Sharkey looked at a Gold Cup in his hand and smiled."
SFL.920.a: "This was only the beginning."

SFL.921.t: "What A State Are We In"
SFL.921.desc: "Claire was resting easy in her seat, even despite the guy to the right and the lady to the left practically squeezing her. If her grandfather was there, he would have said, “It's like one of them old time tent revivals.” Instead of a tent on a farmer’s field, instead was the dark and damp basement of a hardware store. The preacher also reminded her of her grandfather, a stout fellow with sheet white hair who wore a mustache like his dollar store suit.\n“The Lord tests us,” He spoke, in a tone fit for a barrel shaped fellow, “so that we may cling to him like the sheep to the shepherd.” “Despite his obedience to us, we stray away from his will” He sighed. “And yet, he always remains to wait for us, Praise the LORD for his mercy endures forever!” the pastor shouted.\n“Amen” the crowd responded. The sound resonated across the room like light in a house of mirrors. As if it were a signal, the pastor descended from his podium and the crowd rose from their seats.\nAs the congregates chattered amongst themselves, a little line began to form. Claire waited to thank the pastor for his words of encouragement, formulating every sort of way to say it.\nThe knob to the door out of the basement began to jiggle, and then the basement went dead silent.\n“Get the fuck out here, David Hirte” shouted the voice from behind it, “Or else we’ll get the fuck in!”\nClaire was practically frozen, unsure on whether to run or hide, and she began to hyperventilate.\nThe door blew open, and the Death Dealers poured down the stairs, it was miraculous that they managed not to trip on each other.\nAfter the first Death Dealer rushed into their sight, the whole basement erupted into chaos. They deafining clamor was brief, as the gunfire silenced the congregation. After the Death Dealers did their job, they began to search the bodies for cash.\nDealer Quinn, crouched over Claire’s corpse. He scanned her for valuables, and rummaged her pockets. He felt the cold feel of a money clip. Though, when he pulled it out he was pleasantly surprised.\n“Nice, two treats in one.“"
SFL.921.a: "Just need to wring it in a cup!"

SFL.922.t: "A Day In The Kitchens"
SFL.922.desc: "The Vampyre King was aseat on his Throne. A grotesque little thing made of bones, which were full of inscriptions and gems. Though his hands were impatient, as his right index rubbled a temple that wasn’t his, the inscription on the skull said “Fetterman”.\n“When is dinner coming?” he shouted.\nThe butler, a former Silicon Valley ceo, clarified, “Your Highness, cooking takes a while.”\n“Just tell him to hurry!” the Sharkey bellowed.\nThe butler’s servile response was “Of course, Your Highness.” He walked into the kitchen, but after a minute or so, the chef was first out of the Kitchen. Second was the large silver tray, finally followed by the butler.\n“Your Highness, I present to you my mere hors d’oeuvre;” the chef pulled the grand lid off “ Jambe de Félon”\n“Ohhh” Sharkey awed as he rapidly clapped his hands, like on would imagine a king to do when presented with a fine show.\nThe chef placed it onto the table and pulled out a carving knife. Unlike the bones of most livestock, it was simple to cut around a femur. He picked the donut like piece with a 2 pronged fork and placed it delicately onto his highness’s plate.\nThe Vampyre king was quick to begin cutting into and eating his meal. “Ah, thank you for first serving a piece with tattooed skin. I'll keep note of that.\""
SFL.922.a: "It's to die for!"

SFL.923.t: "Ell Ay Must Burn"
SFL.923.desc: "City West was a no-go. Anything even remotely near Little Tokyo or anything in Downtown LA for that matter wasn’t safe, and Johnny knew it. The fires that broke out in Little Tokyo hadn’t reached him yet, neither had the gunshots. But he knew they would in due time. Clearing the pileups that littered the streets, he jolted down the road. He heard some people say they were going to get to Dodgers Stadium as a safe haven. Johnny didn’t like that idea. Too close to the action, and LAPD could very well be thinking the same. And anywhere the LAPD were, massacre was not far behind.\nHis mind was set on getting to Griffith. Hollywood folk could be fleeing there, but it was big and muddled enough that he could find a space to hide out in and wait out the storm. He vaulted over a car, heart pounding and his lungs begging him to stop. His body couldn’t though, not with the Death Dealers behind him. And certainly not with a thousand city blocks all on edge, ready to shoot anyone who looked at their lawn accessories wrong. No, it wasn’t just the Death Dealers or enraged cops everyone had to worry about. Looters and ex-corporate militias were marauding around with the collapse of any semblance of stability. No matter how much the Satanists wanted to act like it, this was not a purge of LA. It wasn’t even a civil war. No, it was something much worse.\nEvery once in a while he spotted a pig's uniform scattered on the streets. Kidnapped, or an act to shake them off? Who knows. They’d all have to skip town sooner or later. The ones that were left anyway. Either hung and decapitated on the lampposts, or dying in deadly battle at the barricades formed throughout the cities. No one could make heads or tails of it. Sharkey’s boys were roughing up policemen across the country, but LA was a fixation of his for some unknowable reason. He and his Death Dealers wanted their pigs to squeal. Of course, a few hundred civilians would get caught in the crossfire, but they didn’t seem to care.\nJohnny tried to call his parents. Luckily they were in San-Fran, but unluckily his phone had died. He cursed under his breath, but focused on running. Adrenaline keeping him from collapsing, and the echoes of bullets and blood-freezing screams keeping him from fainting. Johnny kept on running. Even during the war it had never gotten this bad. Sure, any old Yarvinite might eye him up thinking “now what is that boy doing out of Compton?” but it was ultimately not much different from 2019. This, this was death. Collapse. Complete, unwashed terror. And so Johnny ran for the hills. Trying not to stare at the scalped and shot pigs he saw on the way. By night-time he had gotten to Griffith. He sat down."
SFL.923.a: "And watched on as Los Angeles burned."

SFL.924.t: "America is Living"
SFL.924.desc: "The Source awoke in the field, with eyes made of angels. Ahead of him were burning cities over which the pentagram shone backwards. The cities were falling into the seas of tar and into the cuts of space. The Source watched them burn and be consumed by the Death Dealers, with their weapons of life. Their ichor bombs and their cungadero bullets blossomed like skulls over the fields and over the skies.\nThe Source wandered in rivers and in the hill tops under the watch of the minstrel moon on which the ants crawled. Glass bells echoed in the cities and the people ran. Empires sewn in the skin of mice shot from the buildings as the beasts with plastic teeth and unknown weapons came to rape them.\nThe very land was breathing and changing. Junkies rode the skies in shining planes, fires made of movies and ether-fumes raged in the cars and the highways, the arteries of a snake that turned around and around in the light of a new America.\nThe Black houses erupted and the people chewed them up. Red maniacs sang the swan songs. Urban hells melted into the tanning sea and the sheltering sky. Guns turned on themselves and melted away. Dogs walked into the caves, wagging their tails of light. Every day, America’s foundations sunk deeper into the cities of nowhere. To be beneath the paper ground, floating in a mescaline mouth. Floating in an open eye made of you. The cities of the limbo of black and red light were stroking themselves as they turned alive. These cities were the new America, blooming, atoning, crucified, impaled below the world. Endlessly turning around on the edge of empty-sight of space; The Great Source had a face there that burned sideways through chromium fabric of space and time. Its mouth flabbed and gibbed. It muttered with sunken, bloated eyes."
SFL.924.a: "Come on inside!"

SFL.925.t: "The Most Wicked 4th"
SFL.925.desc: "The Washington DC sky blooms as it’s adorned and fretted with a lace of fire and pyrotechnics. Reunification had come just in time for America’s semiquincentennial anniversary, and there was full intent for the occasion to be celebrated like nothing before it.\nScarlet pentagrams trace the great celestial canopy above as thousands begin to chant in unison, their voices carried by the summer wind. Sharkey himself stands atop the steps of what remained of the Lincoln Memorial, in front of a great bonfire. He is defiant, triumphant, draped in a silken cape stitched with inverted flags, fangs flashing as he raises a goblet. “Two hundred and fifty years, two and a half centuries, of deceit and trickery end tonight!” he calls out, words echoing from the giant sound-system he had had installed. “The Founders have been replaced. The covenant is broken. America shall be born anew in blood and truth!”\nBelow him, a tapestry of characters from his cultic followers -- bikers in leather vests, pale-faced teenagers painted like Nosferatu, and actual ex-congressmen in crimson robes -- hand out sparklers in the style of St Peter’s cross. Kitsch, gaudy, tacky, his critics would spit about the whole event, but they would miss that those adjectives are a pillar of Americana, whether new or old.\nChildren squeal with delight as more fireworks explode in unsettling shapes overhead. The Devil’s 4th of July would replace Independence Day -- its pageantry equal parts grotesque and joyous. Blood-red candies are handed out to youngsters while the adults drink great goblets of alcohol, some drinks also colored crimson for the occasion.\nDespite a heap of consternation about the show, it would become tradition. Any normalcy had died years before the war anyway. Effigies of the old ways would burn. The carnival would reign now. Sharkey, grinning down at his creation, raises his arms to the flames and shouts towards the jubilant crowds:"
SFL.925.a: "Let Freedom Ring!"

