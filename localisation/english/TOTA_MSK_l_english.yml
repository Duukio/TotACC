MISKITO_TT: "Miskito-Belizean Creole [MSK.GetFlag]"
MISKITO_TT_DESC: "Number of Speakers: 400,000+\n\nInterchangeable with Belizean or Miskito Creole, Miskito-Belizean Creole is a formation of a continuous dialect between Belize and the Mosquito Coast due to the increasing influence of English Creoles in the region and continued efforts in re-uniting the similar creoles. As the Mosquito Coast's indigenous and African Creole populations, including in peripheral regions like the Corn Islands, where it is the language of 100% of the population, gained their independence with the assistance of the Contras, the language received a mass revival among Nicaraguan Creoles and thus went from a weak and vulnerable language to a thriving one, with official status in the Commonwealth and the CCPA.\n\nOther information:\nThe language has one sub-dialect: Rama Cay Creole, spoken by 800 people."

SAN_ANDRES_TT: "San Andrés-Providencia Creole"
SAN_ANDRES_TT_DESC: "Number of Speakers: ~80,000\n\nFormed out of an original small stock of Puritan English immigrants to Providence Island (now Providencia), the Providence Island Company established slave plantations in the region during the late 1700s and remained a mixed territory of White landowners and African slaves until 1822. In that year, the island of Providence voluntarily joined the Pan-Bolivarian project of Gran Colombia, and the island alongside San Andrés remained in dispute between Nicaragua (successor to Mexican claims) and Colombia, with Colombia protecting the local language through legislation (at least most of the time). By 1903 however, the Raizal (the local Creole speakers) were force-assimilated into Colombia through Catholic missionaries. A minority of White Anglo-Saxon Protestants remain in the islands. Whilst the Raizal and the Whites follow Protestantism, local late arrivals from Colombia follow Catholicism and speak Spanish."

JAMAICA_TT: "Jamaican Patwah/Patois"
JAMAICA_TT_DESC: "Number of Speakers: Over 3 million\n\nThe strongest and liveliest of all Creoles in the Caribbean, Jamaican Patois is also the most documented and most protected of all the Creole languages."

