l_english:
 MSK_the_victory_in_ahuya_yari:0 "The Victory in Ahuya Yari"
 MSK_the_victory_in_ahuya_yari_desc: "As we've attacked the incompetent Honduran government to defend the Miskito people in its borders from its totalitarian government, we've since shown the World to be a formidable force. It is certainly alarming to our enemies, but possibly welcomes new friends from the foray."
 MSK_calming_down_the_contras:0 "Calming Down The Contras"
 MSK_calming_down_the_contras_desc: "Those ungrateful veterans have been poking at us to invade Nicaragua as soon as possible, even if we've since created a proper nation instead of just a right-wing outpost in a communist country's territory. Of course, what we can do right now is to give them further concessions alongside some special statements to get them less bloodthirsty for the time being..."
 MSK_the_arab_in_bluefields:0 "The Arab In Bluefields"
 MSK_the_arab_in_bluefields_desc: "The Soviet agent, Bukele, has been recently approaching us with a \"Molotov-Ribbentrop Pact\"-style alliance against Honduras... Whilst this could be useful for gaining the Gracias a Dios department, it will take much convincing from the Salvadorans. Let's see what they got..."
 MSK_ortega_must_go:0 "Ortega Must Go!"
 MSK_ortega_must_go_desc: "The Contras have begun getting restless. Bukele's crusade in Central America cannot be stopped by us alone and therefore it's down to us to secure (at least part of) Nicaragua before his Cryptocurrency-obsessed despotate tries to destroy us in his wake."
 MSK_the_computer_king_of_corn_island:0 "The Computer King of Corn Island"
 MSK_the_computer_king_of_corn_island_desc: "Is this thing on?\n\nAs much as we've tried, the massive exodus of Americans from the United States once their war's broken out has stuffed what little infrastructure we had. John McAfee, a Floridian warlord, was forced out of Miami and has since seized both Corn Islands as his despotate. Armed to the teeth with ten thousand men and the best guns the world can offer, he has come to negotiate with our government. We suppose it wouldn't hurt to talk..."
 MSK_rearrange_our_priorities:0 "Rearrange our Priorities"
 MSK_rearrange_our_priorities_desc: "As we've since accepted McAfee's solution to our dispute, his leadership has demanded we take a radical redirection of our society and government towards a grandiose project of mercenary adventurism, claiming it will be the best way to reclaim Nicaragua from Ortega's government (an attractive statement to the Contras in our territory)."
 MSK_copirates_of_the_caribbean:0 "Co-Pirates of the Caribbean"
 MSK_copirates_of_the_caribbean_desc: "McAfee's first demand is to begin acts of piracy in the Caribbean coast as a way to increase funds for the Miskito Nation's government. This has only had real resistance from Miskito moderates who've been worried that this will result in us appearing as an illegitimate nation. Let us ignore them."
 MSK_the_emperors_new_groove:0 "The Emperor's New Groove"
 MSK_the_emperors_new_groove_desc: "The second demand is to \"pimp\" up our King, Joseph Clarence, in a way that allows him to be more in-touch with the country's youth and modern cultural sensibilities, away from ceremonialisms and regal formality. Clarence seems tolerant of the idea, if a little reluctant. Anything for Miskito..."
 MSK_appeasing_the_conquistadors:0 "Appeasing The Conquistadors"
 MSK_appeasing_the_conquistadors_desc: "The Contras have, since McAfee's takeover, been more hyper than ever. They crudely demand for an immediate invasion of Nicaragua, something that's begun to attract McAfee's interest. Perhaps it's time we show the Ortega government that we have sabers, and aren't afraid of using 'em."
 MSK_prince_of_seychelles:0 "Prince Of Seychelles"
 MSK_prince_of_seychelles_desc: "Our friends on the other side of the World have been enthusiastically supporting our new government with weapons, funding and intel. It is perhaps time to strengthen our ties even further..."
 MSK_corrupt_the_king:0 "Corrupt The King"
 MSK_corrupt_the_king_desc: "\"Ah, Joseph...\n\n The World is not merciful, kind or forgiving. Things were never easy for you or your people, either. It's time we show the World that we aren't afraid of getting our hands dirty, don't you think..?\nMeet me in Big Corn Island.\""
 MSK_held_together_by_solder:0 "Held Together By Solder"
 MSK_held_together_by_solder_desc: "Through the tenacity of our allies, our own people's fervor and McAfee's connections, we have been creating the most formidable Army in Central America, and with it bringing together the entirety of Miskito through a thick, unbreakable solder. With enough preparation, we may conquer the World.\n\nThat said, however, we must continue efforts to improve our armaments, increase our industry and mobilize our people."
 MSK_no_enemies_only_customers:0 "No Enemies, Only Customers"
 MSK_no_enemies_only_customers_desc: "If only people were able to accept healthy transactions... Alas, we must stress to our Partners and potential partners that we care little for geopolitical idealism, and instead believe in customers - regardless of their choice of market - after all, money talks."
 MSK_throw_bukele_in_the_trash:0 "Throw Bukele in the Trash"
 MSK_throw_bukele_in_the_trash_desc: "Despite our pragmatic nature - there is one thing we cannot accept; Bukele's rabid desire to upset the balance in Central America towards his designs and Soviet Communism. We must forgo our alliance with Bukele and begin preparations to wipe the floor with his smug teeth."
 MSK_against_the_world:0 "Against The World!"
 MSK_against_the_world_desc: "No allies besides a few stragglers on the other side of the World gives us no fear. We will not concede to Globalist tyrants and their stiff upper lips - we must stand in front of the World in sheer defiance."
 MSK_convince_the_japs:0 "Convince The Japs"
 MSK_convince_the_japs_desc: "Despite this intense independence, there is one nation we can rely on for friendship - the Japanese. Their previous allies, the Hondurans, have gone even further to the loony bin and we appear as calm and collected businessmen in comparison. It's high time we meet up in Shimizu..."
 MSK_text_tahoe:0 "Text Tahoe"
 MSK_text_tahoe_desc: "Tahoe City's more egregious allies might find it interesting to venture out into the jungles of the Coast for glory, money, fame and more. Let us contact our friends in Cali and get some more important people in our beautiful tropical paradise."
 MSK_appeal_to_the_ydwm:0 "Appeal To The YDWM"
 MSK_appeal_to_the_ydwm_desc: "Thousands of Western youths have been utterly poisoned by the lugubrious depression of modern life. Perhaps advertising ourselves as a place for glory and adventure to disaffected Westerners in decaying Western countries would be a good way of ensuring we keep a steady pool of loyalists nearby."
 MSK_jungle_blitzkrieg:0 "Jungle Blitzkrieg"
 MSK_jungle_blitzkrieg_desc: "Sun Tzu said once, \"There is no instance of a nation benefitting from prolonged warfare\", a generally correct sentiment. We must quickly spread ourselves across Central America and destroy our enemies before they grow too strong."
 MSK_the_kino_effect:0 "The Kino Effect"
 MSK_the_kino_effect_desc: "As Young, Disaffected White Men come in droves to Bluefields, we've only had a further shift towards the cultural Right - with words like \"Aryan classic\" and \"Kinoplex\" being thrown around as our body count piles into the tens of thousands. Perhaps it's time to own up to our wacky nature and become a hub of romantic Right-wing adventurism, answering to no one but the \"Kino Effect\", described by the principle of \"If it looks good, it works\"."
 MSK_drag_the_peasantry_towards_the_sun:0 "Drag The Peasantry Towards The Sun"
 MSK_drag_the_peasantry_towards_the_sun_desc: "Despite the intense transformation of our ruling class, the locals in our country have been completely aloof to these changes, unable to comprehend them or even oppose them due to not really keeping track - probably a good time to consolidate our rule in not only our newly-conquered territories, but also in our heartland through propaganda and further colonization."
 MSK_merry_england_lives_on:0 "Merry England Lives On"
 MSK_merry_england_lives_on_desc: "As Britain chokes on its own saliva through totalitarian surveillance and socialism, we torch forward the banner of Empire through the Kino Effect. Perhaps, in a way, Merry England lives on in our land, mercilessly destroying what refuses to join its beautiful sweltering Sun."

