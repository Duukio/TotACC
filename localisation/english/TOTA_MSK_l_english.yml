MSK_contras_anxiety: "Contras' Anxiety"
MSK_contras_anxiety_desc: "As the Contras age and become ever complacent, their commanders, officers and leaders have grown anxious in waiting for the Miskito to finally attack the communist government in Nicaragua, and their anxiety continues to pile up every month like a fountain of vengefulness. We need to act quickly, lest they become too angry and ruin what we've created.\n\nThe current level of Contras' Anxiety is [MSKCONTRASANGER_SCRLOC]."

