 MSK_anticocaine_act_desc:0 "We have been far too lenient to these degenerates using our State's lenient and libertarian laws for nefarious purposes. It's high time to crush them."
 MSK_wipe_out_the_druglords_desc:0 "With the ACA, we now have total sweeping rights to eliminate and arrest people involved with the cocaine trade. Whilst \"softer\" drugs like marijuana have been left in a more legally dubious area, we will focus on crushing the cocaine trade first."
 MSK_decentralized_justice_desc:0 "As to avoid becoming tyrants, we must bring clarity to the population that if they see someone cultivating coca leaves and producing cocaine, we give them full rights to shut down that operation within the bounds of the law, and if needed, defend themselves."
 MSK_adopt_common_law_desc:0 "Our legal system has been too infected with civil law systems which are inefficient, crude and unbecoming of our Creole people. It's time that we adopt a fully Anglophone legal system and abandon old Spanish laws which aren't representative or acceptable for the character of our people."
 MSK_plug_out_the_contras_desc:0 "We've depended on these old Spaniards for long enough. It's time we plot a plan to finally get them back to their homeland and keep them out of ours, in friendly terms of course..."
 MSK_found_the_creolecaribbean_peoples_association_desc:0 "Our Anglo-Afro-Caribbean Creole peoples have been threatened by Hispanics for centuries, and it is high time that we take the Anglophone countries of the Americas and create a mutual alliance for the preservation of our cultures and languages."
 MSK_adopt_a_president_desc:0 "As much as we love our Head Chief, it's probably a good idea to follow through with Hector's plan of creating a mixed Republican-Monarchical system which will allow for wide representation of our peoples without forgoing part of our heritage."
 MSK_purchase_brus_laguna_desc:0 "The starving Hondurans have lost their easternmost city, \"Puerto Lempira\" as they like to call it, and now we believe it'd be good to come in \"friendly\" terms to request the purchase of Brewer's Lagoon, an old English settlement in the Honduran northeast coast that belongs to the greater Miskito Homeland."
 MSK_county_reform_desc:0 "Our fledgling nation has had confusing and hazy legal systems for subdivisions, with Nicaraguan Departments and Miskito Regions being equally legally valid. Therefore, we will establish the creation of Counties, which will be the first-level subdivisions of our small nation. The names of these counties will comprise our leaders, heroes and cultural artifacts."
 MSK_our_ambitions_onward_desc:0 "As much as we've united the overwhelming majority of Miskito and Creole peoples, many have made a relatively legitimate argument that we have a real shot, and possibly a great destiny, in uniting the Central American peoples under an impartial and small ethnic group, for the ultimate perpetuity of not only our ethnic groups, but also Liberty and good government in this region marked by crime and poverty."
 MSK_bankrupt_the_contras_desc:0 "Since the Contras have successfully taken Managua, we have had a noticeable stake on their Government services and military equipment supply. Therefore, we can easily stranglehold their government and society to capitulate to our new ambitions."
 MSK_durrani_assistance_desc:0 "As much as they may be bigoted freaks that like to fornicate with goats, the Durranis have proven to be generally friendly to Christians compared to most Islamic nations, particularly as an export. They've backed Pence's government in Houston among others and we might be able to score some serious assistance from them, without forgoing our independence."
 MSK_japanese_switcharoo_desc:0 "Maybe it's time for the Japanese to abandon the Hondurans - our delegates will arrive in Shimizu to consult with a potential switch towards us as Japanese allies, offering instead a stable, militaristic and proud society with a fiercely anti-communist government, things that any Japanese administrator would smile at."
 MSK_partition_honduras_desc:0 "Bukele's rhetoric against Honduras has culminated into an attack by the fascistic government in Tegucigalpa against the Marxist government in San Salvador, and thus it is probably a good idea to take the opportunity and seize the remaining parts of Creole Honduras as a way to secure our northern flank."
 MSK_expand_our_citizenry_desc:0 "As much as we've promoted the primacy of uniting the Creole and Anglophone Caribbean peoples, we must recognize that we now hold a significant Hispanic population, and thus should consider turning them equal citizens under the Law as a way to secure further support."
 MSK_industrialization_reform_desc:0 "Our core nation, mostly rural fishermen and commercepeople, needs to be dragged towards the Future through industrialization and mobilization of our peasantry."
 MSK_the_ultimate_showdown_of_ultimate_destiny_desc:0 "Now, our goals are almost complete. We have dragged ourselves out of mediocrity into the greatest expression of Anglo-Creole culture in the Americas south of Mexico. Little stands in our way to bring the rays of Liberty to these opressed nations. Onward!"
 MSK_proclaim_the_kingdom_desc:0 "We've done it. Time to celebrate."

