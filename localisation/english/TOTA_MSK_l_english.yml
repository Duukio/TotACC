MSK.2.t: "The Battle for Corn Island"
MSK.2.desc: "The sky foamed grey as thousands of village folk saw something that appeared to be straight out of the latest action flick - Dozens of armed men of varying skin tones, headed by none other than John McAfee dispersed into Big Corn Island as they prepared defences and communicated with the municipal government in Little Corn Island as a direct line to the government in Bluefields.\n\n\"Your contract's up, motherfucker. You owe us a billion dollars, you stupid fucking Reverend!\" exclaimed McAfee with sheer hatred in his throat and eyes. He prepared his ships' armaments and pointed them towards Carib Town, a tiny settlement in Little Corn Island and ordered his men to stand alert.\n\n\"Get out of your palace and retire, you conman. It's high time you gave this country to its people.\"\n\nReverend Hector Williams heard these threats and responses with a hatred as bitter as his frustration. He knew that he fucked up letting those bastards in this country - but the roads, the clinics and telephone lines that were built by the hands of drug lords and bandits proved all too attractive to a man who cared about his people as deeply as he did.\n\nHe knew that he'd need the help of the Contras to disperse these rioting elements, but worried about the independence of his country when faced with either the crushing horror of bandit cartels or the overwhelming Hispanidad that choked his nation's throat for centuries. He looked on from Bluefields' coast, and as McAfee threw more expletives and warning shots, he sighed."
MSK.2.a: "For you, Moskitia, I'll die."
MSK.2.b: "For you, Moskitia, I'll fight."

MSK_raid_shadow_legends: "Raid: Shadow Legends"
MSK_raid_shadow_legends_desc: "Despite our increasingly drug-centric economy, we've successfully managed to create an efficient privateering business too. Through pillaging coastal towns and cities across the Caribbean, we are able to bring in revenue at the cost of some trade with neighboring nations."
