MSK.1.t: "Blooming Blue"
MSK.1.desc: "The old government mansion had been transformed into a more modernistic building on the outside, but within it looked about equivalent to its years. Within its creaking swivel chairs and attempts at bringing the old to the new was a clean, new lounge where the few countries which recognized the Moskitian commonwealth would convene to discuss diplomacy.\nNayib Bukele was tapping his fingers at the brand-new faux wood table, drinking some coffee that was too sweet for him. He looked towards the door, as the Chief Minister anxiously sat near him, in significantly more formal clothing, which was difficult to wear in the sweltering sun. Thankfully, the building had air-con installed only a year ago. As the passive trains of thought reached their rhetorical stations and boredom began taking hold, a few knocks came from the frosted glass door. Bukele answered.\n"Oh, it's excellent to see you again. Did you get the King's response?", said Bukele with surprising enthusiasm for the dingy environment he was in.\n"Yes," the aide said. She was darker-skinned than anyone Bukele had ever seen. How are these people so different? It's all Central America, after all...\nHector looked towards the two exchanging words to one another, and picked up the lemonade he requested a bit ago. \"So, with the Chief's assent, I can tell you with certainty that, as the representative of the Moskitian people...\""
MSK.1.a: "...We are in."

MSK.9.t: "An Exercise In Liberty"
MSK.9.desc: "The 2022 Moskitia elections have arrived as part of Parliament - and the King's - assent to create the role of President, as our nation becomes a diarchy and has a monarch which represents the Commonwealth, whilst a President represents the people as a whole. As it remains vacant at this time, the election was called as to secure a democratic mandate for the new position. A couple options have taken primacy over fourth-party and alternative candidates -- Cleaveland T. Webster of the Social Democratic Party, Edward Sinclair Chow of the Miskito Liberal Conservatives and Hector Williams of the Misnats, the popular term for the Miskito National Party, the country's first and most popular political party.\nDespite the inherent popularity of the Misnats as the incumbents and longstanding majority party of Moskitia's parliament, the Chief Minister of Moskitia, Hector Williams, has been in office for unusually long -- about 9 years at this point, which is partly why he has been pressured to call for an election. Whilst he and his core supporters believe he can eek out a majority in Parliament and keep him as the country's Chief Minister, his appeal has been faltering and a conservative alternative to the Misnats has taken the country by storm - of course, that being the MLCP. Focused on green politics mixed with conservatism and religious democracy, they intend on keeping many policies of Hector Williams but slowing down on industrialization and rapid urbanisation of the nation, urging caution in not losing their values.\nAlternatively, the main opposition party, the MSDP, have advocated for full developmentalism and further economic managerialism as a way to bring Moskitia to the 21st century.\n\nAfter most regions had been called by the day's end, Corn Island, the last constituency to finish counting, proved to be the decisive factor with its 3 MPs and 2,000 votes, voting mostly for..."
MSK.9.a: "Cleaveland and the MSDP in a major upset!"
MSK.9.b: "The MLCP and Edward Chow!"
MSK.9.c: "The Misnats and another Hector government!"

