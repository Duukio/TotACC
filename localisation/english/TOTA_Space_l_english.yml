WNE.139.t: "Leonov 1 Leaves Mars [GetNewsGraphic]" #15 APR 21
WNE.139.desc: "After a few weeks of final checks, the intrepid crew of Leonov 1 has safely departed Mars today for their final destination to the outer reaches of cis-Jovian space: the moon of Europa. The Leonov Mission has been a bold, collaborative effort between NASA, Interkosmos, and ECSA, with input from private contractors and Lunar and Martian researchers alike, featuring a new generation of shuttle design, the Deep Space Transport Vehicle (DSTV), which has been designed to facilitate the multi-year voyages needed given Europa's distance. Leonov 1 will travel for around four years before making its first landing, expected to occur in 2025."
WNE.139.a: "Bon Voyage!"
WNE.140.t: "Leonov 2 Launches from Mars [GetNewsGraphic]" #02 MAY 22
WNE.140.desc: "The next stage for the Leonov Mission has commenced, with the departure of the Leonov 2 crew from Mars' orbit, piloting the largest mobile space station yet built. Named Talos I, the station will act as the primary orbiting base for future missions to Europa and into trans-Jovian space. It is reportedly capable of housing around a crew of around 120 people at one time, having been built with future mission upscaling in mind. Powered by nuclear engines and sporting its own botanical wing and a rudimentary shipyard for repairs, it represents a true commitment to space exploration."
WNE.140.a: "Absolutely remarkable!"
WNE.141.t: "Humanity's Next Great Leap [GetNewsGraphic]" #15 MAY 25 - Superevent
WNE.141.desc: "Billions around the world tuned in today to watch humanity's next expedition into space, as Leonov 1 made its final descent to Europa's surface. Many watched with bated breath to see who would take the first step, before it was revealed to be the British and Italian crew members, Tim Peake and Samatha Cristoforetti, as part of a joke devised by the crew to 'return the Europeans to Europa'. Some observers have claimed the mission's spirit of collaboration has been undermined by the emergence of the Second American Civil War, but the directors of NASA, ECSA, and Interkosmos have all affirmed the success of the mission and its symbolic meaning."
WNE.141.a: "Truly an inspiration!"
WNE.142.t: "Leonov I and II Crew Reunion [GetNewsGraphic]" #02 FEB 26
WNE.142.desc: "Years after its departure, the Talos I space station has safely arrived in Europan orbit, successfully linking up with the orbiting module of Leonov I's shuttle. Videos sent by members of the two crews show a great sense of comeraderie as the teams met just outside the main airlock of Talos I, with Leonov I's commander, Stephanie Wilson, commending the pioneering work of both mission crews. There have been numerous concerns from doctors and psychologists about the feasibility of long-term missions like this, but it appears that Leonov I's mission has showcased the viability of them, with no major incidents being reported."
WNE.142.a: "Per aspera ad astra..."
WNE.143.t: "Initial Drilling on Europa [GetNewsGraphic]" #21 APR 26
WNE.143.desc: "With the arrival of Talos I, the final components needed to begin drilling through the thick ice crust that coats the oceans of Europa have been delivered. These excursions have been tried and practiced on Mars for years, attempting to find subsurface pockets of liquid water that have hosted life, but to no avail. It is hoped that Europa's thinner ice-crust and subsurface ocean could prove more worthwhile for finding life given the similarities between Europan and Earthen water, chemistry, and energy."
WNE.143.a: "Exciting!"
WNE.144.t: "Initial Reports of Europan Life? [GetNewsGraphic]" #19 NOV 28
WNE.144.desc: "After more than a year and a half of drilling operations on the Europan surface, the deepest borehole has successfully breached the Europan crust and opened up a route into the subsurface ocean on the Jovian moon. Into this borehole, a small submarine drone was lowered into the ocean by the crew. After several hours of exploration, the pilot of the drone reportedly witnessed movement of what was described as a 'large creature, almost like a shark'. Unfortunately, an oversight meant a recording of this expedition's cameras was not made, leaving just hearsay from the Leonov crews, but the crew have emphasized that recordings will be made in future."
WNE.144.a: "We want to believe!"
WNE.145.t: "No Further Sightings On Europa [GetNewsGraphic]" #16 DEC 29 - excl. to WNE.146
WNE.145.desc: "After just over a year of searching, the Leonov crews have been unable to re-establish visual contact of any such lifeform in the Europan subsurface ocean. Despite various types of research going on within Talos I's research centre, the excitement about the possibilities of any extraterrestrial life, even unintelligent forms, has waned and fizzled out as more months pass without any recorded, verifiable evidence."
WNE.145.a: "Is this space's Loch Ness Monster?"
WNE.146.t: "Europan Life Photographed! [GetNewsGraphic]" #21 JUL 29 - excl. to WNE.145
WNE.146.desc: "Over six months of waiting has paid off as the first pictures of extraterrestrial life have been released to the public! The landmark picture, although low-quality, appears to show the main head of a shark-like creature, featuring an articulable jaw as well as a dorsal fin. The bizarre similarities between this lifeform and Earthen life have puzzled bioscientists in many different fields, bringing up more questions about the initial development of life on Earth, with one even claiming that 'anything could be possible.'"
WNE.146.a: "Anything, huh?"
WNE.147.t: "Approval For Jovian Settlements! [GetNewsGraphic]" #16 OCT 29
WNE.147.desc: "Following the landmark photograph of the first verified non-Earthen life - a creature many are calling 'The Europan Shark' - the directors of NASA, ECSA, and Interkosmos have announced their approval of more missions to investigate life on Europa. As part of this, a new series of yet-unnamed missions will attempt to establish a permanent base on another of Jupiter's moons, Callisto, owing to its more advantageous orbit outside of Jupiter's radiation field compared to other Jovian moons. These missions are slated to commence in the early 2030s, with a tentative 2035 landing."
WNE.147.a: "Humanity's reach grows yet further!"
WNE.148.t: "First African Mass Driver Operational! [GetNewsGraphic]" #04 SEP 23
WNE.148.desc: "While mass drivers have become more common as more nations branch out into space industries, the East African Federation has become the first nation on the African continent to build a fully-operational mass driver, with assistance from ECSA engineers and scientists. Its functionality was showcased via the launch of a payload of construction and research materials that will rendezvous with the International Orbital Platform, to be passed to ECSA researchers on Luna. In a statement, ECSA Director Wörner referred to it as 'a landmark advancement in bringing space to more of humanity.'"
WNE.148.a: "Truly propelling science forward!"
WNE.149.t: "Space Industries To Burgeon Out Further [GetNewsGraphic]" #17 MAR 24
WNE.149.desc: "Despite the chaos brought to NASA by the Second American Civil War, the inter-agency collaborations initiated with the Leonov Program have held strong, with the launch of the latest mission to Venus. The mission intends to place a floating outpost platform above the planet's dense clouds to be used as a research base to begin with, aiming to better assess conditions on the planet, as well as to gain more information about the Sun. In light of this news, some experts have even posited that Venus could become a future home for humanity alongside Luna and Mars, living out on vast arcologies in the clouds."
WNE.149.a: "Three planets down, five to go!"
WNE.150.t: "Tragedy Strikes Space Industry Sector [GetNewsGraphic]" #08 JAN 25
WNE.150.desc: "Following the establishment of Mars' Bowie Base 1, many entrepeneurs looked to the nearby asteroid belt as a promising cache of mineral deposits that are otherwise harder to come by on Earth, establishing private space industries. However, many are doubting the ability of these companies to operate in such hostile environments as a major depressurization incident has led to the deaths of a crew of 28 aboard a Sphinx Resources Ltd. mining base. Four crew members found the gruesome scene after returning to the base following a shift. Much of the Canadian public is now calling for a thorough investigation into the incident and to strengthen spacer protections."
WNE.150.a: "How terrible..."
WNE.151.t: "Crystal Palace Space Station Opens! [GetNewsGraphic]" #27 JUN 27
WNE.151.desc: "After nearly two decades of work, the first privately-owned space station has finished construction and has been opened to the public. The Crystal Palace project has been headed by Richard Branson of the Virgin Group, with hopes to remove Hilton's space-hotel monopoly operating from Luna. The landmark station features numerous hotels, casinos, conference rooms, and shopping plazas, as well as incredible features such as an artificial arboretum and park for leisure. The station is expected to field a working crew of over 200 people. While a very risky venture, it has certainly heightened public interest in space tourism."
WNE.151.a: "The start of a new age."