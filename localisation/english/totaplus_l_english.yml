l_english:
 USA_end_of_the_world_as_we_know_it: "End Of The World as we know it,"
 USA_end_of_the_world_as_we_know_it_desc: "The United States of America, a federation 2 and a half centuries old, the champion of the grand democratic system, gone ablaze in traitors and tyranny. 7 Scores and 15 years ago, Lincoln had put to rest the first of the men threatening our democracy. Now a country on fire, it may soon be the end of the world as we know it…"
 USA_and_i_feel_fine: "And I feel fine..."
 USA_and_i_feel_fine_desc: "…though even through its low points, America has always gone under and got back up to fight another day. The Colonists didn’t surrender then the British burned the white house, the men of the Alamo didn’t cower when they were losing against Santa Anna. America is a country that shall live on forever in democracy, when we win this, we’ll all feel fine."
 USA_emergency_police_deployments: "Emergency Police Deployments"
 USA_emergency_police_deployments_desc: "In times of crises, the national guard has come to step up and serve the country in all ways. Now during the biggest crisis in the nation’s history, we now must call them up again to defend the national values that have defined and uphold our democracy for years and years to come."
 USA_of_cops_and_communists: "Of Cops and Communists"
 USA_of_cops_and_communists_desc: "New England, one of the first places of the United States to be colonized by the pilgrims in 1620. Two Factions have come to call this place home, the communists of Philadelphia and the police union in New York. This is our first target to take out as it contains 2 of the largest cities in the United States and is historically important while being a thorn in our side. A victory in this area would be a practical and symbolic victory."
