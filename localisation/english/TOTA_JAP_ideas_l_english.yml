SIA_SVI_condominium: "[SVI.GetFlag]Vietnamese-[SIA.GetFlag]Thai Joint Rule"
SIA_SVI_condominium_desc: "Despite our best efforts to retain the independence of the Republic, the only way we've been able to survive this long has been extensive backing by regional allies against the Red Khmer. While unfortunate, it is likely that we will be able to gain a spine once we've finally defeated them."


SIA_tkcaic: "The Kra Canal And Its Consequences"
SIA_tkcaic_desc: "As over two trillion yen poured over to the Thai government to fund and create the Kra Canal, a modern marvel of engineering, so too did centuries-old tensions boil over between the Thai and Malays of the area. The further separation of Thai Malay - and thus wider Thai Muslim - issues from the rest of Thailand has resulted in significant clashes in the Malay border, where Islamist and Communist groups work in tandem against the Thai government."

SIA_legacy_of_phibun: "Phibunsongkram's Legacy"
SIA_legacy_of_phibun_desc: "Phibunsongkram's leadership in Thailand was nothing short of meteoric. Reforms left and right were deeply popular and simultaneously polarizing, all whilst bringing Thailand kicking and screaming into the 20th century. Suddenly, upon Phibun's assassination at the hands of a dissident, these reforms had been left half-finished or completely abandoned. His governance to this day works as a benchmark to compare with other contemporary Thai leaders, too. Nonetheless, his dissolution of the Thai monarchy and rapid reforms meant that many in Southern Thailand, conservative and rural as they are, saw these with deep skepticism, and to this day the southern parts of Thailand are in favor of restoring the Monarchy, even if just constitutionally."

SIA_mrt: "The MRT Project"
SIA_mrt_desc: "The Metropolitan Rapid Transit system, at this time, functions as a gateway to all things in Central Thailand, but aspirations to expand the currently excellent railway infrastructure have been considered and planned multiple times, with some deadlock, to reach other regions in Thailand and even nearby countries!"

SIA_libtards: "Liberal Dissidents"
SIA_libtards_desc: "Recent actions by the Government have proven deeply unpopular with Thailand's large youth population, especially in cities, who believe in fierce reformism - from more transparency in government, to cracking down on corporate meddling in politics. This deeply liberal youth has called the Prime Minister a tyrant multiple times, demanding his resignation. We must decide a course of action with them soon."

WNE.210.t: "Japan-Korea Undersea Tunnel Complete"
WNE.210.desc: "After nearly a decade in construction, the Japan-Korea Undersea tunnel, representing cross-strait efforts for generations in both lobbying for its initial construction and the maintenance of funding, has been completed. Cars, trucks and people cross the new \"Asian Channel Tunnel\", which has focused on keeping low fares for the time being as a way to attract newcomers to its slightly unusual status as one of the longest tunnels ever made by humans. One can only imagine what future projects Japan might be thinking of doing in the future!"
WNE.210.a: "Good for them!"

SRW_two_sarawaks: "Two Sarawaks"
SRW_two_sarawaks_desc: "From the glass towers of Kuching to the jungle longhouses of Limbang, Sarawak is a land divided. Urban elites in the capital embrace Japanese architecture, British manners, and global capital. In the east, time moves slower... but loyalty to the White Rajah binds them together, for better or for worse."
SRW_heaven_has_a_landlord: "This Heaven Has A Landlord"
SRW_heaven_has_a_landlord_desc: "Although this tropical rainforest paradise has a relatively open-minded elite, for generations, landholders governed Sarawak as miniature rajahs: half-tribal chieftains, half-feudal lords. Now, they drive Land Cruisers, use digital land registries, and sell their sons into the officer corps. But beneath the surface, the old logic endures and Sarawak's governance gets more and more complex."
SRW_eurasian_investment: "Eurasian Investment"
SRW_eurasian_investment_desc: "Historically, Sarawak sits as a curious blip in the lineage of Europe-Asia relations - an Insulindian nation ruled by descendants of a British filibuster on land gifted by a native Sultan. This blend of East and West continues to this day in the economic tug-of-war between the United Kingdom and Japan, each seeking a strong outpost in the South China Sea. Sarawak can try to chart its own path but on each side is a predator, whether traditional friend or traditional foe."
SRW_whispers_of_kalimantan: "Whispers of Kalimantan"
SRW_whispers_of_kalimantan_desc: "Although the insurrection by the North Kalimantan Communist Party nearly razed Kuching to the ground and was later wiped by Japanese tanks and, later, drone-equipped Sarawak rangers, the hushed wounds of the past continue lingering as some local Iban populations fear the Rangers' brutality."

SRW_heaven_has_a_landlord_1: "Landlord Question Reforms"

SRW_preparations_for_the_180th: "Preparations For The 180th"
SRW_preparations_for_the_180th_desc: "Sarawak will soon mark one hundred and eighty years of Brooke rule. We must organize festivities and highlight the dynasty’s role in guiding the state through empire, war, and modernity."
SRW_the_brooke_naval_tradition: "The Brooke Naval Tradition"
SRW_the_brooke_naval_tradition_desc: "The rivers and seas have always been Sarawak’s lifeblood. By investing in shipyards and research, we ensure our navy can defend the coasts and project our influence beyond Borneo."
SRW_what_singapore_never_was: "What Singapore Never Was"
SRW_what_singapore_never_was_desc: "Singapore may have fallen to socialism, but Sarawak can seize the mantle of a free-trading hub in Southeast Asia. By promoting commerce and finance, we attract the world’s capital to Kuching."
SRW_reform_the_sarawak_foreign_office: "Reform The Sarawak Foreign Office"
SRW_reform_the_sarawak_foreign_office_desc: "The Sarawak Foreign Office once served as the White Rajahs' voice abroad. Renewed funding will allow us to expand our reach, negotiate treaties, and defend Sarawak’s place among nations."
SRW_flourishing_our_markets: "Flourishing Our Markets"
SRW_flourishing_our_markets_desc: "State subsidies and royal patronage will stimulate trade, boost industry, and secure growth. Sarawak must be seen as a land of open opportunity and dynamic enterprise."
SRW_masters_of_trade: "Masters of Trade"
SRW_masters_of_trade_desc: "By lowering barriers, easing tariffs, and expanding our networks, Sarawak can become the crossroads of Southeast Asia. Commerce flows best where the Rajah’s banner flies."
SRW_bring_american_refugees: "Bring American Refugees"
SRW_bring_american_refugees_desc: "The civil war in the United States drives many to seek refuge. By welcoming them, offering support, and encouraging integration, Sarawak gains both skilled hands and loyal new citizens."
SRW_for_another_180: "For Another 180!"
SRW_for_another_180_desc: "The anniversary festivities conclude with parades, speeches, and royal proclamations. The dynasty is stronger than ever, its people united in pride for Sarawak’s long survival."
SRW_gone_forth_beyond_the_sea: "Gone Forth Beyond The Sea"
SRW_gone_forth_beyond_the_sea_desc: "The Rajah’s vision no longer ends at Sarawak’s borders. With growing strength and foreign recognition, our foreign policy will be felt across the seas of Asia."
SRW_bornean_concerns: "Bornean Concerns"
SRW_bornean_concerns_desc: "The city of Keningau links Sarawak to Sabah. By negotiating its purchase, we expand our territory and secure a strategic foothold for the kingdom’s future."
SRW_the_abang_jo_plan: "The Abang Jo Plan"
SRW_the_abang_jo_plan_desc: "The Philippine anti-communists seek friends abroad. By sponsoring them, we turn their struggle into Sarawak’s opportunity — and gain a loyal proxy across the sea."
SRW_the_landlord_question: "The Landlord Question"
SRW_the_landlord_question_desc: "The feudal land system must adapt to modern times. Through experiments in taxation and land reform, we spread ownership and stability without undermining the Rajah’s authority."
SRW_request_japanese_garrisson: "Request Japanese Garrison"
SRW_request_japanese_garrisson_desc: "Though our friends, Japan’s strength remains unmatched. A garrison from Tokyo will reinforce our security, deter our enemies, and anchor Sarawak firmly in the Pan-Asia Free Commerce and Peace Group."
SRW_host_the_exiles: "Host The Exiles"
SRW_host_the_exiles_desc: "By giving sanctuary and support to the Philippine exile government, we deepen our influence. Their survival is tied to our patronage — and to our royal will."
SRW_stem_the_tides_of_populism: "Stem The Tides of Populism"
SRW_stem_the_tides_of_populism_desc: "Economic reforms and royal generosity can defuse popular discontent. The people need to see that their king provides, and in doing so, they will remain loyal."
SRW_expand_the_rangers: "Expand The Rangers"
SRW_expand_the_rangers_desc: "The Sarawak Rangers have long defended our borders and jungles. Expanding their ranks will strengthen our military and provide proud service for loyal citizens."
SRW_the_question_of_sabah: "The Question of Sabah"
SRW_the_question_of_sabah_desc: "The people of Sabah look to Kuching for guidance. By extending citizenship and protection, we bind them to the Rajah’s realm and secure our rightful claim."
SRW_improve_urban_conditions: "Improve Urban Conditions"
SRW_improve_urban_conditions_desc: "Cities must be livable, not only profitable. Investments in housing, planning, and public works will ensure Kuching becomes a beacon of modern urban life."
SRW_improve_military_research: "Improve Military Research"
SRW_improve_military_research_desc: "War is fought with brains as well as bravery. We will fund laboratories and academies to keep Sarawak’s forces abreast of the latest military science."
SRW_the_great_adventure_south: "The Great Adventure South"
SRW_the_great_adventure_south_desc: "Conflict rages in the archipelago. Sarawak must choose its friends and chart a bold course — siding with the Dutch remnants or the Nusantaran Emirate."
SRW_mix_the_neighborhoods: "Mix The Neighborhoods"
SRW_mix_the_neighborhoods_desc: "Diversity is Sarawak's strength. By encouraging integration across ethnic and religious lines, we forge unity from difference and harmony from discord."
SRW_forwards_fair_sarawak: "Forwards, Fair Sarawak"
SRW_forwards_fair_sarawak_desc: "The dynasty stands firm, the people are loyal, and the state is strong. With our path set, Sarawak marches forward into a future worthy of its long and storied past."
SRW_negri_elections_2025: "Negri Elections 2025"
SRW_negri_elections_2025_desc: "Negri Elections 2025"
SRW_supp_victory: "SUPP Victory"
SRW_supp_victory_desc: "SUPP Victory"
SRW_spp_victory: "SPP Victory"
SRW_spp_victory_desc: "SPP Victory"
SRW_sarawa_progress_victory: "Sarawa Progress Victory"
SRW_sarawa_progress_victory_desc: "Sarawa Progress Victory"
SRW_steady_as_she_goes: "Steady As She Goes"
SRW_steady_as_she_goes_desc: "Steady As She Goes"
SRW_the_reform_package: "The Reform Package"
SRW_the_reform_package_desc: "As the Sarawa Progress Party continues reforming the State to allow for further democratization, the powers of the Chief Minister shall be expanded to create further accountability."
SRW_kuchings_shimizu: "Kuching's Shimizu"
SRW_kuchings_shimizu_desc: "Kuching's Shimizu"
SRW_negri_elections_2030: "Negri Elections 2030"
SRW_negri_elections_2030_desc: "Negri Elections 2030"

SRW.1.t: "180th Anniversary of the Founding of the State of Sarawak"
SRW.1.desc: "In 1841, James Brooke first raised the Sarawak flag over Kuching, setting into motion a dynasty that has defied empires, wars, and revolutions alike. Now, one hundred and eighty years later, the White Rajahs still reign from the Astana and their authority, only slightly modified from 1841, continues to be carried by the rivers and mountains of Borneo. Sarawak has changed beyond recognition since those days of gunboats and jungle treaties: highways stretch into the hinterlands, oil derricks rise along the coast, and the neon glow of Kuching speaks to a modern age. Yet, old divisions linger: Between city and village, lord and tenant, faith and ideology. The Rajah, styled as both monarch and modernizer, declares this anniversary not an ending, but a new beginning: a promise that Sarawak will endure the storms of the future just as it endured the storms of empire. Loyalists cheer, skeptics grumble, and in the dying whispers of the jungle sit the graves of those who dared defy this great Raj."
SRW.1.a: "Let us pray for 180 more."
SRW.2.t: "Sarawak offers to buy Keningau"
SRW.2.desc: ""
SRW.2.a: "Shore"
SRW.2.b: "Naw"
SRW.3.t: "Sarawak offers to protect the Philippine Exiles"
SRW.3.desc: ""
SRW.3.a: "Fine"
SRW.4.t: "Sarawak Requests Bolstered Defenses"
SRW.4.a: "Yessir"
SRW.4.b: "No"
SRW.5.t: "Council Negri Elections: 2025"
SRW.5.desc: "Once more, Sarawak's people gather at the polls, exercising the curious blend of monarchy and democracy that has defined the White Rajahs' rule for just three election cycles so far. The Council Negri of 2025 is a contest between three visions of the state: the ruling Sarawak United People's Party, guardians of liberal anocracy and palace patronage; the rising Sarawak People's Party, conservative developmentalists who promise discipline and prosperity under firm central control; and the Sarawak Progress Party, social democrats calling for fairer wages, broader rights, and a deeper share of Sarawak's wealth for its workers. The Rajah, of course, remains above it all: Arbiter, patron, and ultimate authority of the State. Yet, the elections carry weight nonetheless, shaping policy, perception, and the delicate balance between palace, landholders, and common folk. The streets of Kuching buzz with debate, while the jungles watch and wait. Sarawak's future, as ever, is written at once in ballots and decrees..."
SRW.5.a: "The SUPP wins another 5 years in power!"
SRW.5.b: "The SPP wins a well-deserved victory!"
SRW.5.c: "Sarawa Progress wins a stunning upset!"

SRW.6.t: "Nusantara accepts our offer!"
SRW.6.desc: "Although we were expecting this response, the Nusantaran side has been notably gracious about the whole thing, saying that the region was unruly anyway and seemed happier at the prospect of being with us."
SRW.6.a: "Phenomenal!"

SRW.7.t: "Nusantara refuses our offer!"
SRW.7.desc: "While not totally out of the realm of possibility, Nusantara has unexpectedly refused our generous offer, citing Nusantara's national integrity as inviolable. We cannot offer them to purchase Keningau again."
SRW.7.a: "That sucks."

SRW.8.t: "The East Indies War: Who To Side With?"
SRW.8.desc: "Although we have been good friends with the Japanosphere for a while, Japan's recent silence and later condemnation regarding the invasion of the East Indies Confederation allows us a unique opportunity to pick between either side of the conflict. Although our Christian population sees this as a prime opportunity to strike the oppressed peoples of Nusantara and free them from Shar'ia, diplomatic obligations means we could instead simply join them against the East Indies Confederation to gain further favors with the Nusantarans."
SRW.8.a: "For our diplomatic future, Nusantara"
SRW.8.b: "For Christian Civilization, the Dutch!"

SRW_american_refugees: "American Refugees"
SRW_american_refugees: "American Refugees, mostly from the American South, have been arriving in droves to Kuching due to our generous \"get back on your feet\" programs."

TURTLE_ISLAND_FACTION: "Turtle Island Liberation Front"