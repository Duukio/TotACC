CANAAN.4.t: "Unity, Socialism, National Revolution"
CANAAN.4.desc: "Mordechai turned on the radio. Those blasted crooks were going to make an announcement. He heard of it since it became the talk of the town. It filled him with disgust that people who not long ago claimed to be stalwart defenders of the great socialist and zionist legacy of the Republic, were now praising this turn to madness. It was big news regardless though, and he felt an obligation to look into it.\nAs he turned on the television, he saw Omer Bar-Lev appearing. He was mid-speech, standing on a pedestal by the Dome of the Rock\n'It is in times like these that we must remember. We must remember the great sacrifices made to build this great Hebrew Nation, bringing us to this day.\n\nWe must remember all those who died in the struggle to free us from the British colonialists.\n\nWe must remember all those who died defending our land from Imperialist aggressors.\nWe must remember all those who died - and still die - in the hand of those blinded by faith and reaction.\nWe must remember the plight of two thousand years of exile - and the still ongoing plight of our Arab countrymen, suffering racism and prejudice - often in the hand of those who claim to carry the mantle of our Revolution.\nIt is in times like these that we must remember, and we must act - act to carry on our Hebrew National Revolution to its natural conclusion - a final unification of our peoples and a final liberation of the semitic sphere.\nCanaan is finally awakening from its millennia's long slumber!\nLet us children of the land of Canaan proclaim together on this day, the beginning of a new age of Unity, let us build a true, unbowed, Free Socialism, let us put an end to unending war and injustice, let us proclaim a grand, new, National Revolution.'\nAs the crowd started cheering, shouting in Hebrew and Arabic alike, Mordechai angrily switched off the TV."
CANAAN.4.a: "Traitors."
CANAAN.2.t: "State and Revolution"
CANAAN.2.desc: "-Decree #1 of the State Committee on National Revolution-\n\nThe Hebrew Republic of Labour, truly a revolutionary project in her time, is now reaching her natural historical development.\nThe partial unification of the land brought about in 1961, and the Arab autonomy we worked with such vigor to establish, were steps in right direction, but never more than flimsy half measures. Now is the time of action to complete the task; with the grand state machine finally in our hands, we must stay true to Canaan and faithfully carry out Revolution.\nWe shall thus declare a grand reorganization of the state; let the false Arab autonomy be formalized into a true Palestinian partnership; let the Hebrew Republic of Labour find its true conclusion in a Free and Secular Semitic Republic of Canaan, proclaiming to the nation and the world the breathing heart of the Canaanite Revolution;"
CANAAN.2.a: "Unity of the Land, Liberty of the People"
CANAAN.1.t: "The Nature of Governance"
CANAAN.1.desc: "Now that the reactionaries and separatists have finally been cleansed, and power consolidated under the national progressive vanguard, many questions on the actual management of the state arise. One of these is the question of the party.\n\nWhile the obvious conclusion seems to be the establishment of a new party of the Canaanite People, many in our movement say that this is not a sufficiently revolutionary measure, merely replacing one party with another, calling for an end to divisive and corrupt Party rule altogether.\nStill, some moderates and more pragmatic cadre seek instead to maintain Mapam rule under new leadership as to gain more legitimacy. The historical revolutionary role of the United Workers Party, they say, cannot be forgotten, and the name does not denote a Jewish or Arab separatism, promoting unity instead. They also seek to emphasize thus the popular and socialist nature of our movement, being a national movement of the workers.\n\nWhat shall it be?"
CANAAN.1.a: "We must rally behind the Canaanite Vanguard."
CANAAN.1.b: "We must go past rotten party politics."
CANAAN.1.c: "Perhaps we shall maintain Mapam..."
CANAAN.3.t: "On the National Front"
CANAAN.3.desc: "With the Hebrew state we inherited the National Front too, for all its parties and mass organizations.\nWhile virtually all in the movement agree that the sectarian parties and organizations in it must be abolished and purged, many still consider the existence of a front to consolidate all reformed mass organizations as beneficial, going as far as to suggest giving them representation in the People’s Council and the government, citing the example of the Prussian Democratic Republic.\nStill, some want to abolish the National Front altogether, maintaining that a strong and unified vanguard without factionalism is needed to guide the Nation through such hard times. The mass organizations must be subjugated to the National interest and the National line set by the state, they say, rather than involving the petty narrow interests of their group in decision making."
CANAAN.3.a: "Everything within the state, nothing outside the state, nothing against the state."
CANAAN.3.b: "We shall go by the Prussian example."
CANAAN.6.t: "Revolutionary Vanguard"
CANAAN.6.desc: "Over the past few months, as the new Canaanite state prepared for its great incursion into the East Bank of the Jordan, its agents had been hard at work.\nIn the town of Al Adassiyah, they had been connecting with Nasserist and dissident Palestinian groups. Many would never have considered working with Eber just a few years ago. But with the rise of the Cannanites, much had changed. Now as their Zionist enemy was no longer Zionist, espousing a supposed equal union of Hebrews and Palestinians, the prospect of a popular revolution against the corrupt Hashemite monarchy had turned many heads.\nAs the crack of dawn came, dozens of gunmen led by a small vanguard of well trained Shin Bet agents stormed the town centre. They knew that down the road, other villages and towns were facing similar uprisings. Altogether, more then 200 people had risen up in a well coordinated maneuver. A few dozen of whom were not exactly native to Jordan. In perfect synchronicity, on social media and on the radio and townhall speakers they declared the beginning of a grand revolution. One that would smash the British puppets in Jordan. They called for the realisation of semitic unity, and inevitably for their brothers in Canaan to come and aid them in the liberation of Palestine."
CANAAN.6.a: "All acording to the Plan..!"
CANAAN.7.t: "Struggle Sessions"
CANAAN.7.desc: "Yoav was brought out into the middle of the town center. The people he once called his friends took him by force and threw him down to the ground.\nOn his head was a dunce hat, inscribed on which were words like \"Traitor\" and \"Exiled Spirited\".\n\nOne man he did not know started to call the attention of the people of the town. He yelled out \"Comrades! Friends of the National Revolution! Before you is a traitor to your cause!\" Yoav saw that some had shifty eyes, not meeting their eyes. But others had their attention caught, and came over to join in on the struggle session.\n\"This man stands accused of acts which would sabotage the unity of our nation.\" Yoav scoffed. The man continued, \"On his twitter, were tweets stating that our Arab countrymen are inferior savages, that 'Jews' should not intermingle with lesser Goyim! Is this a way for the liberated Hebrew in his land, for the Canaanite, to treat his brother? Did his role as supervisor resurrect the petit-bourgeois, exiled-jewish way of thinking? Can such a man be trusted to not discriminate against his Arab workers, can he be trusted not too steal from the nation?\" Many did not answer, but just as many booed and hissed at Yoav.\nThe man spoke again. \"What shall be done with such weak spirited traitors? Surely, if given the choice he would renounce his statements. But tell me, brothers and sisters, how could we make sure it is a honest change of heart?\"\nThe crowd began to chant. One called to beat him up, sending a chill down Yoav's spine. But most started chanting something different. \"Remove him from his post! Let him work with his brothers as equal! Labour will teach him! Labour will save him!\"\nYoav sighed in relief."
CANAAN.7.a: "Repudiate Ghetto-Exiled Thought, follow the National Line, Uphold the National Revolution."
CANAAN.8.t: "Dealing with Reaction"
CANAAN.8.desc: "It was the 3rd meeting of the underground party \"Young Zionists for Liberty\" that month. Ever since the coup, they had been collecting members. Yes, Ramon was gone. But his ideas remained. And especially with the new National Revolutionary direction of our government, such previously narrow organizations have been unifying reactionary opposition forces. Those reactionaries, discussing different methods of covert organizing for protests and even possible future coups, have been in direct contact with the secret services of France, Britain, and intelligence suggests that even some of our so-called Socialist allies maintain secret contacts with them. Chatter was everywhere. Men and women of many different ages talked in excitement as their leadership prepared for the formal start of the meeting.\nA dozen Shin-Bet officers stood outside the building they were meeting in. There were little informants, but intelligence had picked up on news of meetings and correspondence with foreign agents. The full might of the Revolution was about to come down on them. Confident that everyone who was going to come had come already, they awaited for their leader's signal. At once, a battering ram slammed into the door. Two others kicked in the windows. A chorus of screams and yells shot out of the little apartment."
CANAAN.8.a: "Freeze! You are all under arrest!"
CANAAN.9.t: "Meirav is Burning"
CANAAN.9.desc: "The Rabbi of Meirav, and many of his followers and friends were herded out of their Religious Kibbutz. Many of the Ye'elim had wanted them to suffer the same fate as those in less fortunate towns, but for once moderating forces had prevailed. There would be no killings today, though others wanted to die with the synagouge.\nOnly a few hours ago, men wearing Ye’elim uniforms, be they Secular Hebrews from Beit She’an or Palestinians from the nearby villages of Jilabun and Faqua, roared into the mountainous kibbutz in cars and jeeps. Carrying guns, machetes, and cans of gasoline, they encircled the synagogue and the Kibbutz center. Cursing the Rabbi and the reactionary ways these Jewish supremacists stood for, they forced those praying out of the synagogue. Their cries for help were silenced by shots into the air. Even the seasoned reservists of the Kibbutz knew any resistance to the heavily armed mob would be futile.\nDousing the synagogue with gasoline and setting it ablaze, their leader proclaimed to the crying people of Meirav; “For long you sat here, on top of the mountain, trying to isolate yourselves in a ghetto, looking down on your Arab neighbors in disgust. In disgust and in fear that one day they will come to you for revenge. Today your fears came true, but not as you expected. Today the entire Canaanite nation, our whole land, is ejecting your reaction from it. Behold! Today you are experiencing revolution.”\nAs the militants stormed homes, going house after house to find books to burn, the most devoted followers of the Rabbi, proclaiming they will burn together with the synagogue, were restrained and silenced. Plans for their re education were already being laid out.\nBy the time dawn had cracked, the Ye'elim were long gone and much of the town lay in ashes."
CANAAN.9.a: "Do justice may it burn the World."
CANAAN.10.t: "Revolution Realized"
CANAAN.10.desc: "While it wasn't the first time he'd been home since university, Idan was always surprised at just how much changed while he was away. Of course, the last few years, change has been much more rapid, with the new Canaanite “National Revolution” going on... He hadn't really paid much attention to it, even with all the talk on campus, he tried to focus on his studies.\nWalking towards his old home, he passed a café when he heard a call from behind him. \"Idan! Hey, Idan! Is that you?!\"\nA young man wearing a purple and blue neckerchief had run out excitedly to meet him and was smiling wide. \"Jalil? Wow, it feels like it's been ages!\" And it had been. Though they had once been close, a rift had formed due to their parents' mutual animosity towards each other, both pairs viewing the Arab-Hebrew friendship as a bad influence between the two sons. \"It's been too long, Idan! We should catch up but first I want to show you something.\" Jalil seemed hardly able to contain his own excitement. Idan followed Jalil back to the café to a surprise. Seated at the large table were both his and Jalil's parents! And most surprising was that they were getting on really well - a far cry from their old relationship. He greeted them all warmly as he and Jalil sat down, \"Well this is certainly a suprise!\"\n\"Hahaha, yes, it's been a bit of a whirlwind these past few months!\" Idan's mother chimed in. \"We've been meeting semi-regularly now for lunch after Ahmed here helped your father out with some car trouble he'd had, but the credit really goes to Jalil.\"\n\"Ohhh thank you, Mrs. Shmaryahu, but that praise is undeserved. The National Revolution, our land of Canaan, that's what inspired me. Leave aside Arab-this, Jewish-that, and I knew you'd all get along like Idan and I used to, unadulterated with hate. And I was right!\" Jalil joked. \"We're all neighbours in the same building, in the same city, in the same ancestral land - any hatred's just a waste, for the country but also for ourselves, you know? Just took a bit of nudging to get this ball rolling, hahaha.\" Jalil joked, but Idan agreed. He was still a bit bitter over the feud between the families, even after all these years, but it seemed sense was finally winning out. \"Totally agree. I've heard a lot of talk of Canaanism at uni, and even with some of the more questionable proponents of it, if this-\" Idan motioned to the newfound friendship around the table, \"is what the end-goal for them is, it's really great to see.\" The whole table concurred before making a very small toast..."
CANAAN.10.a: "To good health, food and harmony!"
CANAAN.11.t: "The Enemy of My Enemy"
CANAAN.11.desc: "Across the boardroom sat in office chairs or lounge chairs, 32 men and women would decide the fate of thousands/hundreds. They were all operating on conflicting orders and ultimately had come to terms with the fact that what they decide upon would only start a greater chain of events regarding the fate of their nation. By now the officials had all organized themselves across the room based upon not their rank and role, but factional stance, what was meant to be a clean cut turned into a debate over the future of the Republic.\nA slightly older looking individual on the opposite side of this room was shuffling between numerous physical paper reports and a Modu tablet computer detailing the records of certain individuals. He raised a mechanical arm to draw eyes onto him and began to speak, \"If I may have your attention, we have clearly lost track of the matter here. These people all pose a serious risk to the new government, and we cannot tolerate any of them whatsoever.\" he continued, \"The problem is, we cannot take down all of these reactionaries and radicals at once, we must pick a group to focus on to ensure we do our job properly.\"\nA young woman began to yell out at him, \"Then it's obvious, we need to eliminate the religious zealots and ethnic supremacists who pose the most threat to us all, we can deploy a number of Dozers in their neighborhoods to quell any unrest and simply arrest them in the process-\" but she was then interrupted by another man \"NO! We must prioritize the known anti-zionists and rightist-deviants, we have their names and addresses here. We can fire them in mass and evict them from their current residences, then we can go about seeing neurological corrections-\"\nThe old man sighed loudly and put his face into his palms, he realized they were going to go on like this for a while, so he had to call rank and make a decision..."
CANAAN.11.a: "Send in the Yasam on the fundamentalists"
CANAAN.11.b: "Terminate the employment of the rightists"
CANAAN.12.t: "Birth of a Nation"
CANAAN.12.desc: "Ever since the coup against that liberal traitor Ramon, the vision for Canaan inches ever closer, only to run into the reactionary roadblock that is Sneh's clique. For so long the Canaanite movement has struggled to end the senseless hate and division between the arab and hebrew brother nations, to strive for unity and peace, to forge a better future for Canaan and Shem. While Sneh and some of his people are surely respectable, albeit mistaken and narrow minded communists, his clique fosters much danger, abound with religious Zionists and other reactionaries who strive for ghetto minded jewish supremacy, an upfront to peace. So action had to be taken. Bar-Lev watches the large LED screen with anticipation, a camera feed of several important locations in Tel-Aviv and Jerusalem.\nAlthough the coup did allow the Canaanite movement more freedom, the government was mostly still controlled, and greatly limited, by Sneh and his allies. But in face of all, the people have spoken and they have spoken for Canaan. Marches, swelling party member numbers and protests against a return to the old corrupt zionist dictatorship have shown that the people want something new! And now they'll get what they want.\nBut behind the scenes, even more important work is taking place. Revolution cannot succeed without a strong vanguard. And indeed, our brave men in the Shin Bet have advanced our position to preeminent dominance. Arrests of religious reactionaries, mysterious deaths and removals of many party and military middlemen, soon to be replaced by our allies. They all readied this moment. In a swift movement our agents and allied military units are taking over, as militiamen are in every corner and every street. Most surrender without a fight.\nThe last vestiges of reaction in Jerusalem are now falling, Sneh and his close clique arrested as thousands march for Hebrew Arab unity, for authentic Peace and Freedom, for National Revolution."
CANAAN.12.a: "History waits for no man."
CANAAN.13.t: "The Hebrew Ideal"
CANAAN.13.desc: "Sneh sits in a war room in the Knesset, around him is his cabinet, in front of him a red phone, a laptop, and a projector showing a collage of live bodycam footage from an EDF special operations unit. For the last few months from this very room Sneh organized crackdowns on the canaanites. The alliance with Bar-Lev was one of convenience to get rid of Ramon and his anti-revolutionary ideas, to secure the state, but in return the Canaanites now get to run around the streets blabbering about their \"new nation\", they used to atleast. For the last few months Sneh's organized crackdowns on the revisionist Canaanites, starting online with their sites taken down and posts censored, things would get heated but the Canaanites never bite back. Slowly they were isolated, grouped up into pockets to be eliminated on charges of \"Terrorism\" and \"Colluding with the enemy\". It's easy to call them arab agents, when they won't stop yapping on about their pan-semitic bullshit.\nRight now, the room's quiet as all eyes were on the screen, with only the piercing sound of sirens from the live-feed filling the room. Then the car stopped, the feed now shows the Canaanite movement's last stronghold. Officers barking orders, militiamen with the hated blue and red armband either shooting or fleeing, a small armored detachment run over a barricade adorned with the Canaanite flag. The small skirmish continues into the building until the operatives reach a blast door, a safe room. The squad quickly set up breaching charges, as the door falls, a familiar voice was heard, it was Bar-Lev. \"I surrender! don't shoot!\". The operatives tackle him to the ground before cuffing the hated revisionist and dragging him out.\nCheers fill the room as the Mapam partymen celebrate their victory. On the projection, reports from officers pour in along with other live-feeds of Canaanites being arrested, or otherwise eliminated. The coup succeeds. As the cheers die down, Sneh stands up."
CANAAN.13.a: "Tabenkin's vision has been restored!"
CANAAN.14.t: "Building Bridges"
CANAAN.14.desc: "Language barriers were a problem. The new drive for Pan-Semitic unity had led to the mobilisation of combined Arab-Hebrew battalions. But the Hebrew of those Arabs from small villages was still not great, and tensions weren't always low. As such, action was slow, so instead of combat, such battalions were often assigned to develop infrastructure works.\nIn one Palestinian village near Jericho, the lot was hard at work. This time, building a railway to connect poorer Arab villages with other important cities. There was much chatter about among the villagers. A few looked on with hope, others seemed to be distrustful. Others yet conversed, mainly with the Palestinians within the battalion.\nBut as the weeks went on, and more and more work was done, in the hearts and minds of the village, the Canaanites standing had grown quite a bit. Among the Hebrew soldiers, the hospitality of the villagers slowly softened years old prejudice and fear."
CANAAN.14.a: "At least the trains run on time"
CANAAN.15.t: "From Swords to Ploughshares"
CANAAN.15.desc: "As the hot Sun is scorching the hills along the Judean desert, moans and complaints are heard from a Youth brigade planting trees as part of the state’s new counter-desertification program. Ever since the consolidation of all youth movements under the new Canaanite direction, many such programs are promoted, with a focus on joint participation of Hebrew and Palestinian youth alike. \n\nAmong them is Eli, a Hebrew high schooler now bemoaning his task of planting trees in the desert. When the idea was presented to his class it seemed to him like a fun way to get away from math class. Next to him is Imad, an arab kid who also had a similar thought process while volunteering to join the activity. \n\n\"God this place is so fucking hot\", muttered Eli, much to the agreement of Imad. The boys continued to talk and complain about the heat, until Uri, the instructor, interrupted them; \n“It may be difficult now, but think how in the future, thanks to your hard work, people will have trees to sit in their shade, to find shelter from the scorching sun. Your forefathers may have sacrificed their lives in pointless brother wars. But the sacrifices you are making today are no longer in vain - you are cultivating the better homeland of tomorrow.” The boys nodded in agreement, but soon after Uri turned away started ridiculing him and running gags and impersonations of the various instructors. They wouldn’t admit it, but his words did resonate with them - the Labour somehow felt lighter now. \n\nThe boys looked down on the saplings they just planted, sitting calmly in this soil, watered and fertilized with the blood of their forefathers. \n\nPerhaps some day the entire region could find the sacred peace by their example. Only then shall they, too, beat their sword into ploughshares, only then,"
CANAAN.15.a: "Will the Fertile Crescent be Fertile Once Again!"
CANAAN.21.t: "On the Semitic Express"
CANAAN.21.desc: "Imbarek had left Benghazi a couple hours ago. The High-speed railway he was on had only today opened up to the public and he was swiftly approaching El Alamein.\nThe train was on a steady road toward Damascus. A journey which just a few years ago would have been inconceivable. But now, all the land from Tripoli to Cairo to Jerusalem to Beirut to Damascus were all part of a brotherhood of friendly semitic states.\nAs he stared out the window, Imbarek soaked in the glory of it all. How far has Libya come? How far has Shem come? Pretty soon, he would be in Jerusalem, and not as a conqueror or hated foreigner, but as a welcomed brother. Who could imagine this at the start of the decade?\nAnd if all this could be achieved in just a few years? What splendour awaits the Semitic people in its future?"
CANAAN.21.a: "The actuality of peace."
CANAAN.22.t: "The Hashemite's Death Knell"
CANAAN.22.desc: "In the quiet village of Feifa the sun hung over the sky and beat down over its inhabitants. Two of them, Muhammad and Suleiman, were inside a teahouse. Muhammad was holding a newspaper while Suleiman focused on the nearby radio. \n\nBoth of them jumped when the radio started to screech and static filled the air. It continued for a minute when a voice came on, speaking in Arabic. \n\n"Palestinian Semitic brothers! Those of you trapped within the Hashemite jail of Jordan! Listen! The time of your freedom is at last at hand. The divine liberating forces of the Canaanite National Revolution is soon coming to smite the petty kings and Anglo imperialists who so cruelly separated our nation for so long.\n\nWe call upon you, Palestinian Brethren, to take arms in your hands. Your brothers from across the sea are finally coming to end the division of the land. Rise up and be free!" Muhammad got up and turned the radio off.\n\nSuleiman complained. Though he was old, he said that he was interested in what they had to say. Muhammad scoffed. He always knew of Suleiman's radical streak. "I hope that doesn't mean what I think it means." He said.\n\n"I'm too old to fight Muhammad." He replied. "But those are no longer the filthy Zionists of the past! The Palestinians are marching with them too! I remember the young times of Nasser… the hope I had. Anyways. Now they're back. Who knows what will happen?"\n\n"I could report that for treason, you know."\n\n"You could. But the government already knows. I never liked those Hashemites, puppets of the Brits. They've got bigger problems now than an old man who can't lift a gun."\n\nMuhammad sighed and went to sit back down."
CANAAN.22.a: "What a load of riffraff"
