 ISP_70_years_of_mapam_rule: "70 Years of Mapam Rule"
 ISP_70_years_of_mapam_rule_desc:0 "In 1951, the various patchworks of Labor Zionist, Socialist, and Communist parties united under the banner of the Mapam, the United Workers Party. 70 Years have passed since then, and much has changed. The world has changed much since those days, but we continue to uphold the principles of Socialism and demonstrate that now, like then, the toiling people of this land forge their own destiny." 
 ISP_a_brand_new_year: "A Brand New Year"
 ISP_a_brand_new_year_desc:0 "A new year is upon us, which means that new challenges lay ahead. New obstacles to face, new enemies to fight, but also new gifts to cherish. Our beloved Republic of Labour is sure to face them diligently, assuring the entire nation that our leading vanguard will always put its security and prosperity first."
 ISP_14th_five_year_plan__year_2: "14th Five Year Plan - Year 2"
 ISP_14th_five_year_plan__year_2_desc:0 "Our economy necessitates renovation, and to that end, we have created guidelines in order to better our economic presence. In spite of much change and adaptation of our economy over the years, our 5 year plans maintain innovation and growth, helping coordinate efficiently our socialist state-market cooperation."
 ISP_delegation_to_moscow: "Delegation to Moscow"
 ISP_delegation_to_moscow_desc:0 "Commemorating the 70th anniversary of the establishment of our United Workers Party, we will send a special delegation of our best diplomats to our good friends in Moscow, assuring them that the course of socialism in our nation is steadfast, and making sure to establish good relations with the new government of Sergey Kurginyan."
 ISP_maintaining_the_national_front: "Maintaining the National Front"
 ISP_maintaining_the_national_front_desc:0 "Our United Workers Party does not govern alone. With it stands the National Front of all progressive & national parties and mass organization of Eber, demonstrating that despite our partys vanguard role in the construction of socialism, our government is a truly national one, representing the interests and opinions of our entire nation. We must maintain good ties with our sister parties, in order to maintain stable and correct governance."
 ISP_for_a_lasting_peoples_friendship: "For a Lasting People's Friendship"
 ISP_for_a_lasting_peoples_friendship_desc:0 "Our friendship with our ideological brethren is righteous and unbreakable. Our Socialist brothers and sisters helped our nation even before our independence, aiding our struggle against the British Imperialist, and since then stood by us at most important moments of crisis. The goodwill of the people stands firm against tyranny, and we are not alone in our struggle."
 ISP_balancing_the_budget: "Balancing the Budget"
 ISP_balancing_the_budget_desc:0 "Although our economy is potent and strong, it must be well-directed. We must direct state spending where it’s most appropriate and necessary. Important aspects of the nation such as: education, industry, or health must be well-orchestrated in order to produce a better land for all of us."
 ISP_reassure_the_military: "Reassure the Military"
 ISP_reassure_the_military_desc:0 "It is no secret that, within the military, nationalist and anti-revisionist forces exist. While the protectors of our nation are of course strongly allied to our grand patriotic government, some have voiced concerns and dissatisfaction. We must reassure them that our government is truly patriotic and socialist in character."
 ISP_all_is_good_in_the_land_of_zion: "All is Good in the Land of Zion"
 ISP_all_is_good_in_the_land_of_zion_desc:0 "We have long accomplished the zionist mission of building a safehaven and a true home to the jewish people, and much more - we have created a prosperous socialism for our nation. We have fought to defend our land, we created peace, we brought prosperity and stability to our people. None can disrupt the course of socialism in our land."
 EFRAIM_SNEH_ISP_TITLE: "Director of the Shin Bet\n\nIdeology: £reformist_socialism_texticon Left-Wing Nationalism"
 EFRAIM_SNEH_ISP: "Efraim Sneh"
 ISP_ending_unemployment_dec_cat: "Road To Ending Unemployment"
 ISP_public_works_campaign: "Public Works Campaign"
 ISP_golan_campaign: "Golan Heights Public Works"
 ISP_galil_campaign: "Galil Public Works"
 ISP_samaria_campaign: "Samaria Public Works"
 ISP_ramallah_campaign: "Ramallah Public Works"
 ISP_hebron_campaign: "Hebron Public Works"
 ISP_negev_campaign: "Expanding Negev Heavy Industry"
 ISP_jerusalem_campaign: "Developing East Jerusalem"
 ISP_coastal_campaign: "Developing Coastal Periphery"
 ISP_general_secretary_ramon: "General Secretary Ramon"
 ISP_general_secretary_ramon_desc: "General secretary Haim Ramon has emerged victorious as the new Prime Minister of the Hebrew Republic. He and his liberal wing of Mapam will try to save the Republic from the path of slow destruction, together with the aid of the Technocratic league and some other smaller sub-faction that oppose the overwhelmingly conservative nature within the party. Ramon will have to navigate throughout the complex political structure of the National Front while carefully balancing between the coalition’s desire for changes and the establishment's pre-existing authority. Everything is up to him to decide on his next move."
 ISP_the_long_road_to_democracy: "The Long Road to Democracy"
 ISP_the_long_road_to_democracy_desc: "Freeing Eber from decades of chafing rule by decrepit bureaucrats, and the oppressive systems of Communism, will not be a very easy task. Creating a true liberal democracy here in this part of the world will be a long and hard road. We will likely alienate Moscow, but for democracy and freedom, that is a price we will be willing to pay."
 ISP_general_secretary_simhon: "General Secretary Simhon"
 ISP_general_secretary_simhon_desc: "For too long has the Hebrew Republic been torn apart from inside out by geriatric conservatives, and ultra-nationalists. But with the coming of our new government, we can break open the floodgates of progress. Always looking forwards in this age of accelerating technological gain. We will make sure the Jew is not left behind."
 ISP_always_forward: "Ever Forward"
 ISP_always_forward_desc: "Much of the world has practically entered a new age of technological progress. Even in Albania unique and innovative approaches to AI are being employed. It simply will not do for us to continue being left behind. We must march ever forwards then. Uproot the foundations of factories and stores. Bring in the fountains of chrome! Eber enters the future today!"
 ISP_promises_of_reform: "Promises of Reform"
 ISP_promises_of_reform_desc: "The call for modernization echoed all across the land of Eber. From the poors in the street of Gaza to the marginalised notion of Arab, everyone here has gathered and rally their voice for freedom and efficiency against the tyrannical leadership under Ehud Barak. And now with the backing of the people, the Reformist clique has effectively taken control over the popular front. It’s time we give back our promises to the people."
 ISP_to_salvage_an_outdated_system: "To Salvage an Outdated System"
 ISP_to_salvage_an_outdated_system_desc: "To say that the current system is outdated is an understatement. The political machine that drives our nation running has been corrupted by greed and nepotism from the inside out. These disgusting behaviors must be stopped at all cost, all the way from the top to bottom. However the core principle of the system itself shall remain the same, albeit with new methods being implemented to help liberalize our administration, keeping in touch with the rest of the world."
 ISP_dissolving_the_partystate: "Dissolving the Party-State"
 ISP_dissolving_the_partystate_desc: "With us finally arriving at the peak of the mountain, it's time to cut down this rotting old tree of tyranny for good! Let’s begin first with uplifting many restrictions upon the so-called “troublemaker” parties that oppose the same authoritarianism as we do and legalize their political activities such as social media advertisement, holding opinions in the council, rallying a protest, etc. Secondly we are going to replace the senile old guard and their connection inside various institutions with young and energetic officers. Even if a few of these decisions will heavily backfire in the end, we hope that this will guide the Republic in the right direction."
 ISP_easing_censorship: "Easing Censorship"
 ISP_easing_censorship_desc: "Censorship has been a major criticism in the government. Many people have pointed out the flaws in our design time and time again and nobody from the old guard listened and worse silently discarded them to the sideline. To not repeat the same mistake of the previous generation, this ever-present media censorship must be put down so that a new voice in the council can be heard and help the republic into a better path than it currently is."
 ISP_cautious_privatization: "Cautious Privatization"
 ISP_cautious_privatization_desc: "Despite many complaints from the radical reformist side of the coalition. Privatization is a dangerous concept that cannot be taken lightly while it’s indeed true that we need to loosen a tight grip over young adolescent enterprises, but like a careful parent that we are, can’t let our children stray away from the path of good toward destructive behaviours."
 ISP_cutting_needless_weight: "Cutting Needless Weight"
 ISP_cutting_needless_weight_desc: "The Hebrew Republic is still maintaining various bloated projects going nowhere and old relics of begone times, which are now taking a huge toll on our GDP and resources. This must change right away, by cutting down these useless and inefficient expeditions, transferring responsibility over some to the private sector and funds to balance our bloated budget will greatly benefit our economy."
 ISP_antibureaucratic_campaign: "Anti-Bureaucratic Campaign"
 ISP_antibureaucratic_campaign_desc: "The Bureaucratic structure of our government has been nothing but a rotten sea of countless paperwork and paperwork that stretches out into infinity, making it harder to navigate each year. Not to mention many of the current bureaucrats who are supposed to clean this mess in the first place, would rather indulge themselves in luxury at the expense of our government administration. We must fire these useless parasites at once!"
 ISP_shutting_simhon_up: "Simhon's Musings"
 ISP_shutting_simhon_up_desc: "The Ramon government is a coalition of various reformist political factions that participate in an effort to modernise this republic. This has resulted in our triumphant victory over the rotten status quo. That being said, having been chosen as leader of the coalition came with many of its own benefits and troubles, one of them being the inner conflict between us and the Technocrat clique of Simhon. Despite our disagreement, Simhon himself has proven to be a valuable ally in our crusade against corruption and inefficiency but many within our cabinet started to wonder how long we can keep this alliance going now that we have solidified our position over the council. Should we continue to work together as it is or break away from the rest entirely?"
 ISP_calling_a_constitutional_convention: "Calling A Constitutional Convention"
 ISP_calling_a_constitutional_convention_desc: "If we are to kill this cancerous beast that infested our administration, we must first strike into the heart of the beast itself, The Constitution! The Constitution was once a perfectly normal constitution like many others but over time has been distorted and subverted by various bad actors who seek to destroy the republic from the inside out. Through constant manipulation of politics over the People’s council, many reform policies were blocked left and right, never to see the light of day. It’s indeed the time for us to redefine a new constitution in order to lay down this beast to rest."
 ISP_enshrining_civil_liberties: "Enshrining Civil Liberties"
 ISP_enshrining_civil_liberties_desc: "Free speech is an essential component for open society. All across the first world, everyone agrees that freedom of expression must be protected and safeguard for as long as one does not threaten to destroy it. So too does our nation must adopt this new conation. Let the people sing, let the people dance, let the people speak up their desire for freedom!"
 ISP_reforming_the_electoral_system: "Reforming the Electoral System"
 ISP_reforming_the_electoral_system_desc: "The constant manipulation of the Electoral system by crooked officers had been a big hindrance toward our policies for a quite long time. By concentrating many districts within their thumb and spreading out rivals' voting base, this had led to undemocratic election wins for the old guards every year despite various attempts to undermine them. To ensure there will be no more “Gerrymandering” in the Electoral Districts, We implement a vast scale of reforms by adopting either nationwide representation or presidential system. Both of which will express a much fairer and equal system than the previous incarnation."
 ISP_zionism_before_socialism: "Zionism Before Socialism"
 ISP_zionism_before_socialism_desc: "Zionism and Socialism had been alongside each other ever since before the birth of the republic itself. However, the trajectory of our economic situation has left us not being unable to follow the official guideline of Socialism anymore. Instead we will have to look more abroad into the direction of free competition rather than supervision under the State. Many old guards will be understandably upset by this and will occasionally throw a bark or accuse us of “betraying” the republic but they themselves must understand that our country will be for Zionism first and Socialism as secondary."
 ISP_a_pragmatic_compromise: "A Pragmatic Compromise"
 ISP_a_pragmatic_compromise_desc: "It’s evident to us that these efforts to help modernize our country cannot come to pass without the help of many friends we had made along the way. Despite some minor differences in classes, status or policies, we are all united in this single common cause to reshape the republic from a stagnating system toward a more free and prosperous society. The coalition that brought everyone together here is the key to all of these but also a sign of friendship between fellow reformists that we cannot simply throw away for small and petty ideological reasons! So let’s talk, negotiate as well as compromise in order to bring back unity instead of bickering over who should get the biggest slice of the cake."
 ISP_uncompromising_on_liberty: "Uncompromising on Liberty"
 ISP_uncompromising_on_liberty_desc: "There’s many expenditures and regulations that are left unchecked by the government, all of which are causing a huge harm to the economy. This must not and will not continue any longer, We will cut them out immediately, swiftly and not relying on others as that would mean requiring even more time, effort and plans to go through. We will have to do with what we have here and end this government-owned tyranny once and for all. Absolutely many of our partners will be outraged by this, especially Simhon himself. We cannot afford to lose this opportunity and bend to any soft half-hearted “Liberalization”, it’s either going full speed with reformation or else there won’t be anything left for this great country."
 ISP_dissolution_of_the_national_front: "Dissolution of the National Front"
 ISP_dissolution_of_the_national_front_desc: "The National Front was a tool used by old guards to assert unfair advantages over the people’s council ever since its creation, but now with the toppling down of the establishment by the grand coalition of young reformists. The National Front lies in our hands to do as we see fit. To prevent any further discrimination and interference within the council, The National Front will be dissolved. No question asked and no answer needed. The National Front is too powerful to be used according to the principle of the Republic."
 ISP_entrench_eternity_clauses: "A Genuine Separation of Powers"
 ISP_entrench_eternity_clauses_desc: ""
 ISP_appeasing_the_military: "Appeasing the Military"
 ISP_appeasing_the_military_desc: "The ongoing crusade against decadency has reached much wider eyes and ears of the top brass in Military HQ. It was estimated that sooner or later they would catch wind of it, but now that it's happening, the military has begun consolidating to intervene against Ramon’s government. In the worst case scenario this would result in a huge crisis that would turn into a disastrous coup, reverse everything back to zero and deprive us of any progress that could potentially save the Republic from extinction! To counter this, we will have to directly contact them for an agreement between the two of us while convincing all these reforms are necessary for the continuation of our Republic’s life and blood. Once all the talking is done, we will shake hands with each other then depart in our separate ways."
 ISP_an_equitable_eber: "A New Name, For A New Era?"
 ISP_an_equitable_eber_desc: "Now that everything are in order, let’s us begin to process of referendum regarding our national identity that had been brought up time and time again inside the council, many of whom wishes to change the republic name for a fresh new start, leaving the legacy of Mapam behind while on the other hand there are some who wants to keep the name as it already is, suggesting that the name “Hebrew Republic of Labour'' had stuck within the heart and mind of citizens, that changing it would drastically changes their culture. We now are presented with two options, either changing it or keeping it for what it is. What shall it be?"
 ISP_appeal_to_secular_liberals: "Appeal to Secular Liberals"
 ISP_appeal_to_secular_liberals_desc: "Secularism has gotten something of a bad name among some of the people within Eber. They raise their eyebrows at the suggestion of de-emphasising the Jewish character of the nation. But our base now consists of a number of  liberals who prefer a secular character for the state. Alongside this, many people, especially Askhenazis, have grown annoyed by the old conservative social laws of the establishment. They call for getting the government off their back and to embrace the liberal values of the West, even at the cost of our relations with Moscow. To appeal to them, though the nationalists will no doubt complain, we will make some concessions. Let’s free up the Kibbutzniks to follow market-oriented policies, should they wish. Let’s push down social conservative policies pushed forward by the rabbis."
 ISP_ratifying_the_constitution: "Ratifying the Constitution"
 ISP_ratifying_the_constitution_desc: "After long discussion on many topics and agenda along with careful reexamination of the passages making sure that nothing is written in any precise manner that contracdict with main guiding principles. The new constitution has been finalised and is approved by the judiciary branch of our government. Now all that is left to make sure that the Constitution will be put into practice and be accepted by the general public and if not? We will just have to punish anyone who isn't law-abiding citizens. "
 ISP_promise_new_elections: "Election Season's Nearing..."
 ISP_promise_new_elections_desc: "At long last we have successfully wiped out all traces of the corrupted and antiquated structure of the previous government. More than ever are people excited for an upcoming election that wasn't unfair and unjust as we proved to everyone and many naysayers that we indeed changed the Republic for the better. But it’s not over yet as there are still elections to attend and much work to be done. The Newly formed independent Herut led by Amir Ohana from the Populist Right are our main opposition for this year along with other fringe parties like the leftover hardline communists, independent Arab parties, liberal and orthodox parties both of which can be persuaded into coaltion. We’ll definitely win this."
 ISP_rallying_the_nationalists: "Rallying the Nationalists"
 ISP_rallying_the_nationalists_desc: "There’s many misconceptions currently within the general public.That our government is not loyal to our nation and is trying to erase the identity of our very culture itself. What a nonsensical thing to say! We have always been the Hebrew people and only doing this for the survival of our country. To quell these misconceptions, we need to intensify the nationalism activity in our government, starting by rallying nationalism sentiment among the populace as well as celerabrate our national heroes that help built this land of Eber."
 ISP_reinvigorating_the_state_machine: "Reinvigorating the State Machine"
 ISP_reinvigorating_the_state_machine_desc: "Bureaucracy has become bloated. Many politicians answer to no one. Managers have no accountability. We have to ensure this is changed. The machinery of the state must be filled with youth once more. Efficiency is key. If we are to develop and change and grow, the old must be left by the wayside."
 ISP_utilizing_unused_potential: "Utilizing Unused Potential"
 ISP_utilizing_unused_potential_desc: "For so long the Republic has been running low on competent officers from all across the whole departments. There’s too many mediocre at best, terrible at worst bureaucrats managing every individual affairs like holding everything together with a duct tape. To ensure that this house of cards doesn’t collapse, we must completely reshape the whole administration from the ground up and utilise every unused potential possible, bringing our productivity back and running again."
 ISP_fine_tuning_statemarket_cooperation: "Fine Tuning State-Market Cooperation"
 ISP_fine_tuning_statemarket_cooperation_desc: "Disputes over the state of the economy have been very dire indeed. Some call for renewed emphasis on planning, while others have called for essentially a return to Capitalism. As is often the case, the true answer lies in between. The market must not be left unchained and allow a reversion to capitalism. But the usage of price-signals and markets has great benefits. Drawing inspiration from Moscow’s market system alongside our new technocratic government is thus our best bet!"
 ISP_digitization_drive: "Digitization Drive"
 ISP_digitization_drive_desc: "In order to guarantee efficiency and progress, it is necessary to digitise the entirety of the country. Automation has been shown to be perhaps the best path forward to ensure complete economic renewal and growth. In doing so we will not only achieve a new chapter of scientific progress, but also be one step closer to the realisation of socialism."
 ISP_backbone_of_the_nation: "For The Backbone of the Nation"
 ISP_backbone_of_the_nation_desc: "The Hebrew Republic has enjoyed her nice spot in the land of Fertile Crescent. However, for the last few decades our food production has diminished heavily from the period of stagnation the previous government refused to address to the public, outdated equipment still commonly used in rural farms. How pitiful it is for this fertile land to become barren and our nation dependent on foreign imports. A nation that cannot truly feed itself is never truly Independent! That’s why we must kick start agricultural production immediately."
 ISP_increasing_the_education_budget: "Increasing the Education Budget"
 ISP_increasing_the_education_budget_desc: "In recent years institutions dealing with education have been left at the wayside and neglected. To maintain a truly successful socialist nation, we must ensure that the youth are enlightened and educated. By directing funding towards education, for all citizens of our Republic, we will move one step closer to a truly enlightened nation!"
 ISP_21st_century_agriculture: "21st Century Agriculture"
 ISP_21st_century_agriculture_desc: "It’s true that our farming technology is too far behind from the rest of the world with many nations beating us in the competition. There’s no doubt that current agriculture is a disgrace to our national pride. To relegate this issue aside. Let’s begin contacting the farmers from all across the country to participate in the project. With the help of scientists we can reshape our agriculture from the backward and pitiful state to be a shining light for the whole world to see!"
 ISP_technocratic_appointments: "Technocratic Appointments"
 ISP_technocratic_appointments_desc: "Within the government there is much bickering. Reformists led by Ramon have been badgering us about our aversion to abandoning socialism. While it hasn’t been too unbearable, some argue that if this is allowed to continue it will only be a matter of time until they take matters into their own hands. The obvious solution would be, if we’re being blunt, to purge the reformists and ultra-liberals. Send them packing out of government, likely amidst shouts and accusations of autocracy. At the same time we would staff much of the government with technocrats, and facilitate early-retirements with officials suspected of being sympathetic to the Capitalist cause. However, doing so could of course turn the ire of some of the population, and many within the party find the idea controversial to say the least."
 ISP_investing_in_marginalized_communities: "Investing in Marginalized Communities"
 ISP_investing_in_marginalized_communities_desc: "The rule of more traditionalist Zionists in the past did very little to stem ethnic tensions. And despite our socialist character, one need only to look at the slums of Hebron and Jericho and at the skyscrapers of Tel Aviv and Jerusalem to see the disparity between the two. This has no doubt fermented chaos and radicalism among the marginalised. Let us seek to invest in their communities and build them up, so they can live as equals among the Jews!"
 ISP_promoting_innovation: "Promoting Innovation"
 ISP_promoting_innovation_desc: "They say necessity is the mother of innovation. And indeed, we have much need for it! Markets for innovation are all out there, and there are always new problems to solve. But geriatric rule in the past has looked down on bright minds and those pursuing R&D. Questions over practicality dissuaded them and broke the dreams of hundreds of innovators and tinkerers. The feeble minded fools! Yes, some will make mistakes. Yes some inventions will be dead-ends, but that is the way of the world! The kernels of great ideas must be allowed to grow. We cannot be dissuaded by the paranoia of a few lost shekels."
 ISP_purge_histradrut_radicals: "Purge Histadrut Radicals" #Histadrut not Histradrut
 ISP_purge_histradrut_radicals_desc: "The Histadrut under the centre-reformist clique has its own smaller subsection of young idealistic radicals or the old conservative seniles that are an obstacle to the path of modernization. The Young Radical are too idealistic and immature while the conservative senile are decrepit fools that won’t laid back and retire. These two groups must be dealt with accordingly and pave a way for sensible reformism."
 ISP_democratic_deregulation: "Democratic Deregulation"
 ISP_democratic_deregulation_desc: "Now that we have carefully privatised the economy to safely extend that the corporates can manage on their own without reliance on government’s assistance. The next thing to do on the list is to unrestrict old business laws that hinder their expansion. To do this let’s start with the smaller sector of young business owners first then gradually uplift everyone to be able to compete with the mainstream corporations."
 ISP_for_the_consumer: "For the Consumer"
 ISP_for_the_consumer_desc: "We have dealt with the regulation problem that plagued our nation and all that is left is to establish the first consumer protection legislation. This will ensure that our people can freely enjoy these commodities at safe hands and away from fraud business practices by shady corporations. While this may move our time and energy away from worker’s protection service to the consumer’s right, rest assured we will protect the two of them regardless."
 ISP_slashing_labor_laws: "Slashing Labor Laws"
 ISP_slashing_labor_laws_desc: "We have remodelled many different laws and practices that have restrained our economy to finally an end, but there’s still remnants of old Labour laws that haven’t been touching them yet. Now is the time to finally slashing down these regulations that were put in place by the old guard. This will surely improve our economic efficiency in the long run."
 ISP_state_directed_development: "State Directed Development"
 ISP_state_directed_development_desc: "The market cannot resolve everything. Pursuit of goals in the name of profit leaves many thousands on the wayside. Just look at what happened in America, before they fell into civil war of course. Gentrification, and the rupturing of impoverished neighbourhoods through the building of mega-highways.\nOur government is not one motivated by profit. It is motivated by the national interest of development and prosperity. Only it can pave the path to the progressive development of Eber, seeing the larger scheme of things rather then short sighted profit and leading the market towards the desired goals."
 ISP_the_infallible_bureaucrat: "The Infallible Bureaucrat"
 ISP_the_infallible_bureaucrat_desc: "The power of the bureaucrat is intolerable. We cannot allow unelected officials with no interest in governing based on what is right. Rather they pursue whatever is in their own interest. It is now time to replace bureaucrats with technocrats. Experts in their fields, alongside the usage of digitisation and new technology, will bring about a  streamlined and efficient future."
 ISP_reforming_the_kibbutzim: "Reforming the Kibbutzim"
 ISP_reforming_the_kibbutzim_desc: "The word “Kibbutz” itself means “gathering,\"  a gathering of people living together in a small communal town similar to that of a bee hive, with each member being assigned a role in society that they must adequately and subsequently contribute to. Despite this, Kibbutz all across the countries have suffered from neglected and improper care from members leaving to find a better life elsewhere or outdated agriculture techniques, which is our mission to remodel these beehives for the better!"
 ISP_ending_unemployment: "Ending Unemployment"
 ISP_ending_unemployment_desc: "In the street many men and women cried out in starvation, improvish, aimless, and worst of all, nowhere to call home. Such is the current state for the majority of our people. Simhon knows well that the only way to pull our brothers from the bottom of our society is to give them a new sense of hope, a revival, a new job which our government assigns them to so that they won’t have to worry about their day to day incomes or dying from starvation. This will help the people finally feel joy and happiness for the first time in their life that they will keep on working for the betterment of our Republic."
 ISP_hebrew_of_the_future: "Hebrew of the Future"
 ISP_hebrew_of_the_future_desc: "The great mind of our republic has now emerged from the depth of insufficient masses of mediocre. The Great Nation of Hebrew is now one of the forefront running of efficiency, progress and innovation! No longer will our people lose their hopes and dreams into a pile of rubbish of yesteryear, no longer shall our names be laughed at and ridiculed by the rest of those who despise our existence. We will thrust ourselves like a rocket, fly high into the sky, above the stars to reach heaven and the future!"
 ISP_efficiency_first: "Efficiency First"
 ISP_efficiency_first_desc: "Corporation, Company, Cooperative or whatever you call them. They have always been existing and operating from inside and outside of the state as long as their royalty resides within the people itself, but as time marched on their manufacture devolved gradually and the quality went down the hill. In order to maximise the full proficiency of our business. We must start overhauling the whole sector. Any under-performing State Corporations will privatise and their assets sell to independent contacts. This goes the same as well with private entities that are too incompetent at managing business, we will step in their affair and nationalise their resources if deemed necessary."
 ISP_agricultural_spearhead: "Agricultural Spearhead"
 ISP_agricultural_spearhead_desc: "It’s not enough that we only become self-sufficient with Agricultural production, No! We must continue to push forward even more, innovate our commodities not just for the sake of Hebrew people of today but tomorrow more people will be born and more foods will be needed to feed. To do that we must hire foreign expertise from our long-time friends the Soviet Union and help us analyse the flaws in our design and find a way to fix it."
 ISP_peace_through_labor: "Peace Through Labor"
 ISP_peace_through_labor_desc: "To establish peaceful relations with the Arabs, improving their material standing in society is one of the best things for us to do. Much of the Arab youth remains unemployed, and with the new reforms to the Hebrew economy."
 ISP_hebrew_economic_miracle: "Hebrew Economic Miracle"
 ISP_hebrew_economic_miracle_desc: "For the first time ever our GDP has finally recovered from stagnation, the red line that keeps going down and down has turned into green progressively upward even with minor down turns along the way. The Hebrew Republic has rejuvenated her spirit, filled with determination to keep on living despite all odds and obstacles against her and her people."
 ISP_free_eber: "A Free Eber"
 ISP_the_coup: "The Coup"
 ISP_the_coup_desc: "Far too long has Ramon and his capitalist pigs managed to run our government to the ground and turn it away from serving the proletarian into enslavement under the tyranny of capital, with the pretence of “Modernization” and “Reforms'' that are nothing but lies to distract us from the real enemy, the international bourgeoisie who is plotting to take over our nation! We say no more of this so-called private property and nonesensical free market reforms. The time for action has come for us to restore order over this broken nation."
 ISP_proclaim_the_government_of_national_salvation: "Proclaim The Government of National Salvation"
 ISP_proclaim_the_government_of_national_salvation_desc: "With everything under the control of the military and that wild snake Ramon out of the picture. We must begin establishing the National Salvation Government and broadcast our truth to the public in order to stabilise the sitaution. With the help of director Bar-Lev and commander Sneh, this shall be done quickly.  There’s still too many citizens confused with the whole ordeal and many traitors running away from our judgement. The traitor Ramon left the nation at a dire state. There is much to be done."
 ISP_rousing_the_masses: "Rousing The Masses"
 ISP_rousing_the_masses_desc: "Disarray and Confusion runs on the streets of Tel Aviv today, as the majority of the populace have no idea what’s going on with the chaos surrounding them. A loud applause cheering for the military on one side and outright cry for democracy on the other, leaving the rest of neutral people in the centre. Thus we must find a way to gain the support in the middle, which begs the question. What is the best way to propagate them to our causes, a fresh start national revolution or the authentic socialist patriotism of old?"
 ISP_emergency_measures: "Emergency Measures"
 ISP_emergency_measures_desc: "Desperate time calls for desperate measures, and for us to stop this looming disaster in our nation, we must completely disregard the usual protocol that was put in place and empower our friends in the army to restore order. Many will look at us with caution eyes or completely denounce our actions as illegitimate and undemocratic, but this is simply the only way to put out the fire."
 ISP_dealing_with_protesters: "Dealing With Protesters"
 ISP_dealing_with_protesters_desc: "Masses of university students and liberal activists rally outside the government building. Calling for the end of martial law and military government. If this parade keeps going, it might become a legitimate threat to our regime. Best to deal with them early on, with that presents two options. We can either use brute force and beat down these protests as suggested by Strong Eber or use our intelligence Shin Bet and destroy the movement from within as recommended by Cannanite. Which plans shall we proceed?"
 ISP_youthful_revolution: "Youthful Revolution"
 ISP_youthful_revolution_desc: "The future lies within the new generation of our blood. It’s been apparent to us that our Hebrew identity is not enough to sustain the country itself, let alone the diverse groups of people who reside in our nation. We need to transform ourselves into something new and beautiful but at the same time calling to our collective past that is shared by many of us. The Ancient Cannanite culture is exactly what we need to unite Hebrew and Palestine under a single nationhood. No more infighting, No more bloodshed, the unity of the nation must prevail!"
 ISP_tabenkins_patriotism: "Tabenkin's Patriotism"
 ISP_tabenkins_patriotism_desc: "The flaws of the new Cosmopolitan regime has not just been its betrayal of socialist ideals, but its increasingly anti-patriotic identity. Moving swiftly away into a globalised world, we risk losing all of our identity. Of no longer being Hebrew, but rootless cosmopolitans. \nTabenkin’s patriotic ideology was what this state was founded on just as much as Communism. Any attempt at deviation must be smothered!"
 ISP_antibritish_rhetoric: "Anti-British Rhetoric"
 ISP_antibritish_rhetoric_desc: "The reaction against our government is really well to be expected, but what we didn’t expect however is how tough it is to crack down on these damn protests. There’s only one possible explanation on why they are strong in the first place… someone must support them behind the scene, and who else is to blame but none other than our eternal enemy, the Anglo! We must remember and venerate the continuous struggle of our people against Anglo Saxon Imperialism, be it our struggle for independence from the British colonizers, our wars of survival against British backed Arab reactionaries, or the great international struggle for socialist and freedom of peoples against the forces of the imperialist capitalist west."
 ISP_brute_force: "Brute Force"
 ISP_brute_force_desc: "Nothing is better than using our own baton to beat down these protestors spreading their capitalist propaganda on the university and other public spaces. Life is hard for many of us, as we know it, but to ensure no foreign will ever meddle their hands in our politics and the continuation of Hebrew existence. We must keep our hands dirty and use our revolutionary violence to curb stomp out all these foreign backed traitors! Not a single one of them shall remain and destabilise our country!"
 ISP_shin_bet_operations: "Shin Bet Operations"
 ISP_shin_bet_operations_desc: "Sometimes it’s better off to deal with things… subtly and smoothly. While there’s no doubt that physical force can be a good way to stop the protest from going out of control but alas, who to say sowing seeds of mistrust, confusion and infighting among the dissidents isn’t a good idea? Let their movement die down on their own like a dwindling light in the bonfire instead of pouring more gasoline into it."
 ISP_calming_the_waters: "Calming The Waters"
 ISP_calming_the_waters_desc: "Choppy water comes and goes like human life, which could be said the same with our republic struggling for the right of our own existence on the world stage. With the protests finally calming down, now is the time to rehabilitate the protests and rebuild everything to the proper state of affairs. Peace has been brought to our nation again."
 ISP_purging_the_party: "Purging The Party"
 ISP_purging_the_party_desc: "It’s clear now that the tense alliance between the two factions inside the military cannot go on any longer. Either one of them must go, which begs us a question. Who shall we side with, The Youthful Semitic Action who want to bring back the Canaanite identity to a new era or The Strong Eber who wish to bring back the authentic Marxist-Leninist ways of the old republic?"
 ISP_solving_the_contradiction: "Solving The Contradiction"
 ISP_solving_the_contradiction_desc: "The main driving forces of the anti-capitalist revolution against the liberal reformists are divided in two. On the one hand, large parts of the army have rallied behind Sneh and his anti-reformist conservative tendencies. Many trust his plans to bring back the Republic to the ideology of the old guard Communists.\nOn the other hand, within the internal security forces and secret services there are many sympathetic to the growing Canaanite movement. These Pan-semitic nationalists are certainly patriotic and are certainly socialist, but will certainly shake up the country quite a bit. The differences between the two groups were kept quiet at first. But with the revolution secured, we will have to see who will be fit to lead."
 ISP_reformist_coalition_dyn: "Reformist Coalition"
 ISP_last_stand: "Extreme Measures"
 ISP_free_eber_dyn: "Free Eber"
 ISP_uncompromising_on_liberty_dyn: "Uncompromising on Liberty"
 ISP_reconciliation_through_education: "Reconciliation Through Education"
 ISP_reconciliation_through_education_2: "Reconciliation Through Education"
 ISP_reconciliation_through_education_3: "Reconciliation Through Education"
 ISP_reconciliation_through_education_4: "Reconciliation Through Education, Peace Through Labour"
 ISP_general_secretary_ashkenazi: "General Secretary Ashkenazi"
 ISP_general_secretary_ashkenazi_desc: "Following the ousting of Ehud Barak, the new general secretary, Gabi Ashkenazi, represents a new generation. A man, teeming with patriotism, eager to serve his country. Having an impressive military career to back his presence in office, the trust of the people resides in his ability to lead and conduct the nation effectively. Even in the face of public discontent, our nation shall prevail."
 ISP_aftermath_of_the_scandal: "Aftermath of the Scandal"
 ISP_aftermath_of_the_scandal_desc: "Whatever happened in regard to Ehud Barak is now dust, ashes to the wind. At least in the eyes of the government. But the people have a different opinion of the matter, many are manifesting great anger, as the stain left by that terrible event stands in their minds as indelible. It is therefore necessary to quell their minds and their anger. "
 ISP_appeasing_the_masses: "Appeasing the Masses"
 ISP_appeasing_the_masses_desc: "Hosting distractions and buttering in the public is crucial to avoid anarchy. As we speak, unrest in the streets is evermore present, and to that end, softening the public’s perception could be and is a good idea."
 ISP_distance_ourselves_from_barak: "Distance Ourselves from Barak"
 ISP_distance_ourselves_from_barak_desc: "Barak’s legacy is one of shame, our new stance on the matter must be to completely distance ourselves from that corrupt fool. He has done far too much damage already to even be considered as nothing more than a man with no name."
 ISP_condemn_corruption: "Condemn Corruption"
 ISP_condemn_corruption_desc: "Corruption is what has caused all of this. Corruption is the main antagonist of this horrid situation, and it shall be condemned for it. It is necessary to encourage the people to resist against such feats of wickedness. No more will we be brought to our knees by events such as this."
 ISP_purge_scapegoats: "Purge Scapegoats"
 ISP_purge_scapegoats_desc: "Every crime has a perpetrator, and in this case, we know full-well who did this. The ones responsible for this disgusting abuse of power shall be mercilessly and rightfully punished as the evil forces behind the current state of the nation. The country is simply overflowing with traitors, and for this we must punish them. We must work our Labor against corruption."
 ISP_maintaining_the_course: "Maintaining the Course"
 ISP_maintaining_the_course_desc: "The current path of our land is treacherous, but our destiny is pure. We must maintain order at all costs and conduct our nation to a better future, defeating the wicked and preserving our heroes. Our people believe in the power of man, and this belief will not falter with our government."

 ISP_crisis_at_home: "Crisis at Home"
 ISP_crisis_at_home_desc: "Problems infecting the interior of the Hebrew Republic of Labour are among the most severe. Most empires after all have fallen from the inside, and not the out! Dealing with any potential sources of instability is our top priority."
 ISP_the_gulf_revolution: "The Gulf Revolution"
 ISP_the_gulf_revolution_desc: "There is a spectre haunting the Persian Gulf. The spectre of Communism! The idiotic Arab bourgeoise within the gulf have for so many years imported what amount to slaves from across the world, but primarily the Indian sub-continent, and believed that they would never feel any repercussions for it. They have sowed and are reaping the whirlwind. The Communist Kafala revolt must receive all of our aid. We, brothers in Communism, cannot sit idly by and see this revolt felled!"
 ISP_aiding_the_kurds: "Aiding the Kurds"
 ISP_aiding_the_kurds_desc: "The brutal fascist rule of the Ba’athists in Iraq has been thoroughly shaken. Ever since the 2010s, civil war has wracked the country and many beasts have risen with it. Not only are the successors of Saddam Hussein fighting, but brutal theocrats aligned with al-Qaeda have also risen and are terrorising the populace. Elsewhere, Turkish backed forces seek to dominate the region and further Turco-Imperialism in Mesopotamia.\nThere is one beacon of hope here however. The Kurds in the North are a shining light in the darkness. By funnelling them weapons and aid, we can try and preserve their independence against their enemies and potentially gain a useful ally in the region."
 ISP_united_against_arab_reaction: "United Against Arab Reaction"
 ISP_united_against_arab_reaction_desc: "The overwhelming majority of Arab states, especially all those that border us, are foaming at the mouth with reaction! Syria may have felled the Ba’athists, but their rule has been replaced with nationalists and Islamists who aid and abet groups like al-Qaeda. Jordan is ruled by a corrupt absolute monarchy and Egypt is not much betterialist allies in the region are the vanguard against reaction. We must unite, and remain united, against any and all forces of fascist reaction to the unstoppable force of Communism!"
 ISP_and_afar: "And Afar"
 ISP_and_afar_desc: "The revolutions turbulent as ever and we cannot get far at all if we only look inside. To secure ourselves we will need to assert ourselves abroad. Be it nearby, to gain allies and keep our enemies in check our far away to influence the outcomes of key geopolitical events, ensuring we remain a key player on the world stage."
 ISP_america_aflame: "America Aflame"
 ISP_america_aflame_desc: "The citadel of Capitalism has fallen at last! America lies in a state of complete collapse and anarchy. A massive variety of groups have risen up to assert themselves. Worryingly, open Neo-Nazis are among them and are gathering strength. The appearance of Nazism on the global stage in the form of a superpower, broken though it may be, is a terrifying prospect for us. We have not, after all, forgotten the terrors of the Holocaust and the millions who perished within it.\nNot only to protect the Jews in America who may be at risk, and not only to ensure they may arrive at a safe home, but also to guarantee the revolution’s victory, we will bring t them over."
 ISP_the_south_african_collapse: "The South African Collapse"
 ISP_the_south_african_collapse_desc: "The government of Apartheid South Africa has buckled and died. Now, the nation tears itself apart. The government in the cape battles with African Communists and Neo-Nazis. While some African Communists are critical of our Zionist movement, supporting them against the Neo-Nazi Afrikaners is a must. The Cape governments largely anti-Communist stances mean they are hardly a valuable ally for us."
 ISP_a_new_aliyah_wave: "A New Aliyah Wave"
 ISP_a_new_aliyah_wave_desc: "Ever since America’s collapse, thousands of Jews are fleeing the country to escape the horrors of civil war and genocide. Some have fled to various countries but many have come here to Eber. A new Aliyah has thus begun, and with potentially hundreds of thousands of Jews coming back home we will need to prepare to welcome them back."
 ISP_reeducating_our_lost_brothers: "(Re)educating Our Lost Brothers"
 ISP_reeducating_our_lost_brothers_desc: "Many American Jews are not very fond of Communism. But many have felt they had no other option in the face of civil war. Especially those who came from places populated by Nazis, anti-semites and Holocaust deniers. Now that they are back home, we will have to teach them in the ways of revolution. To welcome them to Eber, we will ensure they become truly revolutionary Jews, accepting the righteous path of Communism."
 ISP_workforce_integration: "Workforce Integration"
 ISP_workforce_integration_desc: "The surest way to promote unity and foster a communal Jewish spirit with the new coming population is to guarantee they see a welcoming land of labour. Let us integrate them into the Hebrew workforce, so they work alongside other Jews from other parts of the world or those who are descended from people who lived here long before 1948!"
 ISP_reopen_ulpanim: "Reopen Ulpanim"
 ISP_reopen_ulpanim_desc: "The Ulpanim were crash course centres for Jews arriving in a new Aliyah, designed to teach them Hebrew, educate them in Zionist history, and of course socialist history too. After the last parts of the soviet aliyahs, the courses were closed as the arrival of new Jews dried up. What remained were small centres for small groups of people. But with this new Aliyah wave, we will need to resurrect these skeletons."
 ISP_prepare_accomodations: "Prepare Accomodations"
 ISP_prepare_accomodations_desc: "The arriving masses of Jews seeking shelter from war and terror will need a place to live if they are to stake out a new and safe life in Eber. More housing is needed for these permanent residents. But alongside that, accommodation for those attending the Ulpanim. Millions of Jews may arrive from America, and if that occurs we may be caught with our pants down and face a grand crisis right out the gate."
 ISP_palestinian_policy: "Palestinian Policy"
 ISP_palestinian_policy_desc: "The defining crisis for our republic is certainly the Palestinian question. The conflict between us and them has been going on since the 1940s, If not even much earlier! New debates have been emerging on policy for the Palestinians. There are those who wish to retain the status quo, if not, keep a tighter grasp on them to ensure our security. There are others who want a new policy to reconcile the Palestinians and see this as the only road towards peace."
 ISP_push_for_reconciliation: "Push For Reconciliation"
 ISP_push_for_reconciliation_desc: "War and terror cannot end unless everyone wants it to. It cannot end until everyone starts working towards it. Stricter measures and harsher acts against Palestinians will only spark a new conflict in the coming years. The road to peace begins with reconciliation!"
 ISP_peace_through_strength: "Peace Through Strength"
 ISP_peace_through_strength_desc: "It would be foolishness and idiocy of the highest order to think even for a second that these genocidal anti-semites can be reasoned with. Simply abandoning the system we have been using to protect us from terrorism and attacks for so many decades would be too risky and would be giving too much to a foe that does not deserve it. To think peace can be bought by making concessions and showing weakness is foolish. Only through strength and might can we establish peace and order, on our own terms."
 ISP_eyes_everywhere: "Eyes Everywhere"
 ISP_eyes_everywhere_desc: "For decades, terror attacks by reactionary separatists have been a nuisance. To keep them under control and to keep us safe we will have to utilise our secret service and tactics of mass-surveillance over. By monitoring potential terrorist sympathisers we will be able to foil a plot long before anyone can even be injured, making our republic a safe place for all."
 ISP_further_arab_autonomy: "Further Arab Autonomy"
 ISP_further_arab_autonomy_desc: "Rampant poverty and stagnation persists in the West Bank and other Palestinian majority areas. This has proven as an easy route into radicalisation and terrorism. These people see the conditions they live in, and respond with whatever means they see fit to improve it. But if we were to address the concerns of their economy and give them a greater degree of political autonomy, much of the populace will desert feeble dreams of complete independence."
 ISP_utilizing_shin_bet: "Utilizing Shin-Bet"
 ISP_utilizing_shin_bet_desc: "Regardless of the measures we have recently employed, the ever-present threat of terror remains. The PLO is still around, posturing and attacking from their bases along our borders, agitating confused arab youth against Socialism. The threat of reactionary terrorism on the Jewish supremacist side is still existant too. The shin bet must be used to investigate and purge any terror cells plotting against us, to strike deep inside the enemy."
 ISP_curtail_islamic_fundamentalism: "Curtail Islamic Fundamentalism"
 ISP_curtail_islamic_fundamentalism_desc: "Certain groups can be negotiated with. There are things we can change or negotiations that can be made that can pacify one or another faction.\nBut for fundamentalists like Hamas, this is impossible. They hate us for being Jews! And as such, they will seek no peace until we are dead and buried! It is best to, instead of blind hatred, promote and fund more moderate islamic schools, less prone to fundamentalist reactionary terrorism."
 ISP_the_enemy_of_my_enemy: "The Enemy of My Enemy..."
 ISP_the_enemy_of_my_enemy_desc: "The biggest branch of Palestinian terror is within the PLO. Internationally, they lead the cause of Palestinian terror against the Hebrew Republic. They have been a thorn in our side for decades and decades and decades. If they haven’t disappeared yet, conventional tactics won’t kill them off. What we need to beat them is to sow divisions within the Palestinian movement. We must foster division between the many groups in it, covertly funding radicals such as the PFLP and Hamas to keep the palestinians along the northern border fighting amongst themselves, struggling for supremacy over their refugee camps instead of attacking us."
 ISP_the_darkest_day: "The Darkest Day"
 ISP_the_darkest_day_desc: "Horror of horrors! Massacre and genocide haunts the Golan today! PLO terrorists based in Syria descended in their thousands on the settlements in the Golan Heights. They overwhelmed our armies, taking them wholly by surprise. In the ensuing chaos a handful of villages were massacred and the total death toll appears to be well over a thousand with dozens of hostages, civilian and military, taken!\nWith the result of this horrific attack, all of Eber has been deeply shaken! But from the darkness and rubble, we will smite those who oppose us and want us dead. We will rebuild and return stronger than ever!"
 ISP_mobilizing_the_harket: "Mobilizing The Harket"
 ISP_mobilizing_the_harket_desc: "With the new war against the PLO and their allies we will need as many allies as we can get! One of them in Lebanon, the Harkat al-Muhrumin, a Shia and socialist militant organisation allied with us, is perhaps the most important ally we could have. By sending them support and mobilising their brigades, we will up the pressure on the PLO and their allies and hem them in until they fall to hell!"
 ISP_concentrated_special_operations: "Concentrated Special Operations"
 ISP_concentrated_special_operations_desc: "Winning hearts and minds in urban warfare is key. While the Lebanese will likely never all support us, their concerns will be abated and calmed if we stick to concentrated special operations. Using precision strikes, we will only kill who we need to kill. This, together with isolated strikes on neighbourhoods and compounds instead of grand battles and campaigns, no ill will shall befall us."
 ISP_with_a_strong_hand: "With A Strong Hand"
 ISP_with_a_strong_hand_desc: "Being too soft and careful will only guarantee no progress on the road to war. It will be like handing victory to the enemy on a silver platter. We will strike hard and fast and cast a wide net, ensuring the annihilation of the enemy!"
 ISP_and_an_outstretched_arm: "And An Outstretched Arm"
 ISP_and_an_outstretched_arm_desc: "Our operations cannot be limited only to the front lines. To fight off the enemy, we will need to penetrate deep behind enemy lines, gather information and intelligence, and carry out operations targeting the membership and leadership of Fatah."
 ISP_cleaning_fatahstan: "Cleaning Fatahstan"
 ISP_cleaning_fatahstan_desc: "The land occupied by Fatah and the PLO in Lebanon, a deep-state or a state within a state, has been a thorn in our side for decades! Cleansing Fatahstan and obliterating any remnants of Fatah and the PLO in Lebanon is thus a key aim of this war, to ensure they can never threaten us ever again!"
 ISP_vainakima: "Va-Inakima"
 ISP_vainakima_desc: "We shall never forget nor forgive what these fiends have done to our innocent citizens! We will ride into battle eternally victorious! We will crush them and send them into the sea! Never again will the people of Eber fear the coming of days of terror!"
 ISP_safeguarding_our_sons: "Safeguarding Our Sons"
 ISP_safeguarding_our_sons_desc: "Too many have already died following the PLO’s surprise attack on the Golan. That on its own had bolstered opposition to our government, criticising us for such a massive security failure. And with this new war, every soldier who dies or is injured is another stain on our government. Policies to minimise any casualties and deaths is essential to maintain stability and to ensure we win the war!"
 ISP_humane_warfare: "\"Humane\" Warfare"
 ISP_humane_warfare_desc: "Many have voiced concerns with this war of the potentially vast humanitarian cost. While in the past these worries would have been far more muted in the face of such vast terror. But to try and abate these concerns we will utilise more targeted strikes and attempt to prevent civilian casualties. For them, this policy will likely suffice, even if the results are not necessarily what they wish."
 ISP_drone_strikes: "Drone Strikes"
 ISP_drone_strikes_desc: "The key to victory is to control the skies, but taken together with our doctrine of special concentrated operations, regular bombers will not suffice. We will need to amplify the production of drones to dominate the sky! Their unending buzzing in the sky will remind the enemy below that they are never safe and that our victory is guaranteed."
 ISP_tis_the_final_battle: "Tis' The Final Battle"
 ISP_tis_the_final_battle_desc: "The greatest horror has come to pass. Surrounded on all sides, our dear republic is at war with the twin evils of Egypt and Syria! These Arab terror states who look upon us with hatred, ready to damn us to the camps we so desperately tried to escape. This shall be the final battle. We will face them in the deserts and in the fields! In the hills and the valleys! In the cities and the coasts! We will push them back to Damascus and Cairo and once and for all guarantee the safety of the Hebrew Worker!"
 ISP_total_mobilization: "Total Mobilization"
 ISP_total_mobilization_desc: "The war we have been thrust into is not like the wars of old against small urban guerillas like Hamas, Fatah, or the PFLP. It is a fight against multiple, organised, well-trained and massive armies. Victory is unfortunately not certain and it is likely battle may come creeping into our cities. While it may be costly, total mobilisation of the populace to resist the coming enemy will be needed to defend ourselves."
 ISP_rolling_screen_of_fire: "Rolling Screen of Fire"
 ISP_rolling_screen_of_fire_desc: "Given the sheer numbers we are up against coming from the Arab hordes, meeting them alone and unguarded in battle is risky. Through a combination of targeted artillery strikes and air support, we will give the foe quite a task in breaking through our defences whilst nullifying their numbers."
 ISP_petition_wto_aid: "Petition WTO Aid"
 ISP_petition_wto_aid_desc: "Our allies in the Warsaw Pact are our best advantage in this war. By petitioning the Warsaw Treaty Organisation for aid and support we will ideally be flooded with guns, money, planes and tanks to fight the enemy and defend ourselves."
 ISP_old_world_razed_to_the_ground: "Old World, Razed To The Ground"
 ISP_old_world_razed_to_the_ground_desc: "At great costs, we have survived and beaten back the cowardly Arabs once more! But disaster and ruin surrounds us. Much of our land has been destroyed, thousands on both sides lay dead. Many more injured. Destruction costs must reach into the billions. \nBut from the ashes of the old dead world, we will build one anew!"
 ISP_bent_back_freed_from_burden: "Bent Back, Freed From Burden"
 ISP_bent_back_freed_from_burden_desc: "No matter what has happened, we can not forget the wholly socialist character of our state. This is a victory not only for the Hebrew man, but all workers around the world as the forces of capitalist theocratic reaction have been crushed! Going forward we must always aim to stay true to the socialist character of the republic."
 ISP_our_own_world_we_shall_establish: "Our Own World We Shall Establish!"
 ISP_our_own_world_we_shall_establish_desc: "As we begin to rebuild, we will not leave our neighbours behind. Developing and supporting the creation of new allies in the region is essential. Both from allied socialist militias in Lebanon alongside Kurds who, though some may distrust us, can see us as an enemy of their enemy and come to be our friends."
 ISP_the_conquered_territories: "The Conquered Territories"
 ISP_the_conquered_territories_desc: "Having won the war, we will now need to decide what to do with the newly conquered territories we have acquired, namely Gaza and the Sinai, both of whom have a largely Arab population. Some have argued for opening up the land to settlement, while others have thought of avoiding that, keeping our hands open for negotiations."
 ISP_renewing_diplomacy: "Renewing Diplomacy"
 ISP_renewing_diplomacy_desc: "With the defeat of the Arab enemy, now is our best time to try and renew diplomacy with other Arab states around us. Our victory should tell them one thing. We are here to stay, so they may as well make peace with us and accept diplomacy."
 ISP_yesterday_nothing__tomorrow_all: "Yesterday, Nothing - Tomorrow, All?"
 ISP_yesterday_nothing__tomorrow_all_desc: "Within Eber there is much joy. Peace has returned and the war has been one. We are safe from annihilation, and hundreds of thousands look forward to the coming years where we will develop a new order in the Middle East and establish peace with the Arab states.\nBut for some, a great malaise has set in as well. After all, did we not establish peace with the United Arab Republic so long ago? And just look where that got us! We are back at the beginning. For some, thousands lay dead and nothing has been achieved. While we look forward to the future and the peace it will hopefully bring, the fears and aversions towards trying again dominate the nation. "


