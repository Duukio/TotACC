ISP.2002.t: "The Conquered Territories"
ISP.2002.desc: "Now that the war is finally over, we are left with huge swaths of new territory, be it Sinai and Gaza we already owned in the past and returned to Cairo, or our new security strip in Jordan.\nWhile the current Egyptian government is not yet open to any peace negotiations, and our public doesn’t trust the possibility of such negotiations either after the failure of the previous peace, the situation in Jordan is very different.\nWhile some radical Zionists wish an annexation of the other bank of the Jordan citing the need of a security strip to pacify the terror ridden region and our historical claim, a continued presence there seems to be rather harmful. The high military leadership, on the one hand, seems to agree that occupying such a densely populated land is harmful, especially as the better strategic position is behind the formidable river, while strong international pressure makes the civilian leadership less keen on continued occupation as well.\nMoreover, it seems that the fragile Jordanian government would readily agree to a ceasefire and a demilitarization of the border regions if we retreat, likely giving the people of the border region peace, at least for the near future."
ISP.2002.a: "We must end the bloodshed, for now."

