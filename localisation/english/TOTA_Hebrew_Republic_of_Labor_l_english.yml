ISP_general_secretary_sneh: "General Secretary Sneh"
ISP_general_secretary_sneh_desc: "The complete bastardisation of the Hebrew Republic of Labour by the ways of Capitalist bastards, corrupters of the righteous path of Communism and the immortal science of Marxism-Leninism has thankfully been nipped in the bud. The right deviations of idealistic Cannannites have been repulsed too.\nThe angry masses of Zion would not standby and let such blatant efforts to rot our revolution. The masses, the armies, the militias, all together stood up and deposed the efforts of opportunists and right-deviation. The Revolution lies safe for now. But much work is yet to be done."
ISP_in_the_steps_of_tabenkin: "In the Steps of Tabenkin"
ISP_in_the_steps_of_tabenkin_desc: "Our legacy derives ultimately from that of Tabenkin. The first leader of our republic. Under Tabenkin’s wise rule, we gained friends in Moscow and wisely moved towards the liberating path of Marxism Leninism.\nBut this legacy has long been forgotten. The path of socialism, and national pride against all who seek to crush us, have all been left at the wayside. We who walk in the steps of Tabenkin must work to rectify this. To erect once more a nation, guided by the way of Communism and loving fervor for our nation, against any and all who seek to sell out the working masses to capital or render a second Holocaust on us."
ISP_a_responsible_national_government: "A Responsible, National, Government"
ISP_a_responsible_national_government_desc: "It is high time to put some effort into reworking the structure and administration of our government. Especially in the aftermath of our new revolution. Layoffs, arrests where necessary, early retirements officials who oversaw the corruption of Communism. At the same time, we must make sure policies and direction are not determined by starry-eyed idealists blinded by radicalism. In doing so, we can form a secure and grounded government of the entire nation, promoting the national interest rather than just the narrow vision of radicals and interest groups."
ISP_for_our_unity: "For Our Unity"
ISP_for_our_unity_desc: "In trying times such as this, it is essential we stay united. The government, the masses, the army, all of it. We must all rally behind the common cause of Socialism and Hebrew sovereignty. We all are united in our desire for safety and the safeguarding of the gains of the revolution. If we are divided, the enemies of our people will no doubt come and smite us where we stand. So, rally you hebrew workers! Let flags of our unity hang from every window. Carry signs and sing the songs of our freedom. No matter what, we will stand united!"
ISP_for_our_security: "For Our Security"
ISP_for_our_security_desc: "Fools and Capitalist collaborators scream and shout in the streets. They speak of oppression, of despots! Red Terror is not the right path to deal with such dissidents though, even if some radicals call for it.\nFor behind every dissident lies the same universal fear of the star and crescent. The Arab threat is ever-looming for us all. A quick reminder of who will defend us and provide them with security from those who call for our death will be all we need to stem the tide of opposition."
ISP_reject_claims_of_radicalism: "Reject Claims of Radicalism"
ISP_reject_claims_of_radicalism_desc: "What we are undertaking is nothing more than a return to the original ideas of the Hebrew revolution. A few within the state call for isolation from the international world, teeming with revisionism at every turn. Others speak in worried tones of a reign of terror, for either Jews, Arabs, or both! But this is certainly not true.\nWe are not radicals. Only safeguards of Socialism. We shall return to the right path and salvage this Nation. Nothing more. Nothing less."
ISP_a_benevolent_iron_fist: "A Benevolent Iron Fist"
ISP_a_benevolent_iron_fist_desc: "The maintenance of a government backed by the barrel of a gun is only wise. It has only been a short while since the rule of revisionism and capitalism was deposed. Maintaining a closed military vanguard for the good of our people is the only path forward."
ISP_cautious_redemocratization: "Cautious Re-Democratization"
ISP_cautious_redemocratization_desc: "With slow and steady steps, we can move towards slight re-democratization. The people have no need for a Red Junta after all. Communism cannot come from the barracks. Reinstating the policies of peoples democracy rule is of the utmost importance."
ISP_rallying_behind_the_military: "Rallying Behind the Military"
ISP_rallying_behind_the_military_desc: "What is the force that defends us from the ever-present threat of reaction? The force that defends us from the threat of annihilation? It is the military! The brave souls who give their lives to make sure we are safe. The whole nation must rally behind the forces of the military, the defenders of the Hebrew people and the principles of Socialism!"
ISP_enforcing_conscription: "Enforcing Conscription"
ISP_enforcing_conscription_desc: "Cowards and dissidents who run from conscription are a blight on us all. If tomorrow brings war, we run the risk of being outmanned and outgunned. Every man and woman who can fight, must stand and fight if we are to triumph!"
ISP_reviving_the_national_spirit: "Reviving the National Spirit"
ISP_reviving_the_national_spirit_desc: "Divisions within the nation of Zion have ruptured our national spirit. Bickering over the path of Communism and if it's even worth treading have caused us much harm. Only by rejuvenating our national spirit with a common pride in our Hebrew identity can we hope to reverse this harm."
ISP_fighting_cosmopolitanism: "Fighting Cosmopolitanism"
ISP_fighting_cosmopolitanism_desc: "The Rootless Cosmopolitan identity has penetrated much of the Hebrew republic. In the cities and universities, many hundreds of students and youth do not see themselves as Hebrew. They do not care for the ideals of the Zionist movement. This is, in no uncertain terms, abhorrent. A rot that will collapse the very foundations of our Communist project if it continues. The ideals of globalism have robbed countless people of a sense of national pride and identity. And in doing so, create individualist crowds with no interest in giving back to their people.\nBy cracking down on such sensibilities, the rootless cosmopolitans infiltrating the nation of the Hebrew man will cease to be."
ISP_silencing_antinational_voices: "Silencing Anti-National Voices"
ISP_silencing_antinational_voices_desc: "Enemies of Hebrew nationhood abound everywhere. There are of course the Palestinians. From the Islamists of Hamas, the Nationalists of Fatah, and the Chinese backed infantiles in the PFLP, terror attacks and insurgency continue to form a great threat. Their sympathizers must therefore be hushed right up. There can be no room for anti-national ideas in this new republic."
ISP_a_controlled_socialist_congress: "A Controlled, Socialist Progress"
ISP_a_controlled_socialist_congress_desc: "A number of people in the urban population have grown restless with our newer policies targeting an overly Cosmopolitan identity. While we are no friends of overt and total cosmopolitanism, we are far from reactionary. Social progress must still continue, within the framework of socialism. We are not stick-in-the-mud conservatives! We pursue progress like any radical socialist would! We do not want excess, but we will not make enemies of the ideals of social progress."
ISP_honouring_our_pioneers: "Honoring our Pioneers"
ISP_honouring_our_pioneers_desc: "Our brave pioneers are the ones who forged the Hebrew nation. The settlers who came in the 1880s, or in the Aliyahs after World War 1 and World War 2. It is because of these pioneers that we are here today. We must honor these figures of our past. We must make sure their legacy is never forgotten! Without them and their brave labour, we would be rotting in the ghettos of Europe and the decrepit corners of reactionary Muslim states who look upon us with disgust."
ISP_a_virtuous_youth: "A Virtuous Youth"
ISP_a_virtuous_youth_desc: "Allowing the Youth to gain experience in the realm of work will not only allow us to bolster the economy, but pave the way to a new generation of Tzabars. Through work, comes a truly proletarian and virtuous class of people. We will not let our youth stray away from our socialist values! The virtues of Labour and fraternity, a strong moral character, will be engrained in them."
ISP_upholding_the_myth_of_tzabar: "Upholding the Myth of the Tzabar"
ISP_upholding_the_myth_of_tzabar_desc: "The new Hebrew man, the Tzabar, is here! Do not forget him! Gone is the old Jew, lawyers and intellectual merchants. The Jew is now a Hebrew, a man of hard labour! Whose body is prickly and hard. But whose interior is soft, intellectual, and gentle. Like the cactus of the desert. This is what the patriotic youth of the Hebrew Republic must strive to be. A nation of truly Proletarian men and women!"
ISP_mobilizing_the_youth: "Directing Youth Idealism"
ISP_mobilizing_the_youth_desc: "Many young men and women, boys and girls, are filled with patriotic love for the cause of Communism and a new Eber. Let us mobilize them into joining party sponsored youth organizations. The youth shall then become our strongest tool in making revolution!"
ISP_a_daring_youth: "A Daring Youth"
ISP_a_daring_youth_desc: "The new Tzabar is nothing if it cannot fight! By training the youth and teaching them how to defend themselves, a new daring corps of soldiers will rear their heads. Ready to take head on, anyone who dares to raise their fists against our dear homeland."
ISP_a_homelandloving_youth: "A Homeland-Loving Youth"
ISP_a_homelandloving_youth_desc: "What is a young generation if it does not love where it lives. We must endeavor to ensure that the youth have in their hearts, great love and adoration for us all. For their countrymen, for their families, for their homeland, and for their nation!"
ISP_the_new_hebrew_man_rejuvenated: "The New Hebrew Man, Rejuvenated"
ISP_the_new_hebrew_man_rejuvenated_desc: "All across the country, the forces of Cosmopolitan globalism are in retreat. The ideals of Capitalism and opportunism are being driven underground and into the shadows! Tzabar stands proud and the new Hebrew Man comes forth! The nation of the Hebrews has been rejuvenated and awoken from its decades long slumber and malaise.\nColour has come to Eber! Away with the old grey, bleak, visions of the future. Dead is the Old Jew! Risen is the new Hebrew! He who is no slave to foreign capital! He who does not live in misery in the ghettos. We are a nation of workers now, not lawyers and merchants! Our spirit is Proletarian! United totally in love and adoration for the light of Communism and our homeland!"
ISP_reversing_the_privatizations: "Reversing the Privatizations"
ISP_reversing_the_privatizations_desc: "The dastardly plots of revisionists and capitalist sympathizers have penetrated deep. Even if we have overthrown them, the economy must be sorted out. Mass privatisation has begun to generate a new parasitic bourgeois-bureaucratic class. It is high time to root them out! Death to Capital! Death to the businessmen! This is not a nation of capital, but a nation working towards a dictatorship of the workingman!"
ISP_rebuilding_a_spirit_of_labour: "Rebuilding a Spirit of Labour"
ISP_rebuilding_a_spirit_of_labour_desc: "Communism cannot be built on the back of petty-bourgeois intellectuals, but rather on the back of millions of hard working proletarians. A spirit of labour is what we need. Appreciation and love for physical work which has built empires and civilizations. By constructing a nation of hard working men and women, the flames of industry will roar! And with them, will come a truly prosperous nation. Out with the lazy lot! We are a nation of proletarians! Hard-working men and women, united in our mission of building socialism!"
ISP_an_eber_of_all_workers: "An Eber of All Workers"
ISP_an_eber_of_all_workers_desc: "The rallying cry of Communism was for the unity of all workers of the world. Not just Jews. This is an Eber for all workers! Collectives, be they in industrial factories or fields of olive trees, must have workers of every size and shape! Be they Jew, Muslim, Christian, Druze. It does not matter! Workers of Eber unite! For we are all brothers here! United in our dream of Communism!"
ISP_integrating_our_arab_countrymen: "Integrating our Arab Countrymen"
ISP_integrating_our_arab_countrymen_desc: "Reaching out to the Arabs and other ethnic minorities, telling them to come down to the industries and farmlands for employment along with their Jewish brethren is not enough. If we are to integrate them into an Eber for all workers, they must also share the rewards of our Labour, and our socialist liberties, to the same extent as the Hebrew. They must be uplifted from their backwards conditions and embraced as true brothers. Maybe then, in such a situation, the time will come for them to join our beloved armed forces too. As Eber will finally be their socialist homeland too. The sense of camaraderie will only grow greater in the military, and leace and unity of workers may follow, for a beautiful socialist future."
ISP_upholding_hebrew_labour: "Upholding Hebrew Labour"
ISP_upholding_hebrew_labour_desc: "In the fields and hills, where the olive plants grow, and where farmers and peasants reap their crops, it is hard not to notice how many there are not Jews, but Arabs. It is the same in the sector of construction. Indians, Arabs, and anyone who isn’t Jewish seem to be everywhere in some of the most important sectors of physical labour, as the Hebrews return to the petty bourgeois ways of the exiled past.\nIf we are to have a truly independent nation for Hebrews, it must not only be politically independent, but must also rely on Hebrew labour. Be it in the lower professions or higher up positions."
ISP_the_conquest_of_labour_lives_on: "The Conquest of Labour Lives On"
ISP_the_conquest_of_labour_lives_on_desc: "A deeply troubling crisis is festering in Eber. More and more Hebrews lounge in the cities, while the proletarian masses are made more and more of imported workers from abroad. They till the fields and build our homes. They take care of our elderly. Now we do not want to make enemies of such people. But we must endeavour to end our reliance on them. If we are to be a socialist state for the Hebrew man, then the Hebrew must remember that he must exercise his control over the means of production and over the land. The land belongs to those who work it after all. For this to be a truly socialist land for the Hebrew, then the Hebrew must be its proletarian base!"
ISP_nation_and_socialism: "Nation and Socialism"
ISP_nation_and_socialism_desc: "Up in Jerusalem, there stand two flags. One bathed in Red. One holding the star of David. This is a nation of two souls. Two spirits. A people united in their vision for Communism. And a people united in their love for Eber. The Tzabars stand proud, the dictatorship of the workers stands firm. The twin visions of Communism and Zionism dance together!"
ISP_old_school_planning: "Old School Planning"
ISP_old_school_planning_desc: "As favored by much of the party and government, the model of economic planning we must take up is the old way. As practiced by Comrade Joseph Stalin’s Union and taken up by many other Communist nations throughout the world, Old-school planning is the way forward.\nTaking inspiration also from the People’s Republic of China, even if relations are tense, is perhaps the best way forward. While we are no Maoists, it is perhaps the strongest model of the traditional method of planning, and the one we are most inspired by."
ISP_socialist_austerity: "Socialist Austerity"
ISP_socialist_austerity_desc: "Excess, surplus, overabundance. It has made us weak! Back in the old days, we were a proud yet humble people. Austerity guided us along a path of labouring for each other. It fostered community, it built this nation as a whole! Now we instead have selfish youths who work for themselves and their own vices. We must remember the principles of the Kibbutzniks. The humble peasant who built utopia on a patch of desert by working together with his neighbour and brother. The petit bourgeois visions of unending commodities and surplus cannot stay! The honest hard Labour of the pioneer Tabenkin exemplified must return!"
ISP_lessons_from_santiago: "Lessons from Santiago"
ISP_lessons_from_santiago_desc: "Not everyone will be happy to hear it, but a system of economic planning needs reformation. This doesn’t mean deference to the new soviet economic model of their socialist market system. But rather turning to digitisation as practiced by Chile via Cybersyn. From Chile, we can bring in a system capable of commanding and planning an economy for millions upon millions of people."
ISP_an_efficient_plan: "An Efficient Plan"
ISP_an_efficient_plan_desc: "Efficiency is key! And what better of a thing to do than to utilize the strongest and most up-to-date forms of technology and Artificial Intelligence to do so? Through the usage of Cybersyn modeled AI and computers, efficiency will reach new heights here in our homeland!"
ISP_sidelining_reactionary_voices: "Sidelining Reactionary Voices"
ISP_sidelining_reactionary_voices_desc: "Within the government, some dissent against our new policies. Arguing that the policies of digitisation are misguided. Be they skeptics of progress, corrupt party leaders or wolves in sheeps clothing who attack the very principles of socialist planning, reaction is everywhere. We have no time for such naysayers. Let us instead push them aside and make a government free of reaction."
ISP_for_the_prosperity_of_eber: "For the Prosperity of Eber"
ISP_for_the_prosperity_of_eber_desc: "As computers and new types of cutting edge technology flow into Eber, prosperity abounds! Efficient models of planning organize the paths of trains, trucks, and ships. Information flows into servers and helps us know how much of what to produce and where to send it. New automated lines of production assemble vehicles and manufactured goods at the speed of light! This is truly a new age for the Hebrew man! "
ISP.2001.t: "Old Wounds, New Peace"
ISP.2001.desc: "\"Welcome home!\" Nimrod was pleasantly surprised at the gathering his mum had put together. His sister was back from university, his grandparents were over, and even his uncle Asaf was here too.\n\"Awh, it's so good to be back, thank you all! I can't wait to have my own bed again!\" He joked, feeling the relief of home wash over him. He hadn't realized how much he'd missed the little things while away at the front: the smell of his mum's cooking; the way the sunlight dappled into the living room through the big tree in the back-garden; even the tinny, worn-out sound of that cheap radio his dad had bought in Sofia when he was little. All the free food and gifts he’d received from revellers in the various street parties on his way back paled in comparison to finally being back home.\nDinner was when discussion moved onto the war, with many questions abound. \"Look, I know you all mean well asking about it... But maybe some other time?\" Nimrod was deflecting. The truth was that he didn't want to talk or even think about it. \"The war's over now anyway. Plenty of time to discuss it later. Now let’s have peace.\" A peace he knew so many of his comrades never got to-\nHis uncle scoffed. \"Pft. Peace? With them?\" There was venom on his tongue. \"We've made peace before. And again before that. There is no peace with the Arabs, mark my words.\" The good mood was shattered. \"Oh, Asaf!\" Nimrod's grandmother exclaimed, \"I thought we raised you better than this! It's always Arabs this, Arabs that. For how long will you hold a grudge for what happened to your father?\" Nimrod's grandfather nodded in agreement. He'd served too back in the 60s, in the other war with Egypt. He'd lost part of his leg and the sight in one eye to a shrapnel blast. He was a lucky one. Nimrod tried to push out the noise, sitting quietly while the argument blared.\nHe was back from fighting only to find more of it at home. He wanted his uncle to be wrong, but even on base he'd heard more and more of this talk, even when he showed the tiniest bit of optimism about a future peace. \"Really? Bring it back after all this?\" \"Well how did it work out last time?” “How can you say that after what they did to David?!” These questions swirled through Nimrod's mind. How many more of his comrades, or even their children, would die in these back-and-forth wars? Was there any point in hoping? Does anything even matter anymore if you know even your grandchildren will fight to secure another peace after this one?"
ISP.2001.a: "To live, and die, by the sword."
