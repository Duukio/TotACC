ISP.1000.t: "Rocket Volley from Lebanon"
ISP.1000.desc: "As we feared, a barrage of rockets have flew in from South Lebanon towards our cities. Whilst the Iron Dome has done great strides in reducing most of them to fireworks, some have gone through and damaged infrastructure."
ISP.1000.a: "Darn it."
ISP.1001.t: "Stabbing in [ISPrandomCityScrloc]"
ISP.1001.desc: "A young Arab citizen affiliated with the PLO appeared in [ISPrandomCityScrloc] and began a stabbing spree. Thankfully, the perpetrator was quickly shot down, but little yielded in terms of intelligence. Thanks to the quick response we only have one dead and a couple injured."
ISP.1001.a: "Our prayers go to the victim."
ISP.1002.t: "Shooting in [ISPrandomCityScrloc]"
ISP.1002.desc: "A mass shooting attempt has taken place in [city] a few hours ago. Luckily, the perpetrator was quickly neutralized. After some investigation, it appears that they were affiliated with the PLO. Further investigation into the source of their firearm will follow."
ISP.1002.a: "These animals won't leave us alone!"
ISP.1003.t: "Tragic Shooting in [ISPrandomCityScrloc]"
ISP.1003.desc: "A mass shooting has taken place in [ISPrandomCityScrloc], and the local police and hospitals has been at it in recovering the bodies of the victims and aiding the wounded. The perpetrator, who has managed to take down a dozen people with him, has been identified as part of a PLO sleeper cell."
ISP.1003.a: "Nothing is sacred to these people..."
ISP.1004.t: "Suicide bombing in [ISPrandomCityScrloc]"
ISP.1004.desc: "Horrific news coming from [ISPrandomCityScrloc] as police find a smouldering pile of rubble in one of the city's main squares, as wounded victims are treated and the mangled bodies of the dead creep up from the efforts of the cops. Not much consolation can be given here, as besides the casualties, this incident has also caused significant delays in transport and other key city infrastructure."
ISP.1004.a: "What a holy endeavor it is to kill innocents, huh?"
ISP.1005.t: "Campus protests in [ISPrandomCityScrloc]'s universities"
ISP.1005.desc: "Hundreds of students in a key [ISPrandomCityScrloc] university have barricaded themselves in the university and called for an immediate return of Palestinian Territories and a right of return to the refugees. Of course, we will be sending in the police to pacify them shortly, but this is, as you might expect, a lot of resources spent."
ISP.1005.a: "College campuses are never up to anything good, are they?"
ISP.1006.t: "Ethnic Violence in Lod and Haifa"
ISP.1006.desc: "In the last couple of days we have seen an upsurge of violence between Hebrews and Arabs in the mixed cities of Haifa and Lod. As always starting with a fight followed by repeated revengeful “responses”, this situation is hampering coexistence all over the country. With the situation still somewhat under control, we must condemn such actions and increase police presence in the area to avoid further escalation."
ISP.1006.a: "Must be some angry football fans again."
ISP.1007.t: "Riots across Arab settlements"
ISP.1007.desc: "Confrontation of protesters with police has lead once again to an outbreak of rioting in Arab population centers across the country, mainly in the West Bank. Looting and arson, barricades and rocks thrown at police, we must tend to this situation carefully as to not make it worse."
ISP.1007.a: "Worrying."
ISP.1008.t: "Protests across the West Bank"
ISP.1008.desc: "Palestinian organizers in cooperation with some sympathetic Hebrew activists have been organizing protests and marches under the banners of “peace and equality” for Arabs, sometimes even going as far as to demand Palestinian statehood and a right of return. While this is a nuisance for sure, most in our government agree that a harsh response by the police would just make things worse."
ISP.1008.a: "Let them protest. In a week they’ll go back home."
ISP.1009.t: "Activists and Protesters block major roads"
ISP.1009.desc: "In a new campaign, Palestinian and sympathetic Hebrew activists have blocked major roads across the country, calling for attention to discrimination and the rights of Palestinians to “self determination”. Of course, we cannot let those foreign backed agents and idealists disrupt the transfer of goods and the daily routine of our workers. They will be dragged off the road and the situation brought under control in no time."
ISP.1009.a: "Don’t they have anything better to do?"
ISP.1010.t: "“Price Tag” in the West Bank"
ISP.1010.desc: "In what they deem a “price tag” and revenge to Palestinian terrorism, radical religious Zionists have set fire to properties in a small Arab village in the West Bank. While their unverified claims that terrorists who attacked them came from this village rouse support among some nationalists, we strongly condemn such reactionary terrorism and they will be punished accordingly. Assessments of the damage and possible casualties are still underway."
ISP.1010.a: "Filthy terrorists ruining our nation's image."

ISP.1999.t: "Yom Ha'Atzmaut"
ISP.1999.desc: "For two millenia our people have suffered exile, enslavement, torture and murder by the hand of empires. The Babylonians, Greeks, Romans, they all kicked us down to our knees and deported us from our very homeland. Even in \"enlightened\" europe we faced persecution, the age old repressive reaction culminating in the genocidal Nazi regime, which brought such a terrible holocaust on our people.\nHowever, to some like our dear Comrade Tabenkin, enough was enough. We returned from our exile in europe little by little since the late 1800s to our ancestral homeland. Pioneers like Comrade Tabenkin worked hard in grueling conditions to establish the basis of our reborn fatherland. The Nazi horror of the holocaust was the straw to break the camels back, and the surviving masses rushed back to their ancestral homeland, Eber, Zion.\nHere, we sought to estabilish a home. Kicking out the British imperialist, and fending off the reactionary anglo-arab monarchies who soon tried to take our newfound freedom, the historical proclamation came: Independence! We proudly constructed a safe homeland for our people and brought socialist hope and prosperity to all. The empires and forces of reaction who sought to exterminate us fell one by one, relegated to the dustbin of history; but we survived, in spite of it all! We survived, and triumphantly restored our Independence in our own homeland - today we can proudly proclaim;"
ISP.1999.a: "Am Yisrael Chai!"

ISP.2000.t: "Workers' Unity Day"
ISP.2000.desc: "Across the streets of Haifa, red banners adorned every building in view. Some were in Arab, most were in Hebrew. All carrying official slogans of the Mapam and celebrating the unity of workers, regardless of national and religious identity, regardless of narrow ideological sect.\nBy the sea, ships sailed with the flags of a socialist Eber, and over the air a lone plane with banners celebrating the national holiday would often pass.\nHere and there children would eat sweets and chocolate given out by friendly stall workers. In some streets, you would find battalions of soldiers parading through the streets. They all forget their differences in this day of unity; they remember and honor the great unification of all parties of Labour, who many decades ago were able to put their differences aside to create our glorious United Workers Party. On this day they remember, that as all parties back then joined their forces to enable the liberating advent of socialism for our people, so we must today remain United, despite our differences, for Eber, for Progress and Socialism."
ISP.2000.a: "The Party is always right!"

