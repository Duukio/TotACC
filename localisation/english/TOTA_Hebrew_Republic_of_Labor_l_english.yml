 ISP_no_longer_postponing_war_desc: "No Longer Postponing War"
 ISP_for_an_authentic_final_peace_desc: "The lands of Sham, of old Misir, of the corpse of Phonecia have all fallen into the semitic fold. Together with our friends in Tripoli, the Near East has been united under the bosom of Pan-semitism! A new era of peace has descended on us. Now comes the era, the generation, of the Pax Semitica!"
