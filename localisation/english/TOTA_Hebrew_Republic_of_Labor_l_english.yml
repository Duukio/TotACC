#ISP.691.t: "The Old Man, the New Guard"
#ISP.691.desc: "Mordechai was impatiently waiting for the announcement of Efraim Sneh. He could feel in the air, in his bones, that something big was taking place. The dismissal of that Canaanite crook Bar-Lev could only mean one thing after all. He watched in excitement as the news screen moved from the reporter to Jerusalem, showing Sneh getting on the podium in front of a large crowd. \n\n“Workers and Toilers of the land! Brothers and Sisters of the Socialist cause! I come before you today to announce a great victory of Socialist Eber. Our grand government of national salvation has fought bravely against the greedy Bureaucrats and capitalist roaders, and today, as order has been restored to the nation, is proud to announce a brave old-new course for our revolution. \n\nMy Hebrew brothers! The path of Tabenkin will not be forgotten! The sacrifices of our pioneers was not for naught! The example of pioneer comrade Tabenkin of patriotic and virtuous Labour will be embraced. The corruption of socialism by Peresite bureaucrats reversed. Let our youth learn the virtue of the pioneer. Let our workers find once again the joy of Labour. Let socialism flourish - let our nation find its vigour once again! \n\nTo you, my brothers and sisters, my dear People, I promise to restore the path of comrade Tabenkin to our nation. To you I promise to restore socialist justice, a true patriotic leadership, which will be the steadfast guard of Socialist Eber.” \n\nMordechai was jolted with joy seeing that Eber truly is not yet lost. Finally, a leader he can trust to be loyal to Eber and put the misguided youth on the right track."
#ISP.691.a: "Tabenkin is Young Again."
#
#ISP.692.t: "The Whole Country a Front, the Whole People an Army"
#ISP.692.desc: ""It beats being shot at, No?" \n\nIsaac scoffed. "When I signed up for the military this is not what I had in mind." Itamar rolled his eyes and said "Well regardless of all that, we're getting off here, make sure you let every one else know." \n\nThe two got off the jeep. Behind them was a convoy of many other soldiers. Guns were mounted on their armoured cars, just in case there was a surprise attack. Almost immediately, one hundred men flew out, carrying wood and steel beams. Others had megaphones and began to announce the coming of a military labour battalion. Recently, this village had been ravaged by a fire from fault wiring. They declared that within the week, it would be as if it never happened at all! \n\nWithin a few minutes, the group had set up dozens of tents for people to stay in as the others went on to build back their burnt down homes. As the days and nights came and went, Isaac and Itamar focused on building up a local school that had been burnt down. Isaac still scowled at the start, but when he saw the faces of the kids and youths who cried at their black and brown houses and schools, his heart slowly began to ache. When he saw that they were crying tears of joy, he began to forget his first doubts. He could not help but remember the words that Itamar first said to him at the reading group he first met him at. \n\n"From each according to their ability..."
#ISP.692.a: "To each according to their needs.""
#
#ISP.693.t: "The Model Citizen"
#ISP.693.desc: ""you're being too close minded Ehud..." \n\n"I'm just looking out for our daughter is all! I don't want her going out with some.. geezer with no future!" \n\n"Well, say what you want Udi." a third voice popped up. It was Gil, Esther's brother. "But I know a fair few things about this boy, and he's a real model citizen!" \n\n"How so?" he asked. \n\n"He is an exemplary Tzabar! Well not quite there yet, but he's got some backbone! He is not afraid of hardship, he is working on himself, and while he might seem a bit rough on the outside, i can assure you he is a gentleman and a patriot with strong values." \n\n"Oh please, do not go on about that nonesense." Ehud laughed. "Nonesense? The Tzabar is nonesense to you? Is this country nothing for you? Gentle, Athletic, Intelligent, self sacrifcing Men and Women like him built this country. But for you, values mean nothing. The man 'with a future' you want for Esther is just a spoiled, rootless individualist from a rich Ashkenazi family". Ehud scoffed. \n\nEsther joined in. "Your ancestors were one of them too. They had to have been to escape.." she stopped herself and a slightly pained silence fell over them. \n\nAfter a few seconds of fidgeting, Gil spoke up. "Look, I'm not saying you have to take him in as your son or whatever. Just, the boy has promise. People like him built this nation. And so it stands to reason we'll need them in the future too! Can't you at least think about cutting him some slack?" \n\nEhud sighed."
#ISP.693.a: "Fine."
#
#ISP.694.t: "Cultivating Virtue"
#ISP.694.desc: "No one in the group was above 25. Most were not even 18. They had been ripped from university and secondary school on the initiative of the government and its affiliated youth organizations for a few weeks. There was much grovelling, these outings certainly were not popular among all. But the prospect of academic credit dampened complaints. \n\nIn the sweltering sun that hung over the Negev deserts, they were sent to work. Sometimes in the farms, other times in construction building homes and roads and railways. \n\nOne of them, Liron, was digging a hole in the dirt. He had by him a boy he never met before who waited for him to finish, so he could place a fig tree in the hole. As the hours went on, the two began to talk. The boy was not much older than Liron. Before long, they began to exchange stories and jokes as they worked. It was not long before Liron forgot about the heat of the sun and soon after they walked back to their homes in the village. Apparently this boys mother had made Chulnt and Liron was invited to join in on dinner."
#ISP.694.a: "Not all bad I suppose."
#
#ISP.695.t: "No room for reaction"
#ISP.695.desc: ""Just what is the meaning of this?!" cried out Avigdor Lieberman. Haim Katz stood beside him, equally as angry as he put his phone into his pocket. "We've been here since the start" Katz shouted. "You can't just let us go like this!" \n\nA group of men and women stood in front of them in suit and ties. Around the room, wooden hammers and sickles that were painted red or yellow were being hung up by a group of Arab workers. One of the women there spoke. 'We're sorry but, the decision has already been made.'  \n\n'And on what grounds?' cried both in response. The woman responded 'There just isn't any room for people like you nowadays. Especially with the new direction of the economy, you are too old school. Not to speak of the corruption allegations Haim. Our government doesn’t want that look, and neither does the progressive development of socialism fit your reactionary policy, Liberman. We are sorry it has to end like this, and we do appreciate your patriotic work.' \n\nThe two protested, Haim Katz turned and accused them of being anti-semites and traitors to Eber, crypto-Arabs and all sorts of insults. The workers gave the two dirty side-eyes, one spat. Once they were tired out from shouting, some of the workers joined the group and said that they'd need to work alone for a bit. The message was clear."
#ISP.695.a: "An early retirement isn't that bad."
#
#ISP.696.t: "The Joy of Labour"
#ISP.696.desc: "Over the radios and on the screens of hundred thousand TVs the voice of Efraim Sneh shot out across the nation. News of an important announcement had been circulating for weeks, and now hundreds of thousands had come to listen. Following the playing of the anthem, Efraim Sneh began to speak. \n\n"Comrades, toilers of the land, defenders and supporters of Socialist Eber, you know that we have won a great victory. Ever since the deposition of the degenerate reformists our dear fatherland has been thrust back onto the righteous course of Socialism. \n\nBut indeed, the damage dealt to us over the last few decades has been deep and harsh. And to rectify it, a tough choice must be made. The globalist consumerism brought upon us by capitalist roaders has corrupted the masses of the Hebrew Republic of Labour. The Hebrews have lost their spirit of Labour. What happened to the gentle tzabar of 1948? Hyper-surplus and generalised commodity production has made them weak under the aegis of global Capitalism! \n\nTo root out this rot, we have but one recourse. Through socialist austerity and the cutting of funding to bloated parts of the economy, the men of the republic will learn once again what it means to be proletarian. The new capitalist class and corrupt bureaucrat leeches must be brought down. They will know what it means to be workers. Hard though it may be, our nation will end up enriched and strengthened. A new chapter in the book of the Hebrew shall be written.""
#ISP.696.a: "Good grief..."
#
#ISP.697.t: "Blue and White"
#ISP.697.desc: "Efraim Sneh looked out of the window of his office. Above him were the portraits of servants of the revolution from across the world. Tabenkin of course was one, so were Marx, Lenin, and many others. Outside the window flew the Blue and White flags of Eber. They looked over Jerusalem and it moved him dearly. \n\nHe knew that far behind him sat the Western Wall and the Dome of the Rock. What beauty was the triumph of Zionism then? After so many centuries of brutal, vicious oppression by feudal lords, fascist anti-Semites, theocrats, and capitalist dogs, the Hebrew was free and sovereign in his homeland at last. \n\nAgainst the vicious tides of globalism and the erosions of national identity through bands of rootless cosmopolitans, against the infantile revisionists who think socialism is the antithesis of the nation, we must stay true to our Zionist roots."
#ISP.697.a: "And he saw that it was good."
#
#ISP.698.t: "Red Flag"
#ISP.698.desc: "Efraim Sneh was on his way to visit a local union of workers who had been strong supporters of the Communist revolution, and had called for strike action against the reformist government across Eber. Though he was flanked by security agents, Sneh greeted every man and woman he saw on the street as he walked. \n\nHe looked at the banners and flags raised on the roads. Everywhere he looked, hammers and sickles, red banners and stars flew proudly in the street. As if they shouted out to the world "Here is the final victory of the working masses! Arise, ye wretched of the Earth! You have nothing to lose but your chains!" Be it in Hebrew, Arab, Kurdish, or whatever other tongue. \n\nSneh walked with new found mirth and life. The forces of reaction lay dead and rotting. He, and the workers of Eber had come to step over them. Dead and gone were they, forgotten were those who forsaked the lofty ideals of Communist worker unity due to their addiction to Jewish or Arab supremacy. \n\nOver their dead ideals, the red banner stood. It split the heavens filled with whirlwinds of danger and reaction. It announced the coming of a new world! What glory! What joy! "
#ISP.698.a: "Eber today. Tomorrow, the Earth!"
#
#ISP.699.t: "Romance of Two Flags"
#ISP.699.desc: "\"Where is the spirit of Eber?\" asked the teacher to her students. One raised his hand "It is in the star of David Mrs. Goldstein!" Before she could respond by asking if anyone else thought anything another voice interrupted them. One girl said "No! It is in the red flag! My daddy said that the Jew's friends were always the Communists. And so we should be that too." \n\nIt did not take long before the classroom erupted into fights between children just above the age of 10. Goldstein sighed and urged the children to calm down. A few were arguing for the sake of arguing, others seemed to be getting red in the face. When she yelled for quiet however, they began to hush. \n\nAfter a short sigh, she spoke. "Benny, you are right that the soul of Eber is in the star of David. But Gali is right too! Remember children, and never forget. You must be proud to be Hebrew. But also proud of what Eber was built upon." \n\n"And what is that?" asked one of the children."
#ISP.699.a: "Socialism, of course."

ISP.711.t: "The Second Yarmouk"
ISP.711.desc: "Sami tried to push them from his mind but the nagging doubts about the imminent charge just wouldn't subside. He reminded himself he was doing this for his people, for his homeland, for Allah, against the Zionist scum that kicked his grandparents to Lebanon. He would push on. He shook his head and looked up to watch his commander join another in his unit laying low on the crest of the hilltop, reconnoiting the Hebrew positions on the fenceline below them. The plan he was part of was very secret. First, waves of bomber drones would disable the sophisticated camera and radar system along the Golan border. Then he and many more elite PLO fighters will storm border posts, in order to cause as much damage possible while the EDF struggles to respond and take as many Zionist soldiers with them to lebanon. From the sky, many brave Shahids will glide into the Hebrew rear, while thousands of rockets fly with them. His commander received a call over his radio - the mission was on.\n/////\n\"Oh fuck off with this. You've done this too many times that I know not to believe you.\" Tal couldn't believe Noam would try this again, pestering him just because he was working with the intelligence offices. Over the last six months, Noam had called in a few times talking about some bullshit attack at his post just to get Tal in trouble again after the first prank worked - it was pathetic. \"No, really, Tal. Something's big happening. There's gliders and everything. Check the cameras, I promise.\" Tal couldn't believe he was entertaining this. \"Fine, I'll check.\"\nThere was an issue with the cameras. A number of them were down, no signal; the radar system didn't respond either; one was still functional at Noam's post. Tal activated manual input and moved it to assess the situation. \"Oh shit.\" Tal activated the emergency procedures. Noam wasn't lying this time.\n/////\n\"-a racketeer like Lime was killed by his friends or an accident. The only important thing is-\" Revital loved these older movies from the West. They used to be difficult to get hold of, but thankfully they were now showing on regular TV after the rules were loosened a few years ago. Suddenly, to her dismay, the film was interrupted with a siren and a black screen with white text and a news-man reading out a statement. \"A large, concentrated attack has occurred in the Golan Heights. Early reports indicate fighting is still ongoing, but both military bases and civilian populations have been targetted. We recommend that anyone in these border regions should evacuate as soon as possible. This message will repeat.\" Revital's husband, Ben, was out near there today to get produce from the kibbutzim in the region. She scrambled to get her things to go and find him."
ISP.711.a: "A dark day for Eber."

ISP.15.t: "Barak's holiday"
ISP.15.desc: "The People's Council was in chaos. In the days after Ehud Barak announced his resignation, all hell broke loose with various factions, ambitious leaders and radicals vying for power, trying to gain influence and gain momentum off of the anti corruption sentiment.\n\nBut the real power struggle, everyone knew, was taking part inside Mapam. The new General Secretary of Mapam, after all, is to be voted as the prime minister as is tradition.\n\nAs the Mapam center is preparing to convene and vote on the new General Secretary of our glorious United Workers Party, different faction leaders are trying to gather and unify support as to be able to contend against the expected candidate of the establishment, Gabi Ashkenazi. Still, all opposition, whether it is the hardliners who mostly prefer Ashkenazi as a lesser evil, the various reformists of the Simhon and Ramon camps, or even the small progressive and canaanite factions, are too fractured to pose a real threat to the establishment."
ISP.15.a: "Let's see where this leads..."

ISP.750.t: "As Easy As 123"
ISP.750.desc: "Ramon wasn't exactly worried when he had enacted the first so-called free elections in Eber history. Whilst most dictators and garden variety despots concern themselves with rigging the results hard enough that there is nothing a unified opposition can do, Ramon was in the opposite situation: His opposition lay in waste, as liberals continue their support of the man who freed Eber from its Party despots and his rivals - delusional Communists who cant grasp at the loss of their rotten machine on the one hand, and remaining variants of revisionists and other weirdos on the other - are woefully split, unwilling to even begin negotiations. \n\n\It was no surprise that after a day or so of voting, Ramon had won handily. Even if the far-Left and Right unified in some unholy alliance of tyranny, Ramon, with the wide support of most liberals, Orthodox and even Arab parties, had won a simple majority of the votes, the greatest form of political mandate there is. \n\nTherefore, after this nice little ritual, he could get back to work."
ISP.750.a: "Who are we to not dance to the drum?"

ISP.769.t: "People's Front of Judea"
ISP.769.desc: "Within a dimly lit room in front of a banner reading "FOUNDATIONAL MEETING OF THE HEBREW WORKERS FRONT",there sat a row of men and women wearing ill-fitting suits with button pins carrying old labor zionist slogans on them while others wore military uniforms spotting red berets or were seen in factory jumpsuits with hammer and sickle patches sewed on. The man in the center, Efraim Sneh, drank from a small glass of water and prepared to speak. \n\n"Is this thing on-" A loud feedback noise shook the room, causing most of the attendees scattered across the room to cover in their ears and wince in pain, one man fell back causing his folding chair to break. Another woman handled the microphones while two reporters in the back assisted the foreigner who had fell. \n\n"Apologies comrades, we had little time to prepare this meeting after the reactionary capitalist constitution of the traitor Ramon has been passed, laying ruin to the party." The room jeered at the name of Ramon, while only a single reporter remained dead silent as she jotted down notes. "This organization has been formed with one purpose in mind, to unite those true adherents to the lost cause of our nation, we seek to defend our land and labor from the anti-Hebrew and anti-worker agents driving us towards the inevitable destruction brought on by embrace of the western haute bourgeoisie." \n\nThe room gave way to a scattered applause, as the occasional cough or sneeze broke the silence in between long rants about the dangers of "Ultra Kosyginite Deviationism" and the "French Ideology" supposedly infecting the youth of the republic. As Sneh slammed on the table at the high point of a speech, the banner behind him fell, covering one of the party's deputy secretaries beneath it. \n\nMeanwhile, in a government office in Jerusalem, Ramon and his ministers set down to work out a response. “This is but a natural response of those narrow minded anti democratic fools. They cannot comprehend progress. With them out, the party must finally lay behind its dictatorial past.” It was decided. The United Workers Party is dead. It must modernize and renew itself. Long live Labour!"
ISP.769.a: "The Revolution will be anything but televised."

ISP.759.t: "Move Forward!"
ISP.759.desc: "Yorai Lahav-Hertznau sits in his office, nervously waiting for Com-no, Prime Minister Ramon. Inviting the man was an intimidating task, Haim Ramon is not an easy man to contact. It took a lot of numbers and d-mails just to get a hold of the man. The offer isn't an easy one to make either, asking to merge the Progressive and Labour parties is a big ballsy move for an upstart like him. The mere freedom of the Progressive Party is a new thing, long having been a sock puppet of Mapam, subjugated to its national front. Traditionally, it was the interest group of some Ashkenazi white collar workers who were less keen about the governments heavy role in their lives - whether it is economic, or religious in character. However, the newly independent party experienced a swift change of power, with the young Hertznau putting progress front and center for the party once again. Hertznau was still contemplating his choice of words when Ramon walked in. \n\n"Mister Ramon, it's so good to see you." said Hertznau. And there he is, a figure larger than life. The man who broke Mapam's iron fisted rule.  "Likewise Mr. Hertznau.". "And before we start, i'd like to mention that you have done our country a great service sir.". Ramon thanks the man before sitting down. Hertznau spoke again, "Mr. Ramon i believe you've read the proposal i d-mailed you, but just to re-iterate. I believe that both our parties share similar platforms and the same ideals, which you worked so hard for. Since the split of those nefarious dictatorial conservatives puts the camp of democracy and Zionism at danger, I believe a unification would prevent both a catastrophic vote split in our camp, and fill in the missing rank and file with new faces." Ramon nods, "Yes your "Kadima" proposal..” Ramon stops for a second before replying, "Well son i think-"
ISP.759.a: "“that we didn’t break apart one party state just to create another, wouldn’t you agree?”"
ISP.759.b: "“that we must put our country first and move forward.”"

ISP.16.t: "Tough talks at Jerusalem"
ISP.16.desc: ""You're pushing your luck, Ramon." \nRamon wiped away some sweat from his temples, breathed out. "That is why we're here, aren't we?" \n\n"Ditching Communism has ruffled a lot of feathers, Ramon. Many see it as unpatriotic, deeming you a traitor. And the Kremlin is unsure about you as well. If I were you, I'd consider my steps very carefully." \n\nRamon responded, "Just what is it that you want from us? Do you really think I’m a traitor? For what would I serve my country for so long then? I’m only committed to Eber before socialism. I’m only looking to save our country from itself. Can’t you see?" Another man replied "We can't speak for people like Sneh or the Canaanites, but perhaps if we were to receive a boost to our defense spending to protect us from outside aggression and internal terror, everyone here would be in a better position, and many skeptics would be assured you have the nations best interest at heart. Wouldn't you agree?" \n\nRamon raised an eyebrow and said "Are you asking me to bribe you?" The same man responded. "Don’t start throwing around accusations. We are only asking for you to aid the defense of our nation." \n\nAfter pausing for while, Ramon answered:"
ISP.16.a: "I'm sure we can balance the budget in a way that pleases everyone…"
ISP.16.b: "I'm afraid Eber won't bend the knee to autocracy and corruption!"

ISP.17.t: "The Constituent Assembly"
ISP.17.desc: "The expo room was a buzz with noise and excitement. Where there once stood advertisements for new state-sponsored tech-start-ups and military contractors were hundreds, if not, thousands of chairs and stalls. \n\nEach stall was discussing something else. A few discussed policy, but most were celebrating. An hour or so later a voice piped up on a microphone and a hush descended on the hall. \n\n"Ladies and gentlemen! I bid you welcome to the birth of a new Eber! Today shall be the start of a new age, where we the people, create a new freer country!" Cheers and applause filled the land. The man continued, "The ways of the old bureaucratic party state have brought upon us corruption and degeneracy. In order to save Eber, nay, in order to save the Zionist vision, we must do away with the senile corrupt autocracy, we must renew and liberate our country. This change must come from the very basis of things; a great new constitution of freedom!” Transcribers were busy writing away on their laptops as he spoke, while others put pen on paper and began drafting articles for this new Eber. \n\nOne voice declared "restore the right to private property!" and was met with applause. Another said "Down with censorship and repression!" and more applause filled the room. Quickly, the assembly began to devolve into debate and arguing. With a sigh, the man at the podium tapped on the microphone and said."
ISP.17.a: "Everyone please. We have a lot to get through!"

ISP.18.t: "Planning Problems"
ISP.18.d: "Benyamin and Yair sat together, rubbing their temples and stroking their beards. Both were officals overseeing the implementation of the Five Year Plan in the country. \n"I still think we should direct it to Education." pleaded Yair. "They've never given us this amount of freedom to decide before! And it would be the first time in a while we ever pursued education as object for planning goals." \n "It's all good to want to educate the youth, Yair. But look around will you? Much of the country is in disrepair! People are fleeing to the cities in search of work! What we need is to build up industry. A steel mill or a car factory or something, I don't know. But we just don't need that right now." retorted Benyamin.\n Yair groaned as he spoke and yelled out. 'We could build our own industry if they have the tools to do so! And the only way to do that is with education!" Benyamin slammed his fist on the wall in frustration. "That doesn't matter! You're right about all that but it doesn't matter! Educating them all would take god knows how long! This is a five year plan Yair, not a fifty year one!" 
ISP.18.a: "Fine. Education it is."
ISP.18.b: "We're staying with industry."
ISP.18.c: "Perhaps the plan is fine as is."

ISP.19.t: "The House of Cards"
ISP.19.d: "The backbone of the Hebrew Republic of Labour in no uncertain terms is its military. After all, without it would it not have been killed off in 47, 61 or 72? \nBut what is the state's backbone, the gurantor of its security, is also a source of great trouble within. \n\n Ever since 1989, the militarys conservative bloc dedicated to the ideological principles of figures like Tabenkin have been stirring and seething. When reformists like Peres ousted Rabin, a renowned militaryman and a student of tabenkin, conservatives and loyalists have looked at Jerusalem with much hatred and annoyance. These factions of the military brass have by now coalesced around Efraim Sneh, a charismatic general who espouse patriotic loyalty to Communism and defending the revolution from those who seek to prevert it from the line of Tabenkin. \n\n Of course, with changing times come changing minds, and the upper crust conservatives are not alone. Led by Ashkenazi political elites, there are those who while resisting radical reform are more moderate, seeking pragmatic statemenship before all. They are best represented by Barak, who created the current coalition as an attempted reconcilation between the military and the reformist state. \n\n But hidden between the cracks of the thrones of the military giants are dens of black sheep, plotting to thrust the republic into bloody revolution. The most prominent are of course the Canaanites, who call for the divorce of the Hebrew Nation from zionism, embracing their semitic brothers in a National Revolution. A few brigades are under their sway but their true domain is with Arab and Druze militarymen and the Shin Bet internal security agency. Smaller still are some radical Religious Zionists who coalesced around a Romanian inspired National Communism. \n\n Though this house of cards has been stable so far, we must maintain a close eye on it, keeping the guardian of Eber on our side."
ISP.19.a: "Let's hope they don't get uppity!"

ISP.20.t: "E-ducation"
ISP.20.d: "Eva looked over her desk, double checking every last bit of her lesson plan and her schedule for the day. She questioned her readiness to this new style of teaching as her cat ran across her desk, shuffling the loose bits of paper and almost knocking down her coffee cup on the new expensive laptop she got from the school. Ever since the new government started experimenting a replacement of some classes with “online interactive teaching”, and despite all the new fancy tools she received, it seemed strange and foreign to her. The reason she came to schooling in the first place, despite the low wages, was the students and the impact she had on them, and she was very skeptical of those new digitalized methods.\n\nBut when the news of the pay bonus came in, Eva was somewhat reassured. Maybe it would allow her to be more dedicated to her students, instead of worrying about the end of the month.\n\nThe clock rapidly ticked down, across the country her students were in the process of readying themselves her class, and despite her hours of preparation, she wasn't fully sure of herself. She was still trying to understand how all the features of the new AI helper works, or struggling to figure out what a "webp" was and why it wouldn't show up like the other images did.\n\nAs the hour and minute hands met again, her frantic shuffling and reorganizing stopped. Just as the video call with her class began. Whether Eva knew it or not, she was going to be fine, and so were her students."
ISP.20.a: "Meow"

ISP.21.t: "Digitisation"
ISP.21.d: ""Just what is the meaning of this?!" roared Abram Zinoviev as he stormed into his managers office.\n\n"What seems to be the problem Abram?"\n\n"You know damn well what the issue is! You're letting me go? After all these years? for a hunk of metal?!"\n\n"The decision wasn't mine Abram, I'm very sorry. But you know what the new rules about the bureaucracy are, don't you?"\n\n"Well you should have done something Avishai! Pulled a few strings! Anything! Now I've lost my job thanks to you! What am I going to tell my wife? Do you have any idea what you've done?!"\n\n"You can always find a new job Abram."\n\n"Cut the crap with the excuses! I don't want to hear it! If I had any sense at all, I'd douse that computer in water so you know what I’m really worth!"\n\n"Abram. Watch your tone." said Avishai in a steady voice as Abram flipped him off. As the door slammed in his face he let out a groan."
ISP.21.a: "No place for leeches."

ISP.22.t: "Monday in Rumana"
ISP.22.d: ""Hamad!" A voice crowed from the other room. The young man dragged himself out of bed and into his mother's room. "You've been out of school for a year and all you do is leech off us, look at these new jobs the government is providing. 500 shekels to lay some bricks? That's good money, Hamad. We need that." He gave a quick nod and began shuffling back to his room. "No! Stop with all this noncommittal garbage! Apply for it now!"\n\n"Hamad!" The younger, more high-pitched voice  of a young teenager yelled from another room. "What is it, Salim?”\n\n"Can you do this for me?" Salim asked, pointing to an empty notebook labelled 'computer science'. Hamad shook his head and Salim whined: "well, what about anything else?". He threw his school bag at Hamad and he looked through it: computer science, fundamentals of programming, biotechnology, mathematics, philosophy. Hamad sighed and left the room, heading outside. He was going towards the local government office, it was in the next town over but the walk wouldn't be too rough with the road improvements.\n\nAfter arriving at the old, squat building, currently in the midst of a repainting, drenched in sweat with feet ripped to shreds. At least there would be a bus route soon, his friend Imad was on a course for the new job last he heard from him. He limped up to the main desk and sheepishly explained: "hello, I'm here to apply for a job."\n\nThe young Mizrahi woman responded: "sorry sir, i don’t speak Arabic."\n\nHamad looked away, asking in Hebrew this time: "I'm uh, here for the job."\n\n"You could've just applied online, but if you have a resume we'll take it.”\n\nHamad pulled a shred of paper, filled with subpar school grades and covered in sweat and dirt from the trek over and handed it to the woman behind the desk, who then unfolded it with the tips of her fingers and a palpable look of disgust. After reading it, she called in a fat old bald man, who proceeded to take him to the back room.\n\n"Do you have any experience at all?"\n\n"No."\n\n"Are you a terrorist?"\n\n"No."\n\n"Are you a drug addict?"\n\n"No."\n\n"Will you steal from us?"\n\n"No"\n\nAfter checking off some boxes, the man exclaimed:"
ISP.22.a: "You're hired!"

no_more_samson: "Samson Option failed"

ISP.23.t: "Sticking to the plan"
ISP.23.d: "All outside the secretariats office, there was a massive hubbub. Ever since the latest decisions made by the state planning committee, his hand was forced to implement threats against the Kibbutzniks. And now, inevitably, they were here to protest.\n\nBoards saying PEOPLE BEFORE PROFIT! and COMMUNISM FOR THE WORKERS NOT FOR COMPUTERS! were held by the protestors outside, who were angered by his announcement that their chicken co-operatives would be brought into a state-allied company if they did not bring themselves up to new production standards. For the last 12 hours, they had not stopped shouting and demanding change. A few had even set up encampments and fighting some police officers to boot.\n\nThe secretary began to think just when this would cool off. If it got really bad, he'd need to call in for more security. But one thing was for sure, he thought to himself."
ISP.23.a: ""I'm never getting re-elected at this rate!""

ISP.24.t: "The Slow Life"
ISP.24.d: ""Can we move the lamp?" said Roni, "It's just not working for me."\n\nYSVH-1 motors whirred up and its hydraulics lifted back and forth, carrying anything but farm equipment or spare produce. Among the many things the new farmhands spent their allocated funds on, he was one of the few things really relevant to farming. But since they surprisingly enough did most of the farm work themselves, YSVH-1 ended up as less of an agricultural aid and more of a homesteading assistant. If YSVH-1 had real feelings, at least complex ones, it would probably be confused but charmed by the naive optimism and passion these kids had in restoring the farmland they were given.\n\n"Hey, i just set up the spreadsheet, we should have enough funds left to get both the eco fertilizer and-“ Eyal paused “omg are you seriously still setting up for your shot?" He glanced over the reading room, seeing his colleague still busy on what was meant to be a 2 second opening shot. Meeting during their after-military trip to Bolivia, they quickly became close friends, sharing a common fascination with rural life, and the neo-kibbutz cultures they aspired to revive. And yet, while it meant they loved to discuss and debate different GMO stands to plant or making fun of ‘monoheads’, it also meant half of their time was spent bragging about how good they had it on social media.\n\n"Oh shut up Eyal, I'm almost done here."\n\nYSHV-1 had finally placed the lamp out of frame, accidentally knocking over some books in the process. "Oh come the fuck on, this is like never getting done at all." Eyal bemoaned "We still have shit to do today, we barely even started setting up the new irrigation system, or readying the ground for the live stock. And believe me when I tell you this experimental Duck variant came with sooo many special care specifications." Roni put down her phone and helped to pick up books alongside YSHV-1, glancing at some of their covers. It was old Labour Zionist literature, from the original owners of this place. She had an idea.\n\n"Let’s try a new Video format today, I just got a whole different vibe here!""
ISP.24.a: "hashtag countrylife"

ISP.25.t: "Habah Lehorgecha..."
ISP.25.d: "Simhon was sorting out the government paperwork in his office like any other day. It was quite a busy day indeed. Many new policies were approved by the national council recently. His work was interrupted as someone knocked on his door. "Come in" Simhon said as he returns back to rechecking the current government budget. He’s got to make sure everything is in place. The door opens and comes in one of his younger personal aides. Quickly and quietly he laid down a paper on his desk. The door opens and comes in one of his younger personal aides. Quickly and quietly he laid down a paper on his desk.\n\n"Due to our recent technocratic campaign... we finally have an opportunity to remove the radical clique of Ramon out. This will solidify and entrench our power in this government. I highly recommend we go over with this plan.” "Are you sure about this?" Simhon raises a question. He can't afford another mistake now couldn't he? "I have calculated everything with the information I gathered here today. With 100 captaincy Sir, they do not have enough power to resist it by this point. And… just think how much more efficiently we could manage Eber without their burden."\n\nSimhon raises an eyebrow and looks back down to reread the content of paperwork back and fourth, checking everything the paper said. He now realizes there wouldn't be another opportunity like this any time soon. It’s the perfect guise for a purge. So the question is should he do it? Should he sacrifice his "friendship" with Ramon over his vision of the future? Is the progress of Eber important enough to endanger the democratic breath of air the new reform coalition brought?\n\nSimhon looks back up at his aide;"
ISP.25.a: "Go ahead and notify Ramon of his early retirement."
ISP.25.b: "Nonsense! We will not sacrifice democracy for such petty reasons."

ISP.26.t: "Light unto the Nations"
ISP.26.d: "“Hello, can everyone hear me?” Eva asked as it seemed that the last of her students entered the virtual conference, “good, so we can begin.” Eva acclimated to the new teaching methods much better than she expected. Getting praises for her virtual lessons and the engagement she managed to create with the students, she was sent to a newly created “Philosophy and Dialectical Materialism for the Modern age” course and upon her return was appointed as the philosophical director for the high school. While the pay raise was nice, she was a bit sad to move from her previous teaching subjects, History and Sociology. And she was quite stressed too, as it was her first lecture on a topic she just learned herself not long ago.\n\n“Today we are going to talk about the role of our people as a Light unto the Nations, in the modern context. As our Hebrew homeland is established and thriving, and leading in so many technological breakthroughs, it seems that the biblical prophecy of Isaiah is coming true. But the great role of our tiny people as leaders of scientific breakthrough worldwide comes at a cost, and raises many questions - some may ask, for example, if this does not mean the necessity for our people to show greater moral character and act as a moral-spiritual as well as technological lighthouse to the-“ she was interrupted by a student. “I’m sorry Eva, but, this reeks of Jewish-Idealism. What about socialism? This can’t be the way we learn philosophy, my big brother told me that-“\n\nEva muted the student and continued: “next time you can click here and it will show me that you want to talk. But this was a great question! The modern interpretation of this concept must of course, come from a secular, socialist, philosophical perspective - this is the dialectic. Eber must, as a modern light to the nations, take a leading role in the socialist cooperation of the brotherhood of progressive people’s, leading to further human advancement and prosperity, to the next stage in our understanding of the cosmos as conscious Humanity - but for this to be, we need each and every one of you. This is what I want all of you to take from this lesson - the special role of our people puts a great responsibility on your shoulders, to be the vanguard of human progress. This is why each and every one of you, in whatever you may do, whether you will be a farmer, a software developer, a doctor or a rocket engineer, must show the greatest diligence, the greatest passion, to surpass, to overcome, to go into the unknown.\n\nYou are the generation of true human potential Marx and Engels spoke of 150 years ago. I want you to go from this lesson with burning passion for knowledge in your hearts, knowing -"
ISP.26.a: "You are the Builders of the Future."

ISP.27.t: "A Better System?"
ISP.27.desc: "Ramon sat down, he had worked hard for this day to come. The reform process is relentlessly advancing, the dictatorial backwards party state falling apart, day after day. But first, an issue must be settled. \n\n"Gentlemen, have a seat. The session will soon start", Ramon slams his gavel and so begins the daily session of the constitutional convention. "First item for the day, on the electoral system of the Republic.". Ramon sighed, it's time to debate the topic. As different representatives rose to outline their suggestions, the delegates seem to have consolidated around 3 main options. The first is to keep the original system of constituencies, but removing the existing obstacles and gerrymandering to allow it to be truly free. This option is favored by much of the nomenklatura, as it allows regional party bosses at least a decent chance at keeping their seat. Next is a "National Proportional Representation" idea, supported by many of the young reformists who see the regional first past the post system as unfair, claiming that our country is too small for regionalism and representation must be directly according to the percentage of votes. Lastly is the presidential proposition, supported by some radical europhiles and also preferred by Ramon and his close clique, they argue that the old parliamentary system separates the people from the choice of the executive too much, leading to the bureaucratic alienation we have seen so far. They call instead of that for a strong president elected in a two round system requiring 50% of the vote, and a less prominent, and truly separate, legislative authority. \n\nAfter hearing the propositions, it all came down to a vote;"
ISP.27.a: "We'll keep the old constituencies, without limitations it’ll work just fine."
ISP.27.b: "The kids are right, we're too small for region-based seats."
ISP.27.c: "Only a strong president can act for the people instead of party bureaucrats and interest groups."

ISP.3.t: "And Eber Bleeds!"
ISP.3.desc: "\"30 kidnapped, at least 200 dead. Many more injured. A handful of tanks and a dozen APCs destroyed or captured. And that is just in the Golan. In major cities like Tel Aviv or Jerusalem, even in Eilat, houses have been damaged. At least a dozen injuries there. And damages...\"\n\n\"Enough.\" [ISP.GetLeader] groaned. \"I get the picture. What bastards are responsible for this?\"\n\nOne voice said "A few people have said it could have been the syrians. But all signs point to the PLO, the attack came from the Lebanese side of the border. They struck very deep indeed too, some reports say even into Buq'ata."\n\nAnother minister said "And there is of course, also the refugees. Around 12,000 seem to have fled during the way as the news of the terror attack ammassed."\n\n[ISP.GetLeader] said "Then is there any doubt on what needs to be done? What is the state of the army..?"\n\nA general in their midst replied "Well, forces in the Golan took heavy casualties. Along with injuries, perhaps nearly a thousand."\n\n[ISP.GetLeader] yelled "Then call up men from the south! Mobilise every division throughout the country as soon as possible. Go and strike those creatures in Lebanon! Grind them into the dust! We are in a state of war with those animals now!"\nHe muttered to himself, "Just look at what those *things* have done." As he glanced at the photos of homes, caked in blood.\nThen the phonecalls came in. From Moscow, from Paris, from London, from whatever warlord that happened to be in Washington at the time, not that [ISP.GetLeader] could remember. Of course, nothing from Tokyo or Cairo.\nCairo... Fucking Cairo! "Goddamit!" He thought. "Make sure some men stay on the highest possible alert in the south. You never know what will come from Gaza."\n\nAnother general piped up "And in the West Bank too. We ought to be careful we don't get another Intifida on our hands..."\n\n[ISP.GetLeader] sighed..."
ISP.3.a: "What do we tell our citizenry?!"

ISP.712.t: "A Punch to Damascus?"
ISP.712.desc: "In recent days, clashes with Syrian forces in Lebanon had intensified. There had been small shootings every now and then, but now both sides were getting braver and bolder. And in the Golan, the situation was practically the same, if not more worrying. For at least when in Lebanon, there would be no direct confrontation on their land. But in the Golan, the problem was multiplied. Border skirmishes and rouge rockets there had led to a number of Hebrews fleeing from their houses to avoid the war and the risk of outright war had begun to intensify, with speculators noting the increasing revanchist rhetoric of the strongman Riad, repeatedly talkings of the “stolen lands” of the Golan.\n\nAs such, a key choice has to be made. As the war escalates, some have begun to call for a direct attack on Syria by striking their bases and city centres, citing a desire to deal with Damascus' Islamists aggression once and for all. While others have argued that growing the war is an irresponsible decision as our hands are already full in the mess of Lebanon."
ISP.712.a: "We cannot suffer infringements of our sovereignty!"
ISP.712.b: "We must hold, for now."

ISP.1948.t: "And Ambition Destroys its Possessor"
ISP.1948.desc: "Mordechai awoke to a sun obscured by clouds. The sleeping pills had left him feeling groggy. He rubbed his eyes and went downstairs. As he poured himself some cereal, he turned the TV on and switched it over to the news. \n\nWhat he saw jolted him fully awake. Since 1947, Mordecai swelled with pride of how his homeland had grown to be a staunch bastion of socialism in an otherwise backwards corner of the world. The recent developments of Haim Ramon’s nazi bullshit had filled him with immense grief and frustration. 70 years of blood, sweat, and tears and this traitor to everything Eber stood for had come along and spat all over it! \n\nWhich is precisely why a smile began to stretch across his face as he saw the announcement that tanks and soldiers had begun storming government buildings across the country. In Haifa, Tel Aviv, Jerusalem, and Hebron! It was finally happening! That blasted fool was being taken down! The familiar face of Efraim Sneh and the less familiar face of Omer Bar-Lev appeared on the screen. \n\n"My fellow Hebrews. Today the Armed Forces, together with the Shin Bet, has undertaken a special operation across the country in the name of protecting the sanctity of our socialist republic from capitalist roaders who seek to corrupt her." Sneh declared "The actions of the traitor Ramon, which saw the breaking of the power of the workers of this nation and the opening of the country to the capitalist model of private property, so that it may be sold to the elites of Paris have not gone unnoticed nor unpunished." Bar-Lev added, to the apparent surprise of his co-conspirator "I assure you all, we will not tolerate any attempts at perverting the course of the revolution of our Republic of Labour. Socialism, which entails a love for all people, and our national spirit of labour and camaraderie, run deep within our veins. We are proud to declare on this day the establishment of a temporary government of national salvation which will act in courage to restore order and vigour to our nation." \n\nThe news anchors quickly returned to screen and Mordecai could only laugh with joy. As he punched the air he shouted: "
ISP.1948.a: "\"Am Yisrael Chai!\""

WNE.211.t: "Syria declares war on the Hebrew Republic!"
WNE.211.desc: "Ever since the start of the recent war in Lebanon, tensions between the Hebrew Republic and Syria have mounted. While both sides seemed to purposefully avoid war, recent escalations have made tensions reach a breaking point. The government in Damascus stated that Hebrew strikes on Fatah targets in Syria are an infringement of the sovereignty of the country as well as supposed “Judeo Bolshevik crimes” in Lebanon and even the world have forced the hand of the Syrian nation and Muslims everywhere to act. As such, they levied a declaration of war against Jerusalem.\nIn what has proven to be the biggest escalation of the conflict since the Yom Kippur War in 1973, Syrian soldiers, together with Islamist militias have invaded the Golan heights from every direction.\nThe Hebrew government has pledged that it will be victorious against the Islamist government in Damascus while the Syrians promise the recovery of lost ground in the Golan heights and to put an end to the “Zionist crimes” in the region."
WNE.211.a: "Concerning!"

WNE.212.t: "Egypt goes to war!"
WNE.212.desc: "Following the recent announcement of the Syrian government of a declaration of war against the Hebrew Republic, the Egyptian government has followed suit and declared war in turn on the country.\nThe new radical government has condemned past peace treaties signed with the Hebrew Republic as the anti democratic acts of traitor servants of the new world order. That the only righteous path for the Egyptian nation is thus to take up arms and quash \"the Judeo-Bolshevik menace\" and put an end to purported crimes against the Palestinian and Lebanese people.\nThis unprecedented escalation in the conflict is no doubt a gargantuan risk to the republic, as they are fighting again on multiple fronts, now against a much more modern Egyptian army. Can the miracle of 61 happen all over again?"
WNE.212.a: "Troubling and disturbing."
SCAPA: "Semitic Cooperation and Peace Association"
PFLA: "Popular Front for the Liberation of Arabia"
SHAM: "Ittihad Al-Sham"

ISP.14.t: "More than a name"
ISP.14.desc: "Ramon sits at his office, contemplating. He is just a couple dozen steps away from the constitutional convention, where he by now holds all the cards. Now it's just a matter of choosing. Four folders are spread across the table, each having a thin collage of papers with laws regarding the official name of the state. The constitutional convention has almost finished its role. The dream of freedom has finally come to Eber, and the deniers of it seem to be on the verge of collapse.\nThe first folder is basically the original law, retaining the name "Hebrew Republic of Labour". The Republic of Labour may no longer be a socialist party state, but perhaps this is exactly the time to not get hanged up on semantics, to not anger any more people and let the real, substantial change, occur. And he is still a Socialist and Labour Zionist, despite his commitment to freedom and democracy, Ramon reminded himself.\nThe second folder had the words "Hebrew Republic" on it, an alternative to the current name. Used from 47-51, it's the old name for the state before Tabenkin consolidated his party-state. Many view it more positively, as a return to the original democratic intention of the founding of the country. But many view this previous form of the state, which resulted in the party state, as something failed, of the past, that we shouldn't strive returning to.\nAnd thus comes the third proposal, the "State of Eber". Some see it as a more natural and native name in Hebrew, rather then importing the European "Republic". Moreover, it may come to signal a greater break of the new state from everything preceding it. Instead of returning to the pre-communist period, its a completely new era for the country.\nFourth and most radical - the "State of Israel". Suggested by some Jewish intellectuals and liked by many in the diaspora, the name seeks to do away with the overwhelming distinction between the Jewish community worldwide and the Hebrew community in Eretz Yisrael. Recalling the identification of us all as "Am Yisrael", and despite our everlasting openness to Aliyah, it comes to advance the notion of our country as the home of all Jews worldwide, hoping to make religious and diaspora Jews more comfortable in face of the perhaps unwelcoming secular Hebrew identity.\n\nTime is ticking, Ramon looks at his watch. He has 5 minutes until the opening of todays assembly, and he knows that he must show his endorsement of one idea today. After some very-very careful consideration, Ramon picked-"
ISP.14.a: "Actual Freedom must come before semantics."
ISP.14.b: "The second, we need to signal a return to democracy."
ISP.14.c: "The third, we must show the beginning of a completely new age for Eber!"
ISP.14.d: "The fourth, the Jewish homeland must be for all Jews!"

ISP_the_edf_focus: "The EDF"
ISP_expanding_the_sayarot: "Expanding the Sarayot"
ISP_expanding_the_sayarot_desc: "Once again we must expand our Special forces capability. More of them need to be engaged in a specialised environment such as desert, urban and countryside. All for preparation against all enemies of our great nation. Be it the Hashemite Kingdom to the east or the Syrian Hawk and especially with the nature of warfare nowadays - it’s terrorist to the north, making much of the large army warfare of the past obsolete. No matter who they are or what they want. The Republic and her excellent special force will always stand proud and triumphant against her adversaries."
ISP_modern_sadeh_doctrine: "Modern Sadeh Doctrine"
ISP_modern_sadeh_doctrine_desc: "Yitzhak Sadeh’s military doctrines were essential in our victory and independence in 1947. He developed the Haganah into capable fighting forces, able to defeat the British and foreign Arab imperialists instead of just Kibbutz guards. His doctrine of mobile warfare, combined with a more egalitarian military and bolstered by popular mobilisation in times of war are needed now more than ever."
ISP_peoples_war: "People's War"
ISP_peoples_war_desc: "When we fight, it must not be only a few elite soldiers who fight. Rather, the whole population, the whole Hebrew nation, must stand united to overthrow and resist the foreign menace who threaten our way of life. An armed population after all, is a population capable of fighting back against foreign occupation. The resistance of armed masses is an immovable force."
ISP_the_ingenuity_of_man: "The Ingenuity of Man"
ISP_the_ingenuity_of_man_desc: "The machine shall never triumph over the man! The cold, soulless beast can never beat the thinking man. Machines may carry unprecedented calculator power. But only a living soul can win the war. The genius of humans is their creative streak. They see past tables of data and pure facts. They can think, and improvise! Such skill is what wins wars. And such skill is why we must stay with flesh and blood."
ISP_rearming_the_yishuvim: "Re-arming the Yishuvim"
ISP_rearming_the_yishuvim_desc: "The Working Class shall never be disarmed! The basis of our popular rule, of our sovereignty, must and will be a ready armed population. Only such a people can resist the foreign invader, and carry out revolution. Behind our diplomacy and kind words must always lay a strong, deterrent force. Behind our grand forces of defense, must lay an armed population, ready to give the very first answer to any threat even before professional assistance comes. Let our reservists and veterans be armed and ready, in every village!"
ISP_so_every_hebrew_mother_knows: "...So every Hebrew Mother Knows"
ISP_so_every_hebrew_mother_knows_desc: ""It is not enough for the commander to know his profession. He must love man, so that the life of all under his command will be dear to him and the soldier sent to him will be dear to him, so that he will love him… Only such a commander will find in his men the soul-dedication which will guide them wherever he sends them. If the commanders inspire trust, devotion and love for their soldiers - only then will every Hebrew mother know that she entrusted the fate of her sons in the hands of commanders who deserve it.""
ISP_spirit_of_the_hebrew_rebellion: "Spirit of Hebrew Rebellion"
ISP_spirit_of_the_hebrew_rebellion_desc: "Rebellion is in our blood! One of the greatest revolts faced by Rome came from the Hebrew man under the leadership of the auspicious Bar Kokhba. We fought hard with our Russian friends during the revolution in 1917. And our ancestors rebelled again and again to gain our independence. They did not just rebel against foreign political dominance, but the international financial system of capitalism too! To be Hebrew is to rebel! If revolution is in our spirit, we must make sure the mood of revolution lays within the minds of the soldier and people alike. The Hebrew Rebellion Movement which freed us from the British yoke must be remembered and studied, it’s lessons applied to the modern world, it’s revolutionary virtues engrained in our people."
ISP_combined_arms: "Combined Arms"
ISP_combined_arms_desc: "A Combined Arms is an unique tactic that seeks to integrate various combat arm forces such as Infantry, Armory and Aerial into one single organised team, manoeuvre over the enemy force through the scouting troops, the breakthrough of tanks and ground support of both jets and artillery in tight close coordination together in many different situation allow for for maximum combat achievements to be gain in warfare."
ISP_striking_as_lightning: "Striking As Lightning"
ISP_striking_as_lightining_desc: "Prolonged and sustained warfare is something which is always costly and highly negative. Our theory of warfare must act accordingly. We will strike fast, strike with determination, and strike hard. The banging of artillery on the enemies frontlines followed swiftly by a gargantuan offensive of land action will overwhelm them and give us a swift victory."
ISP_art_of_fast_war: "The Art of Fast War"
ISP_art_of_fast_war_desc: "The ability to outmanoeuvre our enemy through mobile and fast paced war can make or break any military campaign. Not only that, but fast moving vehicles can provide our soldiers with essential resources, ensuring they remain supplied and safe."
ISP_towards_a_fifth_merkava: "Towards A Fifth Merkava"
ISP_towards_a_fifth_merkava_desc: "The Researchers team finally presented us with the first ever Fifth generation Merkava known as “Lighting”, equipped with highly innovative VR headset “Iron Vision” allowing forTank Commander to link in with a turret camera and see the area in 350 degrees. Furthermore, it will enhance the protective shield in the surrounding dome and turret against the upcoming targeting drones. This will be greatly beneficial for the entire armed forces once put into service!"
ISP_expand_namer_production: "Expand Namer Production"
ISP_expand_namer_production_desc: "The Namer is an armoured personnel carrier based around EDF main battle tank, the Merkava. With the additional release of the Fifth generation of Merkava, simultaneously came with our new responsibility for the APC to modify and develop into a new state of production. We will contact and request the defence industries to invest more heavily on the new type of Namer and put them into service as soon as possible."
ISP_the_galil_and_beyond: "The Galil - And Beyond"
ISP_the_galil_and_beyond_desc: "The IMI Galil is our local kalashnikov based rifle designed by Yisrael Galili, also known for his creation of the infamous Uzi submachine gun. The Galil is commonly used among standard issue EDF equipment and highly adored by the soldiers and public alike for its reliability under hot and dusty climate, simple, easy to use and lived up to its expectations for many fans in our nation and beyond. There’s many further improvements that can be made with the Galil so let keep 'em coming!"
ISP_modernizing_the_tomats: "Modernizing The Tomats"
ISP_modernizing_the_tomats_desc: "The Tomats or shelling  Artillery is one of the vital components among EDF units. Without it we wouldn’t be able to hold our position and defend ourselves against the United Arab Republic in the past. It’s highly obvious to anyone that the next logical course of action is to modernise the Artillery’s capability, making it launch faster, reloading quicker, anything that aids the effectiveness of its firepower will help us to withstand and change the tide of upcoming war."
ISP_overwhelming_firepower: "Overwhelming Firepower"
ISP_overwhelming_firepower_desc: "Constantly keeping the enemy under pressure is another trait for our Artillery corps. Making them softer and unable to retaliate back while our troops advance into the frontline and tackling them one by one, is the ideal scenario. In most cases this can be done easily by deploying large amounts of Artillery units into position via transport truck or train networks. Ensuring that our enemy cannot let a single peak in the open is quite easy for us."
ISP_accelerating_lahav_introduction: "Accelerating Lahav Introduction"
ISP_accelerating_lahav_introduction_desc: "Introducing the next generation of Multiple rocket launcher unit, Lahav. Lahav has come with its own advanced navigation systems, incorporating both INS (inertial navigation) and GPS together as well as faster firing speed and better accuracy compared to previous M270 launchers. Although it hasn't seen much combat yet, tt’s surely will send terror and frighten our enemy into surrender. More of them will need to be assigned to our unit so it’s best in our interest to keep accelerating the production."
ISP_only_the_best: "Only The Best"
ISP_only_the_best_desc: "Improving more upon our special force to hit harder and better is the correct way to go. However, the massive influx of conscription has led to a decrease in quality of the unit itself. Hence why we must stiffen the requirement for the Sayarot, reconstruct them back to the same legendary status. The rest that didn’t make the cut will either be put in reserve or assigned back to the main force."
ISP_truly_modern_warfare: "Truly Modern Warfare"
ISP_truly_modern_warfare_desc: "Warfare has come such a long way from man using rock to spear and bow then came with invention of gunpowder, tank, jets and now with the latest addition of technology like Drone and Artificial Intelligence Robots which will accompany us in the future battle against those who threaten to destroy our existence. Let's begin the research, production and refine them into state of the art modern warfare that no one will ever see before!"
ISP_ct_specialization: "Counter-Terrorism Specialization"
ISP_ct_specialization_desc: "For the most part our nation has been relatively peaceful from the outside observers but this isn’t entirely the case as there's a secret underground movement that dedicates their time and money to sabotage our regime’s efforts. The PLO attempting again and again to attack us from their northern bases in Lebanon, or to stir terrorism from among our Arab populace - for a modern warfare moving away from the big battle and towards irregular terrorist tactics, we must fight smarter, in unique and different ways."
ISP_rigorous_training: "Rigorous Training"
ISP_rigorous_training_desc: "Even if we are to have high technology, supply or equipment. An inexperienced staff without proper outstanding protocol and function will inevitably undermine our force. Thus, extensive and wide-range training must be our priority, without it our armed forces will always be fatigued and easy prey for our opponent to counter. We can’t allow this to happen."
ISP_cutting_edge_equip: "Cutting-edge Equipment"
ISP_cutting_edge_equip_desc: "Finally we have arrived at the same capacity with the rest of the world in terms of technology production. But that’s still not serviceable as we always need to be one step ahead of our adversaries, therefore creating a special research team exclusively for the 21 century tech will be highly useful for the EDF, not only we can try to experiment with other nations' prototypes, we can also coming out with our own unique design as well."
ISP_importance_reconaissance: "The Importance of Reconaissance"
ISP_importance_reconaissance_desc: "With proper gear and an astonishing army. Many would think this will be sufficient enough to charge ahead for victory but that would be mistaken as they missed only one crucial element that is the terrain planning. With precise knowledge of the environment and careful battleplans, these  will help negate the risk for us leading to minimal losses for both manpower and equipment. No need for long and exhausting resupply and repair."
ISP_further_spec_expansion: "Further Special Forces Expansion"
ISP_further_spec_expansion_desc: "The expansion of Special Forces is a requirement if we wish to survive the upcoming turbulence time. A highly trained and well equipped elite unit is what we need the most and not those mediocre masses of low trained and cheap units. No offence, but it’s imperative for us to keep expanding the protocol with more training, better equipment, life changing lessons and anything that will be beneficial to our victory."
ISP_beyond_human: "Beyond Human"
ISP_beyond_human_desc: "With the new developments in technology relating to the modification of humans, we cannot afford to be left behind. Minor mechanical modifications to our soldiers can help them perform far more effectively in combat against terrorists or enemy armies."
ISP_hitech_war: "Hi-Tech War"
ISP_hitech_war_desc: "Much of our equipment is woefully out of date. Some guns are soviet-made weapons left over from the 70s or 80s. Technological inferiority may very well be our death knell. By directing mass investment into new technologies and modern weapons, we will ensure we don’t fall behind."
ISP_war_without_blood: "War Without Blood"
ISP_war_without_blood_desc: "The greatest cost of war is the cost of blood. We can rebuild destroyed homes and roads. But we can never resurrect the dead. We can never reverse the pain of a mother who lost her son. If, then, we were able to find a way to wage war without spilling blood, it must be our top priority. It may be costly, but utilising remote weapons, such as drones, or robots to fight our enemies then we will have secured even our children from death!"
ISP_ensuring_high_morale: "Ensuring High Morale"
ISP_ensuring_high_morale_desc: "War is folly if no man is willing to fight. War is folly if the soldier believes he is doomed and is not willing to fight. But if they have morale, then certain death cannot assuage them. They will fight to the bitter end, filled with pride and faith in their nation. They will become martyrs and their comrades will look upon them with love and a burning desire to avenge them. \n\nOur soldiers must remember what they are fighting for. If they do so, they will be filled with the rigour to fight another day."

#Sneh
SNEH.1.t: "The Joy of Labour"
SNEH.1.d: "Over the radios and on the screens of hundred thousand TVs the voice of Efraim Sneh shot out across the nation. News of an important announcement had been circulating for weeks, and now hundreds of thousands had come to listen. Following the playing of the anthem, Efraim Sneh began to speak.\n\n"Comrades, toilers of the land, defenders and supporters of Socialist Eber, you know that we have won a great victory. Ever since the deposition of the degenerate reformists our dear fatherland has been thrust back onto the righteous course of Socialism.\n\nBut indeed, the damage dealt to us over the last few decades has been deep and harsh. And to rectify it, a tough choice must be made. The globalist consumerism brought upon us by capitalist roaders has corrupted the masses of the Hebrew Republic of Labour. The Hebrews have lost their spirit of Labour. What happened to the gentle tzabar of 1948? Hyper-surplus and generalised commodity production has made them weak under the aegis of global Capitalism!\n\nTo root out this rot, we have but one recourse. Through socialist austerity and the cutting of funding to bloated parts of the economy, the men of the republic will learn once again what it means to be proletarian. The new capitalist class and corrupt bureaucrat leeches must be brought down. They will know what it means to be workers. Hard though it may be, our nation will end up enriched and strengthened. A new chapter in the book of the Hebrew shall be written.""
SNEH.1.a: "Good grief..."
SNEH.2.t: "Cultivating Virtue"
SNEH.2.d: "No one in the group was above 25. Most were not even 18. They had been ripped from university and secondary school on the initiative of the government and its affiliated youth organizations for a few weeks. There was much grovelling, these outings certainly were not popular among all. But the prospect of academic credit dampened complaints.\n\nIn the sweltering sun that hung over the Negev deserts, they were sent to work. Sometimes in the farms, other times in construction building homes and roads and railways.\n\nOne of them, Liron, was digging a hole in the dirt. He had by him a boy he never met before who waited for him to finish, so he could place a fig tree in the hole. As the hours went on, the two began to talk. The boy was not much older than Liron. Before long, they began to exchange stories and jokes as they worked. It was not long before Liron forgot about the heat of the sun and soon after they walked back to their homes in the village. Apparently this boys mother had made Chulnt and Liron was invited to join in on dinner."
SNEH.2.a: "Not all bad I suppose."
SNEH.3.t: "The Model Citizen"
SNEH.3.d: "\"You're being too close minded Ehud...\"\n\n\"I'm just looking out for our daughter is all! I don't want her going out with some.. geezer with no future!\"\n\n\"Well, say what you want Udi.\" a third voice popped up. It was Gil, Esther's brother.\"But I know a fair few things about this boy, and he's a real model citizen!\"\n\n\"How so?\" he asked.\n\n\"He is an exemplary Tzabar! Well not quite there yet, but he's got some backbone! He is not afraid of hardship, he is working on himself, and while he might seem a bit rough on the outside, i can assure you he is a gentleman and a patriot with strong values.\"\n\n\"Oh please, do not go on about that nonesense.\" Ehud laughed. \"Nonesense? The Tzabar is nonesense to you? Is this country nothing for you? Gentle, Athletic, Intelligent, self sacrifcing Men and Women like him built this country. But for you, values mean nothing. The man 'with a future' you want for Esther is just a spoiled, rootless individualist from a rich Ashkenazi family\". Ehud scoffed.\n\nEsther joined in. \"Your ancestors were one of them too. They had to have been to escape...\" she stopped herself and a slightly pained silence fell over them.\n\nAfter a few seconds of fidgeting, Gil spoke up. \"Look, I'm not saying you have to take him in as your son or whatever. Just, the boy has promise. People like him built this nation. And so it stands to reason we'll need them in the future too! Can't you at least think about cutting him some slack?\"\n\nEhud sighed."
SNEH.3.a: "Fine!"
SNEH.4.t: "The Whole Country a Front, the Whole People an Army"
SNEH.4.d: "\"It beats being shot at, No?\"\n\nIsaac scoffed. \"When I signed up for the military this is not what I had in mind.\" Itamar rolled his eyes and said \"Well regardless of all that, we're getting off here, make sure you let every one else know.\"\n\nThe two got off the jeep. Behind them was a convoy of many other soldiers. Guns were mounted on their armoured cars, just in case there was a surprise attack. Almost immediately, one hundred men flew out, carrying wood and steel beams. Others had megaphones and began to announce the coming of a military labour battalion. Recently, this village had been ravaged by a fire from fault wiring. They declared that within the week, it would be as if it never happened at all!\n\nWithin a few minutes, the group had set up dozens of tents for people to stay in as the others went on to build back their burnt down homes. As the days and nights came and went, Isaac and Itamar focused on building up a local school that had been burnt down. Isaac still scowled at the start, but when he saw the faces of the kids and youths who cried at their black and brown houses and schools, his heart slowly began to ache. When he saw that they were crying tears of joy, he began to forget his first doubts. He could not help but remember the words that Itamar first said to him at the reading group he first met him at.\n\n"From each according to their ability...""
SNEH.4.a: "-To each according to their needs.""
SNEH.5.t: "Red Flag"
SNEH.5.d: "Efraim Sneh was on his way to visit a local union of workers who had been strong supporters of the Communist revolution, and had called for strike action against the reformist government across Eber. Though he was flanked by security agents, Sneh greeted every man and woman he saw on the street as he walked.\n\nHe looked at the banners and flags raised on the roads. Everywhere he looked, hammers and sickles, red banners and stars flew proudly in the street. As if they shouted out to the world \"Here is the final victory of the working masses! Arise, ye wretched of the Earth! You have nothing to lose but your chains!\" Be it in Hebrew, Arab, Kurdish, or whatever other tongue.\n\nSneh walked with new found mirth and life. The forces of reaction lay dead and rotting. He, and the workers of Eber had come to step over them. Dead and gone were they, forgotten were those who forsaked the lofty ideals of Communist worker unity due to their addiction to Jewish or Arab supremacy.\n\nOver their dead ideals, the red banner stood. It split the heavens filled with whirlwinds of danger and reaction. It announced the coming of a new world! What glory! What joy!"
SNEH.5.a: "Eber today. Tomorrow, the Earth!"
SNEH.6.t: "Blue and White"
SNEH.6.d: "Efraim Sneh looked out of the window of his office. Above him were the portraits of servants of the revolution from across the world. Tabenkin of course was one, so were Marx, Lenin, and many others. Outside the window flew the Blue and White flags of Eber. They looked over Jerusalem and it moved him dearly.\n\nHe knew that far behind him sat the Western Wall and the Dome of the Rock. What beauty was the triumph of Zionism then? After so many centuries of brutal, vicious oppression by feudal lords, fascist anti-Semites, theocrats, and capitalist dogs, the Hebrew was free and sovereign in his homeland at last.\n\nAgainst the vicious tides of globalism and the erosions of national identity through bands of rootless cosmopolitans, against the infantile revisionists who think socialism is the antithesis of the nation, we must stay true to our Zionist roots."
SNEH.6.a: "And he saw that it was good."
SNEH.7.t: "Romance of the Two Flags"
SNEH.7.d: "\"Where is the spirit of Eber?\" asked the teacher to her students. One raised his hand \"It is in the star of David Mrs. Goldstein!\" Before she could respond by asking if anyone else thought anything another voice interrupted them. One girl said \"No! It is in the red flag! My daddy said that the Jew's friends were always the Communists. And so we should be that too.\"\n\nIt did not take long before the classroom erupted into fights between children just above the age of 10. Goldstein sighed and urged the children to calm down. A few were arguing for the sake of arguing, others seemed to be getting red in the face. When she yelled for quiet however, they began to hush.\n\nAfter a short sigh, she spoke. \"Benny, you are right that the soul of Eber is in the star of David. But Gali is right too! Remember children, and never forget. You must be proud to be Hebrew. But also proud of what Eber was built upon.\"\n\n\"And what is that?\" asked one of the children."
SNEH.7.a: "Socialism, of course."
SNEH.8.t: "No room for reaction"
SNEH.8.d: "\"Just what is the meaning of this?!\" cried out Avigdor Lieberman. Haim Katz stood beside him, equally as angry as he put his phone into his pocket. \"We've been here since the start.\" Katz shouted. \"You can't just let us go like this!\"\n\nA group of men and women stood in front of them in suit and ties. Around the room, wooden hammers and sickles that were painted red or yellow were being hung up by a group of Arab workers. One of the women there spoke. 'We're sorry but, the decision has already been made.'\n\n'And on what grounds?' cried both in response. The woman responded 'There just isn't any room for people like you nowadays. Especially with the new direction of the economy, you are too old school. Not to speak of the corruption allegations Haim. Our government doesn’t want that look, and neither does the progressive development of socialism fit your reactionary policy, Liberman. We are sorry it has to end like this, and we do appreciate your patriotic work.'\n\nThe two protested, Haim Katz turned and accused them of being anti-semites and traitors to Eber, crypto-Arabs and all sorts of insults. The workers gave the two dirty side-eyes, one spat. Once they were tired out from shouting, some of the workers joined the group and said that they'd need to work alone for a bit. The message was clear."
SNEH.8.a: "An early retirement isn't that bad."
SNEH.9.t: "The Revolution Realised"
SNEH.9.d: "Abdel Aziz sat on a hill overlooking Hebron. It was where he was born 90 long years ago. He had hated the Zionists for the Nakba. Many of his friends and comrades were those who had to flee Eastward as Plan Dalet's fires swept across Palestine. But, it was there he met his dearest friend, Anwar. Anwar was a Communist, an old one to boot. He claimed to have shook hands with Lenin himself and even had a photo of him and Stalin. It was he that taught Abdel Aziz to be one as well. He cursed many of the Labour Zionists, but when Abdel was still a young child he taught him never to curse the Jews.\n\n\"A number of them are workers and peasents. Just like you and me. Their model of Communism is all twisted, and I will fight against it. But remember that Abdel. Remember who our true foe really is!\" Anwar wasn't always popular with the others in Hebron, but he liked him quite a lot indeed.\n\nAs the years turned to decades, Abdel turned bitter. Doubly so as the Hebrew government inched closer and closer to reformism and capitalist rule. But now? Now was different. Ever since the 2nd Revolution, all was right once more. Abdel Aziz looked down at Hebron and saw a red flag flying over it, and he smiled. A few years ago, this would have been unthinkable. And sure, there was still much work to be done for the Palestinians. But the horrors of private property had vanished.\n\nNo one would have to endure the indignity of suffocating rent and the physical tortures of wage labour. No one here at least he thought, as his mind flashed again to how Anwar once shot a landlord dead in the desert and how his father and mother were left to starve by one many years prior. A few years ago, all this would have been unthinkable. It would have been impossible to imagine an escape from the every reaching abyss of capitalist restorationists.\n\nA pang of confusion fled into his mind. Where was his mother? His father? He shook his head to remind himself. He was getting very old now, they were long gone. A tear fell down his eye and he smiled. He was thankful that he remembered to tell one of his friends to visit him at his home on the hill. Mordechai scowled on the phone at him for making him come so far, but he agreed all the same.\n\nThe sun began to set. He remembered one last time all that had happened. And thought what might come? He had seen so much. What was before him was no utopia, that was where he was going next he reminded himself, but it was good. It was freedom. It was more than he could have asked for. As he laid his weary eyes to rest one final time, he saw the red flag wave over Hebron one final time and thought."
SNEH.9.a: "We've won."
SNEH.10.t: "The Old Man, the New Guard"
SNEH.10.d: "Mordechai was impatiently waiting for the announcement of Efraim Sneh. He could feel in the air, in his bones, that something big was taking place. The dismissal of that Canaanite crook Bar-Lev could only mean one thing after all. He watched in excitement as the news screen moved from the reporter to Jerusalem, showing Sneh getting on the podium in front of a large crowd.\n\n“Workers and Toilers of the land! Brothers and Sisters of the Socialist cause! I come before you today to announce a great victory of Socialist Eber. Our grand government of national salvation has fought bravely against the greedy Bureaucrats and capitalist roaders, and today, as order has been restored to the nation, is proud to announce a brave old-new course for our revolution.\n\nMy Hebrew brothers! The path of Tabenkin will not be forgotten! The sacrifices of our pioneers was not for naught! The example of pioneer comrade Tabenkin of patriotic and virtuous Labour will be embraced. The corruption of socialism by Peresite bureaucrats reversed. Let our youth learn the virtue of the pioneer. Let our workers find once again the joy of Labour. Let socialism flourish - let our nation find its vigour once again!\n\nTo you, my brothers and sisters, my dear People, I promise to restore the path of comrade Tabenkin to our nation. To you I promise to restore socialist justice, a true patriotic leadership, which will be the steadfast guard of Socialist Eber.”\n\nMordechai was jolted with joy seeing that Eber truly is not yet lost. Finally, a leader he can trust to be loyal to Eber and put the misguided youth on the right track."
SNEH.10.a: "Tabenkin is Young Again."

#libya stuff
TRP_jdpon_city: "The Home of The Downtrodden Nations"
TRP_jdpon_city_desc: "As the People's Jamahiriya thrives away from its backwards past, many have begun to see our glorious Green Libya as the model for a new world which rejects both Sovietism and Europeanism, in favor of an alternate global order. This order, spearheaded by Libyan efforts across the World, is a pact which gives significant diplomatic soft power for Libya and its allies."
TRP_his_excellency: "His Excellency's Most Stagnant Society"
TRP_his_excellency_desc: "Muammar Gaddafi, the Nation's Brotherly Leader and Guide of the Revolution's central role in Libyan society has also fundamentally resulted in him as a central figure to blame for follies of local governments under him. As projects sometimes falter and ideas of his degrade in quality alongside his own cognition, one may begin to see cracks in what was an untouchable regime for nearly 50 years."

POLITICS_GADDAFI_DESC: "Muammar Muhammad Abu Minyar al-Gaddafi has ruled an independent Libya since 1969, his revolution against colonialism has lead to foreign states jealous of his intelligence and morality to levy accusations of authoritarianism and repression at the saviour of the Arab and African peoples.\n\nOur Brotherly Leader has vowed to continue his neverending crusade against the colonialist powers exploiting Africa and The Arab World, the people of Libya stand with him in his crusade."

#canaanites
 ISP_patriots_in_control: "Director Bar-Lev"
 ISP_patriots_in_control_desc: "Against the ever prevailing tides of separatism, bogged-down conservatives, and liberals who wish to betray the lofty goals of our national revolution, the Antediluvian energy of Earth has broken the soil. It has shot into the sky and covered the land in its light! No more will we be governed by the tyranny of plutocrats and decadent capitalists! We will walk into the glowing future of a united Cannan. By tearing down the false divisions between the Arab and the Jew and the faiths that divide them, we will forge a truly national state of the semitic man!"
 ISP_the_party: "The Party"
 ISP_the_party_desc: ""
 ISP_the_state: "The State"
 ISP_the_state_desc: "The basis of the state as it stands now, is something we need to strive to change. It is on a fundamental basis of purely Hebrew statehood. It does not allow for the achievement of a true semitic unity. By reorganising and restructuring it from its face to its flesh, by tearing apart the oppressive Jewish-Zionist supremacy, we shall establish a truly free secular and democratic state, the basis of an authentic union of Hebrew and Arab."
 ISP_fate_of_the_national_front: "Fate of the National Front"
 ISP_fate_of_the_national_front_desc: ""
 ISP_a_return_to_civilian_government: "A Return to Civilian Government?"
 ISP_a_return_to_civilian_government_desc: "Many within the party have been discussing the current state of governance. Namely if it is right and proper for our rule to continue on the basis of a Military Junta, or if we should transform into a civilian government. Some say that continued military rule will ensure the security of our revolution and allow us the means to not have to worry about gridlock and pesky balances which prevent real, popular change, from being implemented.\nOn the other hand, others have argued that a civilian government will lend us more legitimacy  on the international stage and stability from those who raise their eyebrows at an army ruling in Jerusalem, worrying that our revolution of freedom will just replace one despot with another."
 ISP_the_national_revolution: "The National Revolution"
 ISP_the_national_revolution_desc: "For so many centuries, the masses of the semitic nation have been divided. Divided between faith. Between countries. Between empires. Between economies and kings and tyrants and all! But now we are here to unchain our very spirits! To reconcile the millenium long divisions between us. A true national revolution to reforge the identity of Canaan! Let us be the free makers of our own history!"
 ISP_social_revolution: "Social Revolution"
 ISP_social_revolution_desc: "Our  revolution is not just in our relations with our neighbors. But it must be a social one too! A revolution which scatters to the wind, the ashes of old reactionary culture. And in its place fills it with a new love and adoration for Young Canaan!"
 ISP_sweeping_the_nation_clean: "Sweeping the Nation Clean"
 ISP_sweeping_the_nation_clean_desc: "The nation is crawling with reaction. You cannot throw a stone without hitting a deceptive rat, who intends to betray the ideals of the Canaanite movement! Jewish fundamentalists and ultranationalists who decry us as Hamas or Fatah terrorists in disguise. Those backward pigs are half the reason behind such bloody conflict and war! We must put them to the sword! Such that not even their ashes will be left of them.\n\nNo mercy can be given to the fundamentalists of Islam and Arab nationalists who wish to put our heads on pikes either.\nBut perhaps our greatest enemy is the forces of globalist liberalism within. The most heinous opposition for many reasons. We know our enemies are Jewish fundamentalists or Arab nationalists. They want us dead. They say so. And we reciprocate. But the liberal is a deceitful fellow. They are cunning and may even commend our attachment to peace. But make no mistake! These globalists and capitalist roaders are like the rats which carried the plague to us! They seek not only to pervert the ideals of socialist revolution, but to sell out the country to the world! We shall put these rotten bastards up against the wall!"
 ISP_maintain_shinbet_supremacy: "Maintain Shin-Bet Supremacy"
 ISP_maintain_shinbet_supremacy_desc: "The Shin-Bet, our inner-security organisation, was historically a centre of Canaanite activity before the revolution. Now it must be transformed into the muscle of the state. We will rely on it to root out reaction and terrorists and guarantee the security of the revolution."
 ISP_a_balanced_approach: "A Balanced Approach"
 ISP_a_balanced_approach_desc: "There are benefits to both the shin-bet and the Ye’elim. The former is professional, clean, well-funded and organised (not to mention teeming with well trusted comrades). The latter is the instrument of the Canaanite movement. It held a key role in allowing our uprising to succeed. Not only that, but what better form of showing the success of our revolution than with the Ye’elim, which exemplifies the radical fervour of the new semitic man? One need not come at the expense of the other. We shall pursue a balanced approach of utilising both."
 ISP_expanding_the_yeelim: "Expanding the Ye'elim"
 ISP_expanding_the_yeelim_desc: "The Ye’elim are perhaps the pinnacle of the Canaanite movement. A popular, volunteer militia with its roots in the years long before the revolution. The Hebrew Fighting Units formed a key part of our ability to come into power. We should choose to uplift them over anyone else. The radical youth, the common people, dedicated to violent purging of the nation's enemies will be our weapon of choice!"
 ISP_towards_a_true_peoples_army: "Towards a True People's Army"
 ISP_towards_a_true_peoples_army_desc: "An army of the people cannot be an elite force of a small portion of the nation. To maintain the ideals of the national revolution, we will have to guarantee that everyone plays their part. The conscription of much of the population, its mobilisation in its totality for war and security will not only create a sense of camaraderie and social harmony, but it will guarantee the defeat of any of our enemies! No longer will the Arab be left aside! We will recruit all sectors of the population, by all means necessary. The cries of reactionaries will not be tolerated."
 ISP_a_social_military: "A Social Military"
 ISP_a_social_military_desc: "The military must not only be a force of defense to secure our revolution and the liberation of the semitic world. It must also be a force for social progress. Send the soldiers to the factories and down into the countryside. Where they will work in the factories and the fields. They will build up industry and the economy. They will provide mass education and welfare to people. Provide aid and work where it is needed. The military will become among the only in the world which acts as a force of progress!"
 ISP_labour_armies: "Labour Armies"
 ISP_labour_armies_desc: "If some great earthquake comes and smites our towns and cities. If floods and droughts come and cause devastation, our labour armies will be there. Wherever they are needed. They will descend on the poor and wretched and build up their lives and homes!"
 ISP_the_great_melting_pot: "The Great Melting Pot"
 ISP_the_great_melting_pot_desc: "We shall now move away from the tendency of the army to be only for Hebrews. The armed forces will be our great melting pot. A true focus of Canaanite power and semitic unity! Arabs, Druze, Circassians, Armenians, Christians, Muslims. Any group. Any class. All will come and join. Our army will become more diverse. All will get out of their homogeneous religious bubbles and intermingle. And with it, sectarianism will die and our strength shall double!"
 ISP_national_mobilization: "National Mobilization"
 ISP_national_mobilization_desc: "Revolution is not a matter for geriatric government officials. Nor is it a job for small battalions of radicals. Revolution is a national matter! We will mobilise the whole state. The whole nation. Everyone and everything for an all encompassing national revolution. All will take up arms and all will join until every detail of the revolution has been fulfilled."
 ISP_developing_arab_areas: "Developing Arab Areas"
 ISP_developing_arab_areas_desc: "Some of the poorest parts of the country are the Arab areas. Poverty is rampant. As is unemployment. Infrastructure is in a sorry state and political unrest is a near certainity! To develop the standing of our semitic brothers and to guarantee the development of our nation, let us develop Arab areas and address political and economic disputes wherever they may arise."
 ISP_towards_a_free_socialism: "Towards A Free Socialism"
 ISP_towards_a_free_socialism_desc: "One of our key issues is to sort out the economy. Our revolution is socialist, to be sure. It is one of the greatest forms of the economy to foster collective unity and ensure the progressive character of nationalism. And of course, we are no friends of capitalism. Even still, our model of a free socialism shall be flexible and free of the dogmatism commonly found among Marxian communists. A form of mixed market socialism, where the interest of capital has been wholly subjugated to the interest of the nation and its masses."
 ISP_a_great_leap_forwards: "A Great Leap Forwards"
 ISP_a_great_leap_forwards_desc: "Only the flames of industry and labour can develop the hinterlands. The periphery and backward villages will become utopias in good time. But to do so, a great leap forward is needed. One which will rapidly mobilise all sectors of the population to industrialise, modernise and bring forth unparalleled growth and progress."
 ISP_reuniting_our_people: "Reuniting Our People"
 ISP_reuniting_our_people_desc: "Since 1948, the Jew and the Arab have been sworn foes. Be it the Nakba which drove so many from their homes, or the Arab-Hebrew wars which brought so many Semites to their tragic deaths. Even now, Arabs and Jews alike bomb each other, stab each other, kill each other. It is time to reunite the sons of the land and put an end to years, decades of war! "
 ISP_rise_of_a_new_man: "Rise Of A New Man"
 ISP_rise_of_a_new_man_desc: "With the rise of Canaan, there comes also the rise of a new man! Out and down with the degenerate men and women of the new globalised world! We have no room for cosmopolitans, neither for exiled Jew of the past! What we desire is a strong, proletarian people. United in their love for Canaan and peace and their hatred for the despicable forces of imperialism!"
 ISP_healing_the_wounds: "Healing The Wounds"
 ISP_healing_the_wounds_desc: "While our revolution has many gains, there are some key problems that mere rhetoric cannot change. Chief among them is the conflict between Arab and Hebrew. And of course, the discrimination faced by the Mizrahi too! We would be frauds and fakes if we only chose to elevate the Jew of Europe while doing nothing for the Arabs. It is high time we thus address their concerns. From socioeconomic woes to rights of return, we will begin to change this place for the better!"
 ISP_those_left_behind: "Those Left Behind"
 ISP_those_left_behind_desc: "Much discrimination has gone on against Arabs and Mizrahis. Shot and arrested. Maligned and spat on. A true Canaanite nation cannot treat its semitic brethren in this way! It is only right that we uplift those who were left behind and transform their standing in society to be equal to all others."
 ISP_investing_in_the_periphery: "Investing in the Periphery"
 ISP_investing_in_the_periphery_desc: "The sprawling urban centres of Tel-Aviv, Haifa, and Jerusalem have been a black hole for migration and investment. To the detriment of other cities and villages. To remedy this, we shall see a surge in investment into these lands and ensure no city or town is left behind. With better infrastructure, higher quality buildings and new opportunities for growth, the periphery will quickly join the development standards of our core."
 ISP_revival_of_the_land: "Revival of the Land"
 ISP_revival_of_the_land_desc: "In the early days of the Hebrew Yishuv, plans for the rapid transformation of nature were quickly carried out. Land was terraformed to be suitable for development, swamps were drained, cities were built where there once was rock and sand! To revive the legacy of the Fertile Crescent, we will revive these ambitious projects. But we will not be centric to the Jew. We will ensure also that the Arabs are included in this development, to guarantee that no one is left behind."
 ISP_our_messianic_role: "Our Messianic Role"
 ISP_our_messianic_role_desc: "We are not like the liberation movements of other parts of the world. Canaan has birthed many faiths and cultures after all, many of whom have captured the world in their grasp! And so once again Canaan is destined to be the prophet, the bringer of the Semitic revolution, a worldwide bastion for liberty! The new mountain which will bury the earth. The messiah of all those who burn and twist under the wicked forces of imperialism, capital, and reaction. We are the Vanguard of the revolution of the semitic world, if not, the world itself! "
 ISP_sideline_european_influences: "Sideline European Influences"
 ISP_sideline_european_influences_desc: "One of the many key failings of Zionism was its attachment to Europe! Was it not Herzl who appealed to Cecil Rhodes, likening the Zionist movement to European colonialism? Was it not the vast majority of our old state which looked on with disgust to the Middle East? We are not a European movement. No! No! A hundred times no! We are the movement of the entire Semitic sphere, it’s authentic history and character! The relation of the Hebrew to Judaism and the Jews abroad can be friendly, as to a relative. But the obsessive ties to our european jewish past must be cut, so true independence and merging in the sphere may come."
 ISP_blood_and_soil: "Blood and Soil"
 ISP_blood_and_soil_desc: "Our national body is the Semitic people, with no false divisions to divide them. They are different, sure. But nonetheless, act as one united body. The boundaries of our people, our soil, mark out our homes and thus the character of the nation. Only through a strong connection to the very soil of our ancestral fatherland, remembering our history, may we find the meaning of our national life."
 ISP_liberator_of_the_semitic_world: "The Historic Mission"
 ISP_liberator_of_the_semitic_world_desc: "The Historic Mission of Canaan is grand. It is to be the bringer of peace and liberty to the entire Semitic Sphere. Such great responsibility for the mere fate of the world may seem frightening, but it is also a source of great pride and dedication for our people. Let our soldiers know what they fight for, and they’ll fight like no other - let them know the greatness of their mission, let them know they are soldiers of peace, and they will never retreat, never cease, until the mission is complete, until peace authentic peace is achieved."
 ISP_arisen_in_the_land_of_old_and_new: "Arisen in the Land of Old and New"
 ISP_arisen_in_the_land_of_old_and_new_desc: "The new man of Canaan. Born in modernity. But whose soul is of the past. Our ideals are modern. Are nation is ancient. We are a fusion of past and future! Our land is much the same. Where ideologies and systems of modernity jolt life into the cultures of ancient people. We have thus become like the overmen. Free from the bounds of any one age and its moral trappings. We live only for ourselves and our land!"
 ISP_revolution_of_youth: "Revolution of Youth"
 ISP_revolution_of_youth_desc: "The future of our nation consists in our children. The next generation will be the vanguard of our national revolution, a transformation that must and will arise from their education. Raise them to be sons and daughters of Canaan. Be they Jew or Arab. Have them learn both Arab and Jewish, have them learn the entire history of their land, rather then just the jewish or arab one, so they learn to adore it. They will be the first generation of true brotherhood, the first generation of new Canaan!"
 ISP_liberation_of_the_arts: "Liberation of the Arts"
 ISP_liberation_of_the_arts_desc: "Breaking free from the closed ideals of socialist realism, the capitalist limitation on free expression, or the trappings of conservative fears and paranoia over art and culture, we will liberate the cultural realm. Canaan must be a land of free cultural change and expression. Fountains of new forms of art will flow at every corner. Artists chained by those who wish to forbid them from new opportunities and new visions will find their Eden here. The free emotional expression of art will be, surely, a spontaneous expression of the grand revolution of our nation and its aspiration - it will tell the stories of old and new, of primal national revival and unrelenting progress."
 ISP_absorbing_youth_movements: "Absorbing Youth Movements"
 ISP_absorbing_youth_movements_desc: "The disparate youth movements of the Hebrew Republic are still all here. Many are left without direction and are ready to be infused into our great movement for the rebirth of Canaan. Our mobilisation of the youth will not be only in the realm of education. But all youth movements shall be regimented towards the realisation of our revolution."
 ISP_giovinezza: "Giovinezza!"
 ISP_giovinezza_desc: "The spring of youth is here on Canaan! The poets, and the artisans celebrate! Our strength comes from our youth! We have no need for elders, though we of course respect them. Like the great minds of the Italian Futurists once preached, we dream of the future! Of violence! Of progress! And blinding, bloody, force! Of heavenly peace and unity brought only through holy war against the old world. Force delivered by the youth of this land! To shock and awe with the ambrosia of young men and women!"
 ISP_national_renaissance: "National Renaissance"
 ISP_national_renaissance_desc: "Everywhere across Canaan, from Galilee to the Negev, a renaissance is taking place. Hundreds of thousands stand united. Discarding the chains of the old world and banishing the horrors of the new world. They have combined into one. They have moved past the petty divisions of the semitic man! Canaan has been reborn! It is young again indeed! Hurrah! Hurrah! The soul of man, the soul of the semitic people, has been energised. The forces of globalism and modern degeneracy flee and the principles of a free progressive nationalism have been cemented. Reactionary tendencies have died and rotted and international imperial finance capital is quaking in its boots! We are free at last now! The land of ancient times is reborn."
 ISP_looking_outwards: "Looking Outwards"
 ISP_looking_outwards_desc: "It will not do for us to go and try to make it on our own in this world. Not only are we principled in our commitment to peace and brotherhood in the Semitic sphere, not only will we resist any and all foreign imperialism, but to function as a prosperous state we will need to establish friendly relations with those receptive to our rule."
 ISP_semitic_action: "Semitic Action"
 ISP_semitic_action_desc: "The Semitic spirit cannot be contained to just the Levant. It is a bursting, energetic movement! It must lodge itself into the spirit of everything around it. It is time to truly look outside and decide our foreign policies."
 ISP_nurture_the_pan_semitic_movement: "Nurture the Pan Semitic Movement"
 ISP_nurture_the_pan_semitic_movement_desc: "Small sections of the Young Shem Society are around throughout the Semitic world. It is time that we begin to embolden and strengthen the movement of Pan-Semitism. Send them money, send them capital, send them weapons if they need it. We will ensure they become a true youthful revolutionary force throughout this corner of the world."
 ISP_arabian_peninsula_branch: "Arabian Peninsula Branch"
 ISP_arabian_peninsula_branch_desc: "Since the arrival of Anglo and French influences in the region, the Arabian Peninsula has been a home to various resistance movements committed to reclaiming their home land from foreign powers. Although those lands are overwhelmingly occupied by reaction as of now, we must find allies in the more progressive movements of Yemen and the Kafalas, and try to reignite the flames of progress and revolution in those barren lands."
 ISP_fertile_crescent_branch: "Fertile Crescent Branch"
 ISP_fertile_crescent_branch_desc: "In the ancient days  of antiquity, the Fertile Crescent stood as the cradle of civilization, heralding a birthplace for human civilization with groundbreaking innovations such as agriculture, writing, and the wheel. Over the ages, countless groups of people have sought to exploit its riches, leaving this once flourishing land desolate and forsaken! Now, as the sole leading organisation of this realm, it’s up to us to rejuvenate her body. We will embark on an endeavour to rejuvanate the Fertile Crescent back to her former glory, with the aid of our agents in the Semitic society."
 ISP_against_anglohashemite_imperialism: "Against Anglo-Hashemite Imperialism"
 ISP_against_anglohashemite_imperialism_desc: "While we have our enemies in Cairo and Damascus, we can perhaps have some begrudging respect for nations with a basis in world history. For ideologies which are at least somewhat progressive or revolutionary. But the Kingdom of Jordan is another matter. The aberration of the Hashemites is a blight on us all. Not only is it a reactionary monarchy formed on religious delusions, but it owes its life to the forces of the British capital and empire! As if that was not enough, it divides the true core lands of Canaan. Let us start preparing to deal with such a horror in the only way that is right."
 ISP_a_call_to_our_brothers_across_the_jordan: "A Call To Our Brothers Across the Jordan"
 ISP_a_call_to_our_brothers_across_the_jordan_desc: "Jordan is not a truly stable kingdom. A majority of its people care more about returning to Canaan than they do serving its kings. While some will not approve of us in any case, it is certainly true that, mobilizing the disgruntled palestinian population, we will find many allies in our war to liberate Jordan from the yoke of the Hashemite monarchs!"
 ISP_operation_tohu_vavohu: "Operation Tohu va-Vohu"
 ISP_operation_tohu_vavohu_desc: "With preparations for war complete, with the battle lines drawn in the sand and the river banks, it is time we commence the first step towards realising National Unification. Let us rise to war and free Canaan from all those which seek to put it in chains!"
 ISP_coopt_pan_arabist_sentiment: "Co-opt Pan Arabist Sentiment"
 ISP_coopt_pan_arabist_sentiment_desc: "The force of Pan-Arabism has been a mixed bag. Yes, they were almost all great enemies of Eber, and many still view us with suspicion at best. But our ideology of Pan-Semitism does have its history among them. Many still remember the past proposals and negotiations between us and Nasser for the formation of a Semitic Confederation. But as leaked NATO documents have revealed, Nasser was overthrown by America and Britain to prevent its formation.\nBy digging into this history, we will no doubt be able to co-opt Pan-Arabism and many of its supporters and fuse it into the wider movement."
 ISP_north_africa_branch: "North Africa Branch"
 ISP_north_africa_branch_desc: "Stretching from the rugged Atlas Mountains in the west to the fertile Nile River in the east, North Africa has long held profound geopolitical interests for many civilizations throughout the age. As the saying goes, "Whoever commands the deserts control half of the world." Thus, we must begin the deployment of agents into the area and scout for any potential allies and likemind individuals who are willing to aid our organisation."
 ISP_allies_in_tripoli: "Allies In Tripoli?"
 ISP_allies_in_tripoli_desc: "While Muammar Gaddafi and his Jamahiriyah have never historically been very fond of Zionism, he has shown more respect for the right of the Hebrew people to reside in the area then other Arab leaders, upholding the legacy of Nasser and being sympathetic to the Pan Semitic idea rather than the reactionary imperialist nationalism that perverted the Arab revolutionary movement. But we are not the old Zionists, we are no longer a Europeanist invasion, we are no longer the bootlickers of Moscow! We are a new independent force for not just Hebrew people. And not just Arabs either. But Semitic people overall. Which includes the people of Libya. It is not out of the question that we forge an alliance with Gaddafi and his Third International Theory…"
 ISP_the_benghazi_forum: "The Benghazi Forum"
 ISP_the_benghazi_forum_desc: "The Forum for the Study and Promotion of National Sovereignty in the 21st Century, or as it has become known colloquially, the Benghazi Forum, will at last be inaugurated. Thinkers from Canaan and Tripoli, alongside the forces of National Communists and progressive Fascisti within Italy, have proposed this bold new political forum to rail against the forces of globalisation and imperialism in all its forms. To form a hub from which we will be able to organise and finance opposition to imperialism."
 ISP_towards_a_world_of_free_nations: "Towards A World Of Free Nations"
 ISP_towards_a_world_of_free_nations_desc: "Ever since the 1500s, the continent of Europe began its meteoric rise to power and dominance over the Earth. From the plains of North America to the hills of Peru. From the Cape of Africa to the tundras of Siberia. European imperialists have robbed and raped all in their wake. But ever since the cataclysmic death of imperial capital starting in 1914, hordes of colonised masses and nations with a fundamentally proletarian character have risen to shake of foreign yoke. Still yet, the new global elites are trying to subjugate the nations of  the world, even after their nominal independence.\nWhat our aim is, our eternal goal, is to end imperialism in any form throughout the world! And in its place to enforce true national sovereignty for every people on the earth!"
 ISP_imperialism_east_west: "Against Imperialism of East and West"
 ISP_imperialism_east_west_desc: ""
 ISP_hardliner_soyrage: "Brewing Military Discontent"
 ISP_impending_doom_dec_cat: "Brewing Military Troubles"
 ISP_a_chat_with_japan: "A Chat With Japan"
 ISP_a_chat_with_japan_desc: "Japan stands at the vanguard against degeneracy of this new world order. Be it the excess of European-American financiers and their foul liberal ideology, or be it the new world order of Moscow. Pursuing closer ties with Tokyo could be a key way of resisting the current of globalist degeneracy.\nHowever, others within the movement have argued that this would be a big mistake. Japan is after all a massive force of capitalism. What’s more, they are themselves an unabashed empire, with gargantuan economic control over much of East Asia. We must keep our cards open as we build a true free alternative."
 ISP_veneration_of_the_mediterranean_spirit: "Veneration of the Mediterranean Spirit"
 ISP_veneration_of_the_mediterranean_spirit_desc: "The Mediterranean is a civilization thousands of years old. Its culture, its spirit, its everything! That is what we must strive to be. We must venerate the spirit of the Mediterranean world! The cradle of civilization, of a hundred cultures! Berber, Semite, Turk, Slav, Greek, Latin, and so many others. This great sea has connected them all, and we are a part of its communal legacy, as opposed to the individualistic degenerate character of the Germanics. Let the land of the olive find its vigour once again!"
 ISP_a_talk_with_china: "A Talk With China"
 ISP_a_talk_with_china_desc: "Maoist China is a country with a fundamentally anti-imperial character. It is the centre of rebellion against the imperialist world order! They have inspired countless revolts against the machinations of international finance capital. From Guinea-Bissau to Mozambique. From Peru to the Philippines! Many, inspired by the call of Maoist anti-imperialism, have risen up. Now, with our rise, we shall strike up relations with Beijing and strengthen the currents of anti-imperialism and Asian brotherhood."
 ISP_and_yet_the_russians_pay_well: "And Yet The Russians Pay Well..."
 ISP_and_yet_the_russians_pay_well_desc: "For all our hatred of the world order created by those in Moscow, it is undeniable that they are the global superpower ever since America’s death. Yes, Paris and Tokyo are rich and powerful as well. But the strength of Moscow and its Communist Bloc, historically allied to us, is simply unparalleled. Their support for the Hebrew national revolution in its infancy and most important crucial  times is not forgotten either. Perhaps some principles ought to be sacrificed for the sake of pragmatic gain?"
 ISP_asian_brotherhood: "Asian Brotherhood"
 ISP_asian_brotherhood_desc: "Asian Brotherhood"
 ISP_a_call_for_all_free_nations: "A Call For All Free Nations"
 ISP_a_call_for_all_free_nations_desc: "The Benghazi Forum should not be restricted to just one or two countries. We are a front for the whole world! For all nations who desire to be free. All nations who reject the horrors of Imperialism and Globalism. All those who tire of seeing foreign companies tread over our soil and trample our people! We open our arms to all who want to live as free people!"
 ISP_swaying_our_socialist_fraternal_nations: "Swaying Our Socialist Fraternal Nations"
 ISP_swaying_our_socialist_fraternal_nations_desc: "While some within the Warsaw Pact remain vehemently opposed to our rule, others are far more receptive. Especially those who remain under the aegis of the National-Communist movement birthed in Romania. Perhaps some of our old brothers will choose to throw their lot in with us, and not the perverted Union up North?"
 ISP_1st_congress_of_national_sovereignity: "1st Congress of National Sovereignity"
 ISP_1st_congress_of_national_sovereignity_desc: "Delegates and representatives of countless Nationalist and Socialist movements from around the globe have been invited to the 1st Congress of National sovereignty! Italian radicals, Turkish Turanist-socialists, Pan-semites, American-Indians from across the sea, and many many more. They have all gathered here today to witness the birth of a new movement to break the chains of imperialism and globalism!"
 ISP_against_the_new_world_order: "Against the New World Order"
 ISP_against_the_new_world_order_desc: "Our greatest commitment is the obliteration of the order created in the last few decades. For one, we obviously oppose any semblance of Capitalism and capitalist rule. Our friends are not in Washington and they are not in Paris. But we also look with disdain to the world created by Moscow and its false reformist ideology, which has driven in a new elitist globalisation!\nOur true enemy is not socialism, neither is it internationalism. It is the new world order of the global elite, whether French or Russian, which seeks to oppress the liberty of both man and nation under the auspices of internationalism."
 ISP_against_the_antihuman: "Against the Anti-Human"
 ISP_against_the_antihuman_desc: "The ugliest tendency of recent years has been a strong turn in some countries towards Trans-Humanism and anti human technological surplus. We are not luddites, but we are only willing to go so far! We must stand opposed to any and all forms of rejection of our very humanity! We will not stand idle as the global elites give power to cold machines of oppression!"
 ISP_for_national_liberty: "For National Liberty!"
 ISP_for_national_liberty_desc: "The chains of imperialism which have been weakening for so many decades shall soon be broken. We do not just want the end of military dominance over the periphery. But the complete end of economic and political rule over us all! A true national liberty for all the oppressed and imprisoned nations of this Earth!"
 ISP_unbowed_spirit_of_rebellion: "Unbowed Spirit of Rebellion"
 ISP_unbowed_spirit_of_rebellion_desc: "We are a great, gallant, resistance against the forces of globalism and capital. Our very spirit! Our very blood! Our souls froth with anger and rage! We are the bringers of a eternal rebellion against all reaction, empire and capital! Against the perversion of the consumerist modern world, against colonialism and imperialism, against its capitalist wealth hoarding, it is right to rebel! We are ferociously rebellious! We are those who will ever rebel against all injustice, who will not cease their striving for liberty."
 ISP_beset_on_all_sides: "Beset on All Sides"
 ISP_beset_on_all_sides_desc: "The greatest horror has come to pass. Surrounded on all sides, our dear republic is at war with the twin evils of Egypt and Syria! These Arab terror states who look upon us with hatred, ready to damn us to the camps we so desperately tried to escape. This shall be the final battle. We will face them in the deserts and in the fields! In the hills and the valleys! In the cities and the coasts! We will push them back to Damascus and Cairo and once and for all guarantee the safety of the Hebrew Worker! "
