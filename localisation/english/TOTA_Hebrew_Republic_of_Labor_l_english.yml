ISP.12.t: "Committee on Political and Social Reform"
ISP.12.desc: "It had been a few weeks since Ramon declared his intentions of creating a Committee to deliberate on the topic of reforming the country and its governance. Today was the day the so-called 'Committee On Political And Social Reform' would meet.\nWith cries and protests outside of their meeting place in Jerusalem, Ramon muttered to himself. "Incredible! We have united both Jew and Gentile. And some would hate us for it!"\nA voice pined up, "Well don't be too concerned. There were always going to be some dissidents poking around, after all. What matters is that we're here now."\nRamon sat down with a smirk. "Too true, too true. But how about we figure this all out. What is to be done?"\nOne man started to speak "No matter what it is we do, we should be at least a little careful not to cross the Kremlin. Market system or not, Moscow will have a word with us if the hammers and sickles fall away. More than they already have anyways."\n"Not just Moscow" Another voice replied. "If we did that, Simhon's bunch would be up in arms!"\nRamon replied "No one is saying we sell the whole country out, you know? This isn't Westphalia after all. But talks about how far liberalisation may go can come later. For now, as long as Simhon cares more at how steep the lines on a graph are, we're out of trouble. We can all agree on cutting some excesses." Nodding heads and sounds of agreements sprang out across the table. "Of course there is the matter of politics too. Simhon wouldn't be too disturbed at the currently proposed package of Electoral Reform and the end to the National Front. And I doubt the more patriotic in the country will complain about a little less Communism if it means less... revolutinary Jews... make Aliyah." said Ramon.\n"Our only concern will be everyone else. Khanin, the Arabs. They'll never let us hear the end of it." Another person spoke.\n"We can withstand any such pressures for now. Let's just move on.""
ISP.12.a: "Now, what about those damned bureaucrats..?"

ISP.11.t: "Election Day"
ISP.11.desc: "The Mapam Party Center is today convening to cast the final vote on the next General Secretary of the Party, who is to be, as is tradition, the new Prime Minister.\nJust over a month ago the former General Secretary, Ehud Barak, resigned after facing numerous allegations, and since then we have seen a lot of negotiations between different forces in Mapam and the realignment of factions, culminating in todays election, a match between the new candidate of the current establishment, Gabi Ashkenazi, and the reformist Shalom Simhon who managed to unite much of the various reformist and opposition factions behind him.\nWhile Ashkenazi has the advantage of the support of much of the party establishment and bureaucracy, along with his military credentials and the support of many Hardliners, the corrupt reputation of former GenSec Barak sticks to him. This, then, is giving a very real chance for Simhon. The big tent alliance and attempted reconciliation of reformists and hardliners by Barak has imploded, and Simhon, apart of the traditional reformist and oppositionist base he managed to unite behind him, is also appealing to many moderates and even hardliners in his pragmatism, seeing him as a new, less radically reformist alternative to the corrupt status quo.\nNow, as the Party Center cast its votes, we can see that the next General Secretary is:"
ISP.11.a: "Simhon, for Progressive Development"
ISP.11.b: "Ashkenazi, for National Unity"

ISP.13.t: "Election Day"
ISP.13.desc: "The Mapam Party Center is today convening to cast the final vote on the next General Secretary of the Party, who is to be, as is tradition, the new Prime Minister.\nJust over a month ago the former General Secretary, Ehud Barak, resigned after facing numerous allegations, and since then we have seen a lot of negotiations between different forces in Mapam and the realignment of factions, culminating in todays election, a match between the new candidate of the current establishment, Gabi Ashkenazi, and the reformist Haim Ramon who managed to unite much of the various reformist and opposition factions behind his own Shinui.\nWhile Ashkenazi has the advantage of the support of much of the party establishment and bureaucracy, along with his military credentials and the support of many Hardliners, the corrupt reputation of former GenSec Barak sticks to him. This, then, is giving a very real chance for Ramon. The big tent alliance and attempted reconciliation of reformists and hardliners by Barak has all but imploded. Ramon, while quite a radical reformist appealing mostly to the traditional reformist and oppositionist base along with out-of-party opposition, must now attempt to diversify his support base, as he tries to appeal to all disgruntled with the corrupt socialist party state - be they Ashkenazi liberals, intellectuals and younger folk who want greater freedom, or even some of the less socialist minded nationalists and Religious Zionists, alienated by the “cosmopolitan” establishment and attracted by his often strong views on the Palestinian question and strong support of settlement and Zionist and Jewish values.\nNow, as the Party Center cast its votes, we can see that the next General Secretary is:"
ISP.13.a: "Ramon, for Zionist Liberty"
ISP.13.b: "Ashkenazi, for National Unity"

