l_english:
 LOADING_TIP_0:0 "The Industrial Revolution and its consequences have been a disaster for the human race.\n- Theodore J. Kaczysnki"
 LOADING_TIP_1:0 "Nothing human makes it out of the near-future.\n- Nick Land"
 LOADING_TIP_2:0 "Money. Money. Money. Money. Money. Money. Money [...]\n- James Ferraro"
 LOADING_TIP_3:0 "In many ways nonsense is a more effective organizing tool than the truth. Anyone can believe in the truth. To believe in nonsense is an unforgeable demonstration of loyalty.\n- Curtis Yarvin"
 LOADING_TIP_4:0 "If something is expensive to develop, and somebody's not going to get paid, it won't get developed. So you decide; Do you want software to be written, or not?\n- Bill Gates"
 LOADING_TIP_5:0 "When the lifeboat is full, those who hate life will try to load it with more people. Those who love life will take the ship's axe and sever the extra hands that cling to the sides of the boat.\n- Pentti Linkola"
 LOADING_TIP_6:0 "I use technology so I can hate it more properly.\n- Nam June Paik"
 LOADING_TIP_7:0 "Those who would judge us merely by the heights we have achieved would do well to remember the depths from which we started.\n- Kwame Nkhrumah"
 LOADING_TIP_8:0 "Phase-out culture accelerates through its digitech-heated adaptive landscape, passing through compression thresholds normed to an intensive logistic curve; 1500, 1756, 1884, 1948, 1980, 1996, 2004, 2008, 2010, 2011...\n- Nick Land"
 LOADING_TIP_9:0 "Democracy. Republic. What do these words signify? What have they changed in the world? All goes on as before, as always. Illusions, illusions.\n- Haile Selassie"
 LOADING_TIP_10:0 "The axis today is not liberal-conservative, the axis is constructive-destructive.\n- Steve Jobs"
 LOADING_TIP_11:0 "Being born is like being kidnapped. And then sold into slavery. People are working every minute. The machinery is always going. Even when you sleep.\n- Andy Warhol"
 LOADING_TIP_12:0 "I really do live for the future, because when I'm eating a box of candy, I can't wait to taste the last piece. I don't even taste any of the other pieces, I just want to finish and throw the box away.\n- Andy Warhol"
 LOADING_TIP_13:0 "When reason and history began revealing the irrationality and limitations of the capitalist order, bourgeois ideology and economics began abandoning both reason and history.\n - Paul Baran"
 LOADING_TIP_14:0 "The place is unreal. The people are unreal. The flowers are unreal — they don't smell. The fruit is unreal. Even the streets and buildings are unreal. That's what Hollywood is — a set, a glaring, gaudy, nightmarish set.\n- Ethel Barrymore"
 LOADING_TIP_15:0 "I honestly believe I'd make one of the worst elected officials in the history of this country.\n- Ross Perot, 42nd US President"
 LOADING_TIP_16:0 "When people concentrate on the idea of beauty, they are, without realizing it, confronted with the darkest thoughts that exist in this world.\n- Yukio Mishima"
 LOADING_TIP_17:0 "Today is a chance for Americans, especially our young people, to say thank you for all the things we love from Japan. Like karate and karaoke. Manga and anime. And, of course, emojis.\n- Barack Obama"
 LOADING_TIP_18:0 "Some of us are still Marxists, you know.\n- Anonymous guest of Virtual Futures 1996 meeting Nick Land"
 LOADING_TIP_19:0 "Modern politics has become little more than shirking responsibility and blaming somebody else.\n- Ross Perot"
 LOADING_TIP_20:0 "Perhaps the easiest way for a modern American to understand Nazism is that a good Brownshirt thought about preserving the Deutsche Volk in exactly the same way that today's Greens think about preserving the environment.\n- Curtis Yarvin"
 LOADING_TIP_21:0 "Anime — indeed, even anime porn — has done more to advance European civilization than both the Freedom and Republican Parties.\n- Richard Spencer"
 LOADING_TIP_22:0 "I wouldn't want to go back to the old white nationalism when no one was listening to us. I want to be in a place where our ideas are entering the mainstream.\n- Richard Spencer"
 LOADING_TIP_23:0 "Experience is being wiped out. The horizons of Past and Future are being blurred. We are being conditioned to live an endless and uncertain Present, reduced to citizens in a state of Forgetfulness.\n- John Berger"
 LOADING_TIP_24:0 "The past grows gradually around oneself, like a placenta for dying.\n- John Berger"
 LOADING_TIP_25:0 "We live in a world ruled by fictions of every kind - mass merchandising and politics conducted as a branch of advertising, the increasing blurring and intermingling of identities within the realm of consumer goods.\n- J.G. Ballard"
 LOADING_TIP_26:0 "Options multiply around us, We live in an almost infantile world where any demand, any possibility, whether for life-styles, travel, sexual roles and identities, can be satisfied instantly.\n- J.G. Ballard"
 LOADING_TIP_27:0 "Communism is as American as apple pie, and America today is a completely communist country.\n- Curtis Yarvin"
 LOADING_TIP_28:0 "The human imagination has great difficulty in living strictly within the confines of a materialist practice or philosophy. It dreams, like a dog in its basket, of hares in the open.\n- John Berger"
 LOADING_TIP_29:0 "Ideology is strong exactly because it is no longer experienced as ideology… We feel free because we lack the very language to articulate our unfreedom.\n- Slavoj Žižek" 
 LOADING_TIP_30:0 "Come into the temple of immaculate violence. Bow at the feet of the indomitable will. Drink from the fountain of gentle annihilation. Become an exterminating angel. Everything will require unfathomable violence. \n- Marianne Williamson"
 LOADING_TIP_31:0 "How boring just to be a body.\n- Susan Sontag"
 LOADING_TIP_32:0 "That even an apocalypse can be made to seem part of the ordinary horizon of expectation constitutes an unparalleled violence that is being done to our sense of reality, to our humanity.\n- Susan Sontag"
 LOADING_TIP_33:0 "Life changes fast. Life changes in the instant. You sit down to dinner and life as you know it ends.\n- Joan Didion"
 LOADING_TIP_34:0 "Until each bullet of imperialism, nationalism and fundamentalism is confronted by a volcanic heart of the civilian everywhere, there is no peace, there will never be peace.\n- Abhijit Naskar"
 LOADING_TIP_35:0 "God seems to have a kind of laid-back management style I'm not crazy about.\n- David Foster Wallace"
 LOADING_TIP_36:0 "To have humanism we must first be convinced of our humanity. As we move further into decadence this becomes more difficult.\n- Thomas Pynchon"
 LOADING_TIP_37:0 "I don't get a sense of American pride. I just get a sense that everyone is here, battling the same thing - that around the world everybody's after the same thing, just some minor piece of happiness each day.\n- Paul Thomas Anderson"
 LOADING_TIP_38:0 "The Right can only live and work hermetically, in the hothouse of the past, while outside the Left prosecute their affairs in the streets manipulated by mob violence. And cannot live but in the dreamscape of the future.\n- Thomas Pynchon"
 LOADING_TIP_39:0 "I am not a conservative. I am a radical monarchist. I believe there are no rails - and never were any.\n- Curtis Yarvin"
 LOADING_TIP_40:0 "It's bad enough when a country gets colonized, but when the people do as well! That's the end, really, that's the end.\n- Tsitsi Dangaremba"
 LOADING_TIP_41:0 "What is pertinent is the calmness of beauty, its sense of restraint. It is as though the land knows of its own beauty, its own greatness, and feels no need to shout it.\n- Kazuo Ishiguro"
 LOADING_TIP_42:0 "Everybody's plastic, but I love plastic. I want to be plastic.\n- Andy Warhol"
 LOADING_TIP_43:0 "I was always willing to be reasonable until I had to be unreasonable. Sometimes reasonable men must do unreasonable things.\n- Marvin Heemeyer"
 LOADING_TIP_44:0 "Homo sapiens is the species that invents symbols in which to invest passion and authority, then forgets that symbols are inventions.\n- Carol Joyce Oates"
 LOADING_TIP_45:0 "There are no solutions. There are only trade-offs.\n- Thomas Sowell"
 LOADING_TIP_46:0 "People were always getting ready for tomorrow. I didn't believe in that. Tomorrow wasn't getting ready for them. It didn't even know they were there.\n- Cormac McCarthy"
 LOADING_TIP_47:0 "The things I believed in dont exist any more. It's foolish to pretend that they do. Western Civilization finally went up in smoke in the chimneys at Dachau but I was too infatuated to see it. I see it now.\n- Cormac McCarthy"
 LOADING_TIP_48:0 "There is no God and we are his prophets.\n- Cormac McCarthy"
 LOADING_TIP_49:0 "A leader is one who, out of madness or goodness, volunteers to take upon himself the woe of the people. There are few men so foolish, hence the erratic quality of leadership in the world.\n- John Updike"
 LOADING_TIP_50:0 "We live in an age in which there is no heroic death.\n- Yukio Mishima"
 LOADING_TIP_51:0 "I think I was once given cocaine but I sneezed so it didn't go up my nose. In fact, it may have been powdered sugar.\n- Alex B. Johnson"
 LOADING_TIP_52:0 "It is a horrible vision. It gives us no joy to articulate it. But at home and abroad, it will end up as their sons against our silicon. Our silicon will win.\n- Mark P. Mills and Peter W. Huber"
 LOADING_TIP_53:0 "It is not an exaggeration to say that being a teenager in late capitalist Britain is now close to being reclassified as a sickness.\n- Mark Fisher"
 LOADING_TIP_54:0 "Manual labor meant association with a rude, coarse, and ignorant class of people. There is no such class now.\n- Edward Bellamy"
 LOADING_TIP_55:0 "Want to know what's more destructive than a nuclear bomb? Words.\n- John Kim Jr."
 LOADING_TIP_56:0 "The work of a pioneer is problematic. It's difficult to become a rich old man while at the same time staying a hardworking poor youth.\n- Efraim Kishon"
 LOADING_TIP_57:0 "The Left says I'm a Nazi. The Right says I'm a Zionist. The Left, an Anti-Semite… The only thing they agree on is their perfectly rational fear that I might expose the cock of Prometheus.\n- Jason Jorjani"
 LOADING_TIP_58:0 "Only Napoleon did more than I have done. But I am definitely taller.\n- Woodsy Berlusconi"
 LOADING_TIP_59:0 "The Stone Age didn't end for lack of stone, and the Oil Age will end long before the world runs out of oil.\n- Sheikh Zaki Yamani"
 LOADING_TIP_60:0 "The Circus-Circus is what the whole hep world would be doing Saturday night if the Nazis had won the war. This is the sixth Reich.\n- Hunter S. Thompson"
 LOADING_TIP_61:0 "Jesus was the first Communist. It's pretty simple.\n- Cameron Fuller"
 LOADING_TIP_62:0 "It's my sad duty to inform the world that Professor Dawkins has been pwned.\n- Curtis Yarvin"
 LOADING_TIP_63:0 "The right place to fight a civil war is always at home.\n- Curtis Yarvin"
 LOADING_TIP_64:0 "The greatest thing that could happen to the state and nation is when we get rid of all the media ... then we could live in peace and tranquillity and no one would know anything.\n- Joh Bjelke-Petersen"
 LOADING_TIP_65:0 "Once you go to college, you are no longer in the real America. You are in a fortified outpost of future America, which has been planted in the real America to enlighten and assimilate it.\n- Curtis Yarvin"
 LOADING_TIP_66:0 "Welcome to 2030. I own nothing, have no privacy, and life has never been better.\n- Ida Auken"
 LOADING_TIP_67:0 "The first lesson a revolutionary must learn is that he is a doomed man.\n- Huey P. Newton"
 LOADING_TIP_68:0 "You know, a long time ago being crazy meant something. Nowadays everybody's crazy.\n- Charles Manson"
 LOADING_TIP_69:0 "Until all Africans stand and speak as free human beings, equal in the eyes of the Almighty; until that day, the African continent shall not know peace.\n- Haile Selassie"
 LOADING_TIP_70:0 "The United States will eventually fly the Communist red flag... The American people will hoist it themselves.\n- Nikita Khrushchev"
 LOADING_TIP_71:0 "We must abandon the very idea of war. It is meaningless. If we stop preparing for war and prepare instead for peace, we can produce food instead of armaments.\n- Alexei N. Kosygin"
 LOADING_TIP_72:0 "Today in all Germany you can't find a single person who voted Adolf Hitler into power. Many Germans feel guilty about the war. But they don't explain the real guilt we share - that we lost.\n- Hanna Reitsch"
 LOADING_TIP_73:0 "If once again Germany destabilizes Europe, then Germany will be not be divided again, but wiped off the map. We have the necessary technology to enforce this verdict. There is no other solution.\n- Lech Wałęsa"
 LOADING_TIP_74:0 "The Europeans looked down on the Black world and condescended to touch nothing but its riches.\n- Cheikh Anta Diop"
 LOADING_TIP_75:0 "Colonialism is not a thinking machine, nor a body endowed with reasoning faculties. It is violence in its natural state, and it will only yield when confronted with greater violence.\n- Frantz Fanon"
 LOADING_TIP_76:0 "For us in Russia, communism is a dead dog, while, for many people in the West, it is still a living lion.\n- Aleksandr Solzhenitsyn"
 LOADING_TIP_77:0 "There are and always will be some who try to prove that slavery wasn't so bad after all. Men will say (and accept) anything in order to foster national pride or soothe a troubled conscience.\n- C. L. R. James"
 LOADING_TIP_78:0 "The rich are only defeated when running for their lives.\n- C. L. R. James"
 LOADING_TIP_67:0 "The best answer to extremists is to build a better world.\n- Klaus Schwab"
 LOADING_TIP_68:0 "You know, a long time ago being crazy meant something. Nowadays everybody's crazy.\n- Charles Manson"
 LOADING_TIP_69:0 "Tomorrow can take care of itself.\n- Nick Land"
 LOADING_TIP_70:0 "If there is a conclusion, it is zero.\n- Nick Land"
 LOADING_TIP_71:0 "It's one of the filter theories. Absorption into simulations. Cultures swirling out of the universe like dirty water down a plug. Derealization vortices.\n- Nick Land"
 LOADING_TIP_72:0 "The arc of history is long, but it bends towards zombie apocalypse.\n- Nick Land"
 LOADING_TIP_73:0 "A revolutionary war against a modern metropolitan state can only be fought in hell.\n- Nick Land"
 LOADING_TIP_74:0 "Organs crawl like aphids upon the immobile motor of becoming.\n- Nick Land"
 LOADING_TIP_75:0 "From a situation in which nothing can happen, suddenly anything is possible again.\n- Mark Fisher"
 LOADING_TIP_76:0 "It is easier to imagine the end of the world than the end of capitalism.\n- Mark Fisher"
