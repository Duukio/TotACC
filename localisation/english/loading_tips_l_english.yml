 LOADING_TIP_0:0 "The Industrial Revolution and its consequences have been a disaster for the human race.\n- Theodore J. Kaczysnki, Industrial Society and Its Future"
 LOADING_TIP_1:0 "Nothing human makes it out of the near-future.\n- Nick Land"
 LOADING_TIP_2:0 "Money. Money. Money. Money. Money. Money. Money [...]\n- James Ferraro"
 LOADING_TIP_3:0 "In many ways nonsense is a more effective organizing tool than the truth. Anyone can believe in the truth. To believe in nonsense is an unforgeable demonstration of loyalty.[...]\n-Mencius Moldbug"
 LOADING_TIP_4:0 "If something is expensive to develop, and somebody's not going to get paid, it won't get developed. So you decide; Do you want software to be written, or not?\n- Bill Gates"
 LOADING_TIP_5:0 "When the lifeboat is full, those who hate life will try to load it with more people. Those who love life will take the ship's axe and sever the extra hands that cling to the sides of the boat.\n- Pentti Linkola"
 LOADING_TIP_6:0 "Neo-Japan Arrives from the future."
 LOADING_TIP_7:0 "With a smothering shroud of six billion people and all their demands covering the surface of the earth, pacifism is dead.\n- Pentti Linkola"
 LOADING_TIP_8:0 "[...]Phase-out culture accelerates through its digitech-heated adaptive landscape, passing through compression thresholds normed to an intensive logistic curve; 1500, 1756, 1884, 1948, 1980, 1996, 2004, 2008, 2010, 2011 ... \n- Nick Land"
 LOADING_TIP_9:0 "[The] Digital hub (center of our universe) is moving from PC to cloud[...]\n- Steve Jobs"
 LOADING_TIP_10:0 "I'm the only person I know that's lost a quarter of a billion dollars in one year.... It's very character-building.\n- Steve Jobs"
 LOADING_TIP_11:0 "Being born is like being kidnapped. And then sold into slavery. People are working every minute. The machinery is always going. Even when you sleep.\n- Andy Warhol"
 LOADING_TIP_12:0 "I really do live for the future, because when I'm eating a box of candy, I can't wait to taste the last piece. I don't even taste any of the other pieces, I just want to finish and throw the box away[...]\n- Andy Warhol"
 LOADING_TIP_13:0 "A squid eating dough in a polyethylene bag is fast and bulbous. Got me?\n- Captain Beefheart and His Magic Band, Trout Mask Replica"
 LOADING_TIP_14:0 "The place is unreal. The people are unreal. The flowers are unreal—they don't smell. The fruit is unreal. Even the streets and buildings are unreal.[...]That's what Hollywood is—a set, a glaring, gaudy, nightmarish set.\n- Ethel Barrymore"
 LOADING_TIP_15:0 "MAKE MONEY. MAKE MORE MONEY. MAKE OTHER PEOPLE PRODUCE SO AS TO MAKE MORE MONEY.\n- L. Ron Hubbard, Principles of Money Management"
 LOADING_TIP_16:0 "When people concentrate on the idea of beauty, they are, without realizing it, confronted with the darkest thoughts that exist in this world.\n- Yukio Mishima"
 LOADING_TIP_17:0 "Today is a chance for Americans, especially our young people, to say thank you for all the things we love from Japan. Like karate and karaoke. Manga and anime. And, of course, emojis. \n- Barack Obama"
 LOADING_TIP_18:0 "Some of us are still Marxists, you know. \n- Anonymous guest of Virtual Futures 96 after meeting Nick Land"
 LOADING_TIP_19:0 "Few people in this country have been able to live the American Dream to the extent that I have... Neither political party has effectively addressed the issues that concern the American people.\n- Ross Perot"
 LOADING_TIP_20:0 "Perhaps the easiest way for a modern American to understand Nazism is that a good Brownshirt thought about preserving the Deutsche Volk in exactly the same way that today's Greens think about preserving the Environment.\n - Curtis Yarvin"
 LOADING_TIP_21:0 "Anime—indeed, even anime porn—has done more to advance European civilization than the Republican Party.\n- Richard B. Spencer, Twitter"
 LOADING_TIP_22: "I rule the fucking world. Those pieces of fucking shit get ruled by people like me. They look up and see a face like mine looking down at them. That’s how the fucking world works.\n-Richard B. Spencer"
 LOADING_TIP_23: "Experience is being wiped out. The horizons of Past and Future are being blurred. We are being conditioned to live an endless and uncertain Present, reduced to citizens in a state of Forgetfulness.\n-John Berger"
 LOADING_TIP_24: "Islam brings hope and comfort to millions of people in my country, and to more than a billion people worldwide.(...) Islam gave birth to a rich civilization of learning that has benefited mankind.\n-George W. Bush"
 LOADING_TIP_25: "We live in a world ruled by fictions of every kind - mass merchandising, advertising, politics conducted as a branch of advertising, the increasing blurring and intermingling of identities within the realm of consumer goods.\n-J.G. Ballard"
 LOADING_TIP_26: "Options multiply around us, We live in an almost infantile world where any demand, any possibility, whether for life-styles, travel, sexual roles and identities, can be satisfied instantly.\n-J.G. Ballard"
 LOADING_TIP_27: "Communism is as American as apple pie, and America today is a completely communist country.\n-Curtis Yarvin"
 LOADING_TIP_28: "You can observe a lot by just watching.\n-Yogi Berra"
 LOADING_TIP_29: "I'm never bringing a bill to the floor that doesn't have the votes.\n-Nancy Pelosi"
 LOADING_TIP_30: "Think fast, chucklenuts!\n-The Scout"
 LOADING_TIP_31: "Nancy Pelosi is a dictator with no legitimate claim to power.\n-Mike Pence"
 LOADING_TIP_32: "it just keeps tumbling down, tumbling down, tumbling down"
 LOADING_TIP_33: "If only you knew how bad things really are\n-Anonymous"
 LOADING_TIP_34: "Don't believe everything you read on the internet.\n-Abraham Lincoln"
 LOADING_TIP_35: "Failure at some point in your life is inevitable, but giving up is unforgivable. We are America, second to none, and we own the finish line. Don't forget it..\n-Joe Biden"
 LOADING_TIP_36: "Soldiers need to shoot, move and communicate, and they need to bond together by tough training and overcoming adversity side by side, [...] Technology should facilitate those fundamentals, not encumber them.\n-Randy George"
 LOADING_TIP_37: "The danger of civilization, of course, is that you will piss away your life on nonsense.\n-Jim Harrison"
 LOADING_TIP_38: "I fear that AI may replace humans altogether. If people design computer viruses, someone will design AI that improves and replicates itself. This will be a new form of life that outperforms humans,\n-Stephen Hawking"
 LOADING_TIP_39: "The four horsemen of the cultural apocalpse are Fake, Gay, Cringe, & Retarded\n-Curtis Yarvin"
 LOADING_TIP_40: "Freedom is secured every day by our men and women in uniform. We must build a future worthy of their sacrifice.\n-Nancy Pelosi"
 LOADING_TIP_41: "Organize, don't agonize\n-Nancy Pelosi"
 LOADING_TIP_42: "What is a television apparatus to man, who has only to shut his eyes to see the most inaccessible regions of the seen and the never seen, who has only to imagine in order to pierce through walls and cause all the planetary Baghdads of his dreams to rise from the dust.\n-Salvador Dali"
 LOADING_TIP_43: "The Internet is becoming the town square for the global village of tomorrow.\n-Bill Gates"
 LOADING_TIP_44: "It has become appallingly obvious that our technology has exceeded our humanity.\n-Unknown"
 LOADING_TIP_45: "I have my own army in the NYPD, which is the seventh biggest army in the world.\n-Michael Bloomberg"
 LOADING_TIP_46: "Sometimes you have to pick the gun up to put the Gun down.\n-Malcom X"
 LOADING_TIP_47: "You'll probably be fine.\n-Agent Ulgrin"