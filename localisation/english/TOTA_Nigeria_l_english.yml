l_english:
 NGA_fifth_times_the_charm: "Fifth Time's The Charm"
 NGA_fifth_times_the_charm_desc:"Four times have we tried to retake our rightful land, four times have we tried to pacify the southern chauvinists, Four times have we tried to liberate our muslim brothers, and four times we have failed horribly. Each time a worse failure, a worser humiliation, and worst of all, Biafraland remains a stain on our nation. Yet not this time, for this time, Nigeria will once and for all triumph over the traitors and prove itself to the world."
 NGA_tigthen_wartime_economy: "Tigthen Wartime Economy"
 NGA_tigthen_wartime_economy_desc:"Our national economy upon the declaration of the war has entered into free fall, we will need to rally the support of our business leaders and align them towards a clear cut goal if we plan on actually winning this conflict. Drafting up new contracts with industrial manufacturers from both here and abroad will be among the many things we can do to give us an edge in this conflict when it comes to our supplies and strategies."
 NGA_pact_with_islamists: "Pact With Islamists"
 NGA_pact_with_islamists_desc:"We may not have had the best relations with the Radical Islamists in the north, but it has become abundantly clear who the real enemy is, the treacherous Biafrans. In order to stabilize the religious regions of the north as well as garner support for the war in the south, we must meet with the leaders of the various Islamist fundamentalist groups. While they are unlikely to completely support the war effort, their support could grant us the help we need to put a finger on the scale of war. Some in our government have proposed adopting some token Islamist policies as a way to extend an olive branch to the Radical Islamists. However we choose to go about this one thing is for sure, Biafra will tremble at the force of a united Nigeria."
 NGA_we_want_our_invasion: "We Want Our Invasion"
 NGA_we_want_our_invasion_desc: "In order for the next war to at last bring us the victory we have hounded for decades, our planning and overarching strategy must be immaculate. Lack of proper direction, organization and supplies are fatal to any war effort and we have learned this lesson painfully at the hands of the secessionist forces time and again. This needs to be a true invasion, not a glorified border skirmish. Preparations will be made with an emphasis on discretion and efficiency, only the most trusted and capable officers in our army made aware of the full scope of our plans. Internal power struggles and cronyism within the chain of command cannot be allowed to hamstring Nigeria yet again. If we fail to plan, then we plan to fail."
 NGA_call_victoria: "Calling Dr. Bloodlust"
 NGA_call_victoria_desc: "If we are to win this war, we must first understand the myriad issues our army is currently facing, such as the suffocating corruption within our ranks and ancient equipment compared to the separatists. These problems could be mitigated with proper modernization but it would take a herculean effort to put us on par with Biafra. Instead, we will be looking at the island to the Indian Ocean's blood diamond: the Seychelles."
 NGA_one_does_not_simply_cross_the_niger: "One Does Not Simply Cross The Niger"
 NGA_one_does_not_simply_cross_the_niger_desc:"All eventualities must be prepared for, including the rather likely possibility that we will have to go on the defensive. Repeated defeats at the hands of Biafran counter-offensives in the past have taught us valuable lessons, foremost of which is to use one's own geography to every possible advantage. The mighty Niger river acts as a natural barrier between ourselves and Biafra, and we shall make it mightier still. Bunkers, razor wire, tank traps, machine gun nests, trench lines, and every other form of fortification that we can muster shall be created at key points along our side of the Niger. In doing so, not only shall we have a formidable defense, but also the perfect staging ground for moving our forces across the water as well."
 NGA_no_longer_a_brother_war: "No Longer A Brother War"
 NGA_no_longer_a_brother_war_desc: "We must emphasize and impress upon the troops that we are not engaging in a war with some foreign interloper, or something else unknown and alien. Rather, they are fighting for the sake of national unity against wayward countrymen led astray by ethno-religious delusion and sedition. As such, the civilian population must be treated with the appropriate respect and restraint when the conflict does finally begin. A failure to minimize collateral damage during the invasion will obstruct any attempt to smoothly reintegrate Biafra back into the fold."
 NGA_a_peoples_war: "A People's War"
 NGA_a_peoples_war_desc: "Our struggles with the separatists in Enugu represents something greater than a mere political and actively militant challenge to our authority. It is a challenge to the very notion of “Nigeria'' itself, to her integrity and the federal system at large. Biafra being the existential threat to our way of life that it is, is why we have never given up on our hopes of reuniting Nigeria under one flag, as one people. It is also why the Nigerian Army must be the ones to land the fatal blow, without external intervention from fundamentalist militias or Seychellois mercenaries. The Nigerian people will claim victory on their own, with their own merits. The Army is the sword they shall wield to achieve it."
 NGA_promises_to_minorities: "Promises to Minorities"
 NGA_promises_to_minorities_desc: "Nigeria cannot sit idly by while our Muslim brothers suffer at the hands of the Biafran government. In order to galvanize our supporters at home and gain allies across the border, we shall proclaim our intent to liberate the oppressed islamic minority of Biafra, as well as any others suffering under the Christian yolk. Such a move makes our intent as plain and straightforward as it has always been, demonstrating to the globe that our commitment to preserving and ensuring our sovereignty remains inexhaustible."
 NGA_a_holy_war: "A Holy War"
 NGA_a_holy_war_desc:"While the war with Biafra is our main priority, our northern states are plagued with Islamic militants terrorizing the population, sapping vital supplies from the conflict in the south. While being a controversial decision, if we could redirect these forces by channeling them into the frontline in Biafra through promises of “jihad” and political pardons we can both have more forces against our enemies in the south while taking out these militias in the process. Besides, it’s not like this could backfire badly?"
 NGA_enhanced_occupation_techniques: "Enhanced Occupation Techniques"
 NGA_enhanced_occupation_techniques_desc:"The Biafran territory that we control are, to put it mildly, completely unruly. Our occupation regime has proven to be inadequate in maintaining control over the occupied territories. Some of our more zealous officers have brought a proposal to us, a group of anti-rebel programs they call Enhanced Occupation Techniques. From interbuilding drone usage to large scale monitoring of civilians, we have to do everything we can to not lose what we've gained."
 NGA_a_fast_war: "A Fast War"
 NGA_a_fast_war_desc:"The previous four wars were all built on the idea that Biafra was a dangerous place and that we needed to spend as much time as possible to rout them out. This was never the case, we must act quickly and decisively to catch them entirely off-guard.  If they expect us to be incompetent and misguided, we must use this to our advantage and surprise them with blow after blow to their defenses and national pride. But we may need outside help to accomplish this goal…"
 NGA_trust_the_experts: "Trust The Experts"
 NGA_trust_the_experts_desc:"The Seychellois mercenaries are some of the most top-notch military operators in the world. With their highly experienced officers, skillful maneuvering, and bleeding-edge technology, these factors combined will surely aid us in crushing down the separatists that have been thorns in our government for good! However, this also demonstrated that our soldiers are vastly inferior to the Seychelles, who are well prepared for this type of modern warfare beforehand. It’s necessary that we request their assistance in strategic planning and military operations in order to ensure our total victory over Biafra unless we want to repeat the same mistakes again."
 NGA_crushing_clientelism: "Crushing Clientelism"
 NGA_crushing_clientelism_desc:"It’s commonly known within our government that higher-ups in the military are corrupted to the bone. These senile officers regularly bribed the news media and yes-men alike to keep them on top while they continued enjoying luxury at the expense of everything else. This must change of course and recent developments between us and the Seychelles have finally granted this opportunity to root out these ancient dinosaurs into extinction. Let us begin the process of modernization in our armies. Start by empowering the vocal Christian minority and promoting competent generals into the office. Once all the elements have been put together, we can then remove them from power and our once proud Nigerian Army can rise back again."
 NGA_the_gun_fever: "The Gun Fever"
 NGA_the_gun_fever_desc:"Above all else, we need arms. Our gun supply is limited and outdated, we will need to spend as much as possible in the right places to fix that. Establishing contacts with major arms manufacturers and requesting additional support from our allies can supplement this. Alongside that, we will need to work with our own manufacturers and supplies to ensure that we can meet the requirement for our frontline infantry, who are currently the bulk of our fighting forces and leading the way against the southern traitors"
 NGA_planned_reforms: "Planned Reforms"
 NGA_planned_reforms_desc:"The stagnation that is widespread within our military has become a severe problem, and for too long we have allowed it under the guise of our own political, personal, and financial interests. This cannot go on, we must do our best to map out a plan for widespread military reforms to turn our nation into a fighting force to be reckoned with. We have the means, we have the potential, we simply need the right people and the right ideas to get things finally going."
 NGA_patriotic_confiscations: "Patriotic Confiscations"
 NGA_patriotic_confiscations_desc:"Our nation is at war. And everyone must do their part for victory, voluntary or otherwise. There are some in this country that remain apathetic to the war effort as well as our government. In order to fully mobilize our nation, we will be confiscating the assets of those who are apathetic to the war or those who may even be sympathetic to the Biafrans. We will win this war."
 NGA_lessons_from_the_last_four: "Lessons From The Last Four"
 NGA_lessons_from_the_last_four_desc:"Our failure to properly grasp the aftermath of the proceeding conflicts has been made all too clear to us now, we must begin to approach the previous conflicts without the zeal of nationalism or any form of historical revisionism. We will allow and tolerate open discussions of our military failures to provide room to develop new strategies and new methods of defeating the Biafran traitors."
 NGA_no_more_fails: "No More Fails"
 NGA_no_more_fails_desc:"After decades of instability, shame and uncertainty, at long last, we taste the sweet fruit of vindication. Nigeria is truly whole once more. Biafra is fully occupied, and ready to undergo the long-awaited process of reintegration into the federal system of Nigeria, under the temporary administration of the military. Organized armed resistance from the former BAF has been dissolved, their chain of command in tatters. All that is left is to round up the stubborn few guerrillas attempting to resist in countryside holdouts, and ensure that the process of reunification is unimpeded. Let there be no misunderstanding, this is a seminal moment in Nigerian history. Our integrity and dignity as a nation is now beyond question, with the return of the oil-rich south also promising future prosperity and greater development. At last, Nigeria can move onwards into the future."
 NGA_im_just_glad_its_over: "I'm Just Glad It's Over"
 NGA_im_just_glad_its_over_desc:"After decades of instability, shame and uncertainty, we once again have failed. Nigeria has been humiliated once more as the Biafran devils gleefully cheer on our loss. Within the country, veterans returning home find themselves distraught and confused, disillusioned with the ruling regime that promised them everything and gave them nothing. Let there be no misunderstanding, this is a seminal moment in Nigerian history. Our integrity and dignity as a nation is now at stake. And as murmurings among the populace become amplified by figures slithering in from the fringes of the Nigerian opposition, the future of Nigeria has become uncertain."
NGA_looking_outwards: "Looking Outwards"
 NGA_looking_inward:0 "Looking Inward"
 NGA_looking_inward_desc: "For far too long we have been dictated by and laser-focused on beating the Biafrans, yet now, with their defeat, we must focus inward and deal with our issues at home. A number of threats plague our nation, from disease to violence, as well as issues with our economy and military. To combat this, we will gather a number of prominent individuals from across the ruling regime to discuss internally how to fix these matters at hand."
 NGA_agenda_2050:0 "Agenda 2050"
 NGA_agenda_2050_desc: "Our plan is simple, we must outline the major changes we will make towards society, the economy, our political system, and the military. To avoid alienating too much of the ruling regime and our supporter base, we will open the discussion up to all members of our side. Thereby allowing us to craft the perfect method of improving and modernizing Nigeria before the century ends."
 NGA_playing_favorites:0 "Playing Favorites"
 NGA_playing_favorites_desc: "It should be clear to us who our intended base of support and strength is. By appealing to and improving the conditions of Sunni Muslims, as well as creating a legal code much more favorable towards them and their beliefs, we can win over a sizable chunk of the country and turn them into the strongest supporters of our new regime. We must make sure to specifically focus on the Sunnis and not any other faith or sect to avoid entrenching them into the system and alienating the Sunni majority."
 NGA_working_towards_islamic_unity:0 "Working towards Islamic Unity"
 NGA_working_towards_islamic_unity_desc: "  We should try to actively encourage and build up relations between Sunni and Shia Muslims within Nigeria, as to combat radicalization and create a new bloc of regime supporters bound together by similar albeit slightly different core values. By promoting cooperation and positive relations between Sunnis and Shias within Nigeria, we can garner a reputation internationally as a leader in religious tolerance, depending on the religion of course, as well as further our stability by easing away tensions that can justify insurgent and violent behavior against others."
 NGA_call_for_interfaith_tolerance:0 "Call for Interfaith Tolerance"
 NGA_call_for_interfaith_tolerance_desc: "The mistakes of the past still continue to haunt us to this day. It isn't a huge secret to anyone when it is said that a huge cause for the instability has been intolerance and discrimination within our government towards other religions, especially the Christians. If we are to remain stable or grow, we need to rein in the most egregious offenders of religious intolerance within our government. We must also purge the most radical of islamist officers within our military. Our nation must be united in faith!"
 NGA_promises_of_secularization:0 "Promises of Secularization"
 NGA_promises_of_secularization_desc: "It is clear that the government needs reform. How much of it is necessary though is another matter entirely. We must make promises of secularization to the people in order to appease their discontent and avoid chaos. The manner in which we ought to do this is subtle; as big changes lead to important consequences, and that can represent an issue."
 NGA_allah_is_the_greatest_planner:0 "Allah is the Greatest Planner"
 NGA_allah_is_the_greatest_planner_desc: "The word of the Quran is the law of the world and the heavens, we need to properly integrate the prophet's words into our government. Various members of our government have proposed to bring in some tenets of Sharia law into the nation's legal code, mostly dealing with economic issues to avoid angering the Christians in the south. The abolition or reduction of interest rates, the codification of the zakat as a new social program as well as banning speculative markets, especially food have been considered or implemented into our government. Some of the wealthier citizens in the country have denounced these changes but as long as Allah wills it, it shall be done."
 NGA_our_friends_in_finance_capital:0 "Our Friends in Finance Capital"
 NGA_our_friends_in_finance_capital_desc: "Nigeria is a growing nation and a future superpower, however we lack the capital to reach our full potential. We have never been the most capital rich nation, but we do still have a burgeoning finance sector with billions of dollars just waiting to be invested. We should call up our "friends" in the financial sector in order to help "guide" some of their investments. A few handshakes here and a few forced loans there should start bringing in more money for our various infrastructure and economic development plans. This money is not infinite and we need to be careful where we spend it, our leader should be the one to make this decision, of course."
 NGA_supermarket_socialism:0 "Supermarket Socialism"
 NGA_supermarket_socialism_desc: "In the eyes of many of our ruling officials, shifting towards an economy inspired by the Romanians seems alienating and off putting, though there is support from some kind of “socialist” economic policy. As a result, we can put forward the idea of enabling large-scale domestic monopolies to fester somewhat unregulated to allow for better control via the government and government-ran labor organizations, rather than dealing with hundreds of small businesses and their owners, we can simply manage a dozen or so megacorporations and their ownership over the means of production."
 NGA_power_to_the_producers:0 "Power to the Producers"
 NGA_power_to_the_producers_desc: "Dr. Alhassan Mamma Muhammed proposes that we relinquish small parts of our business sector, mainly agriculture and light industry to some local enterprises and trade unions, which will allow a small but sizeable amount of competition in the workforce as well as boosting sales and revenue to the Nigerian recessive economy. Now normally, we would like to keep a tight grip on the financial system in order to control and authorize the masses what to export or manufacture but perhaps it’s time we end this and hand down some of our power to the producer and let their innovation and creativity run flow."
 NGA_attempt_virtue_signaling:0 "Attempt Virtue Signaling"
 NGA_attempt_virtue_signaling_desc: "In order to solidify control over our land we must solidify control over our soul. The religious diversity at hand in this country needs to cease, as there is only one true faith. With that, it is also necessary to level any thought of peaceful coexistence with those who wish to harm our faith."
 NGA_adopt_a_populist_image:0 "Adopt a Populist Image"
 NGA_adopt_a_populist_image_desc: "The new Nigeria needs a new image, and our image is broadcasted towards the people. From the rural poor to the urban youth, the Nigerian government will do everything in its power to appeal towards and win over the disaffected and disillusioned masses. Turning them from potential dissidents to the most ardent defenders of our new government."
 NGA_incorporate_managerialist_elements:0 "Incorporate Managerialist Elements"
 NGA_incorporate_managerialist_elements_desc: "Taking inspiration from the orient, we should incorporate greater means of political control and efficiency within our emerging political structure and system.  By encouraging micromanagement within the political apparatus of the new regime, we can easily control the political structure we have built. As by sidling ideology over pragmatic policies and planning, we will ensure that the new civilian government remains incapable of opposing us and more than capable of serving us perfectly."
 NGA_experiment_with_democratic_centralism:0 "Experiment with Democratic Centralism"
 NGA_experiment_with_democratic_centralism_desc: "This time Dr. Alhassan has asked us to help experiment with the Democratic Centralism idea, taking straight from Romania’s decision-making playbook. The chairman suggests that our first priority should be to soften our restraint in government, then propose a small-scale policy that will help encourage people to voice their opinions and debate with one another. Once all said debates are done, we then proceed with a voting referendum and eliminate any undesirable policies as well as select the ones that are largely agreed to be the best by the majority of our administration."
 NGA_establishing_military_values:0 "Establishing Military Values"
 NGA_establishing_military_values_desc: "Nigeria has a long history with our own armed forces, starting as an element within WAFF. Years later, the United Kingdom would grant us independence in 1960 and that small, tiny regiment would transform into the Nigerian Armed Forces. Six years later, a group of mutinous soldiers launched a military coup that brought on a decade-long conflict known today as the Nigerian-Biafra War. Needless to say, the NAF has played a major role in shaping Nigeria’s identity ever since its foundation with mixed results but in order to hope for the better, we will have to enshrine the good aspects of our military values, such as loyalty, discipline, courage, integrity, and selfless service, and drill them directly into the minds of our soldiers so that they can perforce better than their previous assignments."
 NGA_political_oversight_in_the_military:0 "Political Oversight in the Military"
 NGA_political_oversight_in_the_military_desc: "The lack of accountability and transparency within the Nigerian Armed Forces is deeply concerning, not to us though, but apparently the public believes so. However, increasing the influence of the civilian government within the military to keep them in check may be useful, as preventing the government from falling into disarray via coups and maneuvers by power-hungry officers is someone no one wants anymore. Thus, we will introduce positions of power and open up offices dedicated towards regulating and controlling the army through the political process and the emerging bureaucracy."
 NGA_support_careerist_officers:0 "Support Careerist Officers"
 NGA_support_careerist_officers_desc: "Nigeria has its fair share of shady business in various sectors of our government but there aren't any branches that can match the amount of backroom dealing like the one in the Nigerian armed forces, who are notoriously well known for their corruption straight from top to bottom, while we have no problem with using dirty tricks to get what we want every once in a while. The military themselves are becoming more lenient and docile as their position cements, not to mention them keeping the luxury and benefit inside their own little chamber. This needs to change of course and what's a better way than to call upon a group of young careerist officers who also want the same benefits as these mentioned officers? Let's invite and promote these generals right away so that they can quickly replace the old clique in no time."
 NGA_democratize_the_military:0 "Democratize the Military"
 NGA_democratize_the_military_desc: "The military is, and always has been an important aspect of our nation. It is what defends us, it is what we trust in, and it is an undeniable resource. Politicizing it for our means is therefore crucial. The country is teeming with Communist and Socialist sympathizers, we can use this to our advantage by integrating them in important places in the military itself, essentially establishing a military democracy with the end goal of protecting and serving the people. Ideological influences such as Romanian National Communism has helped us reach such conclusions, and we shall uphold our profound obligations."
 NGA_a_conscious_nigeria:0 "A Conscious Nigeria"
 NGA_a_conscious_nigeria_desc: "Our reforms have been a great success, and Nigeria now stands as a beacon of morality and sanity within Africa, amidst a rapidly changing and inhuman world. Guided by spirituality and the will of the masses, Nigeria is no longer stricken by waves of violence and hate. Instead, our people have learned to care for one another, and the junta enjoys the benefits of a mostly peaceful and complacent populace. Despite bickering from more radical and particularly left-wing voices within and outside of the new regime, Nigeria may not be democratic or egalitarian, but it is finally sound of mind and sound of body."
 NGA_the_three_and_a_half_republic:0 "The Third-and-a-Half Republic"
 NGA_the_three_and_a_half_republic_desc: "It has taken us years to get here but we have finally done it, we have finally moved past the mistakes of the past and reformed our government. From anti corruption measures to officer commission reforms, we have finally pushed through our plan of brining the old, corrupt regime into the future. While many still decry our government as corrupt and ineffective, it is only because they do not fully understand how much we have changed. People will always find reasons to complain but we know that we are what's best for Nigeria and we will make sure nothing threatens us again."
 NGA_the_silent_revolution:0 "The Silent Revolution"
 NGA_the_silent_revolution_desc: "The dust has settled on the instability in the capital of Nigeria as the free people of the world look on in terror as the National Communists, lead by Dr.Alhassan Mamman Muhammed, have seized control of the nation. Already, the government's new policy of Soja na Farko or military first has begun to be implemented with the vast, young population of Nigeria being conscripted into labor battalions for use across the military economy. Resistance to the new government has begun to arise but are being systematically eliminated by Alhassan's Red Army. The specter of communism haunts the dark continent and the war drums have begun to beat."
 NGA_the_jade_revival:0 "The Jade Revival"
 NGA_the_jade_revival_desc: "Almost a decade ago, Nigeria was a failed state, a disappointment with all of the potential it could have had wasted. Now? Nigeria has prospered, entering a new golden age under our regime, we have brought peace to our homes and riches to our people. From north to south, Nigeria acts as a symbol for all of Africa to aspire towards. And as the ruling regime looks forward towards all the benefits this new era will bring to them, we can only hope this age of prosperity continues forever."
 NGA_selfreliance:0 "Self-Reliance"
 NGA_selfreliance_desc: "With the south pacified, we have acquired significant oil reserves and arable land that can be used to fulfill our own needs. A national program of autarky will be needed to bring Nigeria into greatness and prevent reliance on foreign powers. Restrictions on foreign oil sales and other protectionist policies that are being implemented throughout the nation in order to help bring about National Communism. State committees controlling the resources of our nation are already being constructed and brought under our control as the workers revolution sweeps the nation."
 NGA_tools_for_our_mines: "Tools For Our Mines"
 NGA_tools_for_our_mines_desc: "Of course, our mines cannot end just with new institutions and worker control! State of the art machinery, and high-quality mines which safeguard against collapse and risks to physical health will follow both by nurturing our manufacturing industry to produce what we need and by importing goods and those able to provide such services from friendly states around the world."
 SCRLOC_NGA_METER: "[SCRLOC_NGA_METER_PROPER]"
 NGA_NORTHERN_BIAS_HIGH: "The Nation is §GClearly Biased towards the North ([?NGA_NORF_SOUF_CALC_NORF|%%]).§!"
 NGA_NORTHERN_BIAS_MED: "The Nation is §GSomewhat Biased towards the North ([?NGA_NORF_SOUF_CALC_NORF|%%G]).§!"
