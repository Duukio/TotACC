NGA.1999.t: "Failure Mountain"
NGA.1999.desc: "Ibrahim Babangida, as old as he is, could not sleep for the last 3 days. The sound of roaring engines, endless barrages and screams, screams of hundreds of thousands of his own countrymen, screams which his country heard for 60 years, of mothers that will never see their children return home, of fanatics laying before their sacred grounds with no hope, and the countless piles of corpses everywhere. But someday he had to step out into the light. The food supplies in the bunker were running out, and it seemed like the most intense of the fights were over, at least thats what the guards tried to say for a long time. Whatever happened outside, Monguno and the whole cabinet got out, looking at the scenery before them with nothing but horror.\nAbuja, the crown jewel of the Nigerian federation, had become unrecognizably bombarded, and reports of mass casualties continued to pile up. The president fell to his knees and wept upon seeing the result of nearly a decade of work turned into dust. The crackling of weapons heard in the distance raised his head. It was time to let it go."
NGA.1999.a: "Enough is enough. We must capitulate."

NGA.2000.t: "Failure Everest"
NGA.2000.desc: "The aging Babangida was at his desk in the Presidential Palace in Abuja, awaiting for a cabinet meeting on the issue of a growing insurrection and supposed \"color revolution\" in Nigeria against the military government. Despite his belief that at least the Presidential Guard was there for him, the old man could not be further from the truth: His loyalists long pacified, a rioting mass of men and women, some even without hijabs, stormed the Palace's door and subdued any guards inside.\n\nNo proper conversation could be made whilst he fell upon the mass stampede coming towards his way, and within 20 minutes, he was nothing more than a mass of softened flesh. His last thoughts were mostly concentrated on how, as a man who's lived quite long, many who fought under his name and the Nigerian banner did not survive past 25. Abdulrahman Bello Dambazau and other high-ranking government members had practically seceded from Abuja, creating a parallel government in Kano as a way to hold off the incoming riots. As the mass of peasants and starving urbanites enacted mass destruction on one of few remaining intact buildings in Abuja, the \"Dare to Die\" 17th Infantry Division had been holed up in Kano awaiting further orders. Many believed civil war was coming, but what few expected was that..."
NGA.2000.a: "Dambazau ordered his men to stand down."
NGA.2000.b: "Blood swarmed the streets of Kano."


