NGA_volunteers: "Volunteer Mobilization"
 NGA_our_friends_in_korea: "Our Friends in Korea"
 NGA_our_friends_in_korea_desc: "While Romania has often been called the birthplace of National Communism, some of the chief inspiration for our ideology has come instead from Korea. In the aftermath of WW2, and Korea’s independence, the Communist and Anarchist movement blossomed. Between them emerged a tendency known as Juche. Though chiefly popular in Korea, and by no means our primary influence, especially due to its often Anarchist leanings, it is certainly a promising movement. Perhaps we can establish ties with them to grow the influence of nationalist and Communist organisations around the world?"
 NGA_the_party_and_the_people: "The Party And The People"
 NGA_the_party_and_the_people_desc: "Some say the divisions and inequalities in Nigeria have been around ever since 1960. They are not wrong, in a sense. But in reality, for hundreds, if not thousands of years, our people have been torn apart by class divisions. Most recently, the class divisions based on racial lines imposed by the British dogs.\nBut now, with our silent revolution against the old reactionary, and bourgeois forces of Nigeria we can set about fixing this once and for all!\nOur revolution is a Communist revolution! As such we seek the eventual abolishment of all classes while we institute the rule of the workers, the peasants, and the intelligentsia! Allied together in our system of Communist revolution.\nAs these classes are united as one, we will need only one party to unite the people in revolutionary fervour in a single democratic state!"
 NGA_the_unending_plains: "The Unending Plains"
 NGA_the_unending_plains_desc: "With the beginning of collectivisation in Nigeria, it would be very very troublesome if we left the farmers and herders alone to develop agriculture. To bolster our self-reliance in agriculture, we will extend a helping hand to the workers in the plains and fields. By ramping up production of fertilisers, irrigation, and other critical infrastructure for food produce."
 NGA_beneath_the_earth: "Beneath the Earth"
 NGA_beneath_the_earth_desc: "The key towards self-sufficiency is to guarantee access to raw materials needed all across the country. How can we be truly independent, if the materials we need for guns, buildings, trains and cars, are all from foreign corporations?\nNigeria is rich in deposits of materials like iron, zinc, and lead. Investing more into digging up resources beneath the Earth will truly propel us to new economic heights."
 NGA_building_communism: "Building Communism"
 NGA_building_communism_desc: "Unlike some of the decadent and revisionists in other parts of the world, our revolution will not be delayed! At once we must start to root out any and all traces of feudalism and capitalism within our beloved nation! The landlords will tremble with fear. Foreign corporations will see their temples burn! And the bourgeoisie will be utterly eradicated."
 NGA_nature_our_mother: "Nature.. Our Mother!"
 NGA_nature_our_mother_desc: "Utilising unsustainable sources of energy runs contrary to the principles of Communism. How can we claim to benefit the revolutionary masses, if in building our nation up, we burn away its forests and poison its seas?\nAs such, we will have to turn to sustainable sources of energy. Those which will not burn and kill the Earth. Nature is our mother. We will not forsake her!"
 NGA_king_coal: "King Coal?"
 NGA_king_coal_desc: "In the past, Coal was produced in massive volumes by Nigeria. But in recent decades, production has slumped. To make the most of our geographical advantages, we should consider reviving this industry."
 NGA_down_in_the_delta: "Down in the Delta"
 NGA_down_in_the_delta_desc: "Having decided on falling back on oil as our primary resource to provide energy and power to Nigeria, our focus must fall on the Delta to get as much benefit as possible. We will open new fracking fields and oil rigs throughout the region."
 NGA_expand_natural_gas_extraction: "Expand Natural Gas Extraction"
 NGA_expand_natural_gas_extraction_desc: "expand_natural_gas_extraction"
 NGA_cutting_off_our_strings: "Cutting Off Our Strings"
 NGA_cutting_off_our_strings_desc: "What chains us to foreign imperialism, is our over-reliance on their economies. Neo-Colonialism has forced us to import gargantuan amounts of their goods and services. The most important step towards liberation from foreign rule, both in the realm of geo-politics and the economy, is to establish self-sufficiency. We must cut off our strings to the West and the Global North as a whole. We shall strive to build a society completely self-sufficient in its stead."
 NGA_burst_open_the_cells: "Burst Open The Cells"
 NGA_burst_open_the_cells_desc: "Within every African nation, there are thousands of people sympathetic to our National Communist cause. Ever since the silent revolution, many have looked to us with inspiration and begun to form their own National Communist revolutionary organisations. Due to popular opposition to the French regime, many have appeared across near our border areas with the French. We will build the strength of these cells by smuggling weapons and providing training."
 NGA_green_guns: "Green Guns"
 NGA_green_guns_desc: "One of the most progressive regimes in Africa, without a doubt, is Gaddafi’s Jamahiriyah. For decades it has valiantly fought against foreign imperialism, by sending support to anti-imperial and socialist movements throughout the world!\nWith the success of our resolution, we will pursue close ties with the Jamahiriyah, in solidarity with their opposition to French colonialism, through the purchase (and provision of) tanks and arms."
 NGA_along_the_forbidden_city: "Along the Forbidden City"
 NGA_along_the_forbidden_city_desc: "Some within the government of Maoist China have voiced their disapproval with us. Condemning our nationalism as counter-revolutionary and not fundamentally progressive or good. Even still, in the realm of realpolitik, such concerns tend to be muted. Pursuing economic and political ties to give China an ally on the African continent is hardly something they’re likely to reject."
 NGA_in_great_bucharest: "In Great Bucharest"
 NGA_in_great_bucharest_desc: "Bucharest has often been called the birthplace of the National Communist movement. We commend the Romanian National Communists for their bravery in sticking up against the revisionist and capitalist tendencies of the modern Soviet Union! Pursuing secure and close ties with this movement and its proponents shall thus be our top priority.\nOne ambitious idea has been to model the practice of African university students migrating to the Soviet Union for education. By sending Nigerian students to Bucharest, and vice versa, we will foster not only friendly relations with the Romanians, but educate a generation of men in the way of our revolution!"
 NGA_africa_unchained: "Africa Unchained!"
 NGA_africa_unchained_desc: "Across all of Africa, wars are raging. Not just attacks against the French Empire. But fermenting popular revolution against Capitalist regimes, and civil war against the vestiges of colonial rule ( such as in South Africa). We cannot sit idly by and risk their failure! So, young warrior! Quickly! To Arms! Go down to the foreign land, where your brothers fight for freedom. Fight with them, boy! For none of us are free until all of us are free!"
 NGA_pressure_on_all_sides: "Pressure on All Sides"
 NGA_pressure_on_all_sides_desc: "Our chief enemy is the French. What else is there to say? They, by far, form the biggest European presence in the continent. While almost every other empire has been kicked off the face of Africa, France alone remains. Much of West Africa remains under its vampiric claws. We are surrounded on all sides, and within the borders of the empire, our brethren yearn for freedom. Now is the time we begin to work towards an inevitable confrontation against Africa’s last foreign empire."
 NGA_going_glowing_green: "Going Glowing Green"
 NGA_going_glowing_green_desc: "While technically not sustainable, nuclear energy leaves a remarkably small mark on the Earth in exchange for gargantuan amounts of energy. To spread electricity and power to every single part of Nigeria and move towards sustainability, we will utilise nuclear power."
 NGA_the_flames_of_industry: "The Flames of Industry"
 NGA_the_flames_of_industry_desc: "It is hard to deny that Nigeria is by and large a non-industrial state. Many of the advances of the modern world have not reached Nigeria and millions lie impoverished. To raise the standing of Nigeria once and for all, we will need to fan the flames of industry. Brazen and uncaring industrial growth through a system of economic plans are the only way forward!"
 NGA_in_the_words_of_sankara: "In The Words Of Sankara"
 NGA_in_the_words_of_sankara_desc: "“Those who come with wheat, corn, or milk. They are not helping us. Those who really want to help us, can give us ploughs, tractors, fertiliser.” These words have sent ripples throughout Africa and awakened many people to the necessities of self-sufficiency, and provided scepticism to what was once portrayed as purely altruistic Western foreign “aid”. If we are to be self-sufficient and build up a robust economy, we do not want raw materials. We want that which will allow us to build up a base which can produce our economic needs. We will not leech on the teat of foreign capital, so that they may suck us dry."
 NGA_the_crashing_blue_stream: "The Crashing Blue Streams"
 NGA_the_crashing_blue_stream_desc: "Irrigation is the future for us all! The uncaring and immensely powerful streams of water that are found all over Nigeria can provide untold amounts of energy and wealth. By ensuring the arrival of water to areas that need it most, not only will we combat famine and lack of access to clean water, but guarantee fertility to even the driest and least productive provinces."
 NGA_finding_new_deposits: "Finding New Deposits"
 NGA_finding_new_deposits_desc: "Biafra’s primary claim to economic fame came from its vast resources of gas and oil in the Niger Delta. But decades of war and turmoil have no doubt restricted potential billions in profit. By rebuilding Biafran infrastructure in the region, and investigating new deposits of gas and oil, who knows how much benefit will follow?"
 NGA_a_thousand_white_trees: "A Thousand White Trees"
 NGA_a_thousand_white_trees_desc: "What could be more renewable than wind? It is everywhere. It is infinite. It is for all! Every province of Nigeria, every city, every town, every village will abound with countless wind farms."
 NGA_in_a_land_down_under: "In a land Down Under"
 NGA_in_a_land_down_under_desc: "Australia is one of the most pro-active economies in the production of Uranium. Other deposits are to be found in the North in France, but we have no interest in dealing with vicious imperial powers like them. Australia is indeed an empire in its own right, but at least they pose no immediate threat to us, making them a great base to acquire nuclear resources."
 NGA_and_a_hundred_black_fields: "And a hundred Black Fields"
 NGA_and_a_hundred_black_fields_desc: "The large amounts of exposure to the sun we regularly get combined with low cloud cover, primarily in the Northern provinces, makes Nigeria fertile ground for developing solar energy."
 NGA_off_the_coast: "Off the Coast"
 NGA_off_the_coast_desc: "We cannot stick only to areas directly accessible by land if we want to build as much oil and gas production as possible. By building oil platforms far away from the coast, we will be able to get into largely unexplored opportunities. Moreover, we are vigilant and aware of the goals of foreign infiltrators and imperialists. No doubt they too are clamouring to access offshore oil fields which technically are outside of our maritime borders. We will never allow these vampires and parasites to cut us off from resources that rightfully belong to the African people! This is not just a matter of resources. But of proving our power and sovereignty!"
 NGA_everything_must_stay: "Everything Must Stay!"
 NGA_everything_must_stay_desc: "We will not have accomplished much if all the oil and gas we have put so much effort into producing, disappears from our country into the jaws of foreign capital. Indeed, we would only be repeating old patterns of imperialism by sending off our raw materials and resources in exchange for foreign raw-materials.\nStill, there are undeniable benefits to selling off our oil too. While we are not issuing an oil embargo, we ought to raise prices and cut production. See to it that what is made in Nigeria, stays in Nigeria!"
 NGA_ensure_decent_standards: "Ensure Decent Standards"
 NGA_ensure_decent_standards_desc: "It would be a blight on our legacy as Communists, if we were to establish self-sufficiency for Nigeria on the back of labour exploitation and mass suffering. We are not barbarians. We will not send our precious workers to the mines to die for coal! By introducing the Abuja Work-system into the mines we will form systems of collective councils, guaranteeing worker control over the mines, with the parties guiding hand."
 NGA_keeping_up_with_the_kremlin: "Keeping up With the Kremlin"
 NGA_keeping_up_with_the_kremlin_desc: "It would be ludicrous to pretend that, despite their reformism, the Soviet Union is not the world’s chief socialist superpower. Pursuing some diplomatic ties to ensure relations do not suffer is paramount. After all, we cannot forget that we are surrounded by the French imperialists. Making enemies of another superpower while we are already in danger would be quite an issue indeed."
 NGA_cultivating_pride: "Cultivating Pride"
 NGA_cultivating_pride_desc: "Our revolution is not only Communist, but National too! We, as a people, are united not only on the principles of class struggle and Communism, but in our national identity! Sure, many have tried to divide us. But we will stand firm, united. Regardless of faith or creed. We are one nation! We must build faith in our national path towards Communism within the whole of the state."
 NGA_nationalising_industry: "Nationalising Industry"
 NGA_nationalising_industry_desc: "Countless firms which dominate essential sectors of the economy are owned and controlled by foreign private entities, if not foreign governments entirely! To exert control over our natural resources and our land and cities we will begin to nationalise all privately owned industry as the shift toward Communism begins!"
 NGA_the_question_of_land: "The Question of Land"
 NGA_the_question_of_land_desc: "The majority of Nigerians do not live in the cities. The majority of our workers do not work in the factories and urban centres. Many live in the countryside and the rural exterior of the country.  It is also here that reaction to revolution abounds. Not just in conservative clergymen, but in the big landlords, native and foreign.\nTo remedy this, we will begin an intensive and ambitious campaign of land reform. One which will redistribute land away from the landlords and into the collective ownership of the farmhands who actually work on the land. The power of feudal lords and tribes will liquify as we force them to abandon the ways of the old world. The despotism of these petty kings and chiefs will crumble away, and a new dawn will come to Nigeria!"
 NGA_the_peoples_bomb: "The People's Bomb!"
 NGA_the_peoples_bomb_desc: "The enactment of socialism in Nigeria cannot take the form of mere state direction and bureaucratic management. To build up a true model of Communist rule in Africa, we will move towards the implementation of a system of national, collective ownership. A model of collective control over industry and land. A work system which will be the people’s bomb! The Abuja Work-system shall be its name!\nThat being said, the presence of reactionary, Capitalist elements within the working class means that some party oversight is necessary. Not only to direct production but ensure a socialist model of collectivisation is being pursued."
 NGA_along_the_model_of_stalin: "Along The Model of Stalin"
 NGA_along_the_model_of_stalin_desc: "The basis for our new socialist organisation of land and agriculture will be one of collective control. The foremost historical example for this, outside perhaps China, is of course the USSR. Specifically, under Joseph Stalin! A program of collectivisation of the land, based on the old Soviet Kholkoz, will be our top priority.\nWith this, of course, must come a strong campaign against the ‘kulaks’ of Nigeria. While the conditions of 21st Century Nigeria are obviously not equivalent to the Union in the 1920s and 30s, that there will be wealthy smallholders, hiring what amounts to slave labour, is inevitable. They will likely oppose us. We will liquidate them as a class in turn. A true socialist model of agrarian production is swiftly approaching."
 NGA_hammer_down_the_landlords: "Hammer Down the Landlords!"
 NGA_hammer_down_the_landlords_desc: "Plans for land reform have been drawn up. Maps analysed, and census’ made. Now we will have to actually put it into practice. Peasant agitation has worked in some reported cases and land has been collectivised by the peasantry in a few parts of the countryside. But many more lack the means, and/or consciousness, to rise up and smash their overlords.  As such, we will send legions of our new Red Army, and young, radical volunteers to the countryside. They will, with weapons in their hands, uproot the power of the feudal landlords and the big bourgeoise. Foreign capital will tremble, and those unable to free themselves will have their chains broken for them..."
 NGA_torch_down_their_castles: "Torch Down their Castles"
 NGA_torch_down_their_castles_desc: "Communism cannot live in harmony with feudalism. The old system which promised autonomy to tribal lords and kings, must therefore go! Class struggle is already manifesting across the country as, in the wake of our Anti-Landlord campaign, many join volunteer organisations to carry out revolution.\nHowever! Material gains are not enough! Not only will the privileges of the chieftains and petty kings be liquidated. But the chauvinist cultures they perpetuate will too! With great violence and fervour, we will begin to smash down those who decry the rights of women and uphold their servitude to men! We will smash down those who speak of racial chauvinism against fellow Africans! To beat the feudalist is not only to seize their land after all. But to break down every tradition and false idol they have made!"
 NGA_away_from_the_market: "Away From The Market"
 NGA_away_from_the_market_desc: "Despite their praise for the goal of Communism, many so-called Communist states are nothing but! Ever since the vicious, traitorous reforms of Kosygin in 1965, socialism in Europe has surely been on the backfoot, outside of one or two notable holdouts. We must stand against such foolish revisionist tendencies. Completely rejecting the market, we will uphold a model of economic planning instead.\nThough, the question remains. What shape should our planned economy take? Some say that following Beijing’s model of economic planning, and the old model of the Union under Joseph Stalin. Others, especially holdouts of Technocratic organisations from before the revolution, have argued for copying the methods used by economic planners in Chile. That is, copying the model of Cybersyn and pursuing computer-based planning."
 NGA_just_like_the_old_days: "Just like the Old Days"
 NGA_just_like_the_old_days_desc: "Comrades! The gains of the revolution thus far have been great indeed! We have broken the backs of the petty-bourgeoisie, and the national bourgeoisie. We have driven out the power of the feudal kings and big bourgeois landlords. But our greatest achievement has yet to come! In choosing the model of Beijing, which is good indeed, a more authentic road to socialism will surely follow! The Capitalist roaders and twin evils of foreign capital and imperialism have taken a beating. For we have chosen not to subject our revolution to the whims of the market nor to wishes of cold machinery! Communism shall liberate the masses. To do so, it must be led by the masses! It must be directed by the people. Oppose the autocracy of the cold machine. Uphold the Beijing model of Communist planning!"
 NGA_down_from_santiago: "Down from Santiago"
 NGA_down_from_santiago_desc: "Following a vote within the party, it has been decided that the best way forward for us is to fall back on the Santiago model. Time has proven again and again that the only way forward is to entrust ourselves to the advance of technology. It was 50 years ago that Cybersyn began to operate. And it was 50 years ago that a new chapter in the book of Communism was opened. Just as the Chileans saw success in the direction and planning of the economy, so too shall we as we open ourselves up to that which we’ve been missing for so, so long."
 NGA_promises_to_enugu: "Promises to Enugu"
 NGA_promises_to_enugu_desc: "What a tragedy it is, that so many millions have needlessly died in countless wars between brothers. The Black man should never kill his brothers and sisters. The Biafran conflict is, of course, emblematic of this. Driven in part by selfish separatists, let us not forget the role of Fulani chauvinists and the unjust oppression they levied on our brothers in the south.\nTo permanently solve this conflict, we will sit down and compromise with Enugu to ensure their pacification. We will provide them the autonomy they so desperately want. This will undoubtedly anger some Fulanis and Hausa in the North, and Biafran ultra-nationalists will continue to wage warfare against us. But no matter. We will bring forth the full force of revolutionary terror against such reactionary fools, while we bring love and respect to those who accept compromise."
 NGA_seize_their_wealth: "Seize their Wealth"
 NGA_seize_their_wealth_desc: "The comprador bourgeoisie of Nigeria who collaborated with foreign imperialism are the most wretched of our enemies. These oligarchs have untold billions in foreign banks, or in fiat currency within the country. The wealth they have stolen from the masses will be taken from them, and placed back in the hands of those who it rightfully belongs to!"
 NGA_keeping_our_word: "Keeping Our Word"
 NGA_keeping_our_word_desc: "Keeping Our Word"
 NGA_northern_pride: "Northern Pride"
 NGA_northern_pride_desc: "We shall not soon forget the treachery of the Biafran south. The evils of separatism have killed millions of people ever since 1967! To maintain the integrity of Nigeria, we will embolden our pride in the North. The peoples of the Fulani and Hausa are the centre of Nigeria. While we will not persecute the Igbo, our pride is for the North alone. We will have no sympathy for separatist terrorists as we transform our nation into one based on our Northern identity."
 NGA_our_black_skin: "Our Black Skin"
 NGA_our_black_skin_desc: "Despite the decades of conflict which scar Nigeria, let alone Africa itself, our movement is fundamentally based on our love for Africa and the Black man. For decades, if not centuries, we were ruled by foreign white colonists. And through this colonisation, we have been united in spirit. Pan-Africanism is thus our foundational goal, no matter the brutal attacks launched by those who insist on the murder of their brothers!"
 NGA_no_room_for_white_menace: "No Room for White Menace"
 NGA_no_room_for_white_menace_desc: "The greatest blight on Africa has been the rule of the White man and the colonizer over us all. Nigeria itself was tortured by the rule of the Anglo, as was much of Africa overall. Even today, the stains of foreign rule and oppression dot our precious continent. Of course, there is France. The French still maintain their colonies in Western Africa, and South African Apartheid enchains millions of Africans too.\nWe can never allow ourselves to be next. We cannot become susceptible to any form of neo-colonialism. The White devil must be banished from Nigeria. In any way that we can! Not one single trace of the influence of the White beast shall remain here."
 NGA_keeping_our_brains: "Keeping Our Brains"
 NGA_keeping_our_brains_desc: "Revolutions are trying times. Though liberating, they bring uncertainty and unrest. And with that, comes the flight of the intelligentsia. To us, the intelligentsia is one of the principle revolutionary classes needed to bring about Communism, alongside the workers and peasants. As such, many have already joined the ranks of revolution. But other technicians, doctors, lawyers, and so on, have fled for what they believe to be greener pastures (usually in Europe). We must keep a tough track on the border and the flight of our countries best, lest we fall into a vicious circle caused by their flight."
 NGA_crack_the_raiders: "Crack The Raiders"
 NGA_crack_the_raiders_desc: "A combination of armed thieves and bandits, Islamist theocrats, herders, and farmers, dot the countryside of Nigeria’s north. Every year, thousands, if not tens of thousands, are robed, killed, or raped by these thugs. Furthermore, some have even fashioned themselves as centres of Anti-Communist rebellion. They thus form a near existential threat to us.\nTo deal with them will require many things. Of course, armed might. We are not looking to bribe our way out of insurgency. We will come down on the North with all our might. Burn down their strongholds and kill them to the man! But this struggle cannot just be a physical one. As many have taken a religious tone to their opposition of Communist rule, we will meet them in kind. We will also intensify a campaign of state Atheism to crash the role and power of the Church for the Northern Muslims."
 NGA_arrest_the_elders: "Arrest the Elders"
 NGA_arrest_the_elders_desc: "The geriatric politicians and government officials have overseen decades of corruption, mismanagement, and despotism over the working class and Nigerian peasantry. Will we really sit by and let them get away with it? Of course not! This is not just a matter of justice after all. These groups do form a serious political threat to our revolution as leaders of counter-revolution. We shall retire them to the dustbin of history."
 NGA_knock_down_the_police: "Knock Down the Police"
 NGA_knock_down_the_police_desc: "One of the hotbeds of reaction is the police force of Nigeria. Many are corrupt, and form a blight on our society. It is commonplace to hear of the police robbing people! What a rotten institution! As revolutionaries and leaders of the proletariat, peasants, and progressive intelligentsia, we will knock out the forces of counter-revolution. Send them to the prisons or to their graves! It does not matter to us!"
 NGA_the_order_of_the_day: "The Order of the Day"
 NGA_the_order_of_the_day_desc: "Our latest measures cannot be expected to solve the lingering threat of counter-revolution within the police or the vestiges of the old government. Counter-revolution is a force which can only be combated by the only language it understands. That of unparalleled violence! These monsters we fight have enacted great horrors on the masses of Nigeria through their corruption and exploitation, it is clear they would not hesitate to multiply their terror against us if they were to return.\nThe only recourse is to declare that we shall make terror the order of the day! A terror to complete the revolution. A terror led by the working masses of Nigeria!"
 NGA_a_nomadic_nigeria: "A Nomadic Nigeria"
 NGA_a_nomadic_nigeria_desc: "As millions of traitors rallied across the streets of Abuja and Lagos, the true patriots and heirs of the Sokoto Caliphate plotted. Through our holy victory against the forces of degeneracy, we've begun the process of slashing Nigeria's rainbow nation status and focus on ourselves as the heirs of an ancient, incredible civilization that once commanded all of West Africa. Now's the time for the Fula and Hausa to reign in the World to their desires. Onwards!"
 NGA_bylaws_and_belief_systems: "Bylaws and Belief Systems"
 NGA_bylaws_and_belief_systems_desc: "As thousands of state enterprises are dissolved or privatized, many have begun to feel the need for the State to do more in terms of moral guidance. As a night-watchman state however, we've opted for a more enlightened approach: The creation of "Honor code" contracts which every productive member of society must agree to. These include adhering to certain moral standards and to deal with disputes in holy struggle for blood. We will not tolerate the weak to thrive."
 NGA_we_want_fulanization: "We Want Fulanization"
 NGA_we_want_fulanization_desc: "The Hausa and Fula people of Nigeria are, as many Marxists might say, the most "historically progressive" of all the peoples of the Benin Bight. As Igbos and Yorubas lived in huts and prayed to animist gods, we, the nomads of the North, knew better, and followed the one true religion which will bring us to an enlightened age. Usman Fodio knew this, and Nigeria as a whole must follow this template for a bright future."
 NGA_radical_izlam: "Radical Izlam"
 NGA_radical_izlam_desc: "As the Western World and even Asia collapses under the weight of its own secular degeneracy, we ought to hold dear to our traditions of fierce, unforgiving Sunni Islam, with a strong emphasis on the needs of the modern age synchronizing with our ways of life. That said, allowing the kind of speech and ideas that dismantled the Western world and is turning the East decrepit must be stopped."
 NGA_smart_sharia: "Smart Shar'ia"
 NGA_smart_sharia_desc: "We understand that Shari'a has some difficulties in being applied completely in the modern age for many reasons - be they financial, social, cultural... Therefore, we ought to combine the teachings of Political Islamism with hadiths and reforms which help create an intelligent, effective Shari'a which, aided by modernity, can be best enforced in a way that isn't, for lack of better word, dumb."
 NGA_emirs_of_the_emerging_economy: "Emirs Of The Emerging Economy"
 NGA_emirs_of_the_emerging_economy_desc: "As decentralization goes further on and thousands of corporate entities stake their little territories in our nation, all aided by the Honour Code system and by the consent of Abuja of course, we ought to create semi-feudal and royal titles for these new corporate Emirs - we are an emerging economy like no other, and for that we need radical, transformative solutions."
 NGA_rise_of_the_corporate_caliphate: "Rise of the Corporate Caliphate"
 NGA_rise_of_the_corporate_caliphate_desc: "As our Honor Code is further and further applied socially, we ought to now fully implement it as an incorporated element of our code of law, and Constitution. A radical reform and departure from our previous society, through this forward-thinking but traditionalised understanding of petty kingdoms ruled by a Sovereign, we can create a true autocracy in the Hausa fashion."
 NGA_northern_values_western_tech: "Northern Values, Western Tech"
 NGA_northern_values_western_tech_desc: "What does the west have that we do not? They may claim a million and one things, but the difference is that we have not lost our values in the face of technology. And unlike the east, we have not based our values around technology. No, the Northern way of life will make their technology subservient to our values. Let us not forget their algorithms and generative models were based on the findings of islamic scholars and merchants."
 NGA_abuja_dream_tone: "Abuja Dream Tone"
 NGA_abuja_dream_tone_desc: "Our nation has undergone a truly incredible transformation. Now that we've secured the institutions and functioning of Nigerian society, we may begin to reach futures never thought before, a true syncretism of the past and the future into an optimistic, beautiful creative effort by the Niger's peoples."
 NGA_prioritize_pastoralism: "Prioritize Pastoralism"
 NGA_prioritize_pastoralism_desc: "We are a nomadic, pastoral people which never settle in one place. As the great caravan-raiders of the Sahel, we know that cities are beacons of degeneracy and foment weakness in a people. We need to minimize the importance of cities in our nation and create a society of faithful, Islamic raider-nomads to take ourselves into an archaeo-future."
 NGA_crispr_cow_commerce: "Crispr Cow Commerce"
 NGA_crispr_cow_commerce_desc: "Nigerian cow species do not necessarily cover all the needs of not only our nation but of international markets - they are seen as only good for extreme heat - and thus, we must focus on creating a perfect bovine - one that will not only handle heat, but cold; one that will not only provide meat, but also good milk; and most of all, be cheap to maintain."
 NGA_goat_silk_securities: "Goat Silk Securities"
 NGA_goat_silk_securities_desc: "The process of combining DNA from select arachnid species into the DNA of our goats to allow them to produce a silk-like substance from their milk is nothing new. Our advantage however, is our familiarity and traditional approach to raising and ranching goats, unlike the superpowers who currently excel in this field. It will be the pride of our new Nigeria if we invest heavily into this sector and outpace the west in it’s profitability."
 NGA_from_the_field_to_foreigners: "From The Field To Foreigners"
 NGA_from_the_field_to_foreigners_desc: "As our meat and dairy industries have increased in capacity and output, we've also begun a focus on free, unrestricted trade. Tariffs should remain minimal as to help our citizens flourish, and so will also the mighty nations of this World to flourish by our side, as equals."
 NGA_converions: "Conver$ions"
 NGA_converions_desc: "Whilst we realize that religion is a deeply uncommercial thing and requires intense observance and commitment, we also realize that many so-called "Christians" in Nigeria simply need some convincing to join us in Allah's plight for the salvation of the universe. A few grants, some tax cuts, and a few nudges can surely fold some of the weaker-willed Yeshuaites."
 NGA_a_waqf_from_the_west: "A Waqf From The West"
 NGA_a_waqf_from_the_west_desc: "As much as supposedly intellectual, anti-Western and so-called "anti-colonial" islamic clerics may despise western innovation and European intelligence, we know all too well that without embracing the future, we will be then left exploitable for the true colonizers of our time. Embracing light is not losing your fire - but rather, the celebration of that fire. We must accept the unconditional gifts the West, so lovingly, has given to our people to raise themselves up from their misery."
 NGA_anticolonial_rhetoric: "Anti-Colonial Rhetoric"
 NGA_anticolonial_rhetoric_desc: "While we understand the intellectual, economic and psychological prowess of Western nations, this does not mean we are anywhere near their subjects. We are an independent nation, which has simply embraced the modern age - nonetheless holding our traditions to our national heart - and that we should act like it. We are our own country, sovereign and with its own cultural touchstones. Motions like phasing out common law would be a good start in our crusade to reduce international influence in intelligent ways."
 NGA_the_israelites_demise: "The Israelites' Demise"
 NGA_the_israelites_demise_desc: "As much as we may emphasize the perfect teachings of Islam, its correctness upon the face of the degenerate activities in places like South Africa and even our neighboring Biafra, the worship of auxiliary prophets as God has remained a terrifying element of our society. We must crack down on Christianity and Judaism, both extremely subversive for our national context, and begin the process of reintroducing jizyah, a form of religious tax on infidels, to enrich our nation and discourage these heretics from maintaining their incorrect faiths."
 NGA_the_traditions_of_tomorrow: "The Traditions Of Tomorrow"
 NGA_the_traditions_of_tomorrow_desc: "The suits of Moscow and Tokyo scratch their heads, they find our way of life unfathomable. In the wartorn ruins of America their citizens look towards us for lessons on how to survive in their calamity, thinking as if we came to this society out of struggle. We no longer suffer under the crushing weight of soulless urbanism nor under backwater reaction, we have taken modernity by the horns and made it submit to us. Nigeria is a beacon for an alternative future, one which the world will learn to respect, and soon enough, desire as an escape from their many mistakes."
NGA_the_abuja_journee: "The Abuja Journeé"
NGA_the_abuja_journee_desc: "A campaign of revolutionary terror will be an abject failure if it is imposed purely from the top down to secure the role of the party. Fortunately, there is fertile ground for popular mobilisation! The greatest place to start is, of course, Abuja. We shall provoke the workers and peasants in Abuja to rise against reaction. They will come up, arms in hand, and demand their deaths! Demand the fulfilment of revolution! When the people’s will is installed in Abuja, it shall no doubt spread and abound throughout the cities of Nigeria!"
NGA_the_lesson_from_russia: "Lessons from Russia"
NGA_the_lesson_from_russia_desc: "What has Russia taught us? That a revolutionary, progressive, state can degenerate due to the threat of reaction. Kosyginites who worship the whims of the capitalist market have corrupted the revolution in Russia. By looking into the government, and the party, we will endeavour to root out the rot of Capitalist roaders."
NGA_decap_the_generals: "Decapitate the Command"
NGA_decap_the_generals_desc: "Across the world, in any place where revolution occurred, the army almost always stood in its way. Who is to say that Nigeria will not follow them? The terror ought to come crashing down on the military. Both for the generals we cannot trust, and low-ranking officers and commanders who at every turn, plot the downfall of the Revolution."

