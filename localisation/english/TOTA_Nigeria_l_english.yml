NGA.2007.t: "The King In The Mountain"
NGA.2007.desc: "It had been 3 in the morning. The security in Abuja's Aso Villa, which hosted the President, had switched guards just 8 hours ago. Ibrahim Babangida, sleeping soundly, was jolted awake by the cracking of gunfire in the Aso Villa. Men screaming, blood gurgling. What a horrible thing to hear while waking up, he thought.\nNot much time was allowed to Ibrahim, however, who suddenly met fierce knocks on his door. He grabbed his bedside pistol, aiming it towards the door.\n\"Do not move a fucking inch, or I'm firing!\"\nThe men did not care. They threw a flashbang grenade into the room, and Babangida began to panic, emptying out his pistol's magazine all over what he believed to be the door. Miraculously, no man was hit, except Babangida - who was immediately shot in multiple places - and fell towards the ground in writhing pain.\n\"Mr. Babangida, we believe that it is time for you to resign. Your cronyism and impossibly incompetent governance have crippled this country long enough. Get yourself clean and we'll patch you up - you'll have to meet the big screen tomorrow.\"\nIbrahim looked on in sheer shock. What was supposed to be a glorious last stand against the forces of evil seeking to destroy Nigeria had simply become a wimper, as he timidly spoke in a televised address only 12 hours later. Ibrahim would be remembered as a coward."
NGA.2007.a: "Vermin."

NGA.2011.t: "Abuja Dream Tone"
NGA.2011.desc: "Usman never thought he'd be living out in the savannah herding cattle. A few months ago he was a customer service guy taking calls in his cramped cubicle in Bida, now those times feels like ages ago. Adjusting the volume of his earbuds, Usman remembered the early office chit-chat about how the government's traditionalist agenda is just gonna be empty talk like usual, until they started giving out tax grants for people to leave the cities. "It's not gonna affect us" he remembered saying that, "it's just gonna be the poor farmers". Then they abolished the legal system, urban nigerians like him were left without any protection. Then Usman's employer company, apparently the government decided software development was a waste of nigeria's resources. White men from some agro-company took over the office, them and a dozen other foreigners coming to exploit the non-existant tarrifs and tax system. He thought of staying in Bida until the tax rates were hiked again, that's when Usman decided to leave town.\n\nUsman thought of how unfair it was before he spots a small cloud of dust a short distance away. "Goddamn raiders," he mumbled while loading his sniper rifle, bought for cheap when the disbanded Bida police's armory was being sold off. There was a time when he would run, but you can't run when there's nowhere to run to. Now, wiithout even taking off his earbuds, Usman took the shot and the raider 300 meters away slumped over his horse and finally onto the savannah dirt. Then once he took his eyes off the scope Usman felt something he's never felt before. It's not the first time he had to defend his family and herd like this, maybe it's the satisfaction, maybe it's the thrill, maybe it's the coffee or the music still playing in his earbuds. But he felt something, something that the old Usman could never achieve. Now he understood the virtue of tradition. And now..."
NGA.2011.a: "...He felt happy."

