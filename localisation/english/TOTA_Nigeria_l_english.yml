NGA_northern_bias_loc_key: "Northern Bias"
NGA_northern_bias_loc_key_desc: "As the British favored the Hausa-Fulani peoples in military affairs and left the Yoruba and Igbo intellectuals to handle government, the logical effect of a military junta is a society and culture led by brutes. Despite the more literate and intellectual elements in our society being in the wealthy south, most government jobs and posts are occupied by Northerners - which has the effect of making our decisions more uninformed and more based on military discipline than any logical political overture or policy package.\n\n\n\n\n£texticon_idea_northern_bias\n\n\n\n\n"
NGA_neutral_bias_loc_key: "North-South Neutrality"
NGA_neutral_bias_loc_key_desc: "Nigeria is currently under a regime with a neutral, unbiased outlook on its North-South divide."
NGA_southern_bias_loc_key: "Southern Bias"
NGA_southern_bias_loc_key_desc: "Nigeria is currently under a regime biased towards the Southern parts of the country."