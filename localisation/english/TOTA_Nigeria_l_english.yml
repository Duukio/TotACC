NGA.1945.t: "Japanese Investor Contracts in ELDA Expire"
NGA.1945.desc: "Contracts previously enacted by the Lagos State Government to Japanese corporations have expired, and with it comes the next chapter of the ELDA's development: How will the Lagos State government plan on finalizing the transitional process where massive grants were given to Japanese corporations and to ensure a health cycle of development from here on out?"
NGA.1945.a: "...gracefully providing renewed contracts!"
NGA.1945.b: "...kicking them out, their investments seized!"
NGA.1946.t: "Soviet Investor Contracts in ELDA Expire"
NGA.1946.desc: "As contracts given out by the Lagos State government and Moscow expire, many have wondered how Abuja plans on renewing these agreements and creating a more permanent (and more equal) position to ensure the area remains in the hands of Nigerians. After a long week of negotiations, the Lagos State government has..."
NGA.1946.a: "...gracefully renewed the contracts and kept a majority share!"
NGA.1946.b: "...kicked out Soviet investors and seized the assets in the area!"
NGA.1947.t: "Soviets Demand Compensation For Lost Investments"
NGA.1947.desc: "As we've kicked out the Soviets for their lack of investment in the ELDA despite our intense diplomatic friendship with them, we've begun receiving multiple trongly-worded letters a day demanding compensation for lost funds in investments and stocks in the region. How do we respond?"
NGA.1947.a: "Tell them to buzz off, but give back most of their futures and stocks."
NGA.1947.b: "Demilitarize the area and request the UN for mediation."
NGA.1947.c: "Seize all assets and tell them to leave us alone!"
NGA.1948.t: "Japanese Demand Compensation for Lost Investments"
NGA.1948.desc: "As we've kicked out the Japanese for their lack of investment in the ELDA despite our intense diplomatic friendship with them, we've begun receiving multiple strongly-worded letters a day demanding compensation for lost funds in investments and stocks in the region. How do we respond?"
NGA.1948.a: "Keep the land and return resources to them."
NGA.1948.b: "Request the UN mediate the region and ensure its economic future as part of Nigeria."
NGA.1949.t: "Soviets Declare War On Us!"
NGA.1949.desc: "Due to our constant antagonizing of them, the Soviets have invaded us from Benin!"
NGA.1949.a: "Fuck!"

NGA_BIA_EMBARGO_END_TT: "Ends the embargo between Biafra and Nigeria, flourishing trade. 60 billion GDP is added to both sides right away as markets flood open."

BIA_why_cant_we_be_friends: "Why Can't We Be Friends?"

NGA.1951.t: "In The Words of Sankara"
NGA.1951.desc: "Tinubu wiped the sweat off his brow. Around him were dozens of others from his village who had come to work on the newly collectivised farms. Nobody had heard from the old landlord for the past few months, and nobody thought to inquire about it. A few grumbled, but many were very happy indeed that they would no longer need to pay costly rent.\nA voice then shot up from the crowd, his friend Abibatu, Cassava in hand, pointed away with her hand to a nearby road. 'Who are those people?' she asked. Tinubu looked and saw a group of uniformed men and two soldiers who accompanied them. A slight sense of unease washed over him at the sight of the guns, until he saw that the men coming over wore smiles on their faces and were bringing behind them five or so carriages covered by red tarp.\nOne man began to speak. 'Comrades! Citizens! Gather round! Gather round!' The people around Tinubu walked over and Tinubu soon followed. The man continued to speak. 'You may all remember recent announcements from Abuja, my friends, that in response to the demands of local councils and collectives and in accordance with the new five-year-plan a revolution in agriculture is to take place.' Tinubu recalled at that moment, back in the village he had seen posters strung up by the local village council announcing their goals to ease labour burdens through the introduction of agricultural machinery. 'Our friends in China, in a display of revolutionary solidarity have provided us with a shipment of many goods, which I know will be to all of your liking.' Almost as if a switch was activated, the soldiers tore off the tarp and revealed great crimson tractors. On them were painted slogans in Mandarin, which of course Tinubu could not read. On a metal shaft on each of the tractors were portraits of various figures Tinubu had seen before. Lenin, Ceausescu, and of course Dr. Muhammad."
NGA.1951.a: "Good times are coming."
NGA.1952.t: "The Party and the People"
NGA.1952.desc: "Tope Folarin walked through the streets of Lagos. Old red cars beeped and roared through the otherwise bare and empty streets. Around him were old houses, covered in peeling paint. Everyonce in a while there’d be the words PHARMACEUTICAL DISTRIBUTORS on a sign above a store. Perhaps there would be a scraped away poster on the wall near a home. An ad for a real estate agent? Or a poster for a lost dog?\nHe walked through the street trying to get home. But nothing really caught his interest. All except for one little detail. On his walk home, he would always remember seeing a billboard with a face on it. Whose face it was, he did not know. But he remembered it being a face for a minor political party. He couldn’t even remember what its cause was, other than the fact that it was very much not fond of Biafra. It was there for so long that it effectively became a landmark for Tope. A way of orienting himself.\nNow, the poster that was always there was gone. Completely erased. Not even pieces of paper from the poster that tended to stick to the billboard remained. As if it was never there to begin with. Just a silent monument. A blank, black, wall high above the ground. He thought that perhaps a new poster would come and replace it. Maybe one sanctioned by the new Nigerian regime.\nBut as the weeks came and went, the billboard stayed silent and empty. Completely untouched. Talk of the party that was there was nowhere to be found. Every once in a while, Tope saw a person or two who he remembered was a member of the party. They never said anything, save for a grumble here and there. It was then that it became increasingly clear to him, just why the board stayed empty."
NGA.1952.a: "Better not mention it."
NGA.1953.t: "La Bombe Populaire"
NGA.1953.desc: "The steel mill was a buzz for the first time in its long, bleak life. Its many concrete pillars billowing unimaginable volumes of smoke and steam into the air, were wrapped up by massive pipes that curved and rolled around the mill. In the mind of a child, it would seem almost like an industrial rusting theme park made out of nightmares.\nBut deep within its walls, it was buzzing and alive. The old owners had long been shuffled away into a far away prison for their many crimes against the working man. A few bureaucrats and state appointed managers had come in, but they were ephemeral. At least on most days. Especially since they were only one faction within the wider Party Committees, in which the workers and engineers held much sway as well.\nOne voice shot up. “One thing we need is bigger pay! Now that those rats are gone!” Another voice replied “It is yours comrade! It is yours!” Another yelled “And for the love of God, can we get some railings too?” The same voice from earlier said “Of course! Of course!” But a low voice from a man with a gun bellowed out. ‘Aren’t we all thinking too small? These are all reasonable demands. But if we have formed these Party and Executive Committees, lets not neglect their political nature Comrades! This work system is for us after all. Let's get together and make this factory more than just a steel mill. But an organ of our political power!” People murmured in agreement."
NGA.1953.a: "How does the Ajaokuta Workers Council sound?"
NGA.1954.t: "Stalin Line"
NGA.1954.desc: "The mounds of dirt in the plains of Nigeria grew and grew in number with every passing week. All knew what lay underneath them. Some celebrated the downfall of the old landlords and wealthy renters. Others grew silent and quiet, especially the luckier ones who got off with a simple expropriation.\nBut now they were to wake up to a welcome surprise. Across countless roads, men dressed in red and armed with guns and books and tractors raced around bringing news to the countrymen. When they came down to the countryside, they passed to the villagers all their tractors and goods needed to farm. And they said to them. “Listen comrades! Listen you revolutionary forces of the nation! Your triumph is here at last! The decrepit, exploitative hand of the landlords have been cast down and you have all been freed. This land is no longer under the brutal knee of any one man or woman. No, gentlemen. It is yours! The land is yours my friends!’\nIn the village of Bana, many raised their arms and yelled out in joy. But just as many scowled and groaned. They complained in the coming weeks that the land they owned was disappearing, but their protests were drowned out by the hired farm hands who had nothing to their name. With time, they had come to accept the new order of land in Nigeria. The land was no longer his or hers."
NGA.1954.a: "It was theirs."
NGA.1955.t: "The Battle of Maiduguri"
NGA.1955.desc: "The city of Maiduguri was set a light. In the dead of night, as the full moon stared over the old city, the red and yellow flames licked the skies. As quick as the battle had started, much of the civilians had fled. In recent weeks the government had made it clear of a coming offensive against Islamist rebels and insurgents in the area, and had long been calling for people to leave to minimize collateral. The city was long a citadel of Boko Haram and other Jihadists in the area. So bold had they gotten that black flags were flying on the poles.\nHundreds of bullets whizzed through the sky. Not a moment went by without being painted by the screams and yells and whoops of men. Artillery from far behind the city shelled the area to smite down the Jihadists. Men with red berets, holding by their hearts a book professing their dedication to the revolution. Many were displaced citizens of the city, who held burning hatred in their hearts for the enemy before them. A handful of tanks and APCs rode on with them, shooting into the city. But those beasts of metal were not immortal. Every once in a while, they would be hit and go up in flames. If the men inside were lucky, perhaps they could escape and not join the mounting dead in the city.\nAs the hours went by, the scene of the battle which was sometimes punctuated by a home blown sky high and the sounds of men dying, calmed down. Eventually, there came the roar of planes and drones from far above. The deep thuds and booms of explosions somewhere far away haunted the city. As the sun had begun to rise, the fighting dimmed even more. Every few minutes an exchange of gunfire would break out. But for the most part, the two sides had retired for the night. The military had gained 3 and a half neighborhoods. Tonight, the meat grinder would roar once more."
NGA.1955.a: "Well, back to the front!"
NGA.1956.t: "Fraternity"
NGA.1956.desc: "All 360 seats in the Nigerian Supreme People's Assembly were full. In front of them, mounted on a wall, was a great hammer and sickle leering over them. Dr. Alhassan Mamman Muhammed took the stage and began to speak.\n“Citizen legislators, the citizens of Nigeria are tired of a situation following our Revolution that has been uncertain and wavering for too long and want to settle their fate once and for all. Internal tyrants and enemies hide throughout the country, seeking to pervert the revolution’s course.\nTraitors to the nation, remnants of our old class enemies, and forces of counter-revolution await around every corner. You have all passed wise laws, laws that promise happiness and secure the implementation of Communism and national pride. But many have not been implemented because the power to do so is lacking. If we do not create that power quickly, these laws risk becoming obsolete almost at birth.\nAt this moment, the enemies of the revolution raise their swords against it, stained with the blood of workers, peasants, and the intelligentsia class. Will you sit by and let the thugs and new tyrants rise up and hurl the revolution into the blackest abyss? Will we sit idly by as they form new conspiracies and criminal acts against the masses? No! No! A thousand times no!\nComrades, to combat this threat, be it in the cities or the countryside. From the bourgeoisie or the tribal chieftains, there is truly but one choice! Let us make terror the order of the day!”"
NGA.1956.a: "And the Revolution cheered."
NGA.1957.t: "A Journee To The Center Of The Earth"
NGA.1957.desc: "It was at first, a quiet day in Abuja where the clouds hung over the sky and not a noise crept into the city's many winding roads. But, like a gray mist falling from the hills down into the valley, something started to grow. At first a few dozen men and women started marching, and later started chanting and calling out for others to join them. Slowly but surely, many more came with. At first it was not clear what they wanted, and some local militias grew skittish in the face of this angry crowd. Whispers of reaction had mounted, but in reality the mass forming ahead of them was a ploy weeks in the making. And it became clear very quickly just what their intentions were.\nBy the time the crowd had reached the supreme people’s assembly, it numbered in the thousands. Armed with sticks and knives the men and women began to call out. Not, as some had feared, for the end of the new revolutionary government, but rather they began to yell out to the men inside. They yelled that the people of Nigeria are hungry, and that the hoarders and businessmen of old are keeping them so. They yelled for the government to let the masses loose. They yelled for them to bring out the terror into the hands of the masses, so they may rise up and smite down the reaction and remnants of capitalism within Nigeria. They yelled for them to be given guns so they may march down into the countryside and kill the chiefs who opposed land reform and formed the basis for reaction.\nAs the minutes grew into hours, some men in the assembly came outside. Ahead of them was the Dr. Alhassan Muhammed."
NGA.1957.a: "My friends, what can we do for you?"
NGA.1958.t: "In-the-cells"
NGA.1958.desc: "“You sure these are our contacts, Olayemi?” Sayat spoke out from the back of the truck as he lay down on top of his makeshift bed. Looking at the ceiling of the interior as his mind wandered and focused on nothing in particular.\n“The higher ups are aware that there are people mobilizing for our cause over there inside the French border. Judging by the coordinates they sent to us earlier, we’ll get in soon enough.'' The driver spoke, leading his caravan of Toyotas, filled to the brim with ammunition, assault rifles, and DICON made equipment, across the seemingly endless ocean of sand and dust.\nMany hours passed by and the vehicle suddenly came to a halt as the group finally arrived at their destination. The two of them left the car and were immediately greeted by two mysterious strangers in tight robes. The men exchanged greetings with them, and began to haul weapon crates from Olayemi’s trucks onto their own. As they finished, one of the men walked up to Sayat and gave him a handmade necklace as a sign of gratitude for their support, then left as quickly as they came."
NGA.1958.a: "Put 'em to good use, will you?"
NGA.1959.t: "When Will The Day Come, Comrade?"
NGA.1959.desc: "The tension in the war room was so high you could practically smell it. It smelled of sweat and spit and angry voices. Dr. Alhassan Muhammad was in the room with several generals and officials just as angry and confused as him.\n‘Just what are our chances here?’ asked the Doctor.\n‘Well, as French forces are as of right now, focused primarily on fighting against Libya, we have good reason to believe the southern provinces in French Africa are undefended. Though, it is inevitably only a matter of time before they are able to divert the relevant forces to fight us off too. But we will likely make significant inroads before that point.’\n‘And in terms of local support?’\n‘There is an abundance of it, we presume. Though, that does vary a little from place to place. We certainly will have support from other states in the area. Algeria, Burkina Faso to name two. And I wouldn’t be surprised if China and Romania choose to fund us with weapons as well. Even in the worst case scenario, a French conquest of Nigeria is… profoundly unlikely to succeed.’\nAnother voice shot up. ‘With all due respect, we cannot just march into war with France here. All for the sake of the Libyans! How many thousands, if not hundreds of thousands of Nigerian men and women will be slaughtered! Is that really a cost we are willing to bare?”\nAll eyes turned to Dr. Muhammad. Ever since the war between Libya and France had broken out, many figures in the government were calling for support to be sent to Gaddafi to combat the French empire. For weeks and weeks, the debate raged on quietly within the halls of government. Now was the moment where the key choice was to be made. Wiping away a brow of sweat, the Doctor began to speak.\n‘Just how would we be remembered if we sat idly by in the great, final war against European imperialism. This is not just a war for Chad and Libya. It would be bad enough if it was. Rather, this is a war which shall decide the fate of Africa. One of the last foreign empires to continue to rule over millions of our African brethren may very well be brought to its knees. It is unthinkable for us to sit by and do nothing. After all, should France succeed and crush the Libyans, how long would it take before the gaze of foreign imperialism turns to us?’\nThere were sighs, frowns, and smiles that dotted the room. One voice broke the silence and said..."
NGA.1959.a: "I'll inform the People's Assembly, Doctor."

NGA.1960.t: "Breaking Into Fort Kano"
NGA.1960.desc: "It had been a torturous morning. The 14th Emir of Kano, Sanusi II, was drowning in an air of desperation, calling countless people hour after hour, trying to mobilize the entire city of Kano. He had received news of a "people's retribution council" heading his way, accusing him of crimes he had no knowledge of.\n\nFortifications and armaments surrounded the Gidan Rumfa. Barbed wire, gun emplacements, sentries, as well as private security - even some elite Seychellois squads - were protecting Kofar Kudu gate.\n\nIt wouldn't be enough. Fifty thousand people in Kano State had been whipped up into a militarized frenzy, seeing the Emir's riches and power in the region as an insult and even a crime to the dignity of all people, but especially to the people of Kano themselves. Their fury had been provoked and armed by some jumped-up knaves in Abuja and Kanfanchan, knowing hell would rain upon the Emir and his palace.\nA few days of preparations and panicked self-neglect was all the Emir had assembled to fight this storm. It was during his prayers that the Emir of Kano heard the first of artillery shells in the distance. It would arrive imminently. Reciting the Shahada and finishing his prayers, he would grab a rifle. Despite his aging body, his mind would be clear. He would fight for Allah against this vile, godless horde of men - men lacking in fear and a master.\n\nHe would not survive the evening."
NGA.1960.a: "Today, obsolete. Tomorrow? Forgotten."

NGA.1961.t: "Politically Incorrect"
NGA.1961.desc: "Abdullahi Sarki Mukhtar was being dragged out of his Kaduna office and beaten with the rifle butts as he stumbled towards the feverish sweltering sun that shone its rays upon the dribbling of blood across his face. The pain, sharp and violent, was unbearable.\nOnly 10 years ago, he was this city's Governor. Only 3 years ago, he was an ambassador to the world's forefront superpower in Moscow and only a year ago he had last left Moscow, unbeknownst to him at the time. Relieved of his duties 3 months ago, he had begun seeing power fly away from his hands in exponentially faster periods, and now he was less than shit -- he was the stable where the horse shat on.\nThe beatings from AK-47 rifles had turned to machetes. He had begun feeling his arms slice slightly and his clothes drench in blood as he filled up with cuts and pus spilled out from his festering wounds over the hours that went on, his skin charred in the sun.\nThis was nothing short of the most gruesome thing he had ever seen or felt. He was destroyed, and his ears rung with a sibilant whine. He couldn't hear anything they were saying short of thumps and the bass in their thundering voices. Something about being an agent of foreign nations. Something about popular retribution against aristocracy. He didn't understand any of it, sobbing uncontrollably as his frail old body gave up slowly and the torturous pains he felt numbed through an endless hell.\nHe thought of meeting with Obasanjo, all these heroes of his nation. He thought about his service in Biafra, all the while his vision faded into ethereal nothings and he thought of his mother.\nAnd at the end of it, sat the people victorious, surrounding a mangled old man past his prime as he boiled in the sun."
NGA.1961.a: "Eternity has a landlord."

