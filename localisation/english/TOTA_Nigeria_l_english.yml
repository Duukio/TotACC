 NGA_SOUTHERN_BIAS_HIGH: "The Nation is §IClearly Biased towards the South ([?NGA_NORF_SOUF|%%]).§!"
 NGA_unfinished_business:0 "Unfinished Business"
 NGA_unfinished_business_desc: "Despite our best efforts, and our incredible victories against the Biafran army, the peoples of southeast Nigeria are still not convinced of our grand national project. Many, particularly the Igbos and Edo, have risen up in fierce resistance against us. Nonetheless, through another great victory, especially against such disorganized resistance, will certainly convince them."
 NGA_encourage_loyalism:0 "Encourage Loyalism"
 NGA_encourage_loyalism_desc: "This unfortunate loss does not come without a silver lining however - many in places like Port Harcourt have also risen in equal resistance to Nnamdi Kanu's fascist ideals, and should be rewarded in earnest for their loyalty."
 NGA_mass_assault_from_all_sides:0 "Mass Assault from All Sides"
 NGA_mass_assault_from_all_sides_desc: "We surround this pseudo-state by all directions, as they barely even hold a coast to throw their backs onto - and with our naval supremacy, a victory will be a foregone conclusion through total destruction of this genocidal revolt."
 NGA_the_south_has_fallen:0 "The South Has Fallen"
 NGA_the_south_has_fallen_desc: "Our attempts to encourage loyalism and friendliness from the locals has only resulted in failure. It's time that we enact full, total military occupation and give no quarter to people that despise us."
 NGA_reward_collaboration:0 "Reward Collaboration"
 NGA_reward_collaboration_desc: "As more and more former Biafrans side with us against Kanu's radicalism, it is only logical that we ought to reward those who were eagerly on our side from day one."
 NGA_promises_of_a_final_peace:0 "Promises of a Final Peace"
 NGA_promises_of_a_final_peace_desc: "Despite threats from outside forces and from Kanu's violence, we may finally find peace within the borders of Greater Nigeria. A great victory has come."
 NGA_retake_bakassi: "Retake Bakassi"
 NGA_retake_bakassi_desc: "For nearly a decade, the rightful Nigerian territory of Bakassi had been in a state of complete chaos. The unlawfully established self-declared “Democratic Republic” has been governing Bakassi against the interests of its inhabitants and especially against our interests. With order restored regarding our border against the francophones, we should finalize our efforts here and reclaim this lost land from the hands of its terrorist claimants."
 NGA_the_southern_problem:0 "The Southern Problem"
 NGA_why_cant_we_be_friends:0 "Why Can't We Be Friends?"
