#Technocratic Tree
NGA_a_technocratic_nigeria: "A Technocratic Nigeria"
NGA_a_technocratic_nigeria_desc: "The modern age has shone over the world for decades. The Russians, the Japanese, the men of Europe and America have bathed in it. But Africa was left behind. Nigeria was left behind. Picked apart by the conservative and anti-intellectual ogres blinded by faith and blood, Nigeria lies broken.\nBut like Prometheus, we defy the will of the old Gods of Nigeria. We defy the will of petty kings, generals, autocrats and all! We defy them to bring to Nigeria the new ideals of Earth. Inspired by the flames of silicon and lightning that roar in California, we lift up Nigeria to a new euphoric society. One ruled not by mobs, not by generals, not by priests. But by the wise and learned men and women. The rational, guided by the logic of metal and light!"
NGA_new_people_and_ideas: "New People, New Ideas"
NGA_new_people_and_ideas_desc: "Nigeria’s burgeoning technocratic movement cannot possibly hope to survive if the government is crawling with the staffers of old. Careerist clerks and elderly conservatives will only hold us back. What we need are fresh ideas from new people. By recruiting from the young Generation Z, we will be able to bolster faith in the system and cleanse the backlog of old and out of touch state-staffers."
NGA_fre_time_equals_heartbeat: "Streamline Hours, Wages"
NGA_fre_time_equals_heartbeat_desc: "Different parts of Nigeria have, in practice, differing realities on the rights of workers to certain hours and wages. By bringing together a cohesive and comprehensive plan for development initiatives, we can streamline hours worked and wages paid to be infinitely more efficient and fair than they are now."
NGA_cementing_good_word: "Cementing the Good Word"
NGA_cementing_good_word_desc: "While in the universities, labs, NGOs, and urban-intellectual centres of Nigeria many have come to sympathise with the model of Nigerian Technocracy, the majority of people remain sceptical or uninformed. Technocracy cannot truly function and reach its peak if the masses do not understand our ideology. \nThrough educating the young and the old, the rich and the poor, the people of Nigeria will hold a better understanding of Technocracy and come to uphold it with all their might!"
NGA_mobilise_greyshirts: "Mobilise the Greyshirts"
NGA_mobilise_greyshirts_desc: "Under the old regimes, the organisation of a technocratic party was practically impossible. Our efforts had to remain decentralised and underground and watered down. Now that we have been thrust into power, we need to form a strong, united party. Not only will power and government officials be consolidated into one Technocratic party, but we will form a group of paramilitaries to defend our government and coup-proof the nation. The Greyshirts shall be a troop of thousands of ideologically loyal militants, ready to rebuff any who oppose enlightened rule in Nigeria which will bring it into the future."
NGA_tots_for_technocracy: "Tots for Technocracy"
NGA_tots_for_technocracy_desc: "Children are the future. One day, Gen Z will wither away and die. Gen-Alpha will take its place. When that day comes, would it not be tragic if we had failed to educate them in the ways of Technocracy? Of course it would.\nTo elevate sustainable development initiatives and foster an inclusive environment for all, we have opened the Tots for Technocracy initiative. Its goal is to introduce to the young children of Nigeria the principles of Technocracy. The history of the movement and where it stands today. To raise a new generation of technocrats, capable of bringing Nigeria to its apotheosis, latte and laptop in hand!"
NGA_digitise_the_workplace: "Digitise the Workplace Even Further"
NGA_digitise_the_workplace_desc: "The bulk of digitisation in the workplace has come from the adoption of technology in the realm of industry to replace inefficient workers. But we must take this a step further. While not every worker can or must be replaced, adding digital advances to every sector of the economy is a must. Tomorrow, CEOs will consult A.I. board members, spreadsheets will be made as efficient as possible by new innovative softwares, digital upgrades will advance the mind and body of the worker and a hundred thousand more amazing things!"
NGA_dismantling_the_cleric: "Dismantling the Bible-Quran Complex"
NGA_dismantling_the_cleric_desc: "Throughout much of Nigeria, especially in the North, theocratic government is the norm. 12 states uphold sharia as official policy and law. While in the south, Christian institutions hold much sway. For us to move into the 21st century, we will have to leave these regressive ideologies behind by abolishing sharia law in the north and annihilating the power of the church down in the south."
NGA_efficiency_by_the_milimiter: "Efficiency by the Milimiter "
NGA_efficiency_by_the_milimiter_desc: "Waste and excess is one of the bigger sources of inefficiency and corruption. Not only must we cut what we do not need, but we get the most bang for our buck. God knows how much money has been lost by corrupt managers and incompetent bureaucrats? How much money is there to be saved by tightening up the budget and pursuing efficiency above all? \nEfficiency is key here. From the organisation of our factories and administration, down to the font-spaces used on official documentation. Whatever fat there is, we will burn it away! To do so, we will take a page out of the book of the old Technocracy Incorporated based in America. At our head will sit the Director of the nation, below him the National Board consisting of the managers of the army, research, social relations, and foreign relations. They, considering the demands and ideas of the boards of various provinces alongside the managers of service sectors and industrial sectors will decide the direction we go in."
NGA_the_great_rehabilitation: "The Great Rehabilitation"
NGA_the_great_rehabilitation_desc: "What makes us Technocrats, in part, is that we are not brutes and savages. We are not so simple minded as to purge our opposition, to throw them in prisons and unmarked mass-graves like Nazis or Communists! Instead we will teach them and change their minds. Win them over in the free marketplace of ideas! We will have them so distraught over their past wrongs and blindness they will become the strongest supporters of Technocracy.\nFor those who have done harm to Nigeria, we will make them atone through labour and struggle for the common wealth of Nigeria.\nOthers, especially those drawing inspiration from more modern incarnations of Technocracy, have proposed the ideas of utilising modifications to the mind. Nothing too extreme of course. But merely small tools to push them in a direction away from physical and mental resistance to our enlightened rule."
NGA_embrace_energy_accounting: "Embracing Energy Accounting"
NGA_embrace_energy_accounting_desc: "Energy accounting is a system utilised for the purpose of measuring the amount of energy consumed in any given process to try and improve the efficiency of the system. This is a solution to a problem which has plagued the power of technology for all time. After all, the first industrial engines were horrifically inefficient due to loss of energy via friction and heat. Through the usage of A.I, machine-learning, and the top-minds of Nigeria, we will be able to use energy accounting to find what is most inefficient and how we can improve industrial and digital processes."
NGA_limited_electronic_democracy: "Limited Electronic Democracy"
NGA_limited_electronic_democracy_desc: "While the mob rule offered by democracy has many large pitfalls, some degree of popular sovereignty and decision making is hardly a bad thing. Through implementing a degree of controlled democracy on smaller, local, issues we can pacify discontent, streamline administrations, and by using technology to make it all electronic, we can even promote the ideals of technocracy along with it! "
NGA_nasdra_unleashed: "NASDRA Unleashed"
NGA_nasdra_unleashed_desc: "The National Space Research and Development Agency, the official space agency of Nigeria, has long been neglected. Funds that could have gone to developing Nigeria science and prestige instead went to the army and corrupt politicians. While Tokyo, Washington, and Moscow have risen to the stars, we have been left behind.\nBut soon will come the time where Nigeria will take its place among the stars and transform itself into the face of a spacefaring Africa! This will not only be amazing for our own development and scientific knowledge, but also our prestige on the international stage for both our nation and our enlightened model of technocracy!"
NGA_copying_california: "From California (to Lagos Island)"
NGA_copying_california_desc: "California is our golden Zion! Under the ideologues of the Forward Party and the aegis of Mr. Yarvin and his like-minded entrepreneurs, technocracy has found a renaissance. By sending diplomats to California, and requesting advisors from the West Coast to instruct us on the implementation of Technocratic rule, the will of companies and private investors will be aligned with our rational and technological government for good! Before the end of the decade, the coastline of Lagos will be indistinguishable from the utopian highlines of Los Angeles!"
NGA_full_automation: "Full Automation or Nothing Else!"
NGA_full_automation_desc: "Nothing quite compares in terms of efficiency to automation! While machines still need workers to maintain them, and while some jobs cannot be automated, we will take a hardline stance to automation. Any time a company refuses or fails to adopt automation, they may expect us to drop any and all support to them, while we will subsidise those who adopt automation to help them along."
NGA_our_many_fifth_columns: "Our Many Fifth Columns"
NGA_our_many_fifth_columns_desc: "Throughout those parts of Africa which form an important part of the world economy and continental politics, we have begun to set up NGOs and frontman organisations to promote the cause of Nigerian Technocracy. From East Africa to parts of French Africa, Zaire, Libya and so on. Alongside the promotion of Nigerian Technocracy, they will ideally align the nations of Africa towards a new Pan-Africanism. One whose roots grow out from Abuja!"
NGA_big_computer_in_new_abuja: "Big Computer in New Abuja"
NGA_big_computer_in_new_abuja_desc: "Ever since the coming to power of Allende in Chile, his program of technocratic planning has become a beacon for the rising technocratic movement. While we have misgivings with the Chilean Communist model, we ultimately cannot deny how integral it will be to assimilate AI into political administration. Doubly so with the coming of AGI. A purely rational machine will advise the government and assist in making Nigeria as efficient as possible."
NGA_actually_existing_afrofuturism: "Actually Existing Afrofuturism"
NGA_actually_existing_afrofuturism_desc: "By the end of the decade, Africa will no longer be associated with poverty. When people think of Nigeria, they will not think of dirt roads and cracked paint on walls. They will think of skyscrapers and newly paved roads. They will think of a nation living in the future, coated in chrome with people walking with technology that even those in Moscow or Tokyo would only be able to dream of! The untouched plains of the north will fall away and the herders and farmers will abandon their backward lives and embrace a new modern identity. No longer will they herd their sheep and cattle, but manage offshore businesses through the click of a button or two from their 1000ft penthouse suites!\nAlready in the realm of culture, people are daring to dream. It is commonplace to see engineers experimenting with robotics, and artists making music or paintings showcasing the coming African utopia. As such, no longer will dreams of the future conjure images of white men and women in flying cars. Rather, it will bring images of an African world!"
NGA_respect_and_enjoy_peace: "Respect and Enjoy the Peace"
NGA_respect_and_enjoy_peace_desc: "The time has come for us to look over a new Nigeria! With the coming of internal peace, and the closure of the one-thousand wars with Biafra, we have opened up a new chapter in our life! Hundreds, no, thousands of companies from across the world see Abuja and Lagos and Benin City as the greatest place for investment opportunities and R&D. More and more people are abandoning their old backwards lifestyles and slouch towards modernity!\nRational rule has thankfully prevailed. Under the aegis of the enlightened and the genius, who knows where Nigeria will go next?"
NGA_relations_with_neighbours: "Relations with our Neighbours"
NGA_relations_with_neighbours_desc: "Technocracy in one nation alone cannot be expected to thrive. Doubly so if we don't even bother to establish some form of position towards the countries around us. For the sake of furthering our power and our influence, and for the sake of flouting the influence of technocracy abroad, we will sink our teeth into the rich lands around us."
NGA_simple_solution: "The Simplest Solution"
NGA_simple_solution_desc: "One key crisis which defined the foreign policy of both the governments of Biafra and old Nigeria was the crisis in Ambazonia. Countless man-hours and countless amounts of money and industry were wasted on arming one side or the other. But we! We are above petty nationalism and care not for either side of the war. The simplest solution is merely to bring into the fold these feuding warlords and foolish generalissimos to enlighten them on the true values of modernity!"
NGA_ending_the_language_barrier: "Ending the Language Barrier"
NGA_ending_the_language_barrier_desc: "Had the language barriers within Nigeria not been so dire, perhaps we could have avoided the bloodshed plaguing us for so long. The Yoruba-Hausa-Igbo-Fulani languages form the vast majority of the many tongues in Nigeria. But with so many speaking so differently, differing identities are bound to emerge and spark tensions.\nThe simplest solution is to erase this language barrier, by imposing a single unified language of English as a temporary solution. While we have some designs for a future Pan-African tongue, smothering Nigerian separatism comes first. And the most efficient way for now is to utilise English as a unifying language, before we move to greater projects..."
NGA_tearing_down_our_great_wall: "Adopting Ambacoin"
NGA_tearing_down_our_great_wall_desc: "For all the petty problems with the nationalist movements in Ambazonia, Ambacoin is a surprising gem in an otherwise coal-ridden hole. An initiative to back up government through cryptocurrency which gives more power to the people and away from the opaque central banks and private lenders is just what we need! By spreading Ambacoin into the newly acquired lands and potentially even into Nigeria itself as an official state sanctioned project, prosperity will no doubt await!"
NGA_albion_thought_repudiated: "Undoing the Colonial Catastrophe"
NGA_albion_thought_repudiated_desc: "One of the most famous errors of colonial rule was the instability that came from how the land was divided. Surely now millions must have died ever since the British left because of the problems they created for us! Even with the Biafran wars having seemingly come to a close, the remnants of its tensions flank us everywhere we go.\nTo begin the process of healing and overcoming the past, we will revise the borders of Nigeria’s provinces and make laws more amenable to nations throughout the country!"
NGA_africa_ab_ante: "Africa Ab Ante!"
NGA_africa_ab_ante_desc: "Much great damage has been done to Africa due to the great horrors of colonialism. Not only were millions killed in the past, but the empires dragging their feet to leave and sinking their claws into whatever they can even now have taken a gargantuan toll on Africa. A toll we may never be able to fully comprehend.\nThe solution was long thought to be the embracement of Pan-African ideology, and it is true. By uniting the peoples of Africa, we will be able to march on united and smash the legacy of colonialism. However, we reject some principles of Pan-Africanism. We are not Communists or socialists. Thus, we do not sympathise with Libya or the National Communist movement within Nigeria. We shall instead build our own Pan-African ideal. One where Nigerian Technocracy is the lighthouse to the sinking, faltering ships of our dear continent!"
NGA_language_of_the_future: "Reviving Afrihili"
NGA_language_of_the_future_desc: "In 1970, an ambitious project was born from the Ghanaian nation. The historian Kumi Atobrah created the language Afrihili, which he intended to be used throughout all of Africa, in the hopes that it would strengthen the Pan-African vision that burnt throughout the continent in those days. Efficiency factored into it too, of course, as it was argued it would cut costs on trade and printing.\nIf we are to stand at the birth of a new era in Pan-Africanism, we must take notes from history and inspiration from those who came before us. Afrihili must be revived! It is a daunting process, but if carried out, will bring us much, much closer to a Pan-African reality!"
NGA_a_psychological_specific_heat_boundry: "An All-African Techno Union"
NGA_a_psychological_specific_heat_boundry_desc: "All throughout Africa, countless frontman organisations and NGOs have been working day and night to spread the word of Technocracy and some governments have become more and more sympathetic. But leaving our Pan-African ambitions in the realm of mere good relations and offices and embassies would be fool hardy. The time has come to usher in a new era! To raise the curtain on old Africa and from on top of a chrome spire annouce the birth of a new union! The All-African Technocratic Union! One which will stop at nothing to bring forth the spread of the might of machinery and human intellect to all of Africa. One which will show no mercy to the old geriatric conservatives, landowning lords, and clerical dogmatic fools. But one which will march, uncompromisingly, to a futuristic, technocratic utopia. Free of mob rule, guided by the geniuses of tomorrow!"

Afrihili: "Afrihili Revival Movement Member"
NGA_employment_crisis: "Employment-Automation Crisis"
NGA_employment_crisis_desc: "Due to an unprecedented drive towards automating jobs, this economy is going through an employment crisis."
Ambacoin: "Cryptocurrency: Ambacoin"
Ambacoin_desc: "This nation uses a type of cryptocurrency as its national currency. In this case, it is Ambacoin, named after Ambas Bay in the Bight of Benin."

# Democratic Tree
NGA_a_democratic_nigeria:0 "A Democratic Nigeria"
NGA_a_democratic_nigeria_desc:0 "For the longest time, Democracy has returned to Nigeria in the middle of chaos and desperation. Many intellects have seemed to doubt the possibility of our coup to overthrow the military junta to be near impossible but alas we are at the throne room of Ibrahim and finally reassert authority over the nation. The power now belongs to the people and we as representatives must go forth and set things right."
NGA_dismantle_the_old_elite:0 "Dismantle the Old Elite"
NGA_dismantle_the_old_elite_desc:0 "With the old Junta thrown out, we have the opportunity to focus on eliminating the corrupt power structures that allowed Ibrahim's parasitic ilk to maintain control. Throughout the nation, remnants of the old government maintain control over a significant portion of the nation's large and medium sized, previously state owned, businesses. Not only are these oligarchs leeching off of the people and keeping our industry uncompetitive, but they also represent a potential political threat with some members wishing to bring back the old junta. The President has already ordered the division of the shares of these companies to be divided amongst the population in order to excise these pockets of corruption and throw out Ibrahim's nobility."
NGA_support_secularization:0 "Support Secularization"
NGA_support_secularization_desc:0 "Ibrahim Babangida and his goons put Nigeria down a path of religious intolerance and stagnation, this must be changed! Military promotions, which have been notorious for their skewed promotions towards Muslim soldiers, have now been secularized to be more meritocratic. Religious schools have been pushed aside for public education as the government has put more funding to secular schools. The Christians in the south have been especially welcoming to these changes, having dealt with discrimination since Ibrahim seized control. With a bright future ahead, the eyes of Nigeria look to heaven, whichever it may be."
NGA_thefourthrepublicsfirststeps:0 "The Fourth Republic's First Steps"
NGA_thefourthrepublicsfirststeps_desc:0 "At long last Nigeria is finally free from the tyrannical rule of Ibrahim and his clique. Ending the long reign of the military junta’s boot over the people. While everyone else is waiting in excitement for our first new elections to come, we should start organizing with the election from voting polls to long hours of discussion on a variety of topics whether it be the direction of our  economy, what’s left of the Ibrahim’s regime, the underdeveloped countryside, etc. Hopefully this all goes well in the end."

#unused
NGA_a_country_of_councils:0 "A Country of Councils"
NGA_a_country_of_councils_desc:0 "Missing LOC"
#unused


NGA_promisesofpeoplespower:0 "Promises of People's Power"
NGA_promisesofpeoplespower_desc:0 "Our country is in a constant state of vulnerability from both interior and exterior factors. Countless coups have been attempted, Disaster has been averted. In order to assure the public that the situation is under our authority. We will make a promise to transform Nigeria gradually into a socialist republic. These efforts alone cannot happen all at once of course, so the first matter of business is to reconstruct our economy into a leftward direction. We will begin favoring more to the proletarian working class, assisting them with whatever we can but also compromise with the bourgeois elements as well."
NGA_vote_with_your_wallet:0 "Vote with Your Wallet"
NGA_vote_with_your_wallet_desc:0 "Money makes the world go round and the invisible hand shall guide the best to wealth and prosperity while discarding the rest that cannot adapt or overcome their hardship. Such is the nature of capitalism, but alas in order to secure only the best possible product in Nigeria, we should aid these consumers and satisfy their desires for better commodities. By enacting legislation that helps empower these desires, we next introduce the concept of “Dollar voting” to the Nigerian populace, letting them dictate their own taste, fashion, merchandise. Only then can they emerge the best possible Nigeria brand in our little market which will one day be able to compete with the rest of the world."
NGA_push_for_privatization:0 "Push for Privatization"
NGA_push_for_privatization_desc:0 "To say that the former government was bloated and corrupt would be an understatement, with the majority of the economy being under the control of inept political buffoons or corrupt military officials. Ibrahim's government had attempted privatization in the late 1980s, to only marginal success and he would backtrack on this policy a decade later. We should break up these large state owned businesses to allow for more competition and innovation. Privatizing the economy will also bring in large amounts of capital that can be used to better the nation."

NGA_a_radical_redirection:0 "A Radical Redirection"
NGA_a_radical_redirection_desc:0 "Missing LOC"

NGA_to_defeat_discrimination:0 "To Defeat Discrimination"
NGA_to_defeat_discrimination_desc:0 "Our nation has been torn apart by ethnic and religious conflicts. North against South, Poor against Wealthy, Christians against Muslims, etc. This cannot continue any longer! We must start taking drastic measures and enforce laws upon these people and unify everyone under one single banner that they can all cheer on. Through sweep diplomacy, middle man negotiation and political campaigns, we can surely bring these people together, closer and closer toward an idealized single Nigeria identity. "
NGA_a_calm_and_conservative_approach:0 "A Calm and Conservative Approach"
NGA_a_calm_and_conservative_approach_desc:0 "It’s apparently clear to us that we cannot simply bend our course to either side without causing a conflict between various ethnic groups and religious feud inside our community so let’s instead focus on a more calmer approach by reducing tension inside our society, finding a common ground and taking things slowly will surely help cool pressure down. Once all of the hatred and bloodshed have gone, we can then move on and build a prosperous future for all Nigerians no matter the differences in their background."
NGA_promote_traditional_values:0 "Promote Traditional Values"
NGA_promote_traditional_values_desc:0 "The Muslims and Christians of Nigeria have had a lot of disagreements in the past over a variety of issues, however both of these groups have large traditionalist populations. Recently, the President has signed a multitude of bills that would bring back traditional values across Nigeria. Restrictions on homosexuality, the banning of birth control, patriotic education, and more have all been implemented across the nation. We have already brought Nigeria from the brink, now it is time to make Nigeria greater than ever."
NGA_a_selfdefense_force:0 "A Self-Defense Force"
NGA_a_selfdefense_force_desc:0 "Missing LOC"
NGA_ending_the_bloat:0 "Ending the Bloat"
NGA_ending_the_bloat_desc:0 "The military had been too powerful for its own good. After all these coups attempt that have plunged our beloved nation to ruin and corruption, we simply cannot trust them to leave on their own device ever again, which it is why it’s important that we must stop supplying these funds to the military and divert it to something much more productive like building roads, investing in agriculture and rebuilding old institutions from the ground up, all of which will inevitably help ward off their influence in not just one but every sector of society. "
NGA_copying_mexico:0 "Copying Mexico"
NGA_copying_mexico_desc:0 "When we have considered the role the military has played in destabilizing and destroying Nigeria’s chances at real democracy, it is best we look to an example of how to keep the Military in check. By taking a page out of the Mexican model, we will greatly restrain and size down the military, muzzling and defanging them through limiting their capabilities and assigning their duties to other branches of the government that are in full civilian control. "
NGA_a_military_makeover:0 "A Military Makeover"
NGA_a_military_makeover_desc:0 "The Junta and his soldiers had held an enormous grip on this country for so long but now that power finally lies in the hands of our people, however a new problem starts to arise surrounding the remaining officers in the army. It's true that Nigeria does need an up standing army to defend herself from external enemies but the barrack is also a threat in itself. After careful consideration we had come to the conclusion that the best way to prevent another military grab for power is to completely reshape the military, putting them reliance on civilian and introducing them other elements such as fully automated technology likes Drone, Mech and Robot as well as PMC, who will help serves as counterbalance against them."
NGA_a_socialist_constitution:0 "A Socialist Constitution"
NGA_a_socialist_constitution_desc:0 "Missing LOC"
NGA_apeoplesconstitution:0 "A People's Constitution"
NGA_apeoplesconstitution_desc:0 "Now that we have settled the dispute between laborers and enterprises, we can establish a new constitution for the people. No longer do the working class need to suffer under the injustice of their workplace, nor does the business have to go bankrupt, nor does the middle class need to lose all of their life savings. We can all cooperate and help each other in times of need. Everyone in Nigeria is a swimmer; some are more skilled than others, but they are all heading in the same direction, and that direction is toward a better and more prosperous Nigeria."
NGA_a_conventional_constitution:0 "A Conventional Constitution"
NGA_a_conventional_constitution_desc:0 "Our nation has gone through so much since we gained independence, four republics, multiple coups and five wars. Nigeria is tired. There is no need to rock the boat with overly radical reforms that would just destabilize our nation more. The President has put forth a new constitution that will please or anger no one. Basic rights such as freedom of religion as well as allowing unrestricted public meetings have largely been praised both inside and outside the nation. The liberals have criticized the constitution for not going far enough, especially with freedom of speech not being entirely protected. However, most of our people are just happy Nigeria is finally stable."
NGA_a_liberalized_constitution:0 "A Liberalized Constitution"
NGA_a_liberalized_constitution_desc:0 "Freedom rings in the Giant of Africa as the (insert President name here) administration has implemented a new liberal constitution, guaranteeing the freedom of all Nigerians. Separation of powers, separation of church and state, freedom of press and free speech have all been enshrined in this new document. Political parties across the political spectrum have already begun to spring up all across the nation, all with their own vision for the future. Some have already been using these newfound freedoms to criticize our government, while in the past this would have been a prison sentence, (President) would not have it any other way."
NGA_thefourthrepublicsfirstelection:0 "The Fourth Republic's First Election"
NGA_thefourthrepublicsfirstelection_desc:0 "It’s here. The moment everyone has been waiting for, the fourth republic’s first ever election. Despite some minor setbacks and bickering from various political parties, we have done a tremendous job in organizing this event that went so smoothly but not so without the possible help of our selfless citizens, who have decided to set things right.\nAs we walk away from the dark past of our history. Nigeria herself can finally spread her wings and fly off into the distance toward a bright future!"

NGA_technounion: "African Techno-Union"
NGA_technounion_DEF: "All-African Technical Union of Republics"
NGA_technounion_ADJ: "African"

#Postwar Jade tree

 NGA_the_jade_revolution:0 "The Jade Revolution"
 NGA_the_jade_revolution_desc: "The time has come. The false republic must go, and the people must take back their country by force. No more concessions and no more negotiations, we will not tolerate this anglo-soviet puppet regime any further. A color revolution has begun, and Nigeria will no longer be afraid of its government, the government will be afraid of its people."
 NGA_a_democratic_revolution:0 "A Democratic Revolution"
 NGA_a_democratic_revolution_desc: "Nigeria has long been denied her right towards self-determination, our revolution must seek to democratize every aspect of our society. Simply overthrowing the corrupt military dictatorship is not enough, we must place the levers of political and economic control into the hands of the people of Nigeria. Our new government will serve the interests of all Nigerians rather than a select elite few."
 NGA_revolution:0 "r/evolution"
 NGA_revolution_desc: "The failure of the previous administration was not in its mere corruption or brutality, but of the failure of its ability to use its immense centralization for the benefit of the people of Nigeria. Our revolution cannot simply accept the replacement of one political class for another, we must empower the professional managerial class instead. Our new technocratic evolution will save Nigeria, and Africa as a whole, from itself."
 NGA_a_national_revolution:0 "A National Revolution"
 NGA_a_national_revolution_desc: "We are not simply overthrowing this regime for the sake of some nebulous notion of democracy, this is a revolution to restore our pride as a nation, as a people. We will not be distracted by flowery foreign ideals of a nation-state, our ambitions go beyond the constraints of the dying breed known as liberalism. We will learn from the Austrobavarians and Japanese with regards towards modernizing and reinventing a failed state."
 NGA_occupy_nigeria:0 "Occupy Nigeria"
 NGA_occupy_nigeria_desc: "Our revolution is now underway, we must establish both a physical presence and ideological presence within Nigeria. One way or another, we will win."
 NGA_take_to_the_streets:0 "Take to the Streets"
 NGA_take_to_the_streets_desc: "We must hold and organize large scale demonstrations calling for the downfall of the regime. To do so, we will organize a number of mass organizations for our cause to garner support both for our ideology and for our cause. We will also establish several front organizations to lure in members of our revolutionary coalition towards our side. We can also setup several encampments and actively participate in civil disobedience to win over those concerned about domestic unrest."
 NGA_catching_flies_with_honey:0 "Catching Flies with Honey"
 NGA_catching_flies_with_honey_desc: "Despite everything our movement has done, there are still a number of people opposed to our cause and some who even actively defend the regime despite being disempowered by it. We must do everything in our power to mobilize and gain the support of these people as our movement continues to grow in size and standing."
 NGA_the_loudest_minority:0 "The Loudest Minority"
 NGA_the_loudest_minority_desc: "The Fulani are a complicated group, they hold the most power in the current government and pose the most risk to our revolutionary movement. And yet, we cannot simply ignore the concerns of the Fulani people as a result of acknowledging the Fulani elite. But how exactly will we reach the interests of the Fulani community as a whole?"
 NGA_no_place_for_hate:0 "No Place for Hate"
 NGA_no_place_for_hate_desc: "We cannot tolerate any discrimination aimed at the Fulani people whatsoever. Our new regime should focus on overcoming and eliminating the boundaries and stereotypes between the various groups of Nigeria. By supporting anti-racist movements and adding proposals that will assist in combating both fulaniphobia and systemic disadvantages faced by the Fulani, we will both win them over and gain the trust of the other ethnic groups."
 NGA_placate_their_fears:0 "Placate their Fears"
 NGA_placate_their_fears_desc: "Instead of simply trying to win over other groups towards the plight of the Fulani, we should instead focus on ensuring the Fulani community remains onboard with our cause as a whole. We should reach out to their own dissident leaders and political influencers to better understand their concerns while winning them over to our side. Regardless of our goals, we cannot deny the fact that the mostly northern and rural Fulani people have unique needs and interests that our movement must properly comprehend before we take any kind of action with or without them."
 NGA_a_different_kind_of_class_conflict:0 "A Different Kind of Class Conflict"
 NGA_turn_pleas_into_promises:0 "Turn Pleas into Promises"
 NGA_more_than_a_mass_movement:0 "More than a Mass Movement"
 NGA_the_final_coup:0 "The Final Coup"
 NGA_the_final_coup_desc: "Our time is now, the military is either overwhelmed by our numbers or effectively sympathetic to our cause, our supporters within the sham government have enough political capital to shut everything down, and we have amassed a popular movement large enough to garner recognition and under the table support from key foreign powers. The Jade Revolution has finally begun."
 NGA_push_for_populism:0 "Push for Populism"
 NGA_the_first_election:0 "The First Election"
 NGA_the_first_election_desc: "Our revolution has won! The people cry out our leaders' names in the street, as our opponents flee abroad or recognize our movement’s legitimacy as the new ruling class of Nigeria. Despite everything, our revolution is still democratic  and we must hold fair and free elections. Even if we already know we’ll be the ones winning them in a landslide."


ETH_TT_TOKYO_TOURING: "@ETH Ethiopia joins the PAFCPG as an Observer-State."

NGA_war_exhaustion_dec_cat: "War Exhaustion"

#Junta Fopol

 NGA_resolving_the_anglophone_crisis:0 "Resolving the Anglophone Crisis"
 NGA_resolving_the_anglophone_crisis_desc: "Since the advent of English to the Bight of Biafra, and in particular Ambas Bay, the Yaoundé Francophones have been asserting violence upon the Anglophone region of the Southern Cameroons to subjugate their way of life, unifying language and law system. Now this conflict has reached its apex with the Ambazonian polities and the central government of Cameroon duking it out. Of course, we will back the Anglophones, but to what extent?"
 NGA_going_all_the_way:0 "Going All the Way"
 NGA_going_all_the_way_desc: "We cannot in good conscience leave men of fellow law, language and shared heritage to the wolves. They may be separatists, but they are separatists fighting for a noble cause -- and thus we will back them until the day the last one of them gives their dying breath."
 NGA_our_misguided_friend:0 "Our Misguided Friend"
 NGA_our_misguided_friend_desc: "The People's Republic of Ambazonia, an aberration of Cold War diplomacy with its supposedly Soviet-aligned government and socialist iconography mixed with the general dysfunctions of a run of the mill African state, has pleaded for our assistance! Of course we will aid them, but an emphasis in prioritising their Nigerian backers over the Soviets might be a good hedge."
 NGA_supporting_from_a_safe_distance:0 "Supporting From a Safe Distance"
 NGA_supporting_from_a_safe_distance_desc: "We know better than to muddle ourselves up into another separatist conflict, and in good spirits we will give aid to our friends, but to place us in its crosshairs would be a terrible idea."
 NGA_better_to_live_on_your_knees:0 "Better to Live on Your Knees"
 NGA_better_to_live_on_your_knees_desc: "...Than to die standing. The Ambazonians have since faced so much of an existential danger to their existence, and us too, have faced such a terrible crisis next to our border that we have provided a humanitarian offer to the Ambazonians: Allow observers and assistants to help govern the People's Republic, accepting status as a protectorate in exchange for permanent protection from Cameroon. I'm sure they'll eagerly accept!"
 NGA_a_triumph_over_francofascism:0 "A Triumph over Francofascism"
 NGA_a_triumph_over_francofascism_desc: "Regardless of the approach we've taken, we have found a way to assist the Ambazonians and help counter the rising forces of franco-fascism."
 NGA_amending_frenches:0 "Amending Frenches"
 NGA_amending_frenches_desc: "The French have aided Biafra for a significant period of time, and whilst we typically would tell them to go straight to Hell, conditions have changed in such ways that it has made it prescient to restart diplomatic conversations, as we look to normalize relations and create cooperation with Europe."
 NGA_importing_european_expertise:0 "Importing European Expertise"
 NGA_importing_european_expertise_desc: "The Europeans have always been at the forefront, the peak of innovation and prowess in technical matters. It's high time we've re-invited the Europeans, now our equals, to help develop our visions of a New Nigeria."
 NGA_take_out_eurobank_loans:0 "Take Out Eurobank Loans"
 NGA_take_out_eurobank_loans_desc: "Loans are the fastest and easiest way to get money, and with money we are able to produce more, and thus eventually pay the loans. These principles will guide our financial policy for the time being."
 NGA_old_friends_and_new_suitors:0 "Old Friends and New Suitors"
 NGA_old_friends_and_new_suitors_desc: "As we shift diplomacy away from Biafran matters and instead to Africa-wide issues, we have found ourselves needing more friends. Out of the many blocs of the world, nearly all of them offer something to us. Which are we taking?"
 NGA_toe_the_soviet_line:0 "Toe the Soviet Line"
 NGA_toe_the_soviet_line_desc: "The Soviets are the World Hegemons, we don't need anyone else. Focus on strengthening our relations with the Soviets further and keeping an environment of significant warmth to our friends in Moscow."
 NGA_applying_for_wto_membership:0 "Applying for WTO Membership"
 NGA_applying_for_wto_membership_desc: "The WTO is the easiest way to improve our financial standing through benefits of membership, besides of course the obligations - which we are able to either fulfill or bribe away - and so we can begin the process of lobbying to join the Soviets in their brave future for Earth."
 NGA_improve_our_comecon_ranking:0 "Improve Our COMECON Ranking"
 NGA_improve_our_comecon_ranking_desc: "COMECON's credit rankings define a nation's capacity to gain loans and to handle debt, and to ensure we aren't getting screwed over with our rates, we ought to focus on improving our ranking through improving our credibility."
 NGA_nigeria_and_nippon:0 "Nigeria and Nippon"
 NGA_nigeria_and_nippon_desc: "The Soviets have clearly left us to dry, placing us in tertiary or quartenary importance. We need someone that takes the concerns of the Non-Aligned World seriously, and if anyone can do that it's the Japanese, with their fierce anti-imperialist rhetoric and robust financial institutions."
 NGA_the_fifth_corner_of_the_world:0 "The Fifth Corner of the World"
 NGA_the_fifth_corner_of_the_world_desc: "As the World faces a global realignment in its values and hierarchies, one sees an opportunity for West Africa as a whole and Nigeria in specific to rise to a level where it is spoken about in the same sentences as Japan, America, Russia..."
 NGA_pegged_to_the_new_yen:0 "Yenisation"
 NGA_pegged_to_the_new_yen_desc: "The Nigerian Pound is a disaster, and we've ought to look into reviving our financial institutions with a real injection of vigor: The introduction of a new currency - the Naira - and its pegging to the primary world currency, with near-universal acceptance, the Yen. Through Yenisation, we will be able to revive our economy to new heights."
 NGA_litigating_liberia:0 "Litigating Liberia"
 NGA_litigating_liberia_desc: "Liberia's one of the most unfortunate and tragic stories in West Africa: A true economic beacon until the 2000s, it faced horrible strife as Charles Taylor's Revolutionary United Front seized territory against the Americo-Liberian regime, which had shifted into a pro-Soviet regime as the Japanese had begun backing the RUF in both Sierra Leone and Liberia. Through our assistance, it will no longer suffer."
 NGA_maintaining_monrovia:0 "Maintaining Monrovia"
 NGA_maintaining_monrovia_desc: "The Monrovia regime is the closest African ally we have, and it's ridiculous to suggest any redirection in policy. We will maintain Monrovia as a palace that'll civilize the rest of Liberia towards a bright future, and secure its hinterlands with pride."
 NGA_giving_them_an_edge:0 "Giving Them an Edge"
 NGA_giving_them_an_edge_desc: "Simple moral backing is not enough -- the Monrovians need state of the art equipment and supplies. Enough dilly-dallying around the issue, we must defend our friends."
 NGA_heavy_is_the_head_that_wears_the_crown:0 "Heavy is the Head that Wears the Crown"
 NGA_heavy_is_the_head_that_wears_the_crown_desc: "But we cannot fall for the Euro-Soviet narrative surrounding Liberia. Taylor has brought the long needed ruthless efficiency of the Japanese towards the long corrupt and truly stagnant Liberian oligarchy masquerading as a republic. If we wish to support Taylor as a modernizing force just as our own regime is, we must stand with him through the hassle of modernization and combating foreign-born radicalism just as we did back home."
 NGA_all_the_kings_men:0 "All the King's Men"
 NGA_all_the_kings_men_desc: "As part of our general realignment in favor of Japan, it is important that we too back Charles Taylor's patriotic and palingenetic regime."
 NGA_putting_liberty_back_in_liberia:0 "Putting Liberty Back in Liberia"
 NGA_putting_liberty_back_in_liberia_desc: "Liberia ought to return to its status as a true democracy prior to this Soviet-Monrovian system. We must help the LURD and its mission of restoring democracy in Liberia."
 NGA_arms_against_tayloranny:0 "Arms Against Tayloranny"
 NGA_arms_against_tayloranny_desc: "The LURD have everything but the means to defeat the warlords and puppet leaders of Liberia, we must back them with the surplus of equipment we have accumulated over the years. We can also shore up for them with our connections in the international arms market they lack access to, although this may come to bite the LURD in the back later on. Either way, it’ll be a boon to both of our economies with this democratic exchange of arms."
 NGA_suffering_from_success:0 "Suffering From Success"
 NGA_suffering_from_success_desc: "As our favored side has handily won, we now find ourselves with an expensive occupation in our hands. This will likely be a drain in our resources for some time."
 NGA_saving_south_sudan:0 "Saving South Sudan"
 NGA_saving_south_sudan_desc: "South Sudan has struggled immensely with its sectarian and ethnic conflicts. We must help them away from their misery."
 NGA_friends_with_the_federales:0 "Friends with the Federales"
 NGA_friends_with_the_federales_desc: "The EAF is the largest, most stable force in the region and has the best shot at keeping order. We will support them in their fight."
 NGA_giving_more_to_the_goliath:0 "Giving More to the Goliath"
 NGA_giving_more_to_the_goliath_desc: "The EAF are more than capable of handling the insurgency in South Sudan. Yet even then, our efforts are united in combating the expansion of Zairean and Libyan influence and the instability that it brings. It is not simply enough to make platitudes and send humanitarian aid or financial assistance to the East Africans in their fight to restore order in South Sudan, we must work towards the formal establishment of not just an military agreement between ourselves and the EAF, but working towards the downfall of the Zairean-Libyan menace. We will leverage our shared skills and burgeoning manufacturing and high tech sector towards their benefit in winning this conflict."
 NGA_their_own_biafra:0 "Their Own Biafra"
 NGA_their_own_biafra_desc: "The Biafrans are much alike the South Sudanese in that they are petulant, ungrateful and unaware of the blissful and benevolent rule of their superiors. We will assist Arusha in ending their insolence."
 NGA_east_africa_as_one:0 "East Africa as One"
 NGA_east_africa_as_one_desc: "Our efforts have paid off! The Federation has finally quashed the rebellion and brought back civility to the south sudanese people. As we speak, joint Nigerian-Federation forces are engaging in eliminating the final pockets of resistance as our statesman and citizenry engage in reconstruction work in the streets of Juba. Interfaith and inter-community dialogues held by the government in the lead up to real and honest elections show why the bloodshed was needed. The people there will see the great wealth of the EAF flood back into their homes and families, as factories and businesses reopen, as clinics and schools are rebuilt, and as new opportunities for healing and growth have emerged. Just as East Africa became whole again, very soon will the rest of Africa be."
 NGA_joining_with_juwama:0 "Joining With Juwama"
 NGA_joining_with_juwama_desc: "The East African Federation is against our most basic interests in the region, and to back them would be backing an Atlanticist project against the wellbeing of Africa. We must stop them."
 NGA_cleaning_up_kush:0 "Cleaning Up Kush"
 NGA_cleaning_up_kush_desc: "Merely sending guns and political support to Juwama against the EAF’s globalist imperialism will not secure victory. They have, after all, been trapped in stalemates for years and years. To push the war in their favor, we may need to start thinking about putting our boots on the ground. Though this may be seen as an escalation, the EAF has little it can do about it. This may very well be the boost Juwama needs to win!"
 NGA_no_longer_our_problem:0 "No Longer Our Problem"
 NGA_no_longer_our_problem_desc: "No one can say we didn’t try. That we didn’t give it our all to fight the EAF in their imperialist war against the people of South Sudan cannot be argued. But it is all too clear now, South Sudan simply can’t be governed. Fighting on is a lost cause. Let us consider this a regrettable chapter in our history, and cut our losses and leave."
 NGA_what_went_wrong:0 "What Went Wrong"
 NGA_what_went_wrong_desc: "Our effort to stabilize South Sudan through supporting the SSLM has sadly fallen through. The SSLM’s victory is hardly uncontested, as there are still many many warlords fighting over scraps, we will need to take this as a harsh lesson to figure out what went wrong and why we failed. Or rather, if we ever could have stabilized the region to begin with. "
 NGA_picking_petty_sides:0 "Picking Petty Sides"
 NGA_picking_petty_sides_desc: "Some are calling for continuing to intervene in South Sudan until the region is stabilized. While the option of sending forces to the SSLM is still open, many are saying there is nothing stopping us from funneling money to the Nuer White Army or the Arrow Boys. As long as some form of state against the EAF prevails…"
 NGA_going_down_south:0 "Going Down South"
 NGA_going_down_south_desc: "The crisis in South Africa has reached truly epic proportions with the breakout of civil war. To not be left on the sidelines, we must ensure we play a decisive role in the outcome of this conflict concerning one of Africa’s main players."
 NGA_true_redemption:0 "True Redemption"
 NGA_true_redemption_desc: "It would be a blight on our legacy if we were to react to the war in the south by funding the Pro-Apartheid government, no matter how sympathetic to reform some of its factions may be. Our dedication is to the liberation of the African people. Be they in Namibia, or anywhere else!"
 NGA_giving_away_guns:0 "Giving Away Guns"
 NGA_giving_away_guns_desc: "The South African people will not be able to resist Apartheid and Fascism if they lack guns with which to fight. The start of the civil war has tragically disrupted industrial supply and production. But by shipping and airlifting military aid we can shift the tide in their favour."
 NGA_relief_is_redemption:0 "Relief is Redemption"
 NGA_relief_is_redemption_desc: "When wars are fought, it is not only soldiers who die. The conditions of civil war have displaced millions, brought famine, brought massacres and disease. To protect our African brothers we will endeavor to make sure large sums of humanitarian aid are brought into the region."
 NGA_ensuring_we_win:0 "Ensuring We Win"
 NGA_ensuring_we_win_desc: "As the war goes on, some fear if the anti-Apartheid movement will succeed in defeating their fascist and white supremacist enemies. To abate these concerns, direct intervention is needed. By throwing the weight of volunteer armies behind the back of liberation, victory will be guaranteed."
 NGA_our_brothers_before_the_bantus:0 "Our Brothers Before the Bantus"
 NGA_our_brothers_before_the_bantus_desc: "The government of South Africa, while adopting Apartheid is ultimately dedicated to  its incremental erasure from society. With this in mind, combined with the status of the largest opposition to them being Moscow-backed Communist terrorists and Nazis, our best bet is to support the legitimist government."
 NGA_send_what_we_can_spare:0 "Send What We Can Spare"
 NGA_send_what_we_can_spare_desc: "The legitimist government has more industrial power than others, benefitting from recognition by most other countries. But still, issues have emerged, and if we are to be good allies we will need to send our weapons to help them out."
 NGA_hoping_for_the_best:0 "Hoping for the Best"
 NGA_hoping_for_the_best_desc: "While we would like to help our friends in Cape Town more, the provision of support to Apartheid has rocked the country with protests from students, workers, and politicians alike. They see it as a betrayal of our Black brothers and sisters and collaboration with foreign colonizers. As such, for now this is all we can do."
 NGA_operation_bantu_freedom:0 "Operation Bantu Freedom"
 NGA_operation_bantu_freedom_desc: ""
 NGA_azanias_first_steps:0 "Azania's First Steps"
 NGA_azanias_first_steps_desc: "Azania is free at last! A new friend and a new ally has appeared on our continent. As the long road to reconstruction begins and Azania takes her first steps into a new world, we will walk alongside them to ensure our new ally can stand on her own two feet."
 NGA_apartheid_again:0 "Apartheid Again"
 NGA_apartheid_again_desc: "Through great trials and tribulations, the legitimate government of South Africa has emerged victorious. This has been very controversial, due to their continuation of Apartheid. But we trust that their promises to reform the system and eventually bring it to a close will hold true, and the rest will follow from there."
 NGA_a_headache_in_the_horn:0 "A Headache in the Horn"
 NGA_a_headache_in_the_horn_desc: "The situation in the Horn of Africa is heating up again. The region has been divided ever since the Ogaden War where Somalia conquered the province from Ethiopia. As conflict begins to re-ignite, we will have to choose our sides."
 NGA_supporting_somalia:0 "Supporting Somalia"
 NGA_supporting_somalia_desc: "Somalia is not only the strongest power in the region, behind perhaps the East Africa Federation. It is also a key Soviet ally. Throwing our weight behind Somalia, who are also our Muslim brothers, is the only sound choice to make."
 NGA_working_with_warsaw:0 "Working With Warsaw"
 NGA_working_with_warsaw_desc: "The Warsaw Pact is supporting Somalia, and as they were historically our backers we should work closely with them to ensure the funneling of resources towards Somalia."
 NGA_an_all_africa_armed_presence:0 "An All Africa Armed Presence"
 NGA_an_all_africa_armed_presence_desc: "We do not need the Warsaw Pact for Africa to fight for her own interests. We do not need to work with them to help our brothers in Mogadishu. Pan-African solidarity is all we will surely need to ensure their success."
 NGA_the_modern_macrobia:0 "The Modern Macrobia"
 NGA_the_modern_macrobia_desc: "As Somalia stands high and proud over the efforts of Christian foes trying to vanquish what is rightfully its land, we stand by this Macrobia of the modern day! Soon will come the day where Somalis will be one of the economic and political titans of the continent, and we will proudly stand right by them"
 NGA_advancing_amhara:0 "Advancing Amhara"
 NGA_advancing_amhara_desc: "One of the foremost Communist-aligned powers in all of Africa is Somalia. While much of Ethiopia does have socialist sympathies, it is hardly as significant. With this in mind, to frustrate the reach of Moscow in Africa, we will support the Amhara against Somali aggression!"
 NGA_tokyo_touring:0 "Tokyo Touring"
 NGA_tokyo_touring_desc: "Japan is a very active player in Africa in the struggle against Soviet influence, seeing Somalia as an agent of just that. Ethiopia is thus a key battle ground in the long war against their foreign dominance in the region. By petitioning Tokyo, we might be able to wrestle greater support towards Ethiopia."
 NGA_reawakening_a_royal_spirit:0 "Reawakening a Royal Spirit"
 NGA_reawakening_a_royal_spirit_desc: "As Ethiopia gains its national dignity once more, much talk has been made regarding the development and restoration of the Solomonic Dynasty as part of its national rejuvenation. We will give our utmost support to this cause."
 NGA_the_solomonic_legacy:0 "The Solomonic Legacy"
 NGA_the_solomonic_legacy_desc: "With Ethiopia’s triumph against the greed-filled forces of Communism, a new Solomonic legacy shines like a beacon of hope for the continent of Africa. One that stands against foreign rule, for native values and tradition, against Communism and disorder. Let this new Ethiopia be a model for us all!"
 
 
NGA.1969.t: "Splitting Spoils"
NGA.1969.desc: "The room was alive with the clamor of diplomats, sat uncomfortably in this small space with armed men behind them. Abeo chiefed a cigarette to calm his nerves as his neighbors yelled over each other. Through the process of vicious deliberation, there came to be various conclusions and proposed solutions to the issue of occupation, someone had to settle them regardless of who it'd make happy. If they went the route of direct annexation, they'd run the almost certain risk of a revolt - but it'd be a hard game to play to convince the Nigerian side to an Autonomous government. It's anyone's guess as to if they can come to an agreement.\n\nHis train of thought was interrupted by an uncomfortable silence, everyone was looking at him.\n\n“What do you think, Abeo?”"
NGA.1969.a: "I'm afraid we have no choice. We need a full scale occupation - now."
NGA.1969.b: "Install a mixed administration for reconstruction."
NGA.1969.c: "Play it safe. Bring in the collaborationists."

