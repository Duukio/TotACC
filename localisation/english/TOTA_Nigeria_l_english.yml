NGA.20007.t: "2026 Elections for President"
NGA.20007.desc: "As the country once again mobilizes its ballot boxes for a new election, three options have come by as the main contenders for the Presidency: Yusuf Mamman Dantalle, a environmentally-conscious conservative thinker and politician, Patrick Utomi, a Igbo man with great support for social democracy and laborism in the nation, alongside the expansion of the welfare state, and Yabagi Sani, a true-blue liberal of socially-liberal persuasions. With the counting over, the following candidate wins Lagos State and takes the Presidency..."
NGA.20007.a: "Yusuf and the Green Conservatives!"
NGA.20007.b: "Utomi and the Third Way Social Democrats!"
NGA.20007.c: "Yabagi Sani and the Liberals!"
NGA.20008.t: "2029 Elections for President"
NGA.20008.desc: "As the country once again mobilizes its ballot boxes for a new election, three options have come by as the main contenders for the Presidency, as Presidents may only serve for one term: Kingsley Chida, a socially traditionalist and family values focused conservative, Darlington Nwokocha, another man of social-democratic persuasions and lastly Abubakar Kabir Abubakar, one of the youngest politicians in Nigerian history, with a strong liberal following and great energy. With the counting over, the following candidate wins Lagos State and takes the Presidency..."
NGA.20008.a: "Kingsley and the Family Conservatives!"
NGA.20008.b: "Darlington and the Third Way Social Democrats!"
NGA.20008.c: "Abubakar and the Liberals!"
NGA.20009.t: "2032 Elections for President"
NGA.20009.desc: "As the country once again mobilizes its ballot boxes for a new election, three options have come by as the main contenders for the Presidency, as Presidents may only serve for one term: Abdullahi Usman, a populist and people-minded conservative, Temitope Adedeji Adewale, a patriotic social democrat and lastly Shaaban Ibrahim Sharada, another young politican with energy and strong liberal persuasions. With the counting over, the following candidate wins Lagos State and takes the Presidency..."
NGA.20009.a: "Abdullahi and the Populist Conservatives!"
NGA.20009.b: "Temitope and the Patriotic Social Democrats!"
NGA.20009.c: "Shaaban and the Liberals!"

