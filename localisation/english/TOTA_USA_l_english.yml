USAAUTHPELOSI.3.t:0 "Houston"
USAAUTHPELOSI.3.d:0 "The streets of the Capital seemed to burst with joy, with millions of Americans flocking from every part of the Union to see, in person, the nation's savior, General Lloyd Austin. The gigantic parade to honor the reunification had just begun. The general president approached the streets and greeted the commander of the first mechanized division. Thousands of infantrymen marched through the streets, their rifles flashing in the sun. Tanks and armored vehicles followed the earth shook as they passed, and children on the sides of the road were overcome with laughter or fear. \n\nFrom above, everything appeared as an unstoppable column of light, interrupted only by the passage of jets in the sky, which fluttered above Washington like a swarm of flies. The march, accompanied by the constant rhythm of military bands, reached the Capitol, where Lloyd began his speech from the stands, "President Abraham Lincoln, the man who saved our union back in 1865, once said that America will never be destroyed from the outside. If we falter and lose our freedoms, it will be because we destroyed ourselves” – the crowd nods – we, 158 years later, are here today to confirm it, thanks to Nancy Pelosi"- who was right beside Austin\n\nFrom above, everything appeared as an unstoppable column of light, interrupted only by the passage of jets in the sky, which fluttered above Washington like a swarm of flies. The march, accompanied by the constant rhythm of military bands, reached the Capitol, where Lloyd began his speech from the stands: "President Abraham Lincoln, the man who saved our union back in 1865, once said that America will never be destroyed from the outside. If we falter and lose our freedoms, it will be because we destroyed ourselves” – the crowd nods – we, 158 years later, are here today to confirm it, thanks to Nancy Pelosi"- who was right beside Austin\n\n “we have defeated the enemies of our democracy and we have reconquered it house by house, city by city, and this is because the American people can always count on their great army, an army of free men, who have never lost a war, as long as Jesus is on our side. God bless our troops, God bless the United States of America”- a cry of exultation rises from the multitude.\n\n The celebrations continued all day, in the streets, in the stadiums, in the homes, but the most attentive began to notice that the military forces that had participated in the parade showed no sign of moving away from the capital. They remained there for days, then weeks…"
USAAUTHPELOSI.3.a:0 "This We'll Defend"
USAAUTHPELOSI.4.t:0 "Tank"
USAAUTHPELOSI.4.d:0 ""It is now clear that the military does not intend to leave the urban centers. We all expected that once the civil war was over, we would return to the peaceful life we had before, yet it seems like the state of war is still ongoing: there are checkpoints on every road and constant patrols. Helicopters fly over residential neighborhoods day and night, despite the constant complaints from citizens. Not to mention the repeated violations of the homes of alleged collaborators and traitors. For this reason I believe it is our duty as young university students to mobilize and loudly demand the complete restoration of our civil liberties, they cannot ignore our voice if we ar-""
USAAUTHPELOSI.4.a:0 "[Video unavailable]"
USAAUTHPELOSI.5.t:0 ""
USAAUTHPELOSI.5.d:0 ""
USAAUTHPELOSI.5.a:0 ""
USAAUTHPELOSI.6.t:0 "Stroke"
USAAUTHPELOSI.6.d:0 "She felt like a sack of lead. Her whole body was numb. The President trembled in her hospital bed, barely able to move a muscle. The stroke had done a number on her, but it would take more than that to take out Nancy Pelosi. One thing was for certain: she was not long for this world, and even in her state, she needed to act quickly. At this very moment, she was faced with one last decision...\n\none final choice that would determine the fate of America and the world. Now who would she choose as her successor? Buttigieg was sneaky: clever but underhanded. He'd be just as likely to run things smoothly behind the scenes, but a man like that wasn't her first choice for a potential successor. On the other hand, there was Austin, the 4 star general, secretary of defense, whom she feared would run the country like the military.\n\nPelosi grimaced with what little muscles she could move. What did it matter anyways? In less than a month none of this would matter. No, she thought. Buttigieg or Austin...? Choose, damn it"
USAAUTHPELOSI.6.a:0 "Buttigieg"
USAAUTHPELOSI.6.b:0 "Austin"
