CAL_the_most_excellent_tahoe_resort: "The Most Excellent Resort"
CAL_the_most_excellent_tahoe_resort_desc: "Whilst the capital of California officially remains Sacramento, all real politics occur inside the mysterious and labyrnthine halls of the Tahoe City and County Resort, where the most elite, yet not necessarily highest profile, people in California congregate. The politics of Sacramento are essentially held up by Tahoe's decisions; the policymakers that dissent are almost certainly found a few days later with a horrible scandal on their hands. Nonetheless, Tahoe City remains merely a quiet, unincorporated town in the middle of rural California, near beautiful alps and comfortable lodges - at least to all who don't partake in California's essentially independent medieval palace politics.\n\n\n\n\n £texticon_tahoe\n\n\n\n\n"

POLITICS_NOT_FUCKING_BORIS_DESC: "Alexander Boris Johnson, chosen as a compromise candidate by the Forward party was a man no one expected to fix the American Crisis. He has failed even those low expectations, Johnson has barely managed to muddle his way through his term as a president with little institutional, and even less electoral support. Harried between scandals and stopgaps he has been cast against his will as the fool, with derission towards him being one of the only points of political unity in the increasingly divided America.\n\nHe awaits his overdue retirement, neither seeking or wanting re-election, the dream of a large state pension and a long overdue vacation in the UK being the only thing that keeps him going."
unpopular_compromise: "Unpopular Compromise"

WNE.202.t: "Ezra Miller's New America [GetNewsGraphic]"
WNE.202.desc: "As the American people heel in pain from years of fighting, one contender has risen above them all: Ezra Miller, side-by-side with his Spider-Queen, Tokata Iron Eyes, as the Lords of Turtle Island, known now as The Sacred Kingdom of Turtle Island and the Holy Light. The autocratic and psychotic rule of the two leaders has since proven to command tens of millions of desperate Americans hoping to recover some of their glory through conquest and prowess, unified by a charismatic and commandeering leader. One shudders to imagine what will come of this new United States..."
WNE.202.a: "Eagles perched on corpses."

WNE.612.t: "Newsom Wins the Election! [GetNewsGraphic]"
WNE.612.desc: "After a short election, Gavin Newsom, the forward party’s candidate in the elections following Pelosi’s announcement to step down from power, has won after competing fiercely for Commander In Chief against Republican Candidate Phil Scott, and Democratic Candidate Anthony Van Jones.\n\nNewsom has called himself a “Social Liberal and a Fiscal Watchdog” and has campaigned to ensure America’s return to normal after the Civil War by fixing America’s politics and beginning rigorous reconstruction programs.\n\nNow, many expect an American return to the global stage soon, as NATO congratulated Newsom on his election, with the Soviets responding sparsely."
WNE.612.a: "California Über Alles!"
WNE.613.t: "Scott wins the Election! [GetNewsGraphic]"
WNE.613.desc: ""
WNE.613.a: "Wait, what?"
WNE.614.t: "Van Jones Wins the Election! [GetNewsGraphic]"
WNE.614.desc: ""
WNE.614.a: "Bernie would be proud."
WNE.616.t: "Pelosi Inaugurated as President [GetNewsGraphic]"
WNE.616.desc: "After the December assassination of President-elect Bernard Sanders, American politics spiraled into unrest and chaos. Multiple candidates called the election a fraud, radical political movements occupied entire states, and militias formed across the country.\n\nDue to the unrest and widespread distrust of Sanders’ Vice President-elect, John Fetterman, Nancy Pelosi, Speaker of the House and Democratic Party politician, has been inaugurated as President of the United States. This has already been denounced by nearly every politician outside the Democratic Party and has sparked riots in cities nationwide."
WNE.616.a: "This doesn’t bode well."
WNE.617.t: "Rival Government Forms in America [GetNewsGraphic]"
WNE.617.desc: "Empty House and Senate seats have been quickly filled, as Pelosi has responded to Former-Minority House Speaker Pence’s seemly traitorous speech. In Dallas, Pence had vowed to dispose of her as she was a “Dictator with no legitimate claim to power.” With the Southern and Midwestern states rallying behind Pence, Pelosi has begun consolidating power on the east coast\n\nWith reports of Federal Troop build-up in midwestern cities, such as Chicago, Detroit, and St Paul, as protests have erupted into riots in the wake of the Sanders Assassination. In response to the build-up, Pence has begun rallying military units and governors opposed to Pelosi in response, and with growing chaos everywhere else in America, it seems the situation is bound to worsen in the coming days."
WNE.617.a: "Is this the start of a Second Civil War?"
WNE.618.t: "Soviet-American Scandal"
WNE.618.desc: "After the killing of two soviet intelligence officers and the leaking of damning information that many leaders inside the United States of America were embezzling funds for scandalous personal exploits, the Soviet Union has cut all support to the United States of America and in a recent press confrence, has begun distancing themselves from the federal government due to the misconduct and un-professinalism done by the federal government. The Federal Government has tried to debunk these allegations, but their best efforts appear useless as the other factions of the civil war eye them hungrily."
WNE.618.a: "Damn, that's crazy."
WNE.619.t: "Escalation In Alaska [GetNewsGraphic]"
WNE.619.desc: "After the defeat of America's autocratic clique and its subsequent return to democracy, the United States hit a nadir with the Soviet Union, as both nations cut ties after the Civil War. Now, their relations have hit a new nadir, as the United States has deployed ground forces in Alaska against both the State Of Alaska and the Soviet Navy. The president of the United States announced that Alaska will be “Re-Absorbed into the Union” and that “Hostile Forces will be Annihilated.”"
WNE.619.a: "Back So Soon?"
WNE.624.t: "Escalation In Alaska [GetNewsGraphic]"
WNE.624.desc: "Despite the negotiations done by Alaskan and American representatives in the past days, the Republic of Alaska has refused to re-integrate into the United States under the pretense of “Violation of the constitution” and “Overriding of states' rights.” In response to this diplomatic downturn, the United States has deployed military forces to Alaska, intending to restore order to the former state as a new entity called the “Command Center Frontier” has been created by the United States as the command post for this new operation against Alaska."
WNE.624.a: "So much for diplomacy."

