USAADK.29.t:0 "Black Dawn"
USAADK.29.d:0 "It’s almost six in the morning, a safehouse nestled deep inside the countryside sits silently, covered by the ambiance of birds and the wind, and in one of the rooms of that safehouse sat two agents, KGB, one female the other a male, both no older than fifty. They chat about their jobs, mostly jokes about how incompetent the other agencies are, although they make plenty of jokes about themselves, although it’s directed mainly at the clerks. But, suddenly they heard a smooth knock on the door, must be the guys that stopped for lunch, maybe Yuri had eaten the sandwiches again, wouldn’t be the first time.\n\nTheir thoughts are cut short though, in an ironic kick the door flings open, smashing into the side as three masked men in grey uniforms, carrying suppressed submachine guns stare down the two, the last holding the door it seems. Fuck! It seems the Republicans got here sooner than expected. Polina then stands up, holding her hands to the sky, but despite the attempt to surrender she’s shredded by twenty rounds of hot lead and she falls onto the couch behind her. Pavel tries to negotiate his life with the men but his stuttering words are no use, he has to share the same fate with Polina, and he’s mowed down too.\n\nAbout seven minutes later before the two agents got turned into swiss cheese, a duo of men had opened the garage to the safehouse, if they were lucky, they wouldn’t have to ask what they are picking up, they were already carrying a lot in the back of their SUV. As the garage door opened, they laid their eyes upon a small cardboard box with PACKAGE, written in black sharpie at the side of it. The two men gave eachother a grin as they moved toward the package, they grabbed it without a second thought and placed it gently inside the trunk.\n\nThey left the safehouse as soon as they could, then closing the door and riding off into the countryside. It was always nice to drive along the country, none of the blinding city lights that the other guys had, or the risk of getting killed by a stray drone. But just as they were thinking about how bad the other guys had it, but just as they made a turn, they only had seconds to recat too a massive semi-truck blocking the road, and as they scrambeled to stop, they swerved into a tree."
USAADK.29.a:0 "Smoke is seen on the horizon, blue and red lights glow beneath it"
USAADK.30.t:0 "Fall"
USAADK.30.d:0 "“And when Team Sierra, six of you is finished, Team Psi who has already been integrated into the police of the county a month earlier arrives, you will retrieve the placed information and transport it to the nearest police station, where you will post the evidence to the public ASAP, now it’s guaranteed Team Psi is going to get in trouble but if this operation is a success… You guys probably won’t have to worry much anyway.”\n\nThey retain that part from the briefing as they open the door to the offices, as long as they don’t take an extra ten minutes this operation should already be done. They slowly make their way toward one of the computers as they plug the USB port into the e-book placed on the coffee table before they leave to retrieve the information from the car Team Sierra crashed about ten minutes ago. Despite the almost leery amount of success they had in the operation, they’re sweating every time they look back at the door into the office to make sure nobody’s trying to get the drop on them as the files sluggishly made their way onto the computer, eventually though the download finished and the rush to upload the files onto the county sheriff’s website followed, just not as painfully slow and soon after a few clicks the job was done.\n\nAlready that information was being picked up by local news outlets as they rushed to investigate the contents of the mystery crash, then as they investigated deeper into all the mountains of information provided, the information was forwarded to bigger news outlets, and soon after it was spread across the country until it reached the Soviet intelligence analysts, who began to review the information minutes after it had been released.\n\nOne of these intelligence analysts stared down his monitor as he reviews all the information provided, it’s hard to read and he begins to skim through it, it doesn’t look good. Buttigieg spending thousands of Soviet aid loans on expensive flights to a private island, Gabbard reselling Soviet equipment to the black market, but one piece of evidence catches his eyes, he can’t believe it, this can’t be true…"
USAADK.30.a:0 "Nancy Pelosi spent a hundred thousand on hookers?"
USANEWSOM.1.t:0 "Inauguration of Gavin Newsom"
USANEWSOM.1.d:0 "A smile, this was it, he’d done it, he had been knocked down many times, Yarvin ousting him, barely dodging bullets in an attempt to get to the northeast, and fighting for his life in the forward primaries against Buttigieg and Duncan, and then in the elections, but it didn’t matter now, he was command in chief, he gripped the sides of the podium and looked into the crowd.\n\nSome were cheering, some were recording the moment, and most were silent, good. After the war, it was expected that nobody wanted to start a fight with the status quo less if they shared the same fate as the others.\n\nNow, getting his view of the crowd, he started his speech.\n\n“As president of the United States of America, I have taken up office as commander-in-chief, and with that, so does the American dream and our nation's opportunity. And the promise of opportunity is what made this nation the power, that it was, but.” A quick pause, and a look around the crowd. “The embers of war, have charred that dream, but not destroyed it.” cheers came from that sentence but stopped as Newsom went to continue. “And as the President of America, I will ensure it is rebuilt and never wounded again.”\n\nCheers, more cheers, until all Newsom could hear was the incessant joyful cries of the masses, it sounded like a victory to him, but also hope, he had a job to do after all, a job to rebuild America."
USANEWSOM.1.a:0 "Brick by brick."
USANEWSOM.2.t:0 "Construction Troubles"
USANEWSOM.2.d:0 "“Good Morning!” said Hunter as reached out his hand. Vince reciprocated the hand, he noted “A firm handshake, I like it!” They grinned at each other, until Hunter interrupted with “let’s get down to business!” He had gotten in this situation due his success as a intern under Pelosi; his charm had ensured him a job in one of the bureaus but when he mentioned that when he was 16 he built a shed his fate was sealed. He was unqualified for the reconstruction bureau but at first it didn’t show. He explained “ as the contract says: we’ll be hiring you to rebuild the Francis Scott Key bridge”; The Project manager winced “that might take 10-20 years” “damn, really?” Hunter inquired. Sensing his inexperience Vince said “Yeah…so how much is the budget?” Hunter’s assistant, Tammy had forgotten the file, so he had to think a number off the top of his head “uhh… 950 million dollars” Vince interrupted him “ you’re out of your fucking mind…\n\ngo find some jigaboo who’s dumb enough to fall for that. Hunter has both surprised and disappointed, He asked Tammy “please bring the file, next time.” She profusely apologized “I’m so sorry sir, it won’t happen again.”, he retorted “don’t call me sir, I’m only a year older than you.” As Vince slammed the door and sped away, Hunter said"
USANEWSOM.2.a:0 "They don’t mess around here"
USANEWSOM.3.t:0 "A Washington Dinner"
USANEWSOM.3.d:0 "“Table of 8, please.” said Hailey to the hostess. The hostess replied, “Let me see if any tables are available.” She sauntered off into the dining room, and Mateo pulled out a lighter. “Uh…what are you doing?” Hailey inquired. “Uh, smoking?” he said as he pulled out a pack of Marlboro reds. The hostess pranced back to the front desk. Mateo was not subtle in checking her out.\n\nShe spoke, “We have a table available,” and without skipping a beat, “And sir, please stop smoking; we have smoke detectors.” Emphasizing his Spanish accent, he said, “Euh, sorry very much missus, where I’m from smoking is very common.”\n\n She retorted, “I don’t care if in Mexico they smoke, not here sir.” He was visibly annoyed as they were brought to the table. It was a big round table, 9 feet in diameter, made of ebony with a blue epoxy river that split into a little delta. The rest of the guests came one after another: Jenny, then Herbert, then Isis and Juliet, then Joseph and Phillip. “Then she said ‘this ain’t ‘meh’hico’, you can’t smoke.’ and Mat’s face scrunched up like he bit a lemon!” she recounted, and the table erupted in laughter. Isis said, “Aren’t you Spanish?” An awkward silence consumed the laughter. “Why yes, I am…” Mateo said in an attempt to break the silence. Then he said, “So…I guess Newsome’s now president, huh.”\n\nPhillip retorted, “Doesn’t mean anything is going to change.” Herbert asked, “Didn’t he promise to allow ex-cons to vote, re-enfranchise the former veterans and citizens of the rebels, and fix campaign finance.”\n\nPhillip interrupted, “Sure, but how realistic are these promises?” He continued, “Perhaps the first one is possible but the rest are ridiculously impossible.” He preceded with, “No offense, Herb and Julie, but I doubt that he wants to let the Nazis and commies to be allowed to vote again.” He pointed out how when the southerners were allowed to vote again they “de-facto continued slavery, and wrote the Jim Crow laws” and appealed, “Imagine the horrors that could return to the plains and the northwest.” Then he said, “And the corporations practically own the Forward party!\n\nThen Jenny asked the question everyone was thinking, “What do you have against Newsome, Phil?”\n\nPhillip answered, “Politicians lie too much!” The table became undecided, but always optimistic Isis announced."
USANEWSOM.3.a:0 "“Whatever He does, America will be better than it was before!”"
USANEWSOM.4.t:0 "Return"
USANEWSOM.4.d:0 ""Monsieur Macron, I presume", said President Newsom, taking a brief glance at the splendour of the Elysee palace. There seemed to be no end to the details this place had. Say what you would about them, the French certainly  had a knack for decoration.\n\n"Nice of you to come, Mr. Newsom." replied Emmannuel Macron "Well I must say I did not expect you coming so quickly after the end of your civil war."\n\nAs the two men walked they passed a 17th century painting of the French Civil War. Newsom didn't know which one it was, but it felt like a darkly ironic coincidence.\n\n"Well it's better than having to rub shoulders with the Kremlin." Newsom said, gesticulating with frustration. "Have you heard what they've been saying out loud lately? It's like they're not even trying to hide it anymore."\n\n"I think they've waited this whole time for the opportunity. They would have never been so brazen otherwise." said Macron. "An autocratic America. Autocratic! Could you believe it?"\n\n"I know, right?" Newsom said. "What say you about another meeting with NATO?""
USANEWSOM.4.a:0 "Macron then turned, and nodded."
USASCOTT.1.t:0 "Boxed Panic"
USASCOTT.1.d:0 "Phil Scott slowly rose to the podium, his hands grasping the sides of the podium just as he made his grand speech “I have been elected president, of this great nation, I can only describe how grateful I am, for America, and in return for their votes, their minds, and their prayers, I will ensure America-” the television was turned off, and the horrified reflection of two young Bearucrats now glowed.\n\n“Oh- Oh shit” Arlington’s jaw might as well have been on the floor at that point, “I thought- I-” Rameriez had no hope then, “I thought- but- how?..” Even if he had two months to know, he was still in denial- I mean, they couldn’t just let this happen, but at this point, if they didn’t want this to happen they would’ve already done something, it was too late at this point.\n\n“Okay, okay, just calm down..” Arlington took a deep breath following that, his eyes then trailing toward Rameriez, who seemed, slightly more composed even if his expression was just a third of Arlington’s. “So, what do you think we do?” Arlington asked Rameriez. “Clean up everything we have related to bureaucracy. Documents, pictures, doesn’t matter, we’re gonna have to burn everything if we want to avoid federal prison I’m afraid.” Arlington slightly frowned in response to that, just burning everything they had worked for.\n\nArlington nodded and opened his mouth, “Arlington sorry for cutting you off but we need to go before federal agents waterboard for information.” Arlington nodded, again, and they both began to exit the blank office they were in, filing into a car, and riding off onto the highway."
USASCOTT.1.a:0 "They didn't talk for much of the car ride."
USASCOTT.2.t:0 "Shuffle"
USASCOTT.2.d:0 "“Got everything?” Arlington’s eyes lazily walked over to Martinez. “Not yet, still looking for the go-ahead document on arresting those Pence advisors.” Arlington did a slight roll of the eye, this was to be expected from him, taking his sweet time with everything. He looked back to the neatly filed slough of papers before him, and then back to Martinez. A quiet groan rumbled inside him, but just about when he was about to chew Martinez out\n\nOne knock on the door to the office, almost instantly like a pack of hungry cats the two jerked their heads to the door. With two knocks, Arlington prepared to duck as Martinez got himself into a running position.\n\nThe exploded open, and a piece of wooden shrapnel flew into Arlington’s cheek, making his duck downwards turn into a fall as he attempted to pry the shrapnel out of him. Martinez could’ve made two laps around the room with the speed he was going as he ran toward an open window, but an agent noticed his figure\n\n“FREEZE!” The agent lifted his Submachine Gun as Martinez grabbed the sides of the window, but then stopped as he seemed to look down into it.\n\nCRACK a shot ripped into Martinez’s leg, his head hit the window seal soon after with a thick CHUNK. Despite Martinez's pained groans, Arlington tried to ignore what was going on. He crawled toward a window behind him and slowly rose upwards as he crept toward it.\n\nJust a little more… He rose further, going into a crouch as he reeled his body weight back to break open the window. “He- Hey hey halt!” A man wearing a blue jacket and an oversized pair of glasses glared toward him, and what appeared to be a gun in his left hand twitched. At that point, Arlington nearly threw himself at the window, and with a piercing shower, the window shattered into a million little pieces.\n\nArlington then stepped his leg back as the man behind him raised his gun, and leaped out the window. And for a moment Arlington thought he was home free. Everything was in slow motion until he looked down. He was three stories up into the air."
USASCOTT.2.a:0 "Last thing he felt was the wind."
USASCOTT.3.t:0 "Chain Gang"
USASCOTT.3.d:0 "“Of course, he’s saving money.” A slough of dirt flowed from the Backhoe’s Front Loader. “I mean, ya think we have any money to spare?” Cawthon turned his head toward Philips who was sitting on the concrete frame of what was a building, “Fair, I just think hiring all of us contractors to do all the work instead of.. Like.. Actual government workers feel scummy..” At this point, Cawthon stopped operating the Backhoe just to talk with Philips.\n\n“Scummy? It’s not scummy if we don’t have pennies to spare.” He pulled a lever on the backhoe and suddenly the machine returned to life. Cawthon was trying to avoid the conservation, but it had the opposite effect on Philips. “Look how hard are you going to suck Phil’s dick man?” Cawthon froze, and the only thing that moved on his entire body was a frown.\n\nCawthon slowly turned to Phillips and gave him an intensely disgusted look. “Are you retarded or something? I was doing relief efforts in Carolina while you were probably NEETing out in Maine you fuckin’ coward. I was saving people from starvation- I firsthand saw how people were displaced, lost their jobs, I mean-” Cawthon paused and kept the disgusted look he had on Phillips.\n\n“Okay, okay- I get it but didn’t Phil have connections to Lindell or whatever? The people we fought?” Cawthon stopped. “Dude, we’re probably working for a Yarvin Lackey right now so I wouldn’t talk if I were you.”"
USASCOTT.3.a:0 "Working on the chain..."
USASCOTT.4.t:0 "Taking Aim"
USASCOTT.4.d:0 "Josaiah said “Now, pull back the bolt and let it go;” the French soldier replied “yes, Ser!” He pulled it back, and as it returned to the begining; it made a ‘CHK’ sound, then he asked “ Where is zhe trigger?” Josaiah replied coyly “Press the button.”, so he did and a bang reverbrated through-out the range. “Waouh, zhat was a loud ‘PAN’!” said the Frenchman, Josaiah recommended “Hold it down to continue firing it.” The Frenchman heartily chuckled as the rounds tore through the targets and slammed into a Westphalian mountainside, Josaiah grinned as the laughs echoed throughout the countryside.\n\nAs the last round flew out of the barrel, Hubert turned around with feigned looked of wonder and spoke “why are zhe targets black?”. “Its for the police too” he replied with a slight chuckle, Hubert roared with laughter “AHAHAH!” Josaiah snarked “especially with Scott as President”, he continued as Hubert started getting uncomfortable “My friend did not get shot and my grandma firebombed so the chuds could win anyway”. Hubert tried to lighten the mood “ Letz hope zhat you’ll still get to go to zhe front of zhe bus.” Josaiah retorted “Y’all still have colonies in Africa”, “Zhey don’t mind, right Koffi?” The African next in line said: “Ferme ta geule, Hub!” “I wouldn’t be surprised if he brings segregation back though” said Josaiah, with discomfort seeping into his voice Hubert consoled “I doubt he could if he wanted to.” They were informed that I was lunch and left for the mess hall.\n\nA week later: the U.S Army officers were informed that they were to attend a mandatory meeting at 900 hour. The speaker began: “Hello I’m Master Sergeant Brown and I am your Battalion 42a,” the whole room began to silently groan. She continued “We will be discussing Politics on Deployment, stating with the 1st rule:”"
USASCOTT.4.a:0 "Leave Domestic Politics at Home."
USASCOTT.5.t:0 "Blunt Trauma"
USASCOTT.5.d:0 "Pain. Pain and Blinking, he was blinking, and in between the blinks he saw, blurs of colors, tan, black, blue- Until he he focused his eyes. A cluster of staggered faces looked at each other until they all agreed to look back at him, he didn’t know why they were staring at him, maybe it had something to do with the searing pain in his head, he didn’t know. As Arlington continued to stare up at the Feds in a pained haze, a pained, deafened haze. Until a certain shout rocked him back to life."
USASCOTT.5.a:0 "“DAMN DUDE YOU GOT FUCKED UP!”"
USASCOTT.6.t:0 "Boxed Panic"
USASCOTT.6.d:0 ""
USASCOTT.6.a:0 "They didn't talk for much of the car ride."
USAJONES.1.t:0 "37"
USAJONES.1.d:0 "Chapter 36 was short, I know I know, when I’m famous people will be asking about it more but, the thing is… I was like, trying to write down as much as I could, but Dad needed a hand with the boiler and, that thing was a bitch to even wrench, it was rusted hard and honestly it’s a miracle it’s even still working.\n\nNow starting this Chapter for real, the reason I am doing all this is because that guy, Van Jones, won the election. I guess he’s kind of like Obama? But I think not really because he’s less crazy than him honestly, he hasn’t tried to storm the capitol so far so he’s more civilized than Obama. Either way, I would’ve liked that guy Scott more, or maybe Newsom, he had a cool haircut at least, Van, Vannie? Vannie. Vannie is just, bald.\n\nAnd I’ve been hearing talk about progressivism, social democracy, NATO, debt, whatever, personally the only thing I know is NATO and that’s because of my games."
USAJONES.1.a:0 "I don’t care about what some evil rich Yankees care about, I think."
USAJONES.2.t:0 "Hot Takes"
USAJONES.2.d:0 "Thursday\n\nToday on the T.V they were talking about how Jones is going to ‘Negotiate’ with France to rejoin NATO, but I know that is just fancy talk for Jones is going to ride Macron’s meat until he lets us in. I mean Macron’s cool and all especially when he was BLOWING up those Camel Fuckers in the desert, but Its not very free in France.\n\n I hear they can’t have guns and that the French president runs for life and doesn’t need to pay taxes or something. They’re just a liberal Soviet Union. Speaking of which despite using Commie Paper, I think from Tajik? I don’t know where that it, I hate the USSR. But if I HAD TO CHOOSE between Commie China and the USSR, I would choose the USSR because they get paid a little bit for work.\n\n If I were the President, I would coup Canada so we can unite and then declare war on the USSR and NUKE THEM as I’ve always wanted to see the Far Eastern Republic IRL like in Dawn of the BloodBath. Vannie won’t cause he ain’t got real balls but I would!"
USAJONES.2.a:0 "Cause THAT would be SO COOL!"
USAJONES.3.t:0 "Judocracy"
USAJONES.3.d:0 "Saturday\n\n Today, my uncle came here to visit; He lives in Baltimore, personally I could never live with all those blacks, but I digress; The first thing he said after greeting us was: “I came ‘cause I needed to get away from the busy city to the simpleness of the quaint country” I hope he’s just dumb instead of uppity.\n\nAt dinner he went on about how Van Jones was going to make “America fairer and better” and how it would “Help Us too”, But I pretty sure my dad can’t vote cause he fought for Pence or something. I think that whatever Jones is going to do is probably gay and retarded, but I’ve got a better idea. Back in the Roman days, they had Gladiator games, and the guy who won would get freed.\n\nBut we don’t have any slaves, so Why not have people register to fight and then the winner gains the right to vote. Kind of like March Madness, and people can bet on the guys. Maybe the bettors that bet on the winner also get to vote. I know I'll be allowed to vote as I have been boxing and judo since I was 8. I got to go now…"
USAJONES.3.a:0 "[I need to do my Burpees before Judo"
USAJONES.4.t:0 "Potholes"
USAJONES.4.d:0 "Tuesday\n\nEvery time I look out my window, all I see are potholes all over the road. Potholes. Fuckin. Everywhere. Things break down quick here in the swamp. I wonder why they even chose to build a town here of all places. Were the pioneers stupid or something?\n\nIt's been like that so long I can't imagine it looking any other way, but a weird thing happened today. On the street I saw a bunch of weirdos filling them up for some reason. You know, I think they were FEMA agents or something. Maybe. I don't know.\n\nSo I was thinking, "Gee, thanks a lot President Vannie". But when they were done they set up these weird little gizmos, like electric pylons. And to be honest I wasn't going to just go down there and ask them, you know? Now I don't know about you, but if nobody is telling you what they're for, you can bet your ass it's nothing good."
USAJONES.4.a:0 "What the hell is going on?"
