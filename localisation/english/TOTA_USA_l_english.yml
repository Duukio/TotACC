ATI.2003.t: "Nervous Young Inhuman"
ATI.2003.desc: "“Dragon Male Vore”\n\n	Nothing new, unfortunately.\n\n  “Dog Vore”\n\nDaniel tried searching a few other terms before just deciding it wasn’t worth it and closing the page. Well, almost closing the page because before he could, an ad had caught his eye. Usually he just ignored the ads on FurAffinity, most of the time it was just for the same generic games. But this one was very different.\n\n“Vore Fascist Thugs”, said a fox decked out in military equipment, which it had to be said, was drawn pretty hot. After clicking the link, Daniel realized it was a recruitment site for the Anti-Fascist Council, or whatever they were calling themselves, for a furry military division? He couldn’t help but laugh.\n\nLaugh until he saw the pay that is. It far out shined any entry level job he’d be getting around Eugene, not that any existed in his region since the general crisis began. He couldn’t believe how bad it had gotten, six months ago it would have seemed like a dream. But here he was, seriously considering joining the army.\n\nHe continued reading through the site, becoming more and more convinced this was really the only option for him. But one line near the end sealed the deal:"
ATI.2003.a: "Fursuits in Pension"

OBM_attack: "Gulf of Mexico Logistics"
OBM_attack_desc: "Now, let me be clear. Cuba’s gone through some terrible things. And we ought to-to… See their plight, as, uh, similar to ours. We - exiled from the America we love, by the powers that be - we will return. Stronger than ever. We’ll take these traitors out and… And through your, uh, diligence, your sweat, your effort - as well as arrangements we’ve made with the Cuban people ‘n’ their government - we’ll have the edge logistically - in this conflict."
OBM_the_hussein_hersey: "The Hussein Hersey"
OBM_the_hussein_hersey_desc: "Have you looked around recently? There’s, uh… There’s fear - and sorrow - in people’s eyes. They’re bein’ forced to fight ‘n’ die for tyrants who don’t care who they are - never knowin’ when their number’s getting called. Hundreds of thousands of graves - families torn apart - destruction out past the horizon… But there’s still hope. The fires lit a decade ago… They’re still burnin’ strong! Life. Liberty. Happiness. There’s been no surrender there. The, uh, seizure of Miami marks the lighting of a new flame - the flame of a new American spirit. We say no more to dying in camps, in trenches, in poverty. We say no more to the old ways, to indignity! Let’s come together - let’s rebuild this nation. For all of us. For our kids. For a better future."
OBM_a_fragmented_movement: "A Fragmented Movement"
OBM_a_fragmented_movement_desc: "I’ll be honest here - with you. America… We-we’re a broken nation. The American Dream’s become a nightmare. The great people of this land - people like you - ‘re bein’ forced to serve under despots ‘n’ warlords - turncoats ‘n’ traitors. Some against your will, but all against your own interests. But there’s hope yet. I’ve seen what people can do united. I’ve seen the goodness of this country and its people. I know enough of you out there believe all this with me. So hear me when I say: Florida is just the start. We are coming to help. To help you. to support you. And-and to heal this country’s wounds. With your help - and your hope - we can do great, great things together."

WNE.85.t: "New Order in America"
WNE.85.desc: "The song of the sparrow lilts across the pines, as a coat of calm envelopes the battleground of America. Campfires are lit, guitars are restrung, and rifles are polished; Commander Robert Jay Mathews of the American National Socialist Party has won the war. Yet the veneer of peace rests atop a violent foundation, as white citizen's militias begin clearing out any pockets of resistance, with various minority groups being subject to ethnic cleansing. Urban centers in particular are subject to large scale operations, aimed at \"retaking our cities\" from those deemed lesser. On the global stage, Mathews' regime has made no attempts at reconciliation, nor has any recognition been afforded — the American people will go it alone, blazing their own trail like their yeoman ancestors of old."
WNE.85.a: "In the year of Jubilee."

USA_moonlight_on_vermont: "Moonlight on Vermont"
USA_moonlight_on_vermont_desc: "By the quiet machinery of succession law, Nancy Pelosi—eighty years old, gavel in hand—has become the most powerful woman on Earth. She didn’t ask for this. But history doesn’t ask. In the wake of catastrophe, Speaker Pelosi becomes Acting President, vowing to preserve the Union not as it was, but as it must become. Emergency decrees are drafted. Advisories are issued. The mood is funereal, but the gears of continuity grind on."
USA_houses_in_motion: "Houses in Motion"
USA_houses_in_motion_desc: "Although there are concerns of privacy, in urgent times that kind of luxury cannot be afforded. We ought to pass the Emergency Powers and Civil Order Act with exceeding speed, lest we lose the grip and narrative of the situation."
USA_the_hem_of_his_garment: "The Hem of his Garment"
USA_the_hem_of_his_garment_desc: "Mike Pence, Presidential candidate of the 2020 election, has declared alongside our Party that the results were illegitimate. However, this is where our agreements end. We will attempt nonetheless begin motions to try and bring him back into the fold, lest we face the threat of civil war."
USA_a_changing_of_the_guard: "A Changing of the Guard"
USA_a_changing_of_the_guard_desc: "We’ll begin taking a more preferential look at units of the Army which clearly show loyalty to us: Vetted officers, civil defense volunteers, contractors who know where their paychecks come from. The National Guards of our States may be lost to separatists and would-be kings, but Washington still has teeth. It’s time to bare them."
USA_raising_ye_curtain: "Raising The Curtain"
USA_raising_ye_curtain_desc: "We are done negotiating. The deadline has passed, and the Republic is bleeding from a hundred cuts. We did not choose this war. But we will choose how it ends."
USA_everyones_gone_high_society: "Everyone's Gone High Society"
USA_everyones_gone_high_society_desc: "Cleansing the executive of the men and women who aimed to destroy its dignity and constitutional system is paramount at this time. In their place, we will bring in people of stature, means, and resources. With the right connections and the right promises, we can get key allies to defend the Republic."

