USASKELETON.999.desc: "Nah fuck that hoe"
USASKELETON.999.a: "Return to sender"

USASKELETON.1000.t: "Pence is not interested"
USASKELETON.1000.desc: "Placeholder"
USASKELETON.1000.a: "At least we tried."

