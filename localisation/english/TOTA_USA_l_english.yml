WNE.1.t: "America in Total Chaos [GetNewsGraphic]"
WNE.1.desc: "The United States finds itself in the largest conflict its ever encountered in its history as states, counties, communities, cities and villages all fight to the death in an attempt to redefine the American political structure to their vision. As Bernie Sanders was assassinated in December 2nd last year, the US House and Senate have been unable to compromise on a candidate for President, leaving both posts empty. Thus, Speaker of the House Nancy Pelosi, according to the line of succession, has been sworn in as interim President of the United States. Many states have since declared the succession illegitimate over Pelosi's alleged overreach of the Constitution, warlords have popped up in response, wishing to wipe out the Pelosi government in D.C. What will happen from here on out could only be described as brutal, horrifying conflict."
WNE.1.a: "Fortes fortuna iuvat."
USAADK.1.t:0 "A sniffle"
USAADK.1.d:0 "“So, we’re-” he was cut off immediately by the Officer “Yes, you're going into the frontlines” he tried to make an excuse, “But-” he couldn’t get past the first word because of the glare the officer as giving him, it was getting pretty obvious that he sealed his fate when he signed the contract for four years in the national guard.\n\nIn his mind he was uttering every cuss in the English language towards the man, maybe even some foreign ones for variety, but he didn’t say anything, he froze. This lasted for about eight seconds until the Officer broke it “Got cold feet?” He looked up to the officer and got out of the chair, awkwardly. He then gave a blank look at the officer then left the room, closing the door behind him.\n\nWell, shit, he was a grunt now, and there wasn’t any excuse to get him out either. He just shouldered it and moved down the hall, where a line of people the same as him were going to get the same fate, poor bastards, maybe if they were lucky they would get a job as a line cook, tsh, they’d probably already replaced all the cooks with robots.\n\nHe pushed open the glass door as he exited the door and was greeted by a loud honk from the left of him, instinctively he turned to the source of the sound and the large face of a bus stood before him, that was his ride to the front. And so, begrudgingly, he stepped onto the bus, taking a seat in the middle of the bus."
USAADK.1.a:0 "There wasn't a thought in his mind then"
USAADK.2.t:0 "Jury"
USAADK.2.d:0 "Absolute silence. Maddrey could feel the dust in the holding cell landing on his head as he longingly looked to the guard outside his cell window. He looked at the guard for a few seconds, then looked back to his cell, and then back to the guard. They should’ve taken him out of the holding cell by now or at least talked to him, he had been in this cell for a hot minute, and they didn’t even let him on the court to tell his side of the story.\n\nHe was getting impatient, he wouldn’t mind just getting the call that he was getting executed if it just got him out of the cell. Eventually, he decided to try and talk with the guard outside of his cell, climbing up from the bed, more like a metal slab hanging from the wall, he walked up and knocked on the glass window of the door.\n\nThe guard didn’t turn around, he looked like he was trying his best to ignore it, so Maddrey knocked again, and the guard folded and turned around. Maddrey spoke to the guard as soon as he turned around, “hey!” a raised voice which the guard promptly responded with a “Huh?” the guard couldn’t hear Maddrey. “HEY!” Maddrey yelled, and the guard recoiled his head back by a smidge.\n\n“I-I hear you, man.” The guard said this back after a few seconds, then returned to confidence once he realized there was a door between them. “What’s taking so long?” Maddrey had asked a question that the guard had no answer for. “Uh.. I don’t know I mean.” The guard raised his left arm and looked at his PDA on it. The guard was intently looking at it, and Maddrey was trying to catch a glimpse of what was on it, then, the screen flashed, and the guard stopped, his eyes scanning the screen from left to right.\n\nThe guard then slowly rose his head to Maddrey and stared at him."
USAADK.2.a:0 "“Well, you're lucky mister.”"
USAADK.2.b:0 "“I’m sorry mister but-”"
USAADK.3.t:0 "Deja Vu"
USAADK.3.d:0 "He’d done this before, he had already made his verdict on Maddrey, and this was usual paperwork for him at this point, go through the dossier, go through the documents, listen to the jury, garble, and mumbo jumbo.\n\nNow, they were holding an American Republic general, Kenneth Franklin McKenzie Jr, imprisoned until he could figure out the general’s fate, of course, he wasn’t alone in this matter, the entire reason McKenzie wasn’t shot on site was that Phil Scott and the Hardliners wanted him in the military so they could get more leverage over Pelosi, it was pretty simple really, and of course, the unitarians were there too, Austin was trying his best to make a case on why McKenzie should be imprisoned, or just, shot.\n\nEach minute passed quickly, and most of the arguments were just partisan bullshit cooked up by some editor at CBS or the Times, maybe there was a fair point or two, but nothing substantial, and when the time finally came, it was pretty obvious no matter what people we’re gonna be pissed.\n\nThe hammer in his hand drifted down as he made his decision."
USAADK.3.a:0 "“Not Guilty”"
USAADK.3.b:0 "“Guilty”"
USAADK.4.t:0 "The Suck"
USAADK.4.d:0 "out every time he made small talk, but this time, he should have considered his words. "My plan? You think I get to choose a plan?" The American Republic marine raised a brow at the young man, who was a grunt fighting for the feds, Pelosi, or whatever drummed-up dogma the propaganda office in D.C. had decided to put out. "Kid, the feds have a gun to my head. If you think I can just walk off without a care in the world, you're stupid." The marine leaned back against the brick wall behind him, trying to find some comfort, but none existed. "Either they're sending me to be executed by the suede-denim secret police, or you'll see me getting fresh goulash on my tray from the cook two days from now." \n\nThe young man had no words but still muttered something. "Wh- Yea- Uh- Y’kno-" He shifted his eyes away from the marine, making an awkward expression before turning back to him. "Oh well... that... that sucks." Just as the grunt was about to speak again, the marine interjected. "It's called the suck. It sucks, but you don't say it sucks; you just call it the suck." The young grunt nodded sheepishly, internalizing the phrase."
USAADK.4.a:0 "Oh, and stop wearing that scarf, it’s eighty degrees out."
USAADK.5.t:0 "Aggregation"
USAADK.5.d:0 "Shuffling. Into chairs. The backstage of the room was entirely quiet, with a few almost in-audible whispers or steps. Then, from the curtains of the room came Pelosi, and everyone froze in place, without a word to say, she’d done it after all, Pence, Yarvin, Innarone- The poor bastards never stood a chance, maybe they shouldn’t have even doubted Pelosi in the first place.\n\nPelosi walked over, and then calmly gripped the podium in front of her. She could’ve just walked into the room and left; if anything the federal government’s survival could beat any rhetoric she could spew out, still, it’d be too anti-climatic not to make a speech on the day victory was declared. Moving closer to the mic, she breathed in, gave one last look around the room, and began to speak.\n\n“All hostiles have been vanquished, America has survived.” A shrill horde of claps came then, it hurt Pelosi’s aged ears. And just as she tried to speak into the microphone again, the journalists began to pelt her with questions, “Will the transitional council step down?” “Will American Democracy Continue?” those questions immediately put her in a bad mood, she didn’t want to have a reminder of the constant slug-out that was the scuffle between the Hardliners and Unitarians.\n\nAt this point Pelosi was pausing, despite all the drugs and surgeries that practically rebuilt her into a cyborg, she was still pausing. An aide then went up to her to tug her shoulder, and Pelosi blinked quickly, re-gripping the podium and continuing with her speech."
USAADK.5.a:0 "“And now, begins a period of healing.”"
USAADK.6.t:0 "Retirement"
USAADK.6.d:0 "She had had a fulfilling career. She had saved democracy and defeated her greatest rival, but she was old and the stress was getting to her. Now she could live out her days a hero, but she needed to see the snap results before fully relaxing. She had prepared ;some would say “groom” due to their age difference; Gavin Newsome to be the perfect stateman to fill the void she would leave; a Macron to the DeGaulle she was. She had invested time and power to ensure he would succeed her, this was her last gambit. She placed the bowl of chocolate ice cream just above the mouse pad. Typed “www.lemonde.fr” and began to eat the ice cream in anticipation, but she was starting to want a beef jerky as she was starting to get stressed by it; jerky had saved her from many a heart attack during the war. She clicks the large headline that said “ US Snap election results in” She takes a deep breath as she clicks."
USAADK.6.a:0 "A return to normalcy; Newsom pulled Forward!"
USAADK.6.b:0 "A deep consternation; Scott had won."
USAADK.6.c:0 "A rebuild of the dream; Jones was elected!"
USAADK.7.t:0 "Excerpt from CBS News"
USAADK.7.d:0 "After Pelosi announced she and her temporary council would step down from power with elections following, The Republican, Democratic, and Forward Party have been found by polling to be the most popular parties, and with elections soon fast, nominations have been hastily chosen, with the Republican Party choosing moderate-conservative Phil Scott, the Forward Party choosing ousted San Francisco mayor Gavin Newsom, and lastly the Democratic Party choosing news host and lawyer Anthony Kapel Van Jones. \n\nWith the election expected to be stones throw of days away, polling has shown that all candidates appear to balanced in their popularities, with predictions that the election will be heavily contested between the three."
USAADK.7.a:0 "May America Choose Wisely."
USAADK.8.t:0 "Excerpt from a debate, Duncan v. Buttigieg"
USAADK.8.d:0 "“I don’t think you understand. What you’re planning would spit in the face of everything America was built on. The people wouldn’t stand for it.”\n\n“The people will understand; America needs to be safeguarded. If we let democracy gum up the works, then we’ll drowned by our enemies. In times of crisis, democratic institutions only offer contradictions. It’s why our military is and always will be autocratic.The founders, who you’ve researched, understood that democracy was more likely to destroy the nation and that people were naturally inclined to monarchy, the rule of one. All we plan to do is turn America into a nation free from the pitfalls that brought it to this point. Imagine, that when the war is won, nothing will be able to stop us from establishing a new golden era."\n\n“History is not on your side. People deprived of freedom will clamor for it back. Autocracy simply functions as the kindling for the embers of revolution. When the Franco-Prussian War started, the 2nd empire was thrown off in a heartbeat. A crisis is for every country always just around the corner, and when it rears its head democracies can adapt, autocracies tend to strain, bend, and then break. What do you think will happen when the dust clears, and the people find that they’re profoundly and permanently less free than they were only a few years ago? Chaos.”\n\n“It’s not like we’re China two. The people will still have the vast majority of their civil liberties. Only the small stuff like newspapers that undermine the aims of the state will be restricted. They’ll wake up in a new America which only differs from the old one, in that it functions efficiently and is at permanent peace.”“Autocracy and liberalism can’t coexist. One will snuff out the other. The July monarchy tried exactly what you are proposing, and it only lasted eighteen years. How will you answer the people, when their demands inevitably involve you being out of the picture?”"
USAADK.8.a:0 "From what it looked like, Buttigieg had won."
USAADK.8.b:0 "From what it looked like, Duncan had won."
USAADK.9.t:0 "Dilemma"
USAADK.9.d:0 "The president angrily fiddled with a pen for what seemed like forever, her botox-filled features bulging almost to the point of exploding. The longer she held this decision off the sooner America would tear itself apart, yet at the same time that seemed like a better decision than cozying up to one of two camps of morons who wanted to reshape it in their image.\n\n“Oh for crying out loud…” Pelosi groaned.\n\nOne one hand she was going to lend an ear to Rho Khanna’s Hardliner Wing, which was more concerned with petty liberties like “freedom of speech” than stability in a time when more pressing matters were at hand.\n\nIf that wasn’t bad enough, the only other option was to listen to Catherine Masto, who like her fellows on the Unitarian Wing wasn’t even trying to hide the fact they were using the chaos as a golden opportunity to force an autocratic regime.\n\n“Which one?” thought Pelosi, frustration building up in her skull as her fingers tightened around each end of the pen.\n\nAll was silent in the Oval Office as the pen broke in two."
USAADK.9.a:0 "She Chose Masto Then"
USAADK.9.b:0 "She Chose Khanna Then"
USAADK.10.t:0 "Paper Filing"
USAADK.10.d:0 "“Right, so you both want to be granted more permissions,” Pelosi said as she took her head slightly back, her right brow bending down onto her face. A nod from both Bennet and Fielder as they sat on the opposite side of the desk. “Why so?” Bennet and Fielder were silent for a few seconds, then came up with their excuses. “To take the workload off of you, as I’m sure it must be extremely stressful!” Fielder was able to come up with a quick answer then Bennet, with her cutting off Bennet’s words.\n\nThen, Bennet would make his case, “To ensure the working order of all branches of government, as I think we lack effective administrators and supervisors in the government at the moment.” Pelosi paused, not even a minute into their arguments and it was already obvious they were making plays for a comfy chair in a high office. She would’ve liked to groan then but, she remained with her slight frown.\n\n“Well..” she thought for a moment, pausing her speech, but she kept pausing, she then wanted to wave them away with a quick jab at them both, but she couldn’t think, and she thought harder, causing her to pause even longer. Until she snapped out of it, and almost reset her mind. Then looking at the stiff awkward looks of Fielder and Bennet, she was old, and it would only get worse for her from here.\n\nFollowing with a sigh, she looked towards the two and raised her hand to a point."
USAADK.10.a:0 "“I’ll be watching, Bennet.”"
USAADK.10.b:0 "“Fielder, you're up.”"
USAADK.11.t:0 "Inauguration"
USAADK.11.d:0 "There was not even a sparse cough or a moment of small talk the first few moments, just dread. Sanders was gone, everybody knew that, and now there was Pelosi, the Speaker, no, the President, who had replaced, usurped, impeached, it didn’t matter, nobody could agree anyway.\n\nThen Pelosi stepped on the podium, the microphone on it picked up her footsteps, and then she placed her hands on the podium her mouth from just a foot away from the mic, with the technicians scrambling to lower the input volume. Still, just as Pelosi made her first breath, she recited her half-practiced speech, and any stray eyes from the crowd now drifted straight to her.\n\n“With the unrest circulating the Union, I have seen as in the best interests of the American People, to establish a-” She paused for just a moment, not even a second, she was having second thoughts on saying temporary or not, and the pause went on for a second, then two, then soon she was paused for just about five before she made up her mind. “A temporary council to ensure America’s survival.” A boo was heard from the crowd, then another, but the cameras were trained on her.\n\nShe continued her speech “This Temporary Council will see me as its leader, and therefore, I will be assuming Commander in Chief.” she then looked around the crowd, it was more shifty and agitated, definitely more agitated, but she kept her previous poker face, she knew damn well what was going to happen, this entire moment had been replayed in her head, even despite how half-assedly she rehearsed herself.\n\nOpening her lips, again, she let out the last part of her starting speech “And as Commander in Chief, I will do everything in my power to ensure the Union’s survival.” she looked to her left and right as she decided to pull a quick lull in her speech, to her left, a column of secret service agents clad, most of them having augmented-reality glasses as they look down on the crowd, and right, the same thing, and then she looked in front of her, and she saw an angry mass."
USAADK.11.a:0 "It comes down to this."
USAADK.12.t:0 "Firebrand"
USAADK.12.d:0 "Washington was in a hectic stir, especially now that Pelosi is president. The interns were dashing across the Halls of Congress, with everything from coffee to tobacco executives. Jerry found himself busier than ever even though his Boss had left for Houston. He was sifting through letters to sort them to the right person, but then he paused. In his hands was the strangest letter; Its envelope was made of “old timely” paper, the kind of stuff used for fake treasure maps, and it was signed by one: “Mencius Moldbug”. He then flipped it over and saw that it had a wax seal;\n\nThe seal consisted of a double-headed eagle with an eyed triangle in its center. He looked to his buddy and said “Look, the Illuminati sent Congress a letter.” They both chuckled. He then asked “Do you have a letter opener?”, Kayd said “No, but isn’t that classified or something?”\n\nJerry replied dopishly “I guess.” He then noticed that it was addressed to President-Elect Pelosi, so he paused, and declared “I’ve got to get this to her!” He leaped from his seat, and ran through the halls and into Washington’s streets. As he ran through the National Mall, he composed what he would say to the Iron Lady. Onlookers watched as this man in a trench coat and a pork pie turned away from the Washington Monument and ran towards the White House. He ran around the White House; woefully oblivious to the concerned Secret Service agents staring him down. That was until as he was approaching the gate, He got tackled. The agent probed “What are you doing here?” Jerry panting said, “I…ve..got…a…letter…for…her.”\n\n“Give it to me!” said the agent. He got the letter and shakily presented it. After a quick look, the agent said “What does Governor Yarvin want?” Jerry had a bewildered look as two marines dragged him away. Agent Vaughn calmly marched into the White House and throughout her halls. He arrived at the Oval Office’s door, and he calmly knocked."
USAADK.12.a:0 "He stared at the door."
USAADK.13.t:0 "The Deacon's Departure"
USAADK.13.d:0 "“Enter,” said the Iron Lady. He opened the door. He walked towards the desk and spoke “Governor Yarvin has sent you a letter and I believe that as he is the head of U.S Command Center West, the letter is urgent and must be read immediately” Pelosi replied, “I see, thank you for bringing it to my attention, you may go now.”\n\nShe unfolded the letter, and scoffed when she saw the large medieval-looking “D”, so she skimmed the letter. The letter was seemingly an incoherent rant, about a cathedral, liberalism, and democracy’s failures or something. It was more like a manifesto than inter-government communication. Then, she read the last 2 lines: “We’re leaving the union, and shall take back America to make it greater than it has ever been. You can go fuck yourself, Lead-Girl.” She was in shock, not due to his adolescent insults, but due to the loss that would be incurred. She had never liked the guy, but without Silicone Valley, the Pacific ports, and Hollywood’s money; she was dealt a heavy blow. Now, she had to think about her whole strategy for the civil war that would come. She thought to herself"
USAADK.13.a:0 "Not really unexpected anyway."
USAADK.14.t:0 "Dread"
USAADK.14.d:0 "The horde of janitors, cooks, and office workers looked at Johnson with tired eyes, and Johnson stared back at them with those same eyes, it was pretty obvious nobody had any hope for tomorrow or the day after. There was no saving the union from bloodshed, even the cooks making food for the janitors during the graveyard shifts overheard the panicked conversations about the militias getting bolder, the recent million-dollar damages from the now-common riots on the streets, it was hard to scrub out of everybody’s head.\n\nFinally, Johnson broke the silence in the room to speak with the staff. “As many of you know, Sanders is dead, and Pelosi has decided to replace Fetterman as president-elect.” Johnson looked around the room for anyone who might’ve had questions, but no one did, however the deep sense of dread on their faces did, and Johnson knew exactly what to say then.\n\n“And uh, what this means for you guys is that a new team of staff will replace you. You will be financially compens-” His statement was drowned out by the incoming orchestra of claps and cheers around the crowd of the staff. Johnson gave a hearty smile to them all and waited for the noises to die down, eventually, he would make another disclosure.\n\n“You will be meeting with the new staff as a passing of the torch, after that, I think you will all be happy to know that I’ve personally paid for trips to the Bahamas for all of you because of your exemplary service.” Despite the trips being more of an apology than anything, the orchestra of cheer returned."
USAADK.14.a:0 "And for a moment that sense of dread was gone"
USAADK.15.t:0 "Torch"
USAADK.15.d:0 "“Right so..” A Janitor looked at another Janitor, a much younger janitor whose overgrown blonde hair covered his pale face. “Chemicals are in the left-most closet, and uh, there’s a new shotgun in case of intruders.” The Janitor looked at the kid, watching as his expression grew from worried to downright scared. The Janitor rolled his eyes. “Don’t worry, if things get hairy leave it to security- I mean, the army.” The kid is still absolutely terrified, and the janitor’s eyes are once again, rolled.\n\n“Just relax.” The Janitor attempted to soothe the kid but- “Are you saying people are going to attack the capital?” The kid says, his expression not changing. “I mean probably-” The Janitor tries to stop himself but he’s too late, the kid’s jaw is opening now.\n\nA groan escapes from the Janitor, “So you're saying I’m gonna die?!” The kid questions once again, this time more frantically. “No, they aren’t going to ninja into the capital. You’ll hear shots hours before the fighting ever reaches here, and by then you’ll be in the back of a truck heading towards north.” It calms the kid down a little, not by much, but it calms him down.\n\nThe Kid would try to shoot a few more questions but the Janitor would continue to shut them down with half-remembered answers. Eventually, the Janitor would begin around the room, until he laid his eyes upon the clock.\n\n12:59. “Oh well man, I gotta get goin!”The Janitor said, his legs back peddling. The kid would fruitlessly try to shoot more questions “But what about the” but the Janitor had already broken into a jog at the point towards the exit, and the kid began to realize something."
USAADK.15.a:0 "That janitor was trying to get out."
USAADK.16.t:0 ""
USAADK.16.d:0 ""
USAADK.16.a:0 ""
USAADK.17.t:0 "Declaration"
USAADK.17.d:0 "“Nancy Pelosi is a Dictator with no legitimate claim to power.” Pence stopped and looked around to the Dallas Skyline, the reflection of the crowd below shimmered onto the nearby buildings as the sun, rising from the horizon mixed with the glass. Pence opened his mouth, his lips smashing against one another “And I will do everything I can to see her removed from power.” He looked to the crowd and nodded, that was it- no, this was it.\n\nThe roar of applause almost hurt Pence’s ears, but it was what he wanted, support.\n\nHe could have continued with his speech, but it had already done its job. The first sentence alone had ignited the spark he intended. Anything more would be like adding extra fireworks to an already dazzling display. Still, a measure of formality and civility had to be maintained—but did it matter now? The fire had been lit fifteen seconds ago.\n\nHe had pre-planned an entire speech, it would’ve been quite wasteful but, just stepping down from the podium and walking to his escort as a movie character to an explosion would be more appealing than any cardboard script he could do.\n\nPence then looked to an assistant beside him, nodded, and made a swift 180, disappearing into the sea of two-piece suits and sunglasses."
USAADK.17.a:0 "The Crowd Still Roared"
USAADK.18.t:0 "Harsh Prohibition"
USAADK.18.d:0 "From behind the register, Brandon scanned his dominion. It was known to most as Main Street’s saloon, but to him, it was his pride and joy, just like his father and his grandfather before him. It was established after the Civil War when his great-great-grandfather moved to the Idaho territory with his young family from Missouri. It had been desolated by Red-legs, so there was nothing left to sow nor reap from its beginning as a trading post where carcasses were used more than gold to a respected establishment that had outlasted the bank and the neighboring tribes. \n\nDespite the recession’s stay in the hills, For Brandon, these were great times, but that was probably due to both unemployed Whites and Indians not liking their prolonged free time and seeking to flee from nagging wives and overdue bills.\n\nThough as began to pour a shot of whiskey for some Yankee drifter, he started to hear a faint growl. As it approached, he finally recognized it, a speeding truck, and it became more apparent as the whoops and yells became audible.\n\nHe had heard about these Redman’s Party thugs, most especially about their savage attacks on isolated ranches and white-owned “trading posts”, so he prayed to the Lord God that it was the Nazis. The truck entered his view as it slowed down in front of the door, and seeing the shield on its hood, he knew that the end was near. As he ducked behind the bar, the driver shouted “What do we do with the man who poisons our brothers and sisters?”"
USAADK.18.a:0 "Most of the patrons almost instantly turned around, eyes peeled."
USAADK.19.t:0 "Red Velvet"
USAADK.19.d:0 "He peered over the counter to tell his patrons to tell them to hide, and then ducked as the other men in the truck shouted “Kill that man!” Machine gun fire ripped through the glass and into the planks, furniture, and drunks.\n\nAs the small arms began to accompany it, they began to speed away. He rose from the floor, luckily he was fine, but not the drifter. He was on the ground as he clutched to the side, and he gurgled “ I guess I’ll never get to Tacoma…” Brandon shouted, “No-No you’ll be fine, lemme call 911!”\n\nHe got out his mobile and dialed the number, and as he did, the skinheads in the corner got up, left some cash on the counter, and bolted out the door. They loaded their guns and hopped on their bikes. As they sped away, the braided scalps on the back fluttered like little flags.\n\nJust as the bikes left town, the ambulance arrived, and the paramedics rushed into the bar. The head medic looked at the carnage and said to the walkie-talkie “We’ll need backup, it's a 10-71, over.” She shut off the radio and said to herself:"
USAADK.19.a:0 ""When did this country go to shit?""
USAADK.20.t:0 "Breaking Bad"
USAADK.20.d:0 "“That’s about 120 pounds of crystal meth.” A year ago for the feds, this was absurd, now it was just another unimpressive find. “How come they just keep leaving this shit around?” Tac questions, a weariful expression canvassed across the face, “Because they know this country is going to go to shit.” Ayesha glances at Tac when she says this, then gladly switches her gaze back onto the horizon.\n\n“So you're saying that this country is gonna-” Tac is interrupted. “Yeah, I’m gonna be honest we’re probably-”  Ayesha is also interrupted. “Cool it, I hear something,” Harwell speaks, and both of them are silent upon hearing him.\n\n“I hear an engine.” Harwell then sticks up his machine gun, and the two others follow."
USAADK.20.a:0 ""Get ready to kill.""
USAADK.21.t:0 "Bug out"
USAADK.21.d:0 "EMERGENCY MESSAGE FOR SECRETARY OF DEFENSE LLYOLD AUSTIN.\n\nMultiple Military Units of all branches, As well as governors in the Southern United States, have gone hostile to the federal government after a speech made by Republican Politician and Candidate for the 2020 election, Mike Pence, calling current President Nancy Pelosi a “Dictator with no legitimate claim to power” and then after calling on multiple governors and military units to join his side. \n\nAny further attempts at communication with Pence have completely failed, and due to Pence’s remarks on not backing down until Pelosi is removed from power, conflict with Pence’s forces seems inevitable."
USAADK.21.a:0 "Tread Lightly."
USAADK.22.t:0 "GENERAL CIVIL REPORT"
USAADK.22.d:0 "To: President Alexander Johnson\n\nDespite our best attempts to cool politics and mend civil unrest during our administration, continued militia activity, unrest, and general political instability have rendered these efforts a failure, especially after the assassination of President-Elect, Bernie Sanders.\n\nRunning-mate of Bernie Sanders, John Fetterman has called for the country to unite around him as the legal President-Elect, however, Speaker of the House Nancy Pelosi has rallied enough support to allow for her to transition to the status of the president. Other candidates have also declared the election rigged, with Governor and Presidential Candidate Mike Pence declaring the election a fraud.\n\nAlthough actions could still be taken, this administration’s time is running out, and any more actions are probably likely to not only be futile but inflame the already chaotic situation in the country, so sadly, the most we can do is hold the door for the next administration."
USAADK.22.a:0 "Understood."
USAADK.23.t:0 ""
USAADK.23.d:0 ""
USAADK.23.a:0 ""
USAADK.26.t:0 "Gutter War"
USAADK.26.d:0 "“One of Pelosi’s main pillars is that the new world order supports her- er… the Soviets, and that pillar of foreign support is one of the more important ones we need to knock out, if we do then it will knock out the soviet’s aid and probably most international support she has, now, if you people would keep your attention for more than a second here’s the plan.”\n\nThe Nerd, his tie being half a size too big, has bored nearly half of the crew of eight in the room, the other half is skimming his words and making to-be half-remembered notes in their head as they wait for that garrulous nerd to finish up with his thirty-minute session about the intricacies of the Atlantic relationship of Pelosi and the Soviet Union. Still, he continues onward, one of the Crewmen, a blonde in a tan suit looks like he is about to give the Nerd a scolding that his father should’ve given him ten er... Twenty or thirty, years ago, his age was irrelevant to him, that guy is gonna get it alright.\n\nBut only a seat away, a man with a dark complexion watched him as he visibly got more annoyed, he’s seen this, this guy was about to jump. He looks to the Nerd to see if he’s even aware of the seething man but of course, he’s completely clueless and is still blabbering something about trade complications, he’s got to give this dud a warning to move on to the actual meat so he can avoid an at best awkward conversation. He tries his best to nod to the nerd that he needs to move on, but he’s still absolutely clueless, and that blonde is getting closer to pistol-whipping the Nerd, he eventually runs out of ideas and decides to just raise his hand.\n\nThe Nerd turns around to the man raising his hand and asks him what his question was, he then responds with “I think it’s best we move on to the Plan you're trying to give us.” The nerd tilts his head and tries to explain “No, this is all very important, you must know why-” The man gives him a Kubrick stare, the Nerd sweats up and eventually folds as he feels the other Crewmen’s peeved looks fall onto him, mission accomplished.\n\n“Right, to keep things short, we are going to kill two Soviet intelligence agents near a covert safehouse deep inside the federal territory, then, the guns used to kill those agents should be placed inside a car as well as a USB drive containing information detailing how Soviet aid is going to be embezzled for illegal activities and personal investments, then after, two federal agents, of course, clueless to this operation, will stop at the safehouse to pick up a package, they will then use the car, and then, we’ll run the car into a tree with a blockade and at that same time destroy at least half of the safe house with an explosion, this will attract the police”"
USAADK.26.a:0 "“But I’m sure you know already this is our objective.”"
USAADK.27.t:0 "Bug out"
USAADK.27.d:0 "EMERGENCY MESSAGE FOR SECRETARY OF DEFENSE LLYOLD AUSTIN.\n\nMultiple Military Units of all branches, As well as governors in the Southern United States, have gone hostile to the federal government after a speech made by Republican Politician and Candidate for the 2020 election, Mike Pence, calling current President Nancy Pelosi a “Dictator with no legitimate claim to power” and then after calling on multiple governors and military units to join his side. \n\nAny further attempts at communication with Pence have completely failed, and due to Pence’s remarks on not backing down until Pelosi is removed from power, conflict with Pence’s forces seems inevitable."
