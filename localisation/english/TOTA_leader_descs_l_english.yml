POLITICS_ASTIZ_DESC: "§YThe Blond Angel of Death§!§T, once responsible for hundreds of deaths and thousands tortured in the Dirty War, has turned increasingly gray and frail as he raises Hell from Buenos Aires.\n\nWhilst the rest of the country is engulfed in chaos, the Sovereign City and its hallowed temples have become testaments of a true revival of the neo-fascist Right, in Argentina of all places. Thousands hail their Chief, millions hear his every word and another many millions face the truth in horror. Thousands more are arrested every day, to never see their families again. Foreign agents are caught before they even step foot in the City. Blood-curdling screams of torture in whispering mountains terrify the few locals that hear it.\n\nNonetheless, the King rests in the mountain. But for how long?§!"

BHA_netaji: "Netaji of All India"

POLITICS_BAP_DESC: "Alamarios knew struggle from his very birth and kissed its deadly cheek with relentless bravery.\n\nAs the Romanian state continued to collapse under its particracy and rotting secret police superstructure, Alamarios' family fled to decidedly more moderate Bulgaria, whence he arrived to the shores of Athens as a child, poor and desperate for dignity. It was in this crucible that he gained a passion and love for the Hellenic world, learning Greek in Crete at the age of 9 and becoming a naturalized Greek citizen.\nIn the beachy shores of pristine, sunny Cyprus he declared allegiance to a decadent, tourist-funded monarchy; saluting the flag, reciting the anthem. He fought valiantly in naval disputes with Athens, his seemingly chauvinistic love for Greece making him a bloodthirsty footsoldier in the crucible of the frontline.\n\nWhen the communists seized Heraklion, even if just for a day, he was a popular governor of Chania, and his patriotism called once more for blood as he brutally seized the city for the Army, overthrowing the monarchy in the process. Now, as the head of the \"temporary\" Greek junta of the day, he begins moving pieces, talking to the right people, appointing governors. Slowly but surely, Hellas will be rebuilt in his romantic image of a brutal, Nietzschean project, and by the Gods, he will set foot where Plato once stood once again, the Monarchy be damned!"
